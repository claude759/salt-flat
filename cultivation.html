/* ----- folding. A panel is open when a form in it is open, when this visit opened it (S.peek), else as this device
   left it (S.fold), else by default (Tasks, Environment and the map open, the rest folded). A press on its title flips
   it in place, with no redraw, so nothing typed or opened in the page is lost. ----- */
const formIn = k => (k === 'map' && !!S.arrange) || (k === 'zones' && !!S.editZones) || (k === 'env' && !!S.editEnv) || (k === 'tasks' && !!S.editCal) || (k === 'runoff' && !!S.runoffForm) || (k === 'notes' && !!S.editNotes) || (k === 'runs' && !!S.planEdit);
const isOpen = k => formIn(k) || !!S.peek[k] || (k in S.fold ? S.fold[k] === 1 : !!FOLD_DEFAULT[k]);
// a panel that folds to one line: its title, a live summary while folded (sum, HTML), a note while open (HTML), the
// buttons that act on it (they stay on the line), and its body
function fpanel(k, title, sum, note, actions, body, o) {
  const open = isOpen(k), lock = formIn(k), bid = o && o.bodyId || `pb-${k}`;
  return `<div class="panel${open ? '' : ' fold'}" data-p="${k}"${o && o.id ? ` id="${o.id}"` : ''}><h3><button type="button" class="ptog" data-fold="${k}" aria-expanded="${open}" aria-controls="${bid}"${lock ? ' aria-disabled="true" title="Save or cancel first"' : ''}><span class="chev" aria-hidden="true"></span><span class="ptt">${esc(title)}</span><span class="ps" id="ps-${k}">${sum}</span><span class="po">${note || ''}</span></button>${actions || ''}</h3><div class="pbody" id="${bid}">${body}</div></div>`;
}
function foldToggle(t) {
  const k = t.dataset.fold, p = t.closest('.panel');
  if (!p || t.getAttribute('aria-disabled') === 'true') return;
  const open = p.classList.contains('fold');   // folded now: this press opens it
  p.classList.toggle('fold', !open);
  t.setAttribute('aria-expanded', String(open));
  S.fold[k] = open ? 1 : 0; delete S.peek[k];
  try { localStorage.setItem('cult.fold2', JSON.stringify(S.fold)); } catch (e) { /* kept for this visit only */ }
}
// open a panel for this visit (a Needs attention item, a zone link) and bring it into view
function openPanel(k, scroll) {
  const p = document.querySelector(`#view-room .panel[data-p="${k}"]`);
  if (!p) return null;
  S.peek[k] = 1;
  if (p.classList.contains('fold')) { p.classList.remove('fold'); const t = p.querySelector('[data-fold]'); if (t) t.setAttribute('aria-expanded', 'true'); }
  if (scroll !== false) p.scrollIntoView({ block: 'start', behavior: 'smooth' });
  return p;
}
// a press on a Needs attention item: what it is about, opened (only that)
function attGo(i) {
  const a = (S.attShown || [])[i], room = S.room && S.rooms.find(r => r.id === S.room);
  if (!a || !room) return;
  const today = CM.todayLA();
  if (a.k === 'missed') {
    openPanel('tasks', false);
    const cb = [...document.querySelectorAll('#view-room .tick')].find(x => x.dataset.task === a.key);
    const li = cb && cb.closest('li');
    if (!li) { openPanel('tasks'); return; }
    const grp = li.closest('ul[id^="tg-"]');
    if (grp && grp.hidden) {
      grp.hidden = false; S.tOpen[grp.id.slice(3)] = true;
      const b = document.querySelector(`#view-room [data-tgrp="${grp.id.slice(3)}"]`); if (b) b.setAttribute('aria-expanded', 'true');
    }
    li.scrollIntoView({ block: 'center', behavior: 'smooth' });
    li.classList.add('flash'); setTimeout(() => li.classList.remove('flash'), 1500);
    return;
  }
  if (a.k === 'trim') {
    openPanel('hv');
    const { R } = histOf(room, today), c = R && R.crops.find(x => x.last === a.date);
    if (c) { S.hvOpen = hvKey(c); paintHv(room, S.hvOpen); }
    return;
  }
  if (a.k === 'over') { openPanel('zones'); return; }
  if (a.k === 'empty') { const fe = $('flip-edit'); if (fe) { fe.scrollIntoView({ block: 'center' }); flipPop(roomView(room, today), fe); } return; }
  const where = S.attWhere.get(a.text);
  if (where) { openPanel(where); return; }
  // Growlink's: the live tiles at the top, and the tile the item names
  const gl = $('gl'); if (gl) gl.scrollIntoView({ block: 'start', behavior: 'smooth' });
  const m = Object.keys(CM.GL.LABEL).find(x => a.text.startsWith(CM.GL.LABEL[x] + ' '));
  if (m) { S.glOpen = m; glRefresh(m); }
}
// the folded line fed by a read that lands after the page is drawn (the harvest history)
function paintSums(room) {

  const h = $('ps-hv'); if (h) h.innerHTML = hvSum(histOf(room, today), today);
}

/* ----- the panels' bodies and their folded lines ----- */
/* Editing the room's task calendar (Gianni, 2026-11-25: "Task calendar"): each task's day of the cycle, kind (a typable
   box, Gianni's rule) and words; add and remove tasks. Each task keeps the key its ticks are stored under, so a task moved
   to another day or reworded keeps its ticks; a new task's key is its day and words. Saved through cult_room_set's tasks;
   a HARVEST task's day also sets the room's harvest day (the 8 / 9 week switch), so the two never disagree. */
function calEditor(V) {
  const cal = (Array.isArray(V.room.tasks) ? V.room.tasks : []).filter(t => t && +t.day > 0).slice().sort((a, b) => +a.day - +b.day);
  return `<div class="cal-ed"><datalist id="cal-kinds">${KINDS.map(k => `<option value="${k}"></option>`).join('')}</datalist>
    <div class="wrapx"><table class="t"><thead><tr><th>Day</th><th>Kind</th><th>Task</th><th></th></tr></thead><tbody id="cal-rows">${cal.map(t => calRow(t)).join('')}</tbody></table></div>
    <div class="pickmsg" id="cal-msg"></div>
    <div class="ed act"><button class="btn ghost" type="button" id="cal-add">Add a task</button><span class="grow"></span>
      <button class="btn" type="button" id="cal-cancel">Cancel</button><button class="btn primary" type="button" id="cal-save">Save calendar</button></div></div>`;
}
function calRow(t) {
  const kind = CM.nice(String(t.kind || 'Action').toUpperCase());
  const k = KINDS.find(x => x.toUpperCase() === kind.toUpperCase()) || kind;
  return `<tr data-key="${esc(t.key || CM.taskKey(t))}" data-new="${t.isNew ? 1 : ''}"><td><input type="number" min="1" max="150" step="1" data-c="day" value="${esc(String(t.day || ''))}" style="width:64px"></td>`
    + `<td><input type="text" list="cal-kinds" data-c="kind" value="${esc(k)}" data-ok="${esc(k)}" autocomplete="off" style="width:96px"></td>`
    + `<td><input type="text" data-c="text" maxlength="200" value="${esc(String(t.text || '').trim())}" style="width:100%;min-width:260px"></td>`
    + `<td><button class="btn ghost" type="button" data-cdel aria-label="Remove this task">×</button></td></tr>`;
}
function wireCalEditor(room) {
  const msg = $('cal-msg'), body = $('cal-rows');
  const kindOk = inp => {   // a kind from the list (Gianni's rule): the exact one in any case, else the one that holds the text
    const p = pickFrom(KINDS, inp.value);
    if (p) { inp.value = p; inp.dataset.ok = p; return true; }
    msg.textContent = `"${inp.value.trim()}" isn't a kind on the list. Kept ${inp.dataset.ok}.`; inp.value = inp.dataset.ok; return false;
  };
  const wireRow = tr => {
    const kd = tr.querySelector('[data-c="kind"]');
    kd.addEventListener('change', () => { msg.textContent = ''; kindOk(kd); });
    kd.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); kindOk(kd); } });
    tr.querySelector('[data-cdel]').addEventListener('click', () => tr.remove());
  };
  body.querySelectorAll('tr').forEach(wireRow);
  $('cal-add').addEventListener('click', () => {
    const trs = body.querySelectorAll('tr'), last = trs[trs.length - 1];
    const day = last ? +last.querySelector('[data-c="day"]').value || 1 : 1;
    body.insertAdjacentHTML('beforeend', calRow({ day, kind: 'ACTION', text: '', key: '', isNew: true }));
    const tr = body.lastElementChild; wireRow(tr); tr.querySelector('[data-c="text"]').focus();
  });
  $('cal-cancel').addEventListener('click', () => { S.editCal = false; renderRoom(room); });
  $('cal-save').addEventListener('click', async () => {
    msg.textContent = '';
    const out = [], bad = [], keys = new Set();
    for (const tr of body.querySelectorAll('tr')) {

    };

  for (const b of document.querySelectorAll('#view-room [data-range]')) b.addEventListener('click', () => {
    S.range = +b.dataset.range; try { localStorage.setItem('cult.range2', String(S.range)); } catch (e) { /* kept for this visit only */ }
    renderRoom(room);
  });
  const pb = $('print-btn'); if (pb) pb.addEventListener('click', e => { e.stopPropagation(); printPop(V, pb); });
  const ta = $('task-add'); if (ta) ta.addEventListener('click', e => { e.stopPropagation(); addTaskPop(V, ta); });

// a tick is saved under this cycle's flip; an untick clears the task under every date it is ticked under (a tick made
// before the flip was corrected is stored under the old date)
// Mark complete (or Undo): saved under this cycle's flip, with who and when (the database stamps both); an Undo clears
// the task under every date it is marked under (one marked before the flip was corrected is stored under the old date)
async function markTask(V, cb) {
  const done = cb.dataset.done === '1';
  cb.disabled = true;
  if (cb.dataset.src === 'one') {   // a one-off task: done or open again
    const { error } = await sb.rpc('cult_room_task_set', { p_id: +cb.dataset.id, p_set: { status: done ? 'done' : 'open' } });
    if (error) { cb.disabled = false; alert("Couldn't save that: " + error.message); return; }
    await loadAll(true, ['oneoffs']); render(); return;
  }
  const task = cb.dataset.task;
  const cycles = done || !cb.dataset.cycles ? [V.C.flip] : cb.dataset.cycles.split(',').filter(CM.isDay);
  for (const cy of cycles) {
    const { error } = await sb.rpc('cult_task_mark', { p_room: V.room.id, p_cycle: cy, p_task: task, p_done: done });
    if (error) { cb.disabled = false; alert("Couldn't save that: " + error.message); await loadAll(true, ['done']); render(); return; }
  }
  // what was saved, kept even if the re-read below fails
  S.done = S.done.filter(d => !(d.room_id === V.room.id && cycles.includes(d.cycle) && d.task_key === task));
  if (done) S.done.push({ room_id: V.room.id, cycle: V.C.flip, task_key: task, status: 'done', done_at: new Date().toISOString(), done_by: S.me && S.me.email || '' });
  await loadAll(true, ['done']); render();   // the room object is new after a reload
}
function wireZoneEditor(V) {
  const box = $('zed'), msg = $('zed-msg'), list = strainChoices(V), tn = CM.tableNs(V.room.layout);
  let pressing = false, refusedNow = false;   // a press on Save zones, and a strain box refusing its text during it
  // a box still showing the strain it opened with keeps that strain's stored text (pheno numbers and spelling included)
  const same = inp => !!inp.dataset.orig && CM.key(inp.value) === CM.key(inp.dataset.shown);
  const check = inp => {
    const t = inp.value.trim();
    if (!t) { inp.dataset.ok = ''; return true; }
    if (same(inp)) return true;
    const p = pickFrom(list, t);
    if (p) { inp.value = p; inp.dataset.ok = p; msg.textContent = ''; return true; }
    msg.textContent = `"${t}" isn't one strain on the list${list.some(x => CM.key(x).includes(CM.key(t))) ? ' (it matches several: type more)' : ''}. Kept "${inp.dataset.ok || 'blank'}".`;
    inp.value = inp.dataset.ok || '';
    if (pressing) refusedNow = true;
    return false;
  };
  // In Metrc as: empty, or exactly one of the room's Metrc strains (same rule as the strain box)
  const mlist = [...new Set(V.P.strains.map(x => x.name))];
  const checkM = inp => {
    const t = inp.value.trim();
    if (!t) { inp.dataset.ok = ''; return true; }
    const p = pickFrom(mlist, t);
    if (p) { inp.value = p; inp.dataset.ok = p; msg.textContent = ''; return true; }
    msg.textContent = `"${t}" isn't one of the strains Metrc has in this room. Kept "${inp.dataset.ok || 'empty'}".`;
    inp.value = inp.dataset.ok || '';
    if (pressing) refusedNow = true;
    return false;
  };
  const wire = row => {
    const s = row.querySelector('input[list="strain-list"]'), m = row.querySelector('input[list="metrc-list"]');
    s.addEventListener('change', () => check(s));
    s.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(s); } });
    if (m) {
      m.addEventListener('change', () => checkM(m));
      m.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkM(m); } });
    }
    row.querySelector('[data-del]').addEventListener('click', () => row.remove());
  };
  for (const r of box.querySelectorAll('.row:not(.h)')) wire(r);
  $('zed-add').addEventListener('click', () => {
    const rows = [...box.querySelectorAll('.row:not(.h)')];
    const last = rows.length ? +rows[rows.length - 1].querySelector('input').value || 0 : 0;
    const nx = tn.size && !tn.has(last + 1) ? (last || 1) : last + 1;   // never start a row past the last table
    box.insertAdjacentHTML('beforeend', zoneRow({ zone: nx, slot: 1, name: '', lights: null, pack: '' }));
    wire(box.lastElementChild);
  });
  $('zed-cancel').addEventListener('click', () => { S.editZones = false; renderRoom(V.room); });
  $('zed-save').addEventListener('pointerdown', () => { pressing = true; refusedNow = false; });
  $('zed-save').addEventListener('click', async () => {
    const stop = refusedNow; pressing = refusedNow = false;
    if (stop) return;   // Save pressed straight from a strain box that refused its text: the reason stays on screen, nothing is saved
    const out = [], slots = {};
    for (const r of box.querySelectorAll('.row:not(.h)')) {
      const [zi, si, li, pi, mi] = r.querySelectorAll('input');
      if (!check(si) || (mi && !checkM(mi))) return;
      const zone = Math.round(+zi.value);
      if (!(zone >= 1 && zone <= 20)) { msg.textContent = 'Each row needs a zone number from 1 to 20.'; zi.focus(); return; }
      if (tn.size && !tn.has(zone) && !V.zones.some(z => +z.zone === zone)) { msg.textContent = `Zone ${zone} isn't on a table on the map (zones there: ${[...tn].sort((a, b) => a - b).join(', ')}). Use Arrange zones on the map first.`; zi.focus(); return; }
      const lights = li.value === '' ? null : +li.value;
      if (lights != null && !(lights >= 0 && lights <= 100)) { msg.textContent = 'Lights must be a number from 0 to 100.'; li.focus(); return; }
      if (!si.value.trim() && lights == null && !pi.value.trim()) continue;
      slots[zone] = (slots[zone] || 0) + 1;
      if (slots[zone] > 9) { msg.textContent = `Zone ${zone} has more than 9 rows.`; return; }
      out.push({ zone, slot: slots[zone], strain: same(si) ? si.dataset.orig : (si.value.trim() || null), lights, pack: pi.value.trim() || null,
        metrc: mi && mi.value.trim() ? mi.value.trim() : null });
    }
    $('zed-save').disabled = true;
    const { error } = await sb.rpc('cult_zones_set', { p_room: V.room.id, p_zones: out });
    if (error) { $('zed-save').disabled = false; msg.textContent = "Couldn't save: " + error.message; return; }
    S.editZones = false;
    S.zones = S.zones.filter(z => z.room_id !== V.room.id).concat(out.map(({ metrc, ...z }) => ({ room_id: V.room.id, ...z, metrc_strain: metrc })));   // kept if the re-read fails
    await loadAll(true, ['zones']); render();   // the room object is new after a reload
  });
}

let glHoverOn = false;
function glHoverAt(box, day) {
  const pts = box._pts || (box._pts = JSON.parse(box.dataset.pts || '[]'));
  if (pts.length < 2) return;
  const first = pts[0][0], span = Math.max(1, CM.diff(first, pts[pts.length - 1][0]));
  let best = pts[0];
  for (const p of pts) if (Math.abs(CM.diff(p[0], day)) < Math.abs(CM.diff(best[0], day))) best = p;
  const frac = CM.diff(first, best[0]) / span, m = box.dataset.m, u = box.dataset.unit || '';
  const v = x => (x == null ? '-' : `${CM.glNum(m, x)}${u}`);
  const l = box.querySelector('.hv-l'), t = box.querySelector('.hv-t');
  l.hidden = false; l.style.left = `${(frac * 100).toFixed(2)}%`;
  t.hidden = false;
  t.textContent = `${CM.wday(best[0])} · on ${v(best[1])} · off ${v(best[2])}${best[3] != null ? ` · plan ${v(best[3])} / ${v(best[4])}` : ''}`;
  const bw = box.clientWidth, flip = frac * bw + t.offsetWidth > bw;   // it would run off the chart: left of the line
  t.style.left = flip ? 'auto' : `${(frac * 100).toFixed(2)}%`;
  t.style.right = flip ? `${((1 - frac) * 100).toFixed(2)}%` : 'auto';
}

    return;

  const pts = box._pts || (box._pts = JSON.parse(box.dataset.pts || '[]'));
  if (pts.length < 2) return;
  const r = box.getBoundingClientRect(), frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const day = CM.addDays(pts[0][0], Math.round(frac * CM.diff(pts[0][0], pts[pts.length - 1][0])));
  for (const b of all) glHoverAt(b, day);
  glHoverOn = true;
});
// back to a tab left in the background: Growlink's readings at once, if the last read is over 5 minutes old
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.loadedAt && S.room && Date.now() - S.gl.at > 5 * 60e3 && await loadGrowlink(S.room)) glRefresh();
  if (document.visibilityState === 'visible' && S.loadedAt && !S.room) ovGlLoad();

window.addEventListener('resize', (() => { let t = 0, w = window.innerWidth; return () => { clearTimeout(t); t = setTimeout(() => { if (window.innerWidth === w) return; w = window.innerWidth; if (S.loadedAt && S.room && !formOpen()) renderRoom(S.rooms.find(r => r.id === S.room)); }, 250); }; })());

/* ---------------- sign-in: Google -> Supabase session (same flow as the pipeline and timesheets apps) ---------------- */
const gateErr = m => { $('gate-err').textContent = m || ''; };
async function sha256hex(s) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function openApp() {
  const { data, error } = await sb.rpc('cult_whoami');
  if (error) { $('gate-loading').hidden = true; gateErr(/function|does not exist|schema cache/i.test(error.message) ? "The cultivation app isn't set up on the server yet. Ask Gianni." : "Couldn't reach the database. Check your connection and refresh."); return; }
  if (!data || !data.view) {
    const { data: { user } } = await sb.auth.getUser();
    $('gate-loading').hidden = true; $('gate-signin').hidden = true; $('gate-noaccess').hidden = false;
    $('gate-email').textContent = user && user.email ? 'Signed in as ' + user.email : '';
    return;
  }
  S.me = data;
  startApp();
}
async function onCredential(resp) {
  gateErr('');
  const { error } = await sb.auth.signInWithIdToken({ provider: 'google', token: resp && resp.credential, nonce: rawNonce });
  if (error) { gateErr('Sign-in failed: ' + error.message); return; }
  openApp();
}
async function showGoogleButton() {
  rawNonce = crypto.randomUUID() + crypto.randomUUID();
  const hashed = await sha256hex(rawNonce);
  let tries = 0;
  (function ready() {
    if (window.google && google.accounts && google.accounts.id) {
      $('gate-loading').hidden = true;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, hd: 'wizardtrees.com', nonce: hashed, auto_select: true, cancel_on_tap_outside: false });
      google.accounts.id.renderButton($('gsi'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
      google.accounts.id.prompt();
    } else if (tries++ < 60) setTimeout(ready, 150);
    else gateErr('Could not load Google sign-in. Check your connection and refresh.');
  })();
}
function signOut() {
  if (!sb) { location.reload(); return; }
  sb.auth.signOut({ scope: 'local' }).finally(() => {   // this device only
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    location.reload();
  });
}
$('signout').addEventListener('click', signOut);
$('gate-out').addEventListener('click', signOut);
// local preview only: on localhost, ?demo=<file>.json reads the rooms from that file beside the page, with no sign-in and no
// database (saves change the copy in memory). Ignored anywhere else.
function demoClient(D) {
  const T = { cult_rooms: D.rooms || [], cult_zones: D.zones || [], cult_strain_codes: D.codes || [], cult_metrc_plants: D.plants || [],
    cult_metrc_meta: D.meta || [], cult_task_done: D.done || [], cult_room_tasks: D.oneoffs || [], cult_runoff: D.runoff || [],
    cult_growlink_now: D.gl_now || [], cult_growlink_log: D.gl_log || [], cult_growlink_meta: D.gl_meta || [], cult_growlink_hourly: D.gl_hourly || [], cult_runs: D.runs || [], cult_metrc_batches: D.batches || [], cult_metrc_veg: D.veg || [], cult_metrc_veg_meta: D.veg_meta || [] };
  let seq = 1000;
  const DOM = '@' + 'wizardtrees.com', PV = 'preview' + DOM;   // made-up accounts for the local preview only
  const q = rows => {
    let r = rows.slice();
    const b = { select: () => b, order: (k, o) => { const asc = !o || o.ascending !== false; r.sort((x, y) => (x[k] > y[k] ? 1 : x[k] < y[k] ? -1 : 0) * (asc ? 1 : -1)); return b; }, eq: (k, v) => { r = r.filter(x => x[k] === v); return b; }, in: (k, v) => { r = r.filter(x => v.includes(x[k])); return b; },
      gte: (k, v) => { r = r.filter(x => x[k] >= v); return b; }, gt: (k, v) => { r = r.filter(x => x[k] > v); return b; }, limit: () => b, then: (f, g) => Promise.resolve({ data: r.filter(x => !x.deleted_at), error: null }).then(f, g) };
    return b;
  };
  const RPC = {
    cult_whoami: () => ({ view: true, work: true, edit: true, email: PV }),
    cult_task_set: a => { let d = T.cult_task_done.find(x => x.room_id === a.p_room && x.cycle === a.p_cycle && x.task_key === a.p_task);
      if (!d) T.cult_task_done.push(d = { room_id: a.p_room, cycle: a.p_cycle, task_key: a.p_task, status: 'open', note: null, moved_to: null });
      Object.assign(d, a.p_set, { done_at: new Date().toISOString(), done_by: PV });
      if (d.status === 'open' && !d.note && !d.moved_to) T.cult_task_done = T.cult_task_done.filter(x => x !== d); return { ok: true }; },
    cult_room_task_add: a => { T.cult_room_tasks.push({ id: ++seq, room_id: a.p_room, due: a.p_due, kind: a.p_kind, text: a.p_text, status: 'open', created_by: PV }); return { ok: true, id: seq }; },
    cult_room_task_set: a => { const t = T.cult_room_tasks.find(x => x.id === a.p_id); if (a.p_set.delete) t.deleted_at = 'now'; else Object.assign(t, a.p_set, a.p_set.status ? { done_by: PV, done_at: new Date().toISOString() } : {}); return { ok: true }; },
    cult_runoff_add: a => { const r = { id: ++seq, room_id: a.p_room, ...a.p_row, created_by: PV, created_at: new Date().toISOString() }; r.runoff_pct = CM.runoffPct(r); T.cult_runoff.unshift(r); return { ok: true, id: seq }; },
    cult_room_history: a => (D.history && D.history[a.p_room]) || { v: 1, harvests: [], trims: [], fresh: {} },
    cult_runoff_delete: a => { const r = T.cult_runoff.find(x => x.id === a.p_id); r.deleted_at = 'now'; return { ok: true }; },
    cult_task_mark: a => { T.cult_task_done = T.cult_task_done.filter(d => !(d.room_id === a.p_room && d.cycle === a.p_cycle && d.task_key === a.p_task));
      if (a.p_done) T.cult_task_done.push({ room_id: a.p_room, cycle: a.p_cycle, task_key: a.p_task, done_at: new Date().toISOString(), done_by: 'preview' }); return { ok: true }; },
    cult_zones_set: a => { T.cult_zones = T.cult_zones.filter(z => z.room_id !== a.p_room).concat(a.p_zones.map(({ metrc, ...z }) => ({ room_id: a.p_room, ...z, metrc_strain: metrc || null }))); return { ok: true }; },
    cult_room_set: a => { const r = T.cult_rooms.find(x => x.id === a.p_room); Object.assign(r, a.p_set); return r; },
    cult_run_save: a => { let r = T.cult_runs.find(x => x.room_id === a.p_room && x.run_key === a.p_run.run_key && !x.deleted_at);
      if (!r) T.cult_runs.push(r = { room_id: a.p_room, run_key: a.p_run.run_key, flip_on: null, cut_by: null, transplant_on: null, plants_per_light: null, zones: [], note: null });
      Object.assign(r, a.p_run, { updated_by: PV }); return r; },
    cult_run_delete: a => { const r = T.cult_runs.find(x => x.room_id === a.p_room && x.run_key === a.p_key && !x.deleted_at); if (r) r.deleted_at = 'now'; return r || null; },
    cult_strain_code_set: a => { T.cult_strain_codes = T.cult_strain_codes.filter(c => !(c.license === a.p_license && c.code === a.p_code))
      .concat({ license: a.p_license, code: a.p_code, name: a.p_name, source: 'confirmed' }); return { ok: true }; },
  };
  return { from: t => q(T[t] || []), rpc: async (n, a) => ({ data: RPC[n] ? RPC[n](a || {}) : null, error: RPC[n] ? null : { message: 'unknown ' + n } }),
    auth: { signOut: async () => ({}), getUser: async () => ({ data: { user: null } }) } };
}
async function initGate() {
  const demo = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get('demo');
  if (demo && /^[\w.-]+\.json$/.test(demo)) {
    try { sb = demoClient(await (await fetch(demo, { cache: 'no-store' })).json()); }
    catch (e) { $('gate-loading').hidden = true; gateErr('Could not read ' + demo + ': ' + e.message); return; }
    S.me = { view: true, edit: true }; startApp(); return;
  }
  if (!window.supabase || !window.supabase.createClient) { $('gate-loading').hidden = true; gateErr('Could not load the page. Check your connection and refresh.'); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.loadedAt) location.reload(); });
  $('gate-signin').hidden = true;
  const { data: { session } } = await sb.auth.getSession();
  if (session) { openApp(); return; }
  $('gate-signin').hidden = false;
  showGoogleButton();
}
