<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f7f4">
<title>Cultivation</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7d4f'/%3E%3Cpath d='M16 6c-3 5-3 10 0 14 3-4 3-9 0-14zM8 13c2 4 5 6 8 7-1-4-4-6-8-7zm16 0c-4 1-7 3-8 7 3-1 6-3 8-7zM16 20v6' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  Cultivation app: the flower rooms of the four grows, one page per room, replacing the [Location] Room # tabs of the
  cultivation sheet. What Metrc says is in each room (plants, strains, the days they went into flower) comes from
  cult_metrc_plants, copied every 3 hours by ~/ar-automation/cult-metrc-sync.mjs on Gianni's Mac. Each room's harvests
  and trims come from the Production Pipeline's copies of Metrc's harvests and the trim sheets, through
  cult_room_history() (pounds only). The rooms, their
  zones, their weekly targets and task calendars, and the room maps traced from the premises / lighting diagrams live
  in cult_rooms and cult_zones (supabase/cultivation.sql). Nothing private is in this file: every number and name is
  read from the database after a Wizard Trees sign-in. Check before every push: node tests/cult-check.mjs
-->
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --panel2:#f1f3ef; --line:#dfe3dc; --line2:#c9cfc6;
    --text:#1d2420; --muted:#5d6862; --faint:#636d67;
    --accent:#2f7d4f; --accent-ink:#ffffff; --accent-soft:#e3f1e8;
    --amber:#9c5d09; --amber-soft:#fff3dc; --blue:#2453a6; --blue-soft:#e6eefc;
    --room-floor:#fbfbf8; --room-wall:#3c4640; --table-line:#6f7a73; --light:#e2b007; --light-hps:#e0782b;
    --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
  }
  :root[data-look="dark"]{
    color-scheme:dark;
    --bg:#121614; --panel:#1a201d; --panel2:#212825; --line:#2d3631; --line2:#3b4640;
    --text:#e6ece8; --muted:#a3aea8; --faint:#8f9a94;
    --accent:#4fb07a; --accent-ink:#0d130f; --accent-soft:#1f3328;
    --amber:#f0b14a; --amber-soft:#3a2e16; --blue:#8fb2f5; --blue-soft:#1c2740;
    --room-floor:#161b18; --room-wall:#c7d0ca; --table-line:#8b968f; --light:#f3cd47; --light-hps:#f3965a;
    --shadow:none;
  }
  iframe{color-scheme:light}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);min-height:100vh;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  a{color:var(--accent)}
  .btn{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;cursor:pointer;line-height:1.2}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text);border-color:var(--line2)}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=text],input[type=number],input[type=date]{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;min-width:0}
  input:focus,.btn:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  #top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
  .brand b{font-size:15px;display:block;white-space:nowrap}
  .brand span{font-size:11.5px;color:var(--muted);display:block}
  .at-rep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .vgt tr.vg-h th{background:var(--ov-site);color:var(--ov-ink);text-align:left;font-size:12.5px;text-transform:none;letter-spacing:0}
  .vgt tr.vg-h th .btn{float:right;font-size:12px;padding:3px 10px}
  .vg-hl{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
  .vg-hl .vg-w{color:var(--amber)}
  .vgt td.ov-none{color:var(--muted);text-align:left}
  .vgt td.vg-edc{text-align:left;white-space:normal}
  .topnav button{font-weight:600}
  .rhead .ovf button{white-space:nowrap}
  @media (max-width:640px){.rhead .ovf{max-width:100%;overflow-x:auto}}
  .bar .grow{flex:1}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
  #fresh{font-size:12px;color:var(--muted)}
  #fresh.stale{color:var(--amber)}

  main{max-width:1500px;margin:0 auto;padding:16px}
  .gate{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;box-shadow:var(--shadow)}
  .gate h1{font-size:20px;margin:0 0 6px}
  .gate p{color:var(--muted);margin:6px 0 18px}
  #gsi{display:flex;justify-content:center;min-height:44px}
  .err{color:var(--amber);font-size:13px;margin-top:10px}

  /* rooms overview */
  .site{margin:6px 0 22px}
  .site h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
  .site h2 span{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px;color:var(--faint)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .rc{padding:12px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;font:inherit;color:inherit}
  .rc:hover{border-color:var(--accent)}
  .rc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rc .h b{font-size:15.5px}
  .rc .h small{color:var(--faint);font-size:12px;white-space:nowrap}
  .rc .day{display:flex;align-items:baseline;gap:8px}
  .rc .day big{font-size:26px;font-weight:650;letter-spacing:-.01em}
  .rc .day span{color:var(--muted)}
  .prog{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .rc .facts{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px}
  .rc .facts b{color:var(--text);font-weight:600}
  .rc .mini{height:92px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .rc .mini svg{width:100%;height:100%;display:block}
  .rc .next{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .next b{color:var(--text);font-weight:600}
  .flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:2px 7px;align-self:flex-start}
  .flag.blue{color:var(--blue);background:var(--blue-soft)}
  .flag.muted{color:var(--muted);background:var(--panel2)}

  /* room page */
  .rhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin:2px 0 14px}
  .rhead h1{font-size:22px;margin:0;line-height:1.15}
  .rhead .sub{color:var(--muted);font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .stat small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .stat b{display:block;font-size:18px;font-weight:650;margin-top:1px}
  .stat span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .stat button{margin-top:6px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
  .panel>h3{font-size:14px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .panel>h3 .grow{flex:1}
  .panel>h3 small{color:var(--faint);font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbody{padding:12px 14px}
  .note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
  .gl{margin-bottom:12px}
  .gl-top{margin:0 0 14px}
  .gl-top .gl-tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .gl-msg{margin:0 0 4px;font-size:13px}
  .gl-head{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .gl-head .warn{color:var(--amber)}
  .gl-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
  .gl-t{appearance:none;font:inherit;color:inherit;text-align:left;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .gl-t:hover{border-color:var(--line2)}
  .gl-t[aria-expanded="true"]{border-color:var(--accent)}
  .gl-t small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .gl-t b{display:block;font-size:18px;font-weight:650;margin-top:1px;white-space:nowrap}
  .gl-t span{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gl-t em{display:block;font-style:normal;font-size:11.5px;margin-top:1px;color:var(--faint)}
  .gl-t.off{border-color:var(--amber);background:var(--amber-soft)}
  .gl-t[aria-expanded="true"]{box-shadow:0 0 0 2px var(--accent)}
  .gl-t.off em{color:var(--amber)}
  .gl-t.old b{color:var(--faint)}
  .gl-t svg{display:block;width:100%;height:22px;margin-top:5px;color:var(--faint);overflow:visible}
  .gl-t.off svg{color:var(--amber)}
  .gl-d{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
  .gl-d p{margin:4px 0 0}
  .gl-d ul{margin:4px 0 0;padding-left:18px}
  .gl-al{list-style:none;margin:8px 0 0;padding:0}
  .gl-al li{font-size:12.5px;color:var(--amber);padding:1px 0}
  .gl-eq{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
  .gl-eqh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .gl-eqh[aria-expanded="false"]>.chev{transform:rotate(-45deg);margin-bottom:0}
  .gl-eqh>b{font-weight:600;font-size:13px;white-space:nowrap}
  .gl-eqs{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
  .gl-eqs .w{color:var(--amber)}
  .gl-eqb{padding:0 10px 8px}
  .gl-eqr,.gl-eqax{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 52px 56px;gap:10px;align-items:center}
  .gl-eqr{padding:4px 0}
  .gl-eqax{color:var(--faint);font-size:11px}
  .gl-eqax>span:nth-child(2){display:flex;justify-content:space-between}
  .gl-eql b{display:block;font-weight:600;font-size:12.5px}
  .gl-eql small{display:block;color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gl-eqr.w .gl-eql b,.gl-eqr.w .gl-eqn{color:var(--amber)}
  .gl-strip{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));height:14px;border-radius:4px;overflow:hidden;background:var(--panel)}
  .gl-strip i{position:relative;display:block}
  .gl-strip i.dk{background:var(--line)}
  .gl-strip u{position:absolute;inset:0;background:var(--blue)}
  .gl-eqr.w .gl-strip u{background:var(--amber)}
  .gl-eqn{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
  .gl-eqd{display:flex;gap:2px;align-items:flex-end;height:18px}
  .gl-eqd i{display:block;width:6px;background:var(--faint);border-radius:1px 1px 0 0}
  @media (max-width:640px){.gl-eqax{display:none}.gl-eqr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l n" "s s"}.gl-eql{grid-area:l}.gl-eqn{grid-area:n}.gl-strip{grid-area:s}.gl-eqd{display:none}}
  .t td small.act{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  .t td small.act.w{color:var(--amber)}
  .envt th.off-c{font-size:10.5px;white-space:nowrap} .envt td.off-c{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .envt td.off-c.w{color:var(--amber);font-weight:600}
  .offb{all:unset;cursor:pointer;border-bottom:1px dotted currentColor;padding:1px 2px}
  .offb:hover,.offb.on{background:var(--panel2);border-radius:4px}
  .offb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .envt tr.env-g td{background:var(--panel);text-align:left;white-space:normal;padding:10px 12px}
  .ps .w{color:var(--amber)}
  .gl-ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
  @media (max-width:640px){.gl-ch{grid-template-columns:minmax(0,1fr)}}
  .gl-cb>b{font-weight:600;font-size:12px}
  .gl-cb .box{position:relative;margin-top:4px}
  .gl-cb svg{display:block;width:100%;height:84px;overflow:visible}
  .gl-cb .y{position:absolute;left:0;font-size:10.5px;color:var(--faint);background:var(--panel);padding:0 2px}
  .gl-cb .ax{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:2px}
  .gl-lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:8px}
  .gl-lg i{display:inline-block;width:16px;height:0;border-top:2px solid var(--blue);vertical-align:middle;margin-right:5px}
  .notes{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}

  .map{position:relative;background:var(--panel2);border-radius:10px;border:1px solid var(--line);overflow:hidden}
  .map svg{display:block;width:100%;height:auto;max-height:68vh}
  .map .tbl{cursor:pointer}
  .map .tbl:focus{outline:none}
  .map .tbl:focus-visible .tbl-edge{stroke:var(--accent);stroke-width:.4}
  .map .tbl:hover .tbl-edge,.map .tbl.sel .tbl-edge{stroke:var(--text);stroke-width:.35}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
  .legend b{color:var(--text);font-weight:600}
  .legend .lt{width:10px;height:10px;border-radius:50%;background:none;border:2px solid var(--light)}
  .legend .lt.hps{background:var(--light-hps);border:0}

  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t tr:last-child td{border-bottom:0}
  table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.t tr.now td{background:var(--accent-soft)}
  table.t tr.now td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
  .wrapx{overflow-x:auto}

  .tasks{list-style:none;margin:0;padding:0}
  .tasks li{display:grid;grid-template-columns:22px 74px 1fr auto;gap:8px;align-items:start;padding:7px 2px;border-bottom:1px solid var(--line)}
  .tasks li.skipped{opacity:.6}
  .tasks li.skipped .x>span{text-decoration:line-through;text-decoration-color:var(--faint)}
  .tasks .tmenu{padding:0 8px;font-size:16px;line-height:1.2}
  .tasks .tnote{color:var(--muted)!important;font-style:italic}
  .ta{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font:inherit;color:inherit;resize:vertical}
  .rnotes{margin:0;white-space:pre-wrap}
  .rform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .rform label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
  .rform label input{width:100%}
  .rform .wide{grid-column:span 2}
  @media (max-width:640px){.rform{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .pform{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .pform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .tasks li:last-child{border-bottom:0}
  .tasks li .d{color:var(--muted);font-size:12.5px;line-height:1.3}
  .tasks li .d b{display:block;color:var(--text);font-weight:600}
  .tasks li .x{font-size:13.5px}
  .tasks li .x small{display:block;color:var(--faint);font-size:12px}
  .tasks li.past{opacity:.55}
  .tasks li.done .x span{text-decoration:line-through;text-decoration-color:var(--faint)}
  .tasks li.today{background:var(--blue-soft);border-radius:8px}
  .tasks li.late .d b{color:var(--amber)}
  .kind{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px;background:var(--panel2);color:var(--muted)}
  .kind.spray{background:var(--blue-soft);color:var(--blue)}

  #pop{position:fixed;z-index:40;max-width:340px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px 14px;font-size:13px}
  #pop h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
  #pop.wide{max-width:min(660px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto}
  #pop .ty-sub{margin:-2px 0 8px;font-size:12px;color:var(--muted)}
  #pop .rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
  #pop .rows span{color:var(--muted)}
  @media (max-width:640px){#pop{left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;max-width:none}}

  .ed{display:grid;gap:6px}
  .ed .row{display:grid;grid-template-columns:56px minmax(0,1fr) 66px minmax(0,84px) minmax(0,110px) 30px;gap:6px;align-items:center}
  .ed .row.h{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ed .row input{width:100%}
  .ed.act{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  .ed.act .grow{flex:1}
  .arows{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .arow{display:grid;grid-template-columns:22px minmax(0,1fr) 64px 72px;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px 8px}
  .arow .al{font-size:12px}
  .arow b{font-size:15px}
  .arow input{width:100%}
  .pickmsg{font-size:12px;color:var(--amber);min-height:16px}
  .codebtn{background:none;border:0;padding:0 2px;color:var(--faint);cursor:pointer;font-size:12.5px;text-decoration:underline dotted;text-underline-offset:3px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
'use strict';
/* ===== CULT MODEL START =====
   Pure parts (no DOM, no network), tested by tests/cult-check.mjs: dates as YYYY-MM-DD strings (never shifted through a
   time zone), Metrc strain names (codes like 2504 named through cult_strain_codes), a room's plants from Metrc, its
   cycle (flip date, day of flower, harvest), its task calendar and environment weeks, where Metrc's plants sit on the
   room's zones, and the room map's shapes in feet.
*/
const CM = (() => {
  const DAY = 864e5;
  const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const ms = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const iso = t => new Date(t).toISOString().slice(0, 10);
  const addDays = (s, n) => iso(ms(s) + n * DAY);
  const diff = (a, b) => Math.round((ms(b) - ms(a)) / DAY);          // days from a to b
  // today on the grows' clock (Los Angeles), as YYYY-MM-DD
  const LA_DAY = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' });
  const todayLA = (now = new Date()) => {
    const p = Object.fromEntries(LA_DAY.formatToParts(now).map(x => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;
  };
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const short = s => isDay(s) ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : '';
  const wday = s => isDay(s) ? `${WD[new Date(ms(s)).getUTCDay()]} ${short(s)}` : '';
  const key = s => String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  // "BLUE BANGER" -> "Blue Banger", "BB X TB #2" -> "BB x TB #2" (two-letter abbreviations stay in capitals); names
  // already in mixed case are kept
  const nice = s => {
    const t = String(s == null ? '' : s).replace(/\s+/g, ' ').replace(/\s+,/g, ',').trim();
    if (/[a-z]/.test(t)) return t;
    return t.split(' ').map(w => w === 'X' ? 'x' : (/^[A-Z0-9]{1,2}$/.test(w.replace(/[^A-Z0-9]/g, '')) && !w.startsWith('#')) || w === 'OG' ? w
      : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
  };

  // Metrc strain (a code like 2504 at 23rd, 15th and Olympic; a name at 25th) -> what to call it
  function strainOf(license, metrc, codes) {
    const s = String(metrc == null ? '' : metrc).trim();
    if (/^\d{3,6}$/.test(s)) {
      const c = codes && codes[`${license}|${s}`];
      return { name: c ? c.name : `#${s}`, code: s, named: !!c, sure: !!c && c.source !== 'inferred' };
    }
    return { name: s || '(none)', code: null, named: true, sure: true };
  }

  // the room's rows of cult_metrc_plants -> strains in flower now, the days they went in, and what left recently.
  // 'left' rows are plants harvested or destroyed in the last 120 days, by the day they went into flower. With the plants
  // still in flower they make up each crop, so a harvest (part of the room or all of it) never moves the crop's flip.
  function roomPlants(room, rows, codes) {
    const mine = (rows || []).filter(r => r && r.license === room.license && r.location === room.metrc_location && isDay(r.day) && +r.plants > 0);
    const by = new Map(), days = {}, all = {};
    let total = 0;
    for (const r of mine) {
      const n = +r.plants;
      if (r.state === 'flowering' || r.state === 'left') all[r.day] = (all[r.day] || 0) + n;
      if (r.state !== 'flowering') continue;
      let e = by.get(r.strain);
      if (!e) { const st = strainOf(room.license, r.strain, codes); by.set(r.strain, e = { metrc: r.strain, ...st, plants: 0, days: {} }); }
      e.plants += n; e.days[r.day] = (e.days[r.day] || 0) + n; days[r.day] = (days[r.day] || 0) + n; total += n;
    }
    const strains = [...by.values()].sort((a, b) => b.plants - a.plants || a.name.localeCompare(b.name));
    const dayList = Object.keys(days).sort().map(d => ({ day: d, plants: days[d] }));
    // crops: every day plants went into flower here, cut where more than 3 weeks pass with none; the newest is the room's
    const crops = [];
    for (const d of Object.keys(all).sort()) {
      const c = crops[crops.length - 1];
      if (c && diff(c.last, d) <= 21) { c.days.push(d); c.last = d; c.plants += all[d]; } else crops.push({ days: [d], last: d, plants: all[d] });
    }
    const crop = crops.length ? crops[crops.length - 1] : null;
    // the flip as Metrc saw it: the crop's first day that moved a real share (10%) of it into flower, so one stray plant
    // moved early does not set it
    const first = crop ? (crop.days.find(d => all[d] >= Math.max(1, crop.plants * 0.1)) || crop.days[0]) : null;
    const gone = state => {
      const m = new Map();
      for (const r of mine) if (r.state === state) {
        const e = m.get(r.day) || { day: r.day, plants: 0, strains: 0 };
        e.plants += +r.plants; e.strains++; m.set(r.day, e);
      }
      return [...m.values()].sort((a, b) => (a.day < b.day ? 1 : -1));
    };
    return { strains, total, dayList, first, cropDays: crop ? crop.days.map(d => ({ day: d, plants: all[d] })) : [],
      harvested: gone('harvested'), destroyed: gone('destroyed') };
  }

  // the room's current cycle. A flip typed in the app wins when it is within 3 weeks of Metrc's (the crew's day, often a
  // day or two before the plants are moved in Metrc). Further off: before Metrc's it is from an earlier cycle; after it,
  // it is the next cycle's flip, used once Metrc has nothing left in flower here. Meanwhile Metrc's day is used. With no
  // crop in Metrc, a typed flip counts until two weeks past its harvest day. A harvested room stays "harvested" for three
  // weeks (trim and the last tasks), then "empty".
  function cycle(room, P, today) {
    const H = +room.harvest_day || 63;
    const typed = isDay(room.flip_date) ? room.flip_date : null;
    const mf = P.first;
    const notes = [];
    let flip = null, source = 'none';
    if (typed && mf && Math.abs(diff(typed, mf)) <= 21) {
      flip = typed; source = 'typed';
      if (typed !== mf) notes.push({ k: 'metrc-day', text: `Metrc has the plants going into flower on ${P.cropDays.map(d => `${short(d.day)} (${d.plants})`).join(', ')}.` });
    } else if (typed && (mf ? typed > mf && !P.total : diff(typed, today) <= H + 14)) {
      flip = typed; source = 'typed';
    } else if (mf) {
      flip = mf; source = 'metrc';
      if (typed) notes.push(typed < mf
        ? { k: 'old-typed', text: `The flip date typed for this room (${short(typed)}) is from an earlier cycle, so Metrc's first flowering day is used.` }
        : { k: 'next-typed', text: `The flip date typed for this room (${short(typed)}) is for the next cycle: Metrc still has plants in flower here from ${short(mf)}, so that day is used until they are harvested.` });
    }
    const lastHarvest = P.harvested[0] || null;
    if (!flip) return { state: 'empty', flip: null, source, typed, metrcFirst: mf, H, day: null, week: null, lastHarvest, notes };
    const day = diff(flip, today) + 1;
    const harvestDate = addDays(flip, H - 1);
    let state = day < 1 ? 'upcoming' : 'flower';
    if (state === 'flower' && !P.total) {
      if (lastHarvest && lastHarvest.day >= addDays(flip, 21)) state = diff(lastHarvest.day, today) > 21 ? 'empty' : 'harvested';
      else notes.push({ k: 'no-metrc', warn: true, text: `Metrc shows no flowering plants in ${room.metrc_location || 'this room'} yet.` });
    }
    if (state === 'flower' && day > H + 3 && P.total) notes.push({ k: 'past-harvest', warn: true, text: `Day ${day}: past the planned harvest (day ${H}) and Metrc still has ${P.total} plants in flower here.` });
    if (state === 'empty') return { state, flip: null, source, typed, metrcFirst: mf, H, day: null, week: null, lastHarvest, notes };
    return { state, flip, source, typed, metrcFirst: mf, H, day, week: day >= 1 ? Math.ceil(day / 7) : 0,
      harvestDate, daysLeft: diff(today, harvestDate), lastHarvest, notes };
  }

  // a task's key: the one stored on it (the calendar editor keeps it through a new day or new words, so ticks stay), else
  // its calendar day and words
  const taskKey = t => typeof t.key === 'string' && t.key ? t.key.slice(0, 200) : `${t.day}|${String(t.text || '').replace(/\s+/g, ' ').trim().toUpperCase()}`.slice(0, 200);
  // day N of a cycle is flip + N - 1 (day 1 = the flip), as the sheet counts. A task's row belongs to the cycle it was made
  // in and still counts after the flip is corrected by up to 3 weeks (cycles in a room are at least 30 days apart); the
  // nearest cycle's row wins, and cycles lists every date the task is stored under (an untick clears them all). A row is
  // done, skipped or open, with a note and a new date (moved_to) either way. The room's one-off tasks (oneOffs) join the
  // list on their due day. Past tasks not done or skipped are "late" for three days, then just past.
  const closed = st => st === 'done' || st === 'skipped';
  const stateOf = (st, date, today) => st === 'done' ? 'done' : st === 'skipped' ? 'skipped' : date === today ? 'today' : date > today ? 'next' : diff(date, today) <= 3 ? 'late' : 'past';
  function tasks(room, C, done, today, oneOffs) {
    const out = [];
    if (C && C.flip) {
      const ticks = new Map();
      for (const d of done || []) {
        if (!d || d.room_id !== room.id || !isDay(d.cycle) || Math.abs(diff(C.flip, d.cycle)) > 21) continue;
        const e = ticks.get(d.task_key);
        if (!e) ticks.set(d.task_key, { d, cycles: [d.cycle] });
        else { e.cycles.push(d.cycle); if (Math.abs(diff(C.flip, d.cycle)) < Math.abs(diff(C.flip, e.d.cycle))) e.d = d; }
      }
      // the calendar's HARVEST, and every task on or after its day, moves with the room's harvest day (the 8 or 9 week
      // switch on the page); a task keeps its key (its calendar day), so its ticks stay with it
      const cal = Array.isArray(room.tasks) ? room.tasks : [];
      const hvT = cal.find(t => t && +t.day > 0 && /^HARVEST\b/i.test(String(t.text || '').trim()));
      const shift = hvT && +C.H > 0 ? +C.H - +hvT.day : 0;
      for (const t of cal) {
        if (!t || !(+t.day > 0)) continue;
        const dd = +t.day + (hvT && +t.day >= +hvT.day ? shift : 0);
        const planned = addDays(C.flip, dd - 1), k = taskKey(t), e = ticks.get(k), d = e ? e.d : null;
        const st = d ? d.status || 'done' : 'open', date = d && isDay(d.moved_to) ? d.moved_to : planned;
        out.push({ src: 'cal', day: dd, kind: String(t.kind || '').toUpperCase(), text: String(t.text || ''), key: k, date, planned,
          moved: date !== planned, status: stateOf(st, date, today), note: d && d.note || null,
          doneBy: d && closed(st) ? d.done_by : null, doneAt: d && closed(st) ? d.done_at : null, cycles: e ? e.cycles : [] });
      }
    }
    const from = C && C.flip ? addDays(C.flip, -14) : addDays(today, -30);
    for (const o of oneOffs || []) {
      if (!o || o.room_id !== room.id || o.deleted_at || !isDay(o.due) || (o.due < from && closed(o.status))) continue;
      out.push({ src: 'one', id: o.id, day: C && C.flip ? diff(C.flip, o.due) + 1 : null, kind: String(o.kind || 'ACTION').toUpperCase(), text: String(o.text || ''),
        key: `one:${o.id}`, date: o.due, planned: o.due, moved: false, status: stateOf(o.status || 'open', o.due, today), note: o.note || null,
        doneBy: closed(o.status) ? o.done_by : null, doneAt: closed(o.status) ? o.done_at : null, createdBy: o.created_by || null, cycles: [] });
    }
    return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.day || 0) - (b.day || 0) || a.text.localeCompare(b.text)));
  }

  // weekly targets; week k covers days 7k-6 .. 7k
  function envRows(room, C) {
    return (Array.isArray(room.env) ? room.env : []).filter(e => e && +e.week > 0).map(e => ({ ...e, week: +e.week,
      from: C && C.flip ? addDays(C.flip, (e.week - 1) * 7) : null, to: C && C.flip ? addDays(C.flip, e.week * 7 - 1) : null,
      now: !!(C && C.week === +e.week) })).sort((a, b) => a.week - b.week);
  }

  // zone strains (as the crew typed them) <-> Metrc's strains in the room, on letters and digits only. Metrc strains with
  // the same letters (a strain under its name and its number, "Flash Bang" and "Flashbang") are one strain here. Exact
  // first; else the longest Metrc name the zone's name extends by a number only ("RIPTIDE X TB #6" is Riptide x TB,
  // "KINGTIDE #3" is King Tide, but "TIDEBANGER" is never Tide); else the one Metrc name that extends the zone's by a
  // number ("KINGTIDE" is King Tide 23 when it is the only one). A zone strain can name the Metrc strain its plants are
  // recorded under when that isn't its own name (metrc_strain: 25th Room 1's Pool Party and King Tide 23 are "Cream" in
  // Metrc); it then takes those plants and keeps its own name. A strain on several zones (or several zone strains on one
  // Metrc strain) is split between them by lights (evenly when none are set), in whole plants that add up to its count.
  function place(zones, P) {
    const ms_ = [];
    for (const s of (P && P.strains || [])) {
      const k = key(s.name), x = ms_.find(y => y.k === k);
      if (!x) ms_.push({ s, k, slots: [] });
      else {
        const days = { ...(x.s.days || {}) };
        for (const [d, n] of Object.entries(s.days || {})) days[d] = (days[d] || 0) + n;
        x.s = { ...x.s, plants: x.s.plants + s.plants, code: [x.s.code, s.code].filter(Boolean).join(', ') || null, days, parts: (x.s.parts || [x.s]).concat(s) };
      }
    }
    const byNumber = (longer, shorter) => longer.length > shorter.length && longer.startsWith(shorter) && /[A-Z]$/.test(shorter) && /^\d/.test(longer.slice(shorter.length));
    const matchOf = name => {
      const k = key(name);
      if (!k) return null;
      const exact = ms_.find(x => x.k === k);
      if (exact) return exact;
      if (k.length < 3) return null;
      const pre = ms_.filter(x => x.k.length >= 3 && byNumber(k, x.k)).sort((a, b) => b.k.length - a.k.length);
      if (pre.length) return pre.length === 1 || pre[0].k.length > pre[1].k.length ? pre[0] : null;
      const ext = ms_.filter(x => byNumber(x.k, k));
      return ext.length === 1 ? ext[0] : null;
    };
    const slots = (Array.isArray(zones) ? zones : []).filter(z => z && +z.zone > 0).slice().sort((a, b) => a.zone - b.zone || (a.slot || 1) - (b.slot || 1))
      .map(z => ({ zone: +z.zone, slot: +(z.slot || 1), strain: z.strain || null, lights: z.lights == null || z.lights === '' ? null : +z.lights,
        pack: z.pack || null, metrcAs: z.metrc_strain || null, m: null, plants: 0 }));
    for (const z of slots) { const look = z.metrcAs || z.strain; z.m = look ? matchOf(look) : null; if (z.m) z.m.slots.push(z); }
    for (const x of ms_) {
      if (!x.slots.length) continue;
      const L = x.slots.reduce((a, z) => a + (z.lights > 0 ? z.lights : 0), 0), n = x.s.plants;
      const share = x.slots.map(z => L > 0 ? n * (z.lights > 0 ? z.lights : 0) / L : n / x.slots.length);
      x.slots.forEach((z, i) => { z.plants = Math.floor(share[i]); });
      let rest = n - x.slots.reduce((a, z) => a + z.plants, 0);
      const order = share.map((v, i) => i).sort((a, b) => (share[b] - Math.floor(share[b])) - (share[a] - Math.floor(share[a])) || a - b);
      for (const i of order) { if (rest <= 0) break; x.slots[i].plants++; rest--; }
    }
    for (const z of slots) {
      z.name = z.metrcAs ? nice(z.strain || z.metrcAs) : z.m ? z.m.s.name : (z.strain ? nice(z.strain) : null);
      z.metrc = z.m ? z.m.s : null; delete z.m;
    }
    return { slots, unplaced: ms_.filter(x => !x.slots.length).map(x => x.s), missing: slots.filter(z => (z.strain || z.metrcAs) && !z.metrc) };
  }

  // colours: one per strain in the room, in the order the zones list them, then the unplaced Metrc strains; past the 14
  // set colours each further strain gets its own hue
  const PALETTE = ['#5b8fd9', '#e8833a', '#4fa86a', '#d85a5f', '#8a6fd1', '#3bb0b0', '#8f9aa3', '#c86aa8', '#8c7a5c', '#6fa83b', '#d07b5f', '#5d7fa8', '#a0522d', '#b05fd9'];   // no yellows: lights are yellow
  function colors(placed) {
    const out = {}, order = [];
    for (const z of placed.slots) { const k = key(z.name); if (k && !(k in out)) { out[k] = null; order.push(k); } }
    for (const s of placed.unplaced) { const k = key(s.name); if (k && !(k in out)) { out[k] = null; order.push(k); } }
    order.forEach((k, i) => { out[k] = i < PALETTE.length ? PALETTE[i] : `hsl(${((i - PALETTE.length) * 137.508 % 360).toFixed(1)}, 45%, 40%)`; });
    return out;
  }

  // which zone a table holds: tables[i].zone when someone has arranged the zones (0 = no zone), else zone n is table n.
  // Tables carry letters (A, B, C ...) so a table is never confused with a zone.
  const tableZone = (t, i) => t && typeof t === 'object' && Object.prototype.hasOwnProperty.call(t, 'zone') && /^\d{1,2}$/.test(String(t.zone)) ? +t.zone : (+(t && t.n) || i + 1);
  const letter = i => i < 26 ? String.fromCharCode(65 + i) : `T${i + 1}`;
  // the zone numbers a room map has, each on one table (a zone a second table repeats is that table's no zone)
  const tableNs = layout => {
    const out = new Set();
    (layout && Array.isArray(layout.tables) ? layout.tables : []).forEach((t, i) => { if (!t || typeof t !== 'object') return; const z = tableZone(t, i); if (z > 0) out.add(z); });
    return out;
  };

  // the room map in feet: walls, doors, tables (zone n = table n), each table split between its strains by lights (a
  // strain with no lights set takes what its plants need at its table-mates' plants per light), plant dots per strain from
  // Metrc's count, and the lights (the fixtures traced from the lighting diagram when it shows them, else each strain's
  // lights over its own part of the table). rotate: turn a tall room on its side for a wide screen. Never throws on a
  // malformed layout: what it can't read it leaves out.
  function mapModel(layout, placed, col, opts) {
    if (!layout || typeof layout !== 'object' || !(+layout.w > 0) || !(+layout.h > 0) || !Array.isArray(layout.tables)) return null;
    const W = +layout.w, Hh = +layout.h, rot = !!(opts && opts.rotate);
    const R = rot ? (x, y) => [Hh - y, x] : (x, y) => [x, y];
    const rect = (x, y, w, h) => rot ? { x: Hh - (y + h), y: x, w: h, h: w } : { x, y, w, h };
    const pts = Array.isArray(layout.outline) ? layout.outline.filter(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])) : [];
    const out = { w: rot ? Hh : W, h: rot ? W : Hh, rot, outline: pts.map(p => R(+p[0], +p[1])), doors: [], tables: [] };
    // doors: the gap runs along the wall the door sits on (walls can slant); its swing goes into the room
    const poly = out.outline.length >= 3 ? out.outline : [[0, 0], [out.w, 0], [out.w, out.h], [0, out.h]];
    const cw = poly.reduce((t, p, i) => { const q = poly[(i + 1) % poly.length]; return t + p[0] * q[1] - q[0] * p[1]; }, 0) > 0 ? 1 : -1;
    const TURN = { n: 'e', e: 's', s: 'w', w: 'n' };   // a quarter turn clockwise moves each wall one side round
    for (const d of Array.isArray(layout.doors) ? layout.doors : []) {
      if (!d || !isFinite(d.x) || !isFinite(d.y)) continue;
      const [x, y] = R(+d.x, +d.y), s0 = /^[nsew]$/i.test(String(d.side || '')) ? String(d.side).toLowerCase() : null;
      const side = s0 ? (rot ? TURN[s0] : s0) : null;
      let a = side === 'n' || side === 's' ? [1, 0] : [0, 1], nv = side ? { n: [0, 1], s: [0, -1], e: [-1, 0], w: [1, 0] }[side] : null, near = 0.5;
      poly.forEach((p, i) => {
        const q = poly[(i + 1) % poly.length], dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
        if (!len) return;
        const t = Math.max(0, Math.min(1, ((x - p[0]) * dx + (y - p[1]) * dy) / (len * len)));
        const off = Math.hypot(p[0] + t * dx - x, p[1] + t * dy - y);
        if (off < near) { near = off; nv = [-dy / len * cw, dx / len * cw]; a = (Math.abs(dx) >= Math.abs(dy) ? dx < 0 : dy < 0) ? [-dx / len, -dy / len] : [dx / len, dy / len]; }
      });
      if (nv) out.doors.push({ x, y, wd: Math.min(8, Math.max(1, +d.width || 3)), a, nv });
    }
    const bySlot = new Map(), usedZ = new Set();
    for (const z of placed.slots) { if (!bySlot.has(z.zone)) bySlot.set(z.zone, []); bySlot.get(z.zone).push(z); }
    layout.tables.forEach((t, i) => {
      if (!t || typeof t !== 'object' || ![t.x, t.y, t.w, t.h].every(v => isFinite(v)) || !(+t.w > 0) || !(+t.h > 0)) return;
      const n = +t.n || i + 1;
      let zn = tableZone(t, i);
      if (zn > 0 && usedZ.has(zn)) zn = 0; else if (zn > 0) usedZ.add(zn);
      const T = { n, idx: i, letter: letter(i), z: zn, ...rect(+t.x, +t.y, +t.w, +t.h), zone: zn > 0 ? bySlot.get(zn) || [] : [], segs: [], dots: [], lights: [] };
      const long = T.w >= T.h;   // the table's long side, in the drawn (maybe turned) frame
      // turned, a table that ran north-south runs right to left: lay its parts and dots from the far end so each strain
      // keeps its end of the table
      const rev = rot && long;
      const parts0 = T.zone.length ? T.zone : [{ zone: zn, slot: 1, name: null, plants: 0, lights: null }];
      const parts = rev ? parts0.slice().reverse() : parts0;
      const lit = parts.filter(z => z.lights > 0), litL = lit.reduce((a, z) => a + z.lights, 0), litP = lit.reduce((a, z) => a + (z.plants || 0), 0);
      const wt = z => z.lights > 0 ? z.lights : !lit.length ? 1 : z.plants > 0 && litP > 0 ? litL * z.plants / litP : litL / lit.length;
      const wsum = parts.reduce((a, z) => a + wt(z), 0) || 1;
      const Lt = long ? T.w : T.h;
      let at = 0;
      for (const z of parts) {
        const len = Lt * wt(z) / wsum;
        const s = long ? { x: T.x + at, y: T.y, w: len, h: T.h } : { x: T.x, y: T.y + at, w: T.w, h: len };
        at += len;
        const c = z.name ? col[key(z.name)] || '#9aa39d' : null;
        T.segs.push({ ...s, color: c, name: z.name, plants: z.plants || 0, slot: z.slot, lights: z.lights, len });
        // dots: rows of plants along the table, 2 across a 4-5 ft table
        const n0 = Math.min(z.plants || 0, 400);
        if (n0 > 0 && len > 0) {
          const across = Math.max(1, Math.min(3, Math.round((long ? s.h : s.w) / 2.2)));
          const along = Math.ceil(n0 / across), A = long ? s.h : s.w;
          for (let q = 0; q < n0; q++) {
            const u = (Math.floor(q / across) + 0.5) * (len / along), v = (q % across + 0.5) * (A / across);
            T.dots.push(long ? { x: rev ? s.x + s.w - u : s.x + u, y: s.y + v, c } : { x: s.x + v, y: s.y + u, c });
          }
        }
      }
      if (Array.isArray(t.light_spots) && t.light_spots.length) {
        t.light_spots.slice(0, 400).forEach((p, k) => {
          if (!Array.isArray(p) || !isFinite(p[0]) || !isFinite(p[1])) return;
          const [x, y] = R(+p[0], +p[1]);
          T.lights.push({ x, y, kind: Array.isArray(t.light_kinds) && /^[VDM]$/.test(t.light_kinds[k]) ? t.light_kinds[k] : null });
        });
      } else {
        // each strain's lights over its own part of the table (half lights share the line between two strains)
        const tot = T.segs.reduce((a, g) => a + (g.lights > 0 ? g.lights : 0), 0);
        const cnt = Math.min(400, Math.round(tot || (+t.lights > 0 ? +t.lights : 0)));
        for (let k = 0; k < cnt; k++) {
          let u;
          if (tot > 0) {
            let lp = (k + 0.5) * tot / cnt, pos = 0;
            u = Lt;
            for (const g of T.segs) {
              const gl = g.lights > 0 ? g.lights : 0;
              if (gl && lp <= gl) { u = pos + g.len * lp / gl; break; }
              lp -= gl; pos += g.len;
            }
          } else u = (k + 0.5) * (Lt / cnt);
          T.lights.push(long ? { x: T.x + u, y: T.y + T.h / 2, kind: null } : { x: T.x + T.w / 2, y: T.y + u, kind: null });
        }
      }
      out.tables.push(T);
    });
    return out;
  }

  // runoff: % = tray / cup; the newest reading of each zone (rows newest first)
  const runoffPct = r => r && +r.cup_ml > 0 && r.tray_ml != null && r.tray_ml !== '' ? Math.round(+r.tray_ml / +r.cup_ml * 1000) / 10 : null;
  function latestRunoff(rows) {
    const out = new Map();
    for (const r of rows || []) { const z = r.zone == null ? 0 : +r.zone; if (!out.has(z)) out.set(z, r); }
    return [...out.entries()].sort((a, b) => a[0] - b[0]).map(([zone, r]) => ({ zone, ...r }));
  }
  // a table's lights: the fixtures traced on the lighting diagram, else the number typed for it in Arrange zones (null: unknown)
  const tableLights = t => !t || typeof t !== 'object' ? null : Array.isArray(t.light_spots) && t.light_spots.length ? t.light_spots.length : (+t.lights > 0 ? +t.lights : null);
  // per table: its zone, the lights it has and the lights its zone's strains are given (over: more than it has)
  function capacity(layout, placed) {
    const out = [], usedZ = new Set();
    (layout && Array.isArray(layout.tables) ? layout.tables : []).forEach((t, i) => {
      if (!t || typeof t !== 'object') return;
      let z = tableZone(t, i);
      if (z > 0 && usedZ.has(z)) z = 0; else if (z > 0) usedZ.add(z);   // as the map draws it: a zone sits on its first table
      const has = tableLights(t);
      const used = z > 0 ? (placed && placed.slots || []).filter(x => x.zone === z).reduce((a, x) => a + (x.lights > 0 ? x.lights : 0), 0) : 0;
      out.push({ idx: i, letter: letter(i), zone: z, has, used, left: has == null ? null : has - used, over: has != null && used > has + 1e-9 });
    });
    return out;
  }
  // what is coming up over the next `days` days, today included: the room's calendar (harvest and trim are on it) and a
  // flip typed for the next cycle
  function comingUp(C, T, today, days) {
    if (!isDay(today)) return [];
    const end = addDays(today, Math.max(0, days | 0));
    const out = (T || []).filter(t => !closed(t.status) && t.date >= today && t.date <= end).map(t => ({ date: t.date, kind: t.kind, text: t.text, day: t.day }));
    if (C && C.typed && C.flip && C.typed > C.flip && C.typed >= today && C.typed <= end) out.push({ date: C.typed, kind: 'FLIP', text: 'Next flip (typed)', day: null });
    return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.day || 0) - (b.day || 0)));
  }
  // the Tasks panel's three parts: now (late, and everything dated from today through the range, done and skipped ones
  // too; a typed next flip in the range as a plain row), earlier this cycle, and later
  function taskGroups(C, T, today, days) {
    const out = { earlier: [], now: [], later: [] };
    if (!isDay(today)) return out;
    const end = addDays(today, Math.max(0, days | 0));
    for (const t of T || []) {
      if (t.status === 'late') out.now.push(t);
      else if (t.date < today) out.earlier.push(t);
      else if (t.date <= end) out.now.push(t);
      else out.later.push(t);
    }
    if (C && C.typed && C.flip && C.typed > C.flip && C.typed >= today && C.typed <= end)
      out.now.push({ src: 'flip', key: 'flip|' + C.typed, date: C.typed, kind: 'FLIP', text: 'Next flip (typed)', day: null, status: 'next' });
    out.now.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.day || 0) - (b.day || 0)));
    return out;
  }
  // what needs attention: tasks not ticked in the last 7 days, how long the room has stood empty, tables given more lights
  // than they have, and the room's warnings (passed in)
  function attention(C, T, today, cap, warnings) {
    const out = [];
    for (const t of (T || []).filter(x => !closed(x.status) && x.date < today && diff(x.date, today) <= 7))
      out.push({ k: 'missed', date: t.date, key: t.key, text: `Not marked complete: ${t.text} (${wday(t.date)}${t.day != null ? `, day ${t.day}` : ''})` });
    if (C && (C.state === 'empty' || C.state === 'harvested') && C.lastHarvest && !(C.typed && C.typed > C.lastHarvest.day)) {
      const n = diff(C.lastHarvest.day, today);
      if (n >= 1) out.push({ k: 'empty', text: `${C.state === 'empty' ? 'Empty' : 'Harvested'} ${n} day${n === 1 ? '' : 's'} ago (${short(C.lastHarvest.day)}) and no next flip set` });
    }
    for (const c of cap || []) if (c.over) out.push({ k: 'over', text: `Table ${c.letter} (zone ${c.zone}) is given ${c.used} lights but has ${c.has}` });
    for (const w of warnings || []) out.push({ k: 'warn', text: w });
    return out;
  }

  // ---- Growlink: the room's live readings (cult_growlink_*, written every 5 minutes by the job on Gianni's Mac, which
  // only reads Growlink) beside the sheet's plan for the week. Times are milliseconds; clocks are the room's (Los Angeles).
  const GL = {
    ORDER: ['temp', 'hum', 'vpd', 'co2', 'light', 'vwc', 'ec', 'sub_temp'],
    LABEL: { temp: 'Temp', hum: 'Humidity', vpd: 'VPD', co2: 'CO2', light: 'Light', vwc: 'Water content', ec: 'Substrate EC', sub_temp: 'Substrate temp' },
    UNIT: { temp: '°F', hum: '%', vpd: 'kPa', co2: 'ppm', light: 'lux', vwc: '%', ec: 'EC', sub_temp: '°F' },
    DEC: { temp: 1, hum: 1, vpd: 2, co2: 0, light: 0, vwc: 1, ec: 2, sub_temp: 1 },
    TOL: { temp: 2, hum: 5, vpd: 0.2, co2: 200 },   // this far from the plan still counts as on it (Claude's assumption)
    STALE: 20,   // minutes: a reading older than this is old

  // a site's Veg room (Gianni, 2026-11-25: "actually veg should be a room", then "Yes, build it"): #veg=<site>
  const vg = location.hash.match(/(?:^#|&)veg=([A-Z])\b/);
  S.veg = !S.room && vg && S.rooms.some(r => r.site === vg[1]) ? vg[1] : null;
  S.trims = !S.room && !S.veg && /(?:^#|&)trims\b/.test(location.hash);   // Trim Yields
  if (!S.room && !S.veg && !S.trims && /(?:^#|&)allveg\b/.test(location.hash)) { setOvf('veg'); history.replaceState(null, '', '#overview'); }   // All Veg is the Overview's Veg Only

  S.editZones = false; S.arrange = false; S.zoneOpened = false; S.runoffForm = false; S.editNotes = false; S.hvOpen = null; S.hvAll = false;
  S.editEnv = false; S.editCal = false; S.envOff = null; S.planEdit = null; S.planSeed = null; S.mapRun = 'now';

function render() {

  const vsite = !one && S.veg ? SITES.find(x => x.id === S.veg) : null, trims = !one && !vsite && !!S.trims;
  $('view-rooms').hidden = !!(one || vsite || trims); $('view-room').hidden = !(one || vsite || trims);

  document.title = one ? `${one.name} · Cultivation` : vsite ? `${vsite.name} Veg · Cultivation` : trims ? 'Trim Yields · Cultivation' : 'Overview · Cultivation';

/* ----- runs (step 4, Gianni 2026-11-24: "Like our room page should be just like his, but with more real time data from
   METRC and Growlink and the visualizer", then "Yes, build it" to the mockup). The run model is CM.runs; this part reads
   the runs planned here and Metrc's batch rows (apart from loadAll, so the page works while they can't be read), and
   draws the Now box, the room timeline, the run cards and the plan form. A run is "A whole plant cycle from clone cut to

const RUNS_TTL = 15 * 60e3;
async function loadRuns(room, force) {
  const e = S.runsBy[room.id] || (S.runsBy[room.id] = { at: 0, sig: null, plans: [], batches: [], err: null, busy: false });
  const sig = metaSig(S.meta);
  if (e.busy && force && e.p) { try { await e.p; } catch (x) { /* read again below */ } }
  if (e.busy || (!force && e.at && e.sig === sig && Date.now() - e.at < RUNS_TTL) || (!force && e.err && Date.now() - e.errAt < 60e3)) return false;
  e.busy = true;
  let done; e.p = new Promise(res => { done = res; });
  let r, b;
  try {
    [r, b] = await Promise.all([
      sb.from('cult_runs').select('room_id,run_key,flip_on,cut_by,transplant_on,plants_per_light,zones,note,updated_at,updated_by').eq('room_id', room.id),
      room.metrc_location ? sb.from('cult_metrc_batches').select('license,location,flowering_day,batch,planted,flowering,harvested,destroyed').eq('license', room.license).eq('location', room.metrc_location) : Promise.resolve({ data: [] }),
    ]);
  } catch (x) { r = b = { error: { message: x.message || String(x) } }; }
  e.busy = false; done();
  // a table not there yet, or a read that failed: the last good copy of it stays, and the page says so on the runs.
  // Returns true when there is something new to draw (a read, or a failure to say).
  if (!r.error) { e.plans = r.data || []; e.at = Date.now(); }
  if (!b.error) e.batches = b.data || [];
  if (r.error || b.error) { e.err = (r.error || b.error).message || 'no answer'; e.errAt = Date.now(); return true; }
  e.sig = sig; e.err = null;
  return true;
}

// the room timeline: every run with a stretch from 63 days back to 137 ahead (Cultivation Command's window), a column a

const TL_BACK = 63, TL_DAYS = 200, TL_DW = 26, TL_LABEL = 84;

function timelineHTML(V, RN, today) {

  for (let i = 0; i <= TL_DAYS; i++) {   // a block per month; its name stays in view while the month is
    const d = CM.addDays(W0, i);

  }

  if (sc) sc.scrollLeft = left != null ? left : Math.max(0, TL_BACK * TL_DW - Math.min(14 * TL_DW, Math.max(0, sc.clientWidth - TL_LABEL) * 0.3));
}
const TL_KEY = '<span class="tl-key"><span><i class="s-root"></i>Clones</span><span><i class="s-veg"></i>Veg</span><span><i class="s-flower"></i>Flower</span><span><i class="s-dry"></i>Dry</span><span><i class="s-trim"></i>Trim</span><span><i class="plan"></i>Planned</span><span><b class="tl-m"></b>Metrc</span><span><i class="tdy"></i>Today</span></span>';

// a run's card: its stretches in a bar, its days, what Metrc holds (now) or what it plans (next), and its buttons
function stageBarHTML(r, today) {
  const st = CM.runStages(r, today);
  if (!st.length) return '<div class="rn-sb empty"></div>';
  const a = st[0].a, z = st[st.length - 1].z, tot = Math.max(1, CM.diff(a, z));
  const parts = st.map(s => `<i class="s-${s.k}${s.rec ? '' : ' fade'}" style="flex-grow:${Math.max(1, CM.diff(s.a, s.z))}"></i>`).join('');
  const tk = today >= a && today <= z ? `<b class="tk" style="left:${(CM.diff(a, today) / tot * 100).toFixed(1)}%" title="Today"></b>` : '';
  return `<div class="rn-sb">${parts}${tk}</div>`;
}
function zonesHTML(rows) {   // rows: [{zone, has, strains: [{name, lights, color}], right}]
  return rows.map(z => {
    const used = z.strains.reduce((a, s) => a + (s.lights || 0), 0);
    const bar = z.has ? `<div class="rn-lb${used > z.has + 1e-9 ? ' over' : ''}"><i style="width:${Math.min(100, used / z.has * 100).toFixed(0)}%"></i></div>` : '';   // a table with no fixtures on the diagram: its lights are the zone's own, nothing to fill
    return `<div class="rn-z"><div class="rn-zh"><b>Zone ${z.zone}</b><span>${z.has ? `${num(used)} / ${num(z.has)} lights` : `${num(used)} lights`}</span><span class="r">${esc(z.right || '')}</span></div>${bar}
      <div class="rn-zs">${z.strains.map(s => `<span>${s.color ? `<i class="sw" style="background:${s.color}"></i>` : ''}${esc(s.name || 'no strain')} ${s.lights != null ? num(s.lights) : ''}</span>`).join('') || '<span>Empty</span>'}</div></div>`;
  }).join('');
}
function runCardHTML(V, RN, r, i, canEdit, canWork, today) {
  const { room, C, P, placed, col } = V;
  const e = S.runsBy[room.id] || {}, planRead = !!e.at, planErr = !!e.err;
  const H = RN.usual.H, cap = CM.capacity(room.layout, placed);
  const hasOf = zn => { const c = cap.find(x => x.zone === zn); return c && c.has != null ? c.has : null; };
  let k;
  if (r.kind === 'cur') k = r.state === 'flowering' ? `${i} · Flowering · day ${C.day} of ${C.H} · harvest ${mon(r.harvest.d)}`
    : r.state === 'veg' ? `${i} · Flips ${mon(r.flip.d)}` : `${i} · ${RUN_STATE[r.state] || ''} · harvested ${mon(r.harvest.last)}`;
  else k = `${i} · ${r === RN.next[0] ? 'Next' : 'Planned'}${r.cut ? ` · cut by ${mon(r.cut.d)}` : ''}${r.flip ? ` · flips ${mon(r.flip.d)}` : ''}`;
  const day = (lab, x) => (x ? `<span>${esc(lab)} ${x.src === 'est' ? '≈ ' : ''}${esc(md(x.d))}</span>` : '');
  let h = `<div class="rn-card${r.kind === 'cur' ? ' now' : ''}" data-run="${esc(r.key || '')}"><div class="rn-ck">${esc(k)}</div><div class="rn-ch">${esc(`${room.name} · ${runName(r)}`)}</div>`;
  h += stageBarHTML(r, today);
  h += `<div class="rn-sl">${day('cut', r.cut)}${day(r.kind === 'next' ? 'transplant' : 'veg', r.tr)}${day('flip', r.flip)}${r.harvest ? day('harvest', { d: r.harvest.d, src: r.harvest.src === 'metrc' ? 'metrc' : 'plan' }) : ''}${r.trim ? `<span>trim ${r.trim.src === 'est' ? '≈ ' : ''}${esc(md(r.trim.a))}</span>` : ''}</div>`;
  h += `<div class="rn-st">${esc(`${RUN_STATE[r.state] || ''} · ${weeksOf(H)} flower${r.flip ? ` · flip ${md(r.flip.d)}` : ''}${r.kind === 'next' && r.flip && r.flip.src === 'plan' ? ' · set by hand' : r.kind === 'next' && r.flip && r.flip.src === 'key' ? " · the plan's day" : ''}`)}</div>`;
  if (r.kind === 'cur') {
    const ent = (r.entered || []).slice(0, 2).map(e => `${md(e.d)} (${num(e.n)})`).join(', ');
    if (r.state === 'flowering' || r.state === 'veg') h += `<div class="rn-mt">${esc(`Metrc now: ${num(P.total)} plants in flower${ent ? ` · clones entered ${ent}` : ''}`)}</div>`;
    else if (r.plants) h += `<div class="rn-mt">${esc(`Metrc: ${num(r.plants)} plants harvested${r.lb ? ` · ${r.lb.toFixed(1)} lb on the trim sheets` : ''}`)}</div>`;
    const zs = new Map();
    for (const z of placed.slots) { if (!zs.has(z.zone)) zs.set(z.zone, []); zs.get(z.zone).push(z); }
    const rows = [...zs.entries()].sort((a, b) => a[0] - b[0]).map(([zn, list]) => ({ zone: zn, has: hasOf(zn),
      strains: list.filter(z => z.name).map(z => ({ name: z.name, lights: z.lights, color: col[CM.key(z.name)] })),
      right: list.some(z => z.metrc) ? `${num(list.reduce((a, z) => a + (z.plants || 0), 0))} plants` : '' }));
    if (r.state === 'flowering' || r.state === 'veg') h += zonesHTML(rows);
    h += `<div class="rn-btns"><button class="btn" type="button" data-runact="print">Print door sheet</button></div>`;
  } else {
    const [cw, warn] = cutWords(r, today);
    if (r.cut) h += `<div class="rn-mt${warn ? ' w' : r.cut.done ? '' : ' q'}">${esc(r.cut.done ? `Clones cut ${CM.wday(r.cut.d)}` : `Cut by ${CM.wday(r.cut.d)}: ${cw}`)}</div>`;
    if (S.planEdit && S.planEdit === r.key) h += planFormHTML(V, RN, r, today);
    else {
      const ppl = r.plan && +r.plan.plants_per_light > 0 ? { v: +r.plan.plants_per_light, src: 'set on the plan' } : roomPpl(room, today);
      const pz = r.plan && Array.isArray(r.plan.zones) ? r.plan.zones.filter(z => z.strain || z.lights != null) : [];
      if (pz.length) {
        const pc = CM.colors(CM.place(pz.map(z => ({ room_id: room.id, ...z })), { ...P, strains: [] }));
        const zs = new Map();
        for (const z of pz) { if (!zs.has(z.zone)) zs.set(z.zone, []); zs.get(z.zone).push(z); }
        let total = 0;
        const rows = [...zs.entries()].sort((a, b) => a[0] - b[0]).map(([zn, list]) => {
          const n = list.reduce((a, z) => a + Math.round((+z.lights || 0) * ppl.v), 0); total += n;
          return { zone: zn, has: hasOf(zn), strains: list.map(z => ({ name: z.strain, lights: z.lights, color: z.strain ? pc[CM.key(z.strain)] : null })), right: n ? `≈ ${num(n)} clones` : '' };
        });
        h += zonesHTML(rows) + `<p class="rn-fn">${esc(`≈ ${num(total)} clones at ${num(ppl.v)} a light (${ppl.src}).`)}${r.plan.note ? ` ${esc(r.plan.note)}` : ''}</p>`;
      } else h += !planRead ? `<p class="rn-fn">${planErr ? "The planned runs couldn't be read: press Refresh." : 'Reading the planned runs...'}</p>`
        : `<p class="rn-fn">${r.plan ? 'No strains planned yet.' : 'Not planned yet.'} Plan run picks the strains for each zone; Same as last run copies the run before it.</p>`;
      if (planRead && (canEdit || canWork)) {
        h += '<div class="rn-btns">';
        if (canEdit) h += `<button class="btn" type="button" data-runact="plan" data-key="${esc(r.key || '')}">${r.plan ? 'Edit plan' : 'Plan run'}</button>`
          + `<button class="btn" type="button" data-runact="same" data-key="${esc(r.key || '')}">Same as last run</button>`
          + `<button class="btn" type="button" data-runact="flip" data-key="${esc(r.key || '')}">Edit flip date</button>`;
        if (canWork && r.cut && r.cut.task && !r.cut.done) h += `<button class="btn" type="button" data-runact="cut" data-task="${esc(r.cut.task)}">Mark clones cut</button>`;
        h += '</div>';
      }
    }
  }
  return h + '</div>';
}

// the plan form, inside the run's card: per zone its strains (typed and picked from the list) and lights, the flip, the
// clone cut, the transplant and the plants per light. What is typed survives a redraw (a tick, a save elsewhere).
function planFormHTML(V, RN, r, today) {
  const box = $('ped');
  const plan = r.plan || {};
  const draft = box && box.dataset.key === r.key ? {
    rows: [...box.querySelectorAll('.row:not(.h)')].map(x => { const [zi, si, li] = x.querySelectorAll('input'); return { zone: zi.value, strain: si.value, ok: si.dataset.ok || '', orig: si.dataset.orig || '', lights: li.value }; }),
    flip: $('ped-flip').value, cut: $('ped-cut').value, tr: $('ped-tr').value, ppl: $('ped-ppl').value, note: $('ped-note').value } : null;
  const seed = S.planSeed && S.planSeed.key === r.key ? S.planSeed.rows : null;
  const rows = draft ? draft.rows : (seed || (Array.isArray(plan.zones) && plan.zones.length ? plan.zones : [{ zone: 1, strain: '', lights: null }]))
    .map(z => ({ zone: z.zone, strain: z.strain || '', ok: z.ok != null ? z.ok : z.strain || '', orig: z.orig != null ? z.orig : z.strain || '', lights: z.lights == null ? '' : z.lights }));
  const list = strainChoices(V), ppl = roomPpl(V.room, today);
  const val = (d, k, v) => esc(draft ? draft[k] : v || '');
  let h = `<datalist id="plan-strains">${list.map(n => `<option value="${esc(n)}"></option>`).join('')}</datalist><div class="ed ped" id="ped" data-key="${esc(r.key || '')}">
    <div class="row h"><span>Zone</span><span>Strain</span><span>Lights</span><span></span></div>`;
  for (const z of rows) h += planRow(z);
  h += `</div><div class="ped-f">
    <label>Flip <input type="date" id="ped-flip" value="${val(draft, 'flip', plan.flip_on)}"><small>blank: ${r.flip && r.flip.src === 'lined' ? `lined up, ${esc(md(r.flip.d))}` : r.flip && r.flip.src === 'key' ? `the plan's day, ${esc(md(r.flip.d))}` : 'lined up on the harvest'}</small></label>
    <label>Cut by <input type="date" id="ped-cut" value="${val(draft, 'cut', plan.cut_by)}"><small>blank: ${r.cut && r.cut.src !== 'plan' ? esc(md(r.cut.d)) : 'the calendar'}</small></label>
    <label>Transplant <input type="date" id="ped-tr" value="${val(draft, 'tr', plan.transplant_on)}"><small>blank: ${CM.ROOT_DAYS} days after the cut</small></label>
    <label>Plants per light <input type="number" id="ped-ppl" min="0.5" max="50" step="0.1" value="${val(draft, 'ppl', plan.plants_per_light)}" placeholder="${esc(num(ppl.v))}"><small>blank: ${esc(num(ppl.v))} (${esc(ppl.src)})</small></label>
    <label class="wide">Note <input type="text" id="ped-note" maxlength="1000" value="${val(draft, 'note', plan.note)}"></label></div>
    <div class="pickmsg" id="ped-msg"></div>
    <div class="ed act"><button class="btn" type="button" id="ped-add">Add a row</button><button class="btn" type="button" id="ped-same">Same as last run</button><span class="grow"></span>
    ${r.plan ? '<button class="btn ghost" type="button" id="ped-del">Delete plan</button>' : ''}<button class="btn ghost" type="button" id="ped-cancel">Cancel</button><button class="btn primary" type="button" id="ped-save">Save plan</button></div>
    <p class="note">Strain: start typing and pick from the list. Lights: the lights over that strain (halves allowed). Zones count left to right from the main entrance.</p>`;
  return h;
}
function planRow(z) {
  return `<div class="row"><input type="number" min="1" max="20" step="1" value="${esc(z.zone || '')}" aria-label="Zone">
    <input type="text" list="plan-strains" value="${esc(z.strain || '')}" data-ok="${esc(z.ok != null ? z.ok : z.strain || '')}" data-orig="${esc(z.orig != null ? z.orig : z.strain || '')}" aria-label="Strain" autocomplete="off">
    <input type="number" min="0" max="100" step="0.5" value="${z.lights === '' || z.lights == null ? '' : esc(z.lights)}" aria-label="Lights">
    <button class="btn ghost" type="button" data-pdel aria-label="Remove row">×</button></div>`;
}
// the run before a planned one, as plan rows (Same as last run): the planned run before it when that has strains, else
// the room's zones now
function zonesBefore(V, RN, key) {
  const i = RN.next.findIndex(r => r.key === key);
  const prev = i > 0 ? RN.next[i - 1] : null;
  if (prev && prev.plan && Array.isArray(prev.plan.zones) && prev.plan.zones.some(z => z.strain))
    return { name: runName(prev), rows: prev.plan.zones.map(z => ({ zone: z.zone, strain: z.strain || '', lights: z.lights == null ? '' : z.lights })) };
  return { name: RN.cur ? runName(RN.cur) : RN.past.length ? runName(RN.past[RN.past.length - 1]) : 'The room', rows: V.placed.slots.filter(z => z.name || z.lights != null).map(z => ({ zone: z.zone, strain: z.name || '', lights: z.lights == null ? '' : z.lights })) };
}
function wirePlanForm(V, RN) {
  const box = $('ped'); if (!box) return;
  const key = box.dataset.key, r = RN.next.find(x => x.key === key) || RN.next[0];
  const msg = $('ped-msg'), list = strainChoices(V);
  let pressing = false, refusedNow = false;
  // a box still showing the strain it opened with keeps that strain's stored text (one that left the list too)
  const same = inp => !!inp.dataset.orig && CM.key(inp.value) === CM.key(inp.dataset.orig);
  const check = inp => {
    const t = inp.value.trim();
    if (!t) { inp.dataset.ok = ''; return true; }
    if (same(inp)) { inp.value = inp.dataset.orig; return true; }
    const p = pickFrom(list, t);
    if (p) { inp.value = p; inp.dataset.ok = p; msg.textContent = ''; return true; }
    msg.textContent = `"${t}" isn't one strain on the list${list.some(x => CM.key(x).includes(CM.key(t))) ? ' (it matches several: type more)' : ''}. Kept "${inp.dataset.ok || 'blank'}".`;
    inp.value = inp.dataset.ok || '';
    if (pressing) refusedNow = true;
    return false;
  };
  const wire = row => {
    const s = row.querySelector('input[list="plan-strains"]');
    s.addEventListener('change', () => check(s));
    s.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(s); } });
    row.querySelector('[data-pdel]').addEventListener('click', () => row.remove());
  };
  for (const x of box.querySelectorAll('.row:not(.h)')) wire(x);
  $('ped-add').addEventListener('click', () => {
    const rows = [...box.querySelectorAll('.row:not(.h)')];
    const last = rows.length ? +rows[rows.length - 1].querySelector('input').value || 0 : 0;
    box.insertAdjacentHTML('beforeend', planRow({ zone: last ? last + 1 : 1, strain: '', lights: '' }));
    wire(box.lastElementChild);
  });
  $('ped-same').addEventListener('click', () => {
    const zb = zonesBefore(V, RN, key);
    for (const x of [...box.querySelectorAll('.row:not(.h)')]) x.remove();
    for (const z of zb.rows) { box.insertAdjacentHTML('beforeend', planRow(z)); wire(box.lastElementChild); }
    msg.textContent = `${zb.name}'s zones copied: change what this run grows differently.`;
  });
  $('ped-cancel').addEventListener('click', () => { S.planEdit = null; S.planSeed = null; renderRoom(V.room); });
  const del = $('ped-del');
  if (del) del.addEventListener('click', async () => {
    if (!confirm('Delete this run\'s plan? Its strains, days and note go (the run stays, lined up on the harvest).')) return;
    del.disabled = true;
    const { error } = await sb.rpc('cult_run_delete', { p_room: V.room.id, p_key: key });
    if (error) { del.disabled = false; msg.textContent = "Couldn't delete: " + error.message; return; }
    S.planEdit = null; S.planSeed = null;
    await loadRuns(V.room, true); render();
  });
  $('ped-save').addEventListener('pointerdown', () => { pressing = true; refusedNow = false; });
  $('ped-save').addEventListener('click', async () => {
    const stop = refusedNow; pressing = refusedNow = false;
    if (stop) return;   // Save pressed straight from a strain box that refused its text: the reason stays, nothing is saved
    const zones = [], slots = {};
    for (const x of box.querySelectorAll('.row:not(.h)')) {
      const [zi, si, li] = x.querySelectorAll('input');
      if (!check(si)) return;
      const zone = Math.round(+zi.value);
      if (!(zone >= 1 && zone <= 20)) { msg.textContent = 'Each row needs a zone number from 1 to 20.'; zi.focus(); return; }
      const lights = li.value === '' ? null : +li.value;
      if (lights != null && !(lights >= 0 && lights <= 100)) { msg.textContent = 'Lights must be a number from 0 to 100.'; li.focus(); return; }
      if (!si.value.trim() && lights == null) continue;
      slots[zone] = (slots[zone] || 0) + 1;
      if (slots[zone] > 9) { msg.textContent = `Zone ${zone} has more than 9 rows.`; return; }
      zones.push({ zone, slot: slots[zone], strain: si.value.trim() || null, lights });
    }
    const d = id => { const v = $(id).value; return v ? v : null; };
    const flip = d('ped-flip'), cut = d('ped-cut'), tr = d('ped-tr');
    for (const [v, w] of [[flip, 'flip'], [cut, 'cut-by'], [tr, 'transplant']]) if (v && !CM.isDay(v)) { msg.textContent = `The ${w} day isn't a date.`; return; }
    const pv = $('ped-ppl').value === '' ? null : +$('ped-ppl').value;
    if (pv != null && !(pv > 0 && pv <= 50)) { msg.textContent = 'Plants per light must be more than 0 and at most 50.'; return; }
    const runKey = key || (flip ? CM.runKey(flip) : null);
    if (!runKey) { msg.textContent = 'This run has no flip day yet: type one.'; $('ped-flip').focus(); return; }
    $('ped-save').disabled = true;
    const p_run = { run_key: runKey, flip_on: flip, cut_by: cut, transplant_on: tr, plants_per_light: pv, zones, note: $('ped-note').value.trim() || null };
    const { error } = await sb.rpc('cult_run_save', { p_room: V.room.id, p_run });
    if (error) { $('ped-save').disabled = false; msg.textContent = "Couldn't save: " + error.message; return; }
    S.planEdit = null; S.planSeed = null;
    const e = S.runsBy[V.room.id]; if (e) e.plans = (e.plans || []).filter(x => x.run_key !== runKey).concat([{ room_id: V.room.id, ...p_run }]);   // kept if the re-read fails
    await loadRuns(V.room, true); render();
  });
}
// a planned run's flip, by hand, or lined up again on the harvest
function runFlipPop(V, RN, key, anchor) {
  const r = RN.next.find(x => x.key === key) || RN.next[0];
  const plan = r.plan;
  let h = `<h4><span>${esc(runName(r))}: flip date</span><button class="btn ghost" type="button" data-close aria-label="Close">×</button></h4>
    <p class="note" style="margin-top:0">${esc(flipWords(r, RN.usual.turn))}</p>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="date" id="rf-in" value="${esc(plan && plan.flip_on || (r.flip ? r.flip.d : ''))}"><button class="btn primary" type="button" id="rf-save">Save</button></div>
    ${plan && plan.flip_on ? '<button class="btn ghost" type="button" id="rf-line" style="margin-top:6px;padding-left:0">Line it up on the harvest again</button>' : ''}
    <div class="pickmsg" id="rf-msg"></div>`;
  showPop(h, anchor);
  const save = async v => {
    const runKey = r.key || (v ? CM.runKey(v) : null);
    if (!runKey) { $('rf-msg').textContent = 'Pick a date.'; return; }
    const { error } = await sb.rpc('cult_run_save', { p_room: V.room.id, p_run: { run_key: runKey, flip_on: v } });
    if (error) { $('rf-msg').textContent = "Couldn't save: " + error.message; return; }
    closePop();
    await loadRuns(V.room, true); render();
  };
  $('rf-save').addEventListener('click', () => { const v = $('rf-in').value; if (!CM.isDay(v)) { $('rf-msg').textContent = 'Pick a date.'; return; } save(v); });
  const l = $('rf-line'); if (l) l.addEventListener('click', () => save(null));
}
// the runs' buttons inside root (the whole page after a redraw; only the cards when paintRuns draws them again, so a
// button outside them is never wired twice)
function wireRuns(V, RN, canEdit, root) {
  for (const b of root.querySelectorAll('[data-runact]')) b.addEventListener('click', async e => {
    e.stopPropagation();
    const a = b.dataset.runact, key = b.dataset.key || null;
    if (a === 'print') { printPop(V, b); return; }
    if (S.planEdit && ['plan', 'same', 'flip', 'new'].includes(a) && key !== S.planEdit) { alert('Save or cancel the plan that is open first.'); return; }
    if (a === 'plan') { S.planEdit = key || (RN.next[0] && RN.next[0].key) || null; S.planSeed = null; if (!S.planEdit) { runFlipPop(V, RN, key, b); return; } renderRoom(V.room); return; }
    if (a === 'same') { S.planEdit = key; S.planSeed = { key, rows: zonesBefore(V, RN, key).rows }; if (!key) { runFlipPop(V, RN, key, b); return; } renderRoom(V.room); return; }
    if (a === 'flip') { runFlipPop(V, RN, key, b); return; }
    if (a === 'delorph') {
      if (!confirm('Delete this plan? It belongs to no run now.')) return;
      b.disabled = true;
      const { error } = await sb.rpc('cult_run_delete', { p_room: V.room.id, p_key: key });
      if (error) { b.disabled = false; alert("Couldn't delete: " + error.message); return; }
      await loadRuns(V.room, true); render();
      return;
    }
    if (a === 'new') {
      const t0 = CM.todayLA(), RN0 = runsOf(roomView(V.room, t0), t0);   // the runs as they are now (the plans may have landed since this was drawn)
      const last = RN0.next[RN0.next.length - 1];
      const flip = last && last.harvest ? CM.addDays(last.harvest.d, RN0.usual.turn) : null;
      if (!flip) { runFlipPop(V, RN, null, b); return; }
      b.disabled = true;
      const { error } = await sb.rpc('cult_run_save', { p_room: V.room.id, p_run: { run_key: CM.runKey(flip) } });
      if (error) { b.disabled = false; alert("Couldn't add the run: " + error.message); return; }
      S.planEdit = CM.runKey(flip);
      await loadRuns(V.room, true); render();
      return;
    }
    if (a === 'cut') {
      b.disabled = true;
      const { error } = await sb.rpc('cult_task_mark', { p_room: V.room.id, p_cycle: V.C.flip, p_task: b.dataset.task, p_done: true });
      if (error) { b.disabled = false; alert("Couldn't save: " + error.message); return; }
      await loadAll(true, ['done']); render();
    }
  });
  for (const b of root.querySelectorAll('[data-hday], [data-turn]')) b.addEventListener('click', async e => {
    e.stopPropagation();
    if (b.getAttribute('aria-pressed') === 'true') return;
    if (S.planEdit) { alert('Save or cancel the plan that is open first.'); return; }
    const set = b.dataset.hday ? { harvest_day: +b.dataset.hday } : { turnover_days: +b.dataset.turn };
    for (const x of b.parentElement.querySelectorAll('button')) x.disabled = true;
    const { error } = await sb.rpc('cult_room_set', { p_room: V.room.id, p_set: set });
    if (error) { for (const x of b.parentElement.querySelectorAll('button')) x.disabled = false; alert("Couldn't save: " + error.message); return; }
    const rr = S.rooms.find(x => x.id === V.room.id); if (rr) Object.assign(rr, set);   // kept if the re-read fails
    await loadAll(true, ['rooms']); render();
  });
  for (const b of root.querySelectorAll('[data-mapv]')) b.addEventListener('click', e => { e.stopPropagation(); S.mapRun = b.dataset.mapv; closePop(); renderRoom(V.room); });
  if (S.planEdit && root.querySelector('#ped')) wirePlanForm(V, RN);
}
// the run-dependent parts again, once the history or the runs' reads land (never the plan form while it is open)
function paintRuns(room) {
  if (!$('tl-body')) return;

// the map's planned view: the next run's plan on the tables (no plants yet)
function planView(V, RN) {
  const r = RN.next.find(x => x.plan && Array.isArray(x.plan.zones) && x.plan.zones.some(z => z.strain));
  if (!r) return null;
  const zones = r.plan.zones.filter(z => z.strain || z.lights != null).map(z => ({ room_id: V.room.id, ...z }));
  const placed = CM.place(zones, { ...V.P, strains: [] });

}

function renderRoom(room) {

  if (S.planEdit && !RN.next.some(r => r.key === S.planEdit)) { S.planEdit = null; S.planSeed = null; }   // its run moved (a new flip day): the form closes

  h += `<div id="gl" class="gl gl-top">${glHTML(room, GV)}</div>`;
  h += fpanel('chart', "This crop's temperature and humidity", 'lights on and off against the plan, from the flip', '', '', glChartsHTML(GH.D));
  h += `<div class="panel" data-p="tl"><h3><span class="ptt">Room timeline</span><span class="tl-sub">clone cut to trim, a column a day</span><span class="grow"></span>${TL_KEY}</h3>

    PV ? mapBody(PV.V, { plan: { r: PV.r, ppl: PV.r.plan && +PV.r.plan.plants_per_light > 0 ? +PV.r.plan.plants_per_light : roomPpl(room, today).v } }) : mapBody(V));
