<title>Crew Hours</title>
<!--
  Crew hours: hours for Norma's crew who are not on Gusto, entered by Diana and submitted once per pay period,
  approved by Gianni (Gianni 2026-11-28). Opened from the Timesheet app (timesheets.html), same sign-in.
  The lines are rows of distro_shifts, the CA labor tracker's table (labor-calculator.html), so they show there
  at once. Database: supabase/crew-hours.sql. Emails: supabase/functions/crew-hours-notify. Check:
  node tests/crew-hours-check.mjs. Hours only on this page, never pay (like the Timesheet app).
-->
<style>

  --warn:#8a5a00;--warn-bg:#fff4dc;--stop:#a3261b;--stop-bg:#fde9e6;--ok:#2f6b45;--chip:#eef2ef;--focus:#2f6b45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111513;--card:#1a201c;--ink:#e6ece8;--muted:#9eaba4;--line:#2d3731;

:root[data-theme="dark"]{--bg:#111513;--card:#1a201c;--ink:#e6ece8;--muted:#9eaba4;--line:#2d3731;--acc:#7cc49a;--acc-ink:#0d1a12;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}

.bar h1{font-size:1.15rem;margin:0;flex:1 1 auto}
.back{font-size:.92rem;text-decoration:none}

.day{display:grid;gap:6px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.9rem;z-index:20;max-width:92vw}

.hide{display:none!important}
.gl{font-size:.85rem;color:var(--muted)}
.tbl tr.off input:not([type=checkbox]){opacity:.45}
.tbl .mob{display:none}
@media (max-width:640px){
  .tbl .hm{display:none}

<script>
/* CREW MODEL: pure rules, no page or database (tests/crew-hours-check.mjs runs them) */
const CM = (() => {
  const DAY = 86400000, ANCHOR = '2026-07-04', LEN = 14;   // the CA tracker's pay periods (labor-billing-core.js)
  function dayNum(iso){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').slice(0, 10));
    if (!m) return null;
    const n = Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY;
    return isoOf(n) === m[0] ? n : null;
  }
  const isoOf = n => new Date(n * DAY).toISOString().slice(0, 10);
  const addDays = (iso, k) => { const n = dayNum(iso); return n == null ? null : isoOf(n + k); };
  const periodStart = iso => { const n = dayNum(iso); if (n == null) return null; const a = dayNum(ANCHOR); return isoOf(a + Math.floor((n - a) / LEN) * LEN); };
  const periodEnd = s => addDays(s, LEN - 1);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dParts = iso => { const n = dayNum(iso); if (n == null) return null; const d = new Date(n * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), w: d.getUTCDay() }; };
  const shortDay = iso => { const p = dParts(iso); return p ? MON[p.m] + ' ' + p.d : ''; };
  const dayLabel = iso => { const p = dParts(iso); return p ? WD[p.w] + ' ' + MON[p.m] + ' ' + p.d : ''; };
  const periodLabel = s => shortDay(s) + ' to ' + shortDay(periodEnd(s));
  // the periods to offer: this one and the n before it, newest first
  function periodChoices(today, n){ const out = []; let s = periodStart(today); for (let i = 0; i <= n; i++){ out.push(s); s = addDays(s, -LEN); } return out; }
  // the period a page opens on: the one that just ended while it still waits for Diana (its Saturday to Monday), else today's
  function defaultPeriod(today, submitted){
    const cur = periodStart(today), prev = addDays(cur, -LEN);
    const dayIn = dayNum(today) - dayNum(cur);
    return dayIn <= 2 && !submitted[prev] ? prev : cur;
  }
  const canSubmit = (period, today) => !!period && today >= periodEnd(period);

  const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m && +m[1] < 24 && +m[2] < 60 ? (+m[1]) * 60 + (+m[2]) : null; };
  function fmtTime(t){
    const m = toMin(t); if (m == null) return '';
    const h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? 'am' : 'pm', h12 = h % 12 || 12;
    return h12 + (mm ? ':' + String(mm).padStart(2, '0') : '') + ' ' + ap;
  }
  // worked minutes before lunch, overnight-safe like the database trigger
  function span(l){ const a = toMin(l.clock_in), b = toMin(l.clock_out); if (a == null || b == null) return null; let m = b - a; if (m < 0) m += 1440; return m; }
  function hours(l){ const m = span(l); if (m == null) return 0; const net = m - (Number(l.break_minutes) || 0); return net > 0 ? Math.round(net / 60 * 1000) / 1000 : 0; }
  const fmtHours = h => (Math.round(h * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });

  // the tracker's rosterMatch (labor-calculator.html), so a name lands on the same person in both apps
  const key = s => String(s || '').trim().toLowerCase();
  function rosterMatch(roster, last, first){
    const l = key(last), f = key(first);
    if (!l && !f) return null;
    const aliasHit = p => (p.aliases || []).some(a => {
      const k = key(a);
      if (l && f) return k === l || k === l + ' ' + f || k === f + ' ' + l || (k === f && key(p.last) === l);
      return k === (f || l);
    });
    return roster.find(p => key(p.last) === l && key(p.first) === f)
        || roster.find(aliasHit)
        || roster.find(p => !l && key(p.first) === f) || null;
  }
  // a name typed in the picker ("First Last", or "Last First" as sheets write it)
  function matchTyped(roster, text){
    const t = String(text || '').trim().replace(/\s+/g, ' ');
    if (!t) return null;
    const exact = roster.find(p => key(p.first + ' ' + p.last) === key(t) || key(p.last + ' ' + p.first) === key(t));
    if (exact) return exact;
    const parts = t.split(' ');
    for (let i = 1; i < parts.length; i++){
      const a = parts.slice(0, i).join(' '), b = parts.slice(i).join(' ');
      const hit = rosterMatch(roster, b, a) || rosterMatch(roster, a, b);
      if (hit) return hit;
    }
    return null;
  }
  const isGustoPerson = (p, day) => !!(p && p.gusto_distro && (!p.gusto_distro_from || day >= p.gusto_distro_from));
  const norm = s => key(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
  // Gusto employees on the day who are this person: one of the person's aliases is the Gusto name, or the
  // Gusto name holds both the first name and a last name ("Santana Parra Villa" for Tany only through the alias)
  function gustoFor(gustoDay, p, last, first){
    const names = new Set(((p && p.aliases) || []).map(norm));
    const L = norm(p ? p.last : last).split(' ').filter(Boolean), F = norm(p ? p.first : first).split(' ')[0] || '';
    return (gustoDay || []).filter(g => {
      const n = norm(g.name);
      if (names.has(n)) return true;
      const toks = n.split(' ');
      return !!F && L.length > 0 && toks.includes(F) && L.some(t => toks.includes(t));
    });
  }
  // a crew row: Norma's Team, paid on her list (the tracker's isGustoPaidRow; crew-hours.sql crew_row_is_crew)
  function isCrewRow(r, roster){
    if (!/^norma/i.test(r.team || '')) return false;
    if (/^gusto-/.test(r.source_id || '')) return false;
    if (/gusto/i.test(r.team || '')) return false;
    if ((r.category || 'distro') === 'harvest') return true;
    if (/\[crew pay\]/i.test(r.note || '')) return true;
    const p = r.roster_id ? roster.find(x => x.id === r.roster_id) : rosterMatch(roster, r.last, r.first);
    return !isGustoPerson(p, r.work_date);
  }
  const rowPeriod = r => r.pay_period || periodStart(r.work_date);
  const samePerson = (a, b) => (a.roster_id && b.roster_id) ? a.roster_id === b.roster_id
    : key(a.last) === key(b.last) && key(a.first) === key(b.first);
  function overlap(a, b){
    const a1 = toMin(a.clock_in), a2 = toMin(a.clock_out), b1 = toMin(b.clock_in), b2 = toMin(b.clock_out);
    if ([a1, a2, b1, b2].some(v => v == null)) return false;
    const A2 = a2 <= a1 ? a2 + 1440 : a2, B2 = b2 <= b1 ? b2 + 1440 : b2;
    return a1 < B2 && b1 < A2;
  }
  // what stops a line from saving ('stop') and what only needs a look ('warn')
  function lineIssues(l, ctx){
    const out = [], stop = t => out.push({ level: 'stop', text: t }), warn = t => out.push({ level: 'warn', text: t });
    if (!l.person && !l.newPerson) stop(l.name ? 'Not on the roster: pick the right name, or tick New person.' : 'No name.');
    if (!l.clock_in) stop('No time in.');
    if (!l.clock_out) stop('No time out.');
    const m = span(l);
    if (m === 0) stop('Time in and out are the same.');
    if (l.break_minutes == null || l.break_minutes === '') stop('Lunch couldn’t be read: type the minutes, or 0 for none.');
    else if (!(Number(l.break_minutes) >= 0 && Number(l.break_minutes) <= 240)) stop('Lunch should be 0 to 240 minutes.');
    if (ctx.day && ctx.today && ctx.day > ctx.today) stop('That day hasn’t happened yet.');
    const net = m == null ? null : m - (Number(l.break_minutes) || 0);
    if (net != null && net > 12 * 60) warn('Over 12 hours.');
    else if (net != null && net > 6 * 60 && !(Number(l.break_minutes) > 0)) warn('Over 6 hours with no lunch.');
    if (l.person && isGustoPerson(l.person, ctx.day)){
      stop('On Gusto' + (l.person.gusto_distro_from ? ' since ' + shortDay(l.person.gusto_distro_from) : '') + ': Gusto pays this day, so it isn’t saved here.');
    } else {
      const g = gustoFor(ctx.gusto, l.person, l.last, l.first);
      if (g.length) stop('In Gusto that day as ' + g[0].name + ' (' + g[0].shifts.map(s => fmtTime(s.in) + ' to ' + (s.out ? fmtTime(s.out) : 'still in')).join(', ') + '): Gusto pays this, so it isn’t saved here.');
    }
    const who = { roster_id: l.person ? l.person.id : null, last: l.person ? l.person.last : l.last, first: l.person ? l.person.first : l.first };
    const clash = (ctx.existing || []).find(r => samePerson(r, who) && overlap(r, l));
    if (clash) stop('Already on the board ' + fmtTime(clash.clock_in) + ' to ' + fmtTime(clash.clock_out) + ' at ' + (clash.company || 'another site') + '.');
    const twice = (ctx.others || []).find(o => o !== l && o.include !== false && samePerson({ roster_id: o.person ? o.person.id : null, last: o.person ? o.person.last : o.last, first: o.person ? o.person.first : o.first }, who) && overlap(o, l));
    if (twice) stop('On this sheet twice at the same time.');
    return out;
  }
  function summary(rows){
    const people = new Set(rows.map(r => r.roster_id || key(r.last + ' ' + r.first)));
    return { lines: rows.length, people: people.size, hours: rows.reduce((t, r) => t + (Number(r.hours) || 0), 0) };
  }
  // pickFrom: the exact entry in any case, else the one entry that holds the text (Gianni's rule for pick-lists)
  function pickFrom(list, text){
    const t = key(text); if (!t) return null;
    const exact = list.find(x => key(x) === t); if (exact) return exact;
    const hits = list.filter(x => key(x).includes(t));
    return hits.length === 1 ? hits[0] : null;
  }
  return { addDays, periodStart, periodEnd, periodLabel, periodChoices, defaultPeriod, canSubmit, shortDay, dayLabel,
    toMin, fmtTime, span, hours, fmtHours, rosterMatch, matchTyped, isGustoPerson, gustoFor, isCrewRow, rowPeriod,
    overlap, lineIssues, summary, pickFrom, key };
})();
/* END CREW MODEL */

/* ---------------- page ---------------- */
const SB_URL = 'https://dhiqhgtmelxwelyoowle.supabase.co';
const SB_KEY = 'sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14';   // publishable key, the same as the Timesheet app (RLS does the guarding)
const SITES = [
  { key: '25th', label: '25th St (Filifera)', company: 'Filifera', category: 'harvest' },
  { key: '23rd', label: '23rd St (Slane)', company: 'Slane', category: 'harvest' },
  { key: '15th', label: '15th St (Imperial)', company: 'Imperial', category: 'harvest' },
  { key: 'olympic', label: 'Olympic', company: 'Olympic', category: 'harvest' },
  { key: '25th-distro', label: '25th St distro (packing)', company: 'Filifera', category: 'distro' },
  { key: 'portal', label: 'Portal (packing)', company: 'Portal', category: 'distro' },
];
const SITE_OF_COMPANY = { Filifera: '25th', Slane: '23rd', Imperial: '15th', Olympic: 'olympic', Portal: 'portal' };
const DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { me: null, email: '', roster: [], period: null, rows: [], subs: {}, sheet: null, site: null, busy: false };
let sb = null;

function todayLA(){ return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
let toastT = 0;
function toast(t, ms){ const el = $('toast'); el.textContent = t; el.classList.remove('hide'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hide'), ms || 4000); }
function show(id){ ['vSignin', 'vNoAccess', 'vApp'].forEach(v => $(v).classList.toggle('hide', v !== id)); }
const personName = p => p ? (p.first + ' ' + p.last).trim() : '';

/* typable pickers: a suggestion picked is used at once; typed text is resolved on Enter or leaving the box */
function wirePicker(input, options, onPick){
  const resolve = () => {
    const v = CM.pickFrom(options(), input.value);
    if (v == null){ if (input.value.trim()) toast('“' + input.value.trim() + '” isn’t on the list.'); input.value = input.dataset.good || ''; return; }
    input.value = v; input.dataset.good = v; onPick(v);
  };
  input.addEventListener('input', () => { if (options().includes(input.value)) { input.dataset.good = input.value; onPick(input.value); } });
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); resolve(); } });
  input.addEventListener('blur', () => { if (input.value !== (input.dataset.good || '')) resolve(); });
}

/* ---------------- data ---------------- */
async function rpc(name, args){
  if (DEMO) return DEMO_RPC(name, args);
  const { data, error } = await sb.rpc(name, args || {});
  if (error) throw new Error(friendlyError(error.message));
  return data;
}
function friendlyError(m){
  const t = String(m || '');
  const i = t.indexOf(': ');

// "8", "8:5", "830", "1:00 pm" -> "HH:MM"
function normTime(t){
  const s = String(t || '').trim().toLowerCase();
  const m = /^(\d{1,2})(?::?(\d{2}))?\s*(am|pm|a|p)?$/.exec(s);
  if (!m) return null;
  let h = +m[1]; const mm = m[2] ? +m[2] : 0;
  if (m[3] && m[3][0] === 'p' && h < 12) h += 12;
  if (m[3] && m[3][0] === 'a' && h === 12) h = 0;
  if (h > 23 || mm > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

function shrinkImage(file, maxDim){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('image convert failed')), 'image/jpeg', 0.88);
    };
    img.onerror = () => reject(new Error('could not read that image'));
    img.src = URL.createObjectURL(file);
  });
}
async function invokeFn(name, body){
  const { data: sess } = await sb.auth.getSession(); const s = sess && sess.session;
  if (s && s.expires_at && (s.expires_at * 1000 - Date.now()) < 120000) await sb.auth.refreshSession().catch(() => {});
  let r = await sb.functions.invoke(name, { body });
  if (r.error && r.error.context && r.error.context.status === 401){
    const { error: rErr } = await sb.auth.refreshSession();
    if (rErr) return { data: null, error: { message: 'your sign-in couldn’t be renewed. Reload the page and sign in again.' } };
    r = await sb.functions.invoke(name, { body });
  }
  return r;
}
async function readPhoto(file){
  if (S.busy) return;
  S.busy = true; $('readState').textContent = 'Reading the sheet… (about 20 seconds)';
  let path = null;
  try {
    let res;
    if (DEMO){ await new Promise(r => setTimeout(r, 400)); res = DEMO_DATA.ocr; path = 'demo.jpg'; }
    else {
      const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name || '');
      const blob = isPdf ? file : await shrinkImage(file, 2000);
      path = crypto.randomUUID() + (isPdf ? '.pdf' : '.jpg');
      const up = await sb.storage.from('timesheets').upload(path, blob, { contentType: isPdf ? 'application/pdf' : 'image/jpeg' });
      if (up.error) throw new Error('upload failed: ' + up.error.message);
      const { data, error } = await invokeFn('read-timesheet', { path });
      res = data;
      if (error || !res || res.ok === false){
        let msg = (res && (res.message || res.error)) || (error && error.message) || 'no answer';
        if (error && error.context && typeof error.context.text === 'function'){ const b = await error.context.text().catch(() => ''); try { const j = JSON.parse(b); msg = j.message || j.error || msg; } catch {} }
        throw new Error('Couldn’t read the sheet: ' + msg);
      }
    }
    // the sheet's own title and date fill the site and day when they're still empty
    if (!S.site && res.company && SITE_OF_COMPANY[res.company]){
      S.site = SITES.find(s => s.key === SITE_OF_COMPANY[res.company]); $('siteIn').value = $('siteIn').dataset.good = S.site.label;
    }
    const dates = (res.rows || []).map(r => r.date).filter(Boolean);
    const common = dates.sort((a, b) => dates.filter(x => x === b).length - dates.filter(x => x === a).length)[0] || res.sheet_date;
    if (!$('dayIn').value && common && common <= todayLA()) $('dayIn').value = common;
    if (!S.site || !$('dayIn').value){
      toast('The sheet is read. Pick the ' + (!S.site ? 'site' : 'day') + ', then press Type the lines instead to see them.', 8000);
    }
    startSheet(path, res.rows || []);
  } catch (e) {
    if (path && !DEMO) sb.storage.from('timesheets').remove([path]).catch(() => {});
    toast(e.message || String(e), 9000);
  } finally { S.busy = false; $('readState').textContent = ''; }
}

      <td data-l="In"><input data-k="clock_in" value="${esc((l.clock_in || '').slice(0, 5))}" placeholder="8:00" class="${l.clock_in ? '' : 'need'}" style="width:6.5em"></td>
      <td data-l="Out"><input data-k="clock_out" value="${esc((l.clock_out || '').slice(0, 5))}" placeholder="12:30" class="${l.clock_out ? '' : 'need'}" style="width:6.5em"></td>
      <td data-l="Lunch"><input data-k="break_minutes" inputmode="numeric" value="${lunchNeed ? '' : esc(l.break_minutes)}" placeholder="?" class="${lunchNeed ? 'need' : ''}" style="width:4.5em"></td>
      <td class="num" data-l="Hours">${CM.fmtHours(CM.hours(l))}</td>
      <td><button class="btn sm danger" type="button" data-rm="${i}" aria-label="Remove this line">×</button></td></tr>`;
  }).join('');
  const gustoHere = (sh.gusto || []).filter(g => (g.shifts || []).some(s => !S.site || !s.site || s.site === S.site.company));
  card.innerHTML = `<div class="status"><h2 style="margin:0">Check the lines: ${esc(S.site ? S.site.label : 'pick a site')} · ${esc(day ? CM.dayLabel(day) : 'pick a day')}</h2>
      <div class="row"><button class="btn" id="addLine" type="button">Add a line</button><button class="btn" id="discard" type="button">Discard</button>
      <button class="btn pri" id="saveSheet" type="button" ${stops || sh.loading || !S.site || !day ? 'disabled' : ''}>Save ${sh.lines.filter(l => l.include !== false).length} lines</button></div></div>
    ${sh.loading ? '<p class="muted small">Checking Gusto and the board for that day…</p>' : ''}
    ${stops ? `<div class="msg stop">${stops} line${stops === 1 ? '' : 's'} can’t be saved yet: fix them, or untick them.</div>` : ''}
    <p class="muted small">Times like 8:00 or 13:30 (or 1:30 pm). Lunch in minutes. People on Gusto aren’t saved here: Gusto pays them.</p>
    <div class="wrap"><table class="tbl"><thead><tr><th></th><th>Name</th><th>In</th><th>Out</th><th>Lunch</th><th class="num">Hours</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
    ${gustoHere.length ? `<p class="gl">In Gusto that day: ${gustoHere.map(g => esc(g.name) + ' ' + g.shifts.map(s => esc(CM.fmtTime(s.in)) + '–' + esc(s.out ? CM.fmtTime(s.out) : 'still in') + (s.job ? ' (' + esc(s.job) + ')' : '')).join(', ')).join('; ')}. A wrong job is changed in the Timesheet app.</p>` : ''}`;
  card.querySelectorAll('tr[data-i] input').forEach(inp => {
    const i = +inp.closest('tr').dataset.i, k = inp.dataset.k, l = S.sheet.lines[i];
    const ev = inp.type === 'checkbox' ? 'change' : 'change';
    inp.addEventListener(ev, () => {
      if (k === 'include') l.include = inp.checked;
      else if (k === 'newPerson') l.newPerson = inp.checked;
      else if (k === 'name'){
        l.name = inp.value.trim();
        const p = CM.matchTyped(S.roster, l.name);
        l.person = p; l.newPerson = false;
        if (p){ l.name = personName(p); l.last = p.last; l.first = p.first; }
        else { const parts = l.name.split(' '); l.first = parts[0] || ''; l.last = parts.slice(1).join(' '); }
      }
      else if (k === 'break_minutes') l.break_minutes = inp.value.trim() === '' ? null : Number(inp.value);
      else { const t = normTime(inp.value); l[k] = t || ''; if (inp.value.trim() && !t) toast('“' + inp.value + '” isn’t a time.'); }
      renderReview();
    });
  });
  card.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.sheet.lines.splice(+b.dataset.rm, 1); renderReview(); });
  $('addLine').onclick = () => { S.sheet.lines.push(blankLine()); renderReview(); };
  $('discard').onclick = () => { if (S.sheet.path && !DEMO) sb.storage.from('timesheets').remove([S.sheet.path]).catch(() => {}); S.sheet = null; renderReview(); };
  $('saveSheet').onclick = saveSheet;
}
async function saveSheet(){
  const sh = S.sheet, day = $('dayIn').value, site = S.site;
  if (!sh || !site || !day) return;
  const ctx = lineCtx();
  const lines = sh.lines.filter(l => l.include !== false);
  if (lines.some(l => CM.lineIssues(l, ctx).some(x => x.level === 'stop'))){ toast('Some lines still need fixing.'); return; }
  // a day of a pay period already submitted or approved is paid with the open one ("missed, paid here")
  const own = CM.periodStart(day), open = CM.periodStart(todayLA());
  const payTo = S.subs[own] ? (S.subs[open] ? null : open) : null;
  if (S.subs[own] && !payTo){ toast('Both that pay period and this one are already submitted. Ask Gianni.', 8000); return; }
  const btn = $('saveSheet'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const photo8 = sh.path ? sh.path.slice(0, 8) : null;
    const made = [];
    for (const [n, l] of lines.entries()){
      let p = l.person;
      if (!p && l.newPerson){
        if (DEMO){ p = { id: 'demo-' + Date.now() + n, last: l.last, first: l.first, team: "Norma's Team", default_rate: 20 }; S.roster.push(p); }
        else {
          const { data, error } = await sb.from('distro_roster').insert({ last: l.last, first: l.first, team: "Norma's Team", default_rate: 20, active: true, gusto_distro: false }).select('*').single();
          if (error) throw new Error('Couldn’t add ' + l.name + ' to the roster: ' + error.message);
          p = data; S.roster.push(p);
        }
      }
      const row = {
        id: crypto.randomUUID(), category: site.category, work_date: day, company: site.company, team: p.team || "Norma's Team",
        roster_id: p.id, last: p.last, first: p.first, clock_in: l.clock_in, clock_out: l.clock_out, break_minutes: Number(l.break_minutes) || 0,
        rate: p.default_rate == null ? 20 : p.default_rate, people: 1, source: sh.path ? 'ocr' : 'manual', photo_path: sh.path || null,
        source_id: photo8 ? `crew-${day}/${site.key}-${photo8}#${n + 1}` : null,
        note: `Crew hours page: ${site.label} sheet` + (l.newPerson ? '. New person, added at $20 by ' + firstName(S.email) : '') + (payTo ? `. ${CM.periodLabel(own)} was already submitted, so it's paid with ${CM.periodLabel(payTo)}.` : ''),
        pay_period: payTo, entered_by: S.email.replace(/ \(demo\)$/, ''), entered_via: 'crew-hours',
      };
      made.push(row);
    }
    if (DEMO){ made.forEach(r => { r.hours = CM.hours(r); DEMO_DATA.rows.push(r); }); }
    else {
      const { error } = await sb.from('distro_shifts').insert(made);
      if (error) throw new Error(/duplicate key/i.test(error.message) ? 'This sheet was already saved.' : friendlyError(error.message));
    }
    toast(`Saved ${made.length} line${made.length === 1 ? '' : 's'}.`);
    S.sheet = null; renderReview();
    await openPeriod(S.period);
  } catch (e) { toast(e.message || String(e), 9000); btn.disabled = false; btn.textContent = 'Save'; }
}
