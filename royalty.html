<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royalty and Licensing</title>
<!--
  Waf & Gus LLC royalty / licensing board. Static page: the data comes from Supabase through the
  key-scoped royalty_read RPC (supabase/royalty.sql). A Mac-side producer (~/ar-automation/lib/
  royalty-feed.mjs, hourly) rewrites the snapshot from QuickBooks. The key in #key=... decides what
  this page can see: a team key renders the whole board, a partner key renders only that partner's
  statement, and the server does that filtering (the page never hides data for security).
  Nothing secret lives here: the Supabase anon key is public and gated by RLS + the RPC.
-->
<style>

  --surface:#fcfcfb;--panel:#ffffff;--line:#e5e4e0;--text:#0b0b0b;--text2:#52514e;--muted:#8a8880;
  --pos:#1baf7a;--neg:#eb6834;--warn:#d29c26;--accent:#2a78d6;--grid:#eeede9;--soft:#f4f3ef;
  --green:#e2f6ea;--greenline:#3fc389;--amber:#fdf0d3;--amberline:#e5aa2d;--blue:#e2edfd;--blueline:#4a90e8;--pink:#fbe6f1;--pinkline:#df5a9d;--grey:#efeeea;--greyline:#b5b3ab;
  --track:#e6f5ee}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){color-scheme:dark;
  --surface:#1a1a19;--panel:#222221;--line:#3a3936;--text:#fff;--text2:#c3c2b7;--muted:#8a8880;
  --pos:#2cbd80;--neg:#ee7a4a;--warn:#f0b53a;--accent:#4d9bf5;--grid:#2c2b29;--soft:#2a2a28;
  --green:#163423;--greenline:#2cbd80;--amber:#362a0e;--amberline:#d29c26;--blue:#152a47;--blueline:#4189e0;--pink:#3a1830;--pinkline:#d84f9c;--grey:#2c2c2a;--greyline:#6b6a64;
  --track:#1f3a2d}}
:root[data-theme=dark]{color-scheme:dark;
  --surface:#1a1a19;--panel:#222221;--line:#3a3936;--text:#fff;--text2:#c3c2b7;--muted:#8a8880;
  --pos:#2cbd80;--neg:#ee7a4a;--warn:#f0b53a;--accent:#4d9bf5;--grid:#2c2b29;--soft:#2a2a28;
  --green:#163423;--greenline:#2cbd80;--amber:#362a0e;--amberline:#d29c26;--blue:#152a47;--blueline:#4189e0;--pink:#3a1830;--pinkline:#d84f9c;--grey:#2c2c2a;--greyline:#6b6a64;
  --track:#1f3a2d}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;padding:22px 24px 70px}

.wrap{max-width:1500px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:15px;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .n{font-size:12px;color:var(--muted);font-weight:400}
.sub{color:var(--text2);margin:0 0 14px;font-size:13px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.small{font-size:12px;padding:3px 9px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:4px 11px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--text);color:var(--surface)}
.chip{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--text2);white-space:nowrap;vertical-align:middle}
.chip.live{color:var(--pos);border-color:var(--pos)}
.chip.off,.chip.bad{color:var(--neg);border-color:var(--neg)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.accent{color:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:1px 8px;background:var(--soft);border:1px solid var(--line);color:var(--text2);white-space:nowrap;vertical-align:middle}
.tag.pos{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 50%,transparent)}

.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.tag.muted{color:var(--muted)}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 6px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.hero .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .val{font-size:22px;font-weight:650;margin-top:2px;letter-spacing:-.01em}
.hero .val.neg{color:var(--neg)}.hero .val.pos{color:var(--pos)}

.state{border:2px solid var(--greyline);background:var(--panel);border-radius:16px;padding:12px 14px;margin:12px 0;box-shadow:0 6px 24px color-mix(in srgb,var(--greyline) 18%,transparent)}
.state.green{border-color:var(--greenline);box-shadow:0 6px 24px color-mix(in srgb,var(--greenline) 22%,transparent)}
.state.amber{border-color:var(--amberline);box-shadow:0 6px 24px color-mix(in srgb,var(--amberline) 22%,transparent)}
.state.blue{border-color:var(--blueline);box-shadow:0 6px 24px color-mix(in srgb,var(--blueline) 22%,transparent)}

.sthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin-bottom:8px}
.sthead .name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}

.green .code{background:var(--greenline)}.amber .code{background:var(--amberline)}.blue .code{background:var(--blueline)}.pink .code{background:var(--pinkline)}

.sthead .note{font-size:12px;color:var(--muted);width:100%}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0;overflow:hidden}
.card.candidate{border-style:dashed}
.card.pending{opacity:.85}
.crow{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(120px,1fr)) auto;gap:8px 14px;align-items:center;padding:11px 14px;cursor:pointer}
.crow:hover{background:var(--soft)}
@media (max-width:900px){.crow{grid-template-columns:1fr 1fr}.crow .k{display:block}}
.crow .title{font-weight:650;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.crow .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.crow .v.neg{color:var(--neg)}.crow .v.pos{color:var(--pos)}
.crow .s{font-size:12px;color:var(--text2)}
.crow .caret{color:var(--muted);font-size:12px;justify-self:end}
.cbody{border-top:1px solid var(--line);padding:10px 14px 14px;background:var(--panel)}
.cbody h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600;display:flex;align-items:center;gap:10px}
.cbody h3:first-child{margin-top:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.dim td{color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.sub td{background:var(--soft);font-size:12px;color:var(--text2);padding-left:22px}
td .neg{color:var(--neg)}td .pos{color:var(--pos)}td .m{color:var(--muted)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--track);min-width:120px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pos);border-radius:4px}
.bar.late i{background:var(--warn)}
.cap{font-size:11px;color:var(--text2);margin-top:3px;white-space:normal;text-align:right}
.aging{font-size:12px;color:var(--text2);display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.aging b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.att{display:grid;grid-template-columns:auto minmax(140px,1fr) minmax(100px,auto) minmax(260px,2fr) minmax(160px,1fr);gap:6px 12px;align-items:start;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:900px){.att{grid-template-columns:auto 1fr}.att>div:nth-child(n+3){grid-column:2}.att .amt{text-align:left}}
.att .dot{width:9px;height:9px;border-radius:50%;margin-top:7px}
.dot.warn{background:var(--warn)}.dot.error{background:var(--neg)}.dot.info{background:var(--greyline)}
.att .fix{font-size:12px;color:var(--muted)}
.att .amt{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--muted)}.small{font-size:12px}
.foot{margin-top:30px;font-size:12px;color:var(--muted);line-height:1.7}
.foot .ok{color:var(--pos)}.foot .bad{color:var(--neg)}
.gate{max-width:520px;margin:60px auto;text-align:center}
.gate p{color:var(--text2)}
#overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:20}
#overlay.show{display:flex}
.modal{background:var(--surface);border:2px solid var(--accent);border-radius:18px;max-width:1100px;width:100%;padding:18px 20px 24px;box-shadow:0 10px 44px color-mix(in srgb,#000 30%,transparent)}
.banner{background:var(--blue);border:1px solid var(--blueline);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.stmt h1{font-size:22px}
.stmt .heroes{margin-top:8px}
.hidden{display:none !important}
@media print{body{background:#fff;color:#000;padding:0}.chip,button,.banner,.noprint,.seg{display:none !important}.hero,.card,.state{box-shadow:none;border-color:#ccc}.tbl{overflow:visible}table{page-break-inside:auto;font-size:11px}th,td{white-space:normal;padding:4px 6px}tr{page-break-inside:avoid}.bar{display:none}.sthead .name .code{color:#000;border:1px solid #000}}
</style></head><body><div class="wrap" id="app"><div class="gate"><h1>Waf &amp; Gus Licensing</h1><p>Loading</p></div></div>
<div id="overlay"><div class="modal" id="modal"></div></div>
<script>
'use strict';
const SB_URL='https://dhiqhgtmelxwelyoowle.supabase.co';
const SB_KEY='sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14';
const SB_H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const POLL_MS=5*60*1000, STALE_H=3;

/* ── key gate: #key=... is consumed once, scrubbed from the URL, kept in localStorage ── */
let viewKey='';
(function(){
  const m=location.hash.match(/key=([\w-]+)/);
  if(m){ viewKey=m[1]; let stored=false;
    try{ localStorage.setItem('royaltyKey',m[1]); stored=localStorage.getItem('royaltyKey')===m[1]; for(const k of Object.keys(localStorage)) if(k.startsWith('royalty_cache_')) localStorage.removeItem(k); }catch(e){}
    if(stored) history.replaceState(null,'',location.pathname+location.search);   // storage blocked: leave the link intact so a reload still works
    return; }
  try{ viewKey=localStorage.getItem('royaltyKey')||''; }catch(e){}
})();

/* ── state ── */
let resp=null, data=null, mode='team', admin=false, rev=-1, online=false, cacheKey='';
let year=null, showIC=false, showInfo=false, showHist=false;
const open=new Set(), openRows=new Set();
try{ for(const k of JSON.parse(localStorage.getItem('royaltyOpen')||'[]')) open.add(k); }catch(e){}
const persistOpen=()=>{ try{ localStorage.setItem('royaltyOpen',JSON.stringify([...open])); }catch(e){} };

/* ── helpers ── */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>{ if(!d) return ''; const [y,m,dd]=String(d).slice(0,10).split('-'); return `${MON[+m-1]} ${+dd}, ${y}`; };
const fmtDs=d=>{ if(!d) return ''; const [,m,dd]=String(d).slice(0,10).split('-'); return `${MON[+m-1]} ${+dd}`; };
const fmtTs=iso=>iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const periodLabel=p=>{ if(!p) return ''; const [y,q]=p.split('-'); return `${q} ${y}`; };
const yl=()=>year==='all'?'all time':String(year);
const sha8=async s=>{ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].slice(0,4).map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'x'; } };
// Year-scoped figures (received, billed, counts) come from that year's bucket; the balance-type
// figures (open, overdue, aging, last received) are point-in-time and always come from 'all',
// so a partner with no activity in the selected year still shows what it owes today.
const YEARLESS=['open_excl_future','open_future','open_qbo','open','overdue_open','overdue_count','oldest_open_days','aging','last_received','days_since_last_received'];
const met=(p,y)=>{ const all=(p&&p.metrics&&p.metrics.all)||emptyM(); const yr=(p&&p.metrics&&(p.metrics[y]||p.metrics[String(y)]))||emptyM(); const out={...yr}; for(const k of YEARLESS) if(k in all) out[k]=all[k]; return out; };
function emptyM(){ return {open_excl_future:0,open_future:0,open_qbo:0,received:0,received_payments:0,received_direct:0,billed:0,billed_future:0,royalty_billed:0,packaging_billed:0,other_billed:0,invoice_count:0,overdue_open:0,overdue_count:0,oldest_open_days:0,last_received:null,aging:{current:0,d1_30:0,d31_60:0,d61_90:0,d90_plus:0}}; }

/* ── data ── */
async function rpc(name){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:SB_H,body:JSON.stringify({p_key:viewKey})});
  if(!r.ok){ const t=await r.text(); if(/bad key/i.test(t)){ const e=new Error('bad key'); e.badKey=true; throw e; } throw new Error('http '+r.status); }
  return r.json();
}
const fetchRead=()=>rpc('royalty_read');
// polling asks for rev only (a few bytes); the ~150 KB snapshot is fetched just when rev moved
const fetchRev=()=>rpc('royalty_rev');
function adopt(j){
  resp=j; data=j.data||{}; rev=j.rev;
  mode=String(j.scope||'').startsWith('partner:')?'partner':'team';
  admin=j.scope==='admin';
  const yrs=yearsAvailable();
  if(year==null||(year!=='all'&&!yrs.includes(year))) year=(data.meta&&data.meta.year)||yrs[0]||'all';
}
function yearsAvailable(){
  const src=mode==='partner'?Object.values(data.partners||{})[0]:data.totals;
  const ys=Object.keys((src&&src.metrics)||{}).filter(k=>k!=='all').map(Number).filter(Boolean).sort((a,b)=>b-a);
  return ys.length?ys:[new Date().getFullYear()];
}
async function load(){
  if(!viewKey){ renderGate(); return; }
  cacheKey='royalty_cache_'+await sha8(viewKey);
  try{
    const j=await fetchRead(); online=true; adopt(j);
    try{ localStorage.setItem(cacheKey,JSON.stringify(j)); }catch(e){}
    render();
  }catch(e){
    if(e.badKey){ try{ localStorage.removeItem('royaltyKey'); localStorage.removeItem(cacheKey); }catch(x){} viewKey=''; renderGate('That link is no longer valid.'); return; }
    online=false;
    let cached=null; try{ cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(x){}
    if(cached){ adopt(cached); render(); } else renderGate('Could not reach the data service. Try again in a minute.');
  }
}
async function poll(){
  if(!viewKey) return;
  try{ const v=await fetchRev(); online=true;
    if(v.rev!==rev){ if(document.activeElement&&document.activeElement.tagName==='INPUT') return; const j=await fetchRead(); adopt(j); try{ localStorage.setItem(cacheKey,JSON.stringify(j)); }catch(e){} render(); }
    else { const c=$('#freshChip'); if(c) c.outerHTML=freshChip(); } }
  catch(e){ if(e.badKey){ try{ localStorage.removeItem('royaltyKey'); localStorage.removeItem(cacheKey); }catch(x){} viewKey=''; resp=null; data=null; closeOverlay(); renderGate('That link is no longer valid.'); return; } online=false; const c=$('#freshChip'); if(c) c.outerHTML=freshChip(); }
}

/* ── render: gate ── */
function renderGate(msg){
  $('#app').innerHTML=`<div class="gate"><h1>Waf &amp; Gus Licensing</h1><p>${esc(msg||'This board needs a link from Gianni.')}</p></div>`;
}

/* ── shared pieces ── */
function freshChip(){
  const gen=resp&&resp.generated_at?new Date(resp.generated_at):null;
  if(!gen) return `<span class="chip warn" id="freshChip">${online?'No snapshot yet':'Offline · nothing cached'}</span>`;
  const age=(Date.now()-gen.getTime())/36e5;
  if(!online) return `<span class="chip off" id="freshChip">Offline · cached ${fmtTs(gen.toISOString())}</span>`;
  // the QuickBooks pull runs hourly from about 5am to 6pm Pacific; overnight the last pull is
  // legitimately old, so "stale" means older than 3 h inside that window or older than 14 h at any time
  const hrPT=Number(new Date().toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'America/Los_Angeles'}));
  const inWindow=hrPT>=5&&hrPT<19;
  if(age>=14||(inWindow&&age>=STALE_H)) return `<span class="chip warn" id="freshChip" title="Pulled hourly between 5am and 6pm Pacific; this one is older than expected">Stale · last pull ${Math.round(age)} h ago</span>`;
  return `<span class="chip live" id="freshChip" title="Pulled hourly between 5am and 6pm Pacific">Live · pulled ${fmtTs(gen.toISOString())}</span>`;
}
function yearSeg(sel){
  const cur=sel==null?year:sel, ys=yearsAvailable().slice(0,3);
  return `<span class="seg" id="yearSeg">${ys.map(y=>`<button data-y="${y}" class="${cur===y?'on':''}">${y}</button>`).join('')}<button data-y="all" class="${cur==='all'?'on':''}">All time</button></span>`;
}
function bindYear(root){
  root.querySelectorAll('#yearSeg button').forEach(b=>b.onclick=()=>{ const v=b.dataset.y; year=v==='all'?'all':Number(v); render(); });
}
function statusTag(p){
  if(p.status==='pending') return `<span class="tag muted">Not in QuickBooks yet</span>`;
  if(p.status==='candidate') return `<span class="tag warn">Candidate · confirm deal</span>`;
  return '';
}
function dealTag(p){ return `<span class="tag">${esc(p.deal||'')}</span>`; }
function lastRecv(lr){ if(!lr) return `<span class="m">none yet</span>`; return `${fmtDs(lr.date)} · ${money(lr.amount)} <span class="m">${lr.kind==='direct'?'wire, no invoice':'payment'}</span>`; }
function nextExp(n){ if(!n||!n.date) return n&&n.note?`<span class="m">${esc(n.note)}</span>`:`<span class="m">no fixed cadence</span>`; return `${fmtDs(n.date)}${n.period_label?` <span class="m">· ${esc(periodLabel(n.period_label))}</span>`:''}${n.note?`<div class="s">${esc(n.note)}</div>`:''}`; }
function progress(i,stats,plan){
  const pct=i.total?Math.max(0,Math.min(100,i.paid/i.total*100)):0;
  const late=i.days_past_due>0&&(!plan||i.days_past_due>((stats&&stats.median_days_to_close)||0)+30);
  let cap=`${money(i.paid)} of ${money(i.total)} (${pct.toFixed(pct>0&&pct<1?1:0)}%) · ${i.installments} payment${i.installments===1?'':'s'}${i.last_paid?` · last ${fmtDs(i.last_paid)}`:''}`;
  if(plan&&stats&&stats.median_days_to_close!=null&&i.status!=='future'){ const proj=addDays(i.date,stats.median_days_to_close), asOf=(data.meta||{}).as_of||''; cap+=`<br>prior invoices closed in ${stats.min_installments}-${stats.max_installments} payments over ~${stats.median_days_to_close} days · ${proj<asOf?'past its usual close':'projected close ~'+fmtDs(proj)}`; }
  return `<div class="bar${late?' late':''}"><i style="width:${pct}%"></i></div><div class="cap">${cap}</div>`;
}
function addDays(d,n){ const t=new Date(d+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function invStatus(i){ return {open:'<span class="tag neg">Open</span>',partial:'<span class="tag warn">Partial</span>',future:'<span class="tag muted">Future</span>',paid:'<span class="tag pos">Paid</span>',zero:'<span class="tag muted">Zero</span>'}[i.status]||''; }
function dpd(i,plan,stats){
  if(!(i.status==='open'||i.status==='partial')) return '';
  if(i.days_past_due<=0) return `<span class="m">current</span>`;

function csvDownload(name,rows){

/* ── partner statement (partner mode + team preview) ── */
function statementHTML(p,{standalone=false,preview=false,yearSel=null}={}){
  const m=(data.meta||{}), y=yearSel==null?year:yearSel, M=met(p,y);
  const live=(p.invoices||[]).filter(i=>i.status==='open'||i.status==='partial');
  const plan=(p.flags||[]).includes('installment_plan');
  let h=`<div class="stmt">${preview?`<div class="banner"><span>Preview: this is exactly what ${esc(p.label||key)}'s link shows. Team-only detail (bank, notes, other customers, future-dated invoices) is not included.</span><button class="small" id="closePrev">Close</button></div>`:''}
    <div class="topbar"><div><h1>${esc(p.label||'')} · Royalty statement</h1><div class="sub">Prepared by ${esc(m.company_name||'Waf & Gus, LLC')} · as of ${fmtD(p.as_of||m.as_of)}${p.state_label?` · ${esc(p.state_label)}`:''}</div></div><div class="actions">${standalone?freshChip():''}${yearSeg(y)}${standalone?'<button class="small noprint" onclick="window.print()">Print</button>':''}</div></div>`;
  if(!p.label||p.withheld) return h+`<p class="muted">${p.withheld?'This statement is temporarily unavailable. Please check back later or contact '+esc(m.contact_from||'us')+'.':'No statement is available for this link yet.'}</p></div>`;
  h+=`<div class="heroes">
    <div class="hero"><div class="lbl">Balance due</div><div class="val ${M.open>0?'neg':''}">${money(M.open)}</div><div class="note">${live.length} open invoice${live.length===1?'':'s'}</div></div>
    <div class="hero"><div class="lbl">Received ${esc(yl())}</div><div class="val pos">${money(M.received)}</div><div class="note">${M.received_direct?`on invoices ${money(M.received_payments)} · royalty payments ${money(M.received_direct)}`:''}</div></div>
    <div class="hero"><div class="lbl">Last payment received</div><div class="val" style="font-size:17px">${M.last_received?fmtD(M.last_received.date):'none yet'}</div><div class="note">${M.last_received?money(M.last_received.amount):''}</div></div>
    <div class="hero"><div class="lbl">Next invoice expected</div><div class="val" style="font-size:17px">${p.next_expected&&p.next_expected.date?fmtD(p.next_expected.date):'no fixed date'}</div><div class="note">${p.next_expected&&p.next_expected.period_label?esc(periodLabel(p.next_expected.period_label)):''}</div></div></div>`;
  h+=`<h2>Open invoices <span class="n">${live.length}</span></h2>`;
  if(!live.length) h+=`<div class="muted small">Nothing open. Thank you.</div>`;
  else{ h+=`<div class="tbl"><table><thead><tr><th>Invoice</th><th class="l">Period</th><th>Date</th><th>Due</th><th class="l">Terms</th><th>Total</th><th>Paid</th><th>Balance</th><th class="l" style="min-width:200px">Progress</th><th>Status</th></tr></thead><tbody>`;
    for(const i of live){ const pct=i.total?Math.min(100,i.paid/i.total*100):0;
      h+=`<tr><td>${esc(i.doc||'')}</td><td class="l">${esc(periodLabel(i.period))}</td><td>${fmtDs(i.date)}</td><td>${fmtDs(i.due)}</td><td class="l">${esc(i.terms||'')}</td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td><span class="neg">${money(i.balance)}</span></td><td class="l"><div class="bar"><i style="width:${pct}%"></i></div><div class="cap">${money(i.paid)} of ${money(i.total)} · ${i.installments} payment${i.installments===1?'':'s'}${i.last_paid?` · last ${fmtDs(i.last_paid)}`:''}</div></td><td>${invStatus(i)}</td></tr>`; }
    h+=`</tbody></table></div>`; }
  const rows=[...(p.payments||[]).map(x=>({date:x.date,amount:x.amount,applied:x.applied.map(a=>`${esc(a.doc||'invoice')} ${money(a.amount)}`).join(' · '),ref:x.ref_num||''})),
              ...(p.direct_receipts||[]).map(r=>({date:r.date,amount:r.amount,applied:`royalty payment, no invoice · ${esc(periodLabel(r.period))}`,ref:''}))]
    .filter(r=>y==='all'||Number(r.date.slice(0,4))===y).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  h+=`<h2>Payment history ${esc(yl())} <span class="n">${rows.length}</span></h2>`;
  if(!rows.length) h+=`<div class="muted small">No payments in ${esc(yl())}.</div>`;
  else{ h+=`<div class="tbl"><table><thead><tr><th>Date</th><th>Amount</th><th class="l">Applied to</th><th class="l">Ref</th></tr></thead><tbody>`;
    for(const r of rows) h+=`<tr><td>${fmtD(r.date)}</td><td><span class="pos">${money(r.amount)}</span></td><td class="l">${r.applied}</td><td class="l">${esc(r.ref)}</td></tr>`;
    h+=`</tbody></table></div>`; }
  const hist=(p.invoices||[]).filter(i=>y==='all'||Number(i.date.slice(0,4))===y);
  h+=`<h2>Billing history ${esc(yl())} <span class="n">${hist.length}</span></h2>`;
  if(!hist.length) h+=`<div class="muted small">No invoices in ${esc(yl())}.</div>`;
  else{ h+=`<div class="tbl"><table><thead><tr><th>Invoice</th><th class="l">Period</th><th>Date</th><th class="l">Description</th><th>Total</th><th>Received</th><th>Balance</th><th>Status</th></tr></thead><tbody>`;
    for(const i of hist) h+=`<tr class="${i.status==='zero'?'dim':''}"><td>${esc(i.doc||'')}</td><td class="l">${esc(periodLabel(i.period))}</td><td>${fmtD(i.date)}</td><td class="l" style="white-space:normal;max-width:320px"><span class="m">${esc((i.lines||[]).map(l=>[l.item,l.desc].filter(Boolean).join(': ')).join(' · ').slice(0,140))}</span></td><td>${money(i.total)}</td><td>${money(i.paid)}</td><td>${i.balance?`<span class="neg">${money(i.balance)}</span>`:money(0)}</td><td>${invStatus(i)}</td></tr>`;
    h+=`</tbody></table></div>`; }
  h+=`<div class="foot">Questions: ${esc(m.contact_from||'')}</div></div>`;
  return h;
}
let previewYear=null;
function previewPartner(key,yr){
  const p=(data.partners||{})[key]; if(!p) return;
  previewYear=yr==null?year:yr;
  $('#modal').innerHTML=statementHTML(p,{preview:true,yearSel:previewYear});
  $('#overlay').classList.add('show');
  $('#closePrev').onclick=closeOverlay;
  $('#modal').querySelectorAll('#yearSeg button').forEach(b=>b.onclick=()=>{ const v=b.dataset.y; previewPartner(key,v==='all'?'all':Number(v)); });
}
function closeOverlay(){ $('#overlay').classList.remove('show'); $('#modal').innerHTML=''; }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeOverlay(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });
function exportPartner(key,what){
  const p=data.team.partners[key]; if(!p) return;
  if(what==='invoices'){
    const rows=[['invoice','qbo_id','period','date','due','terms','kind','total','paid','balance','status','installments','last_paid','days_past_due','description']];
    for(const i of p.invoices) rows.push([i.doc||'',i.id,i.period||'',i.date,i.due,i.terms||'',i.kind,i.total,i.paid,i.balance,i.status,i.installments,i.last_paid||'',i.days_past_due,i.lines.map(l=>l.desc).filter(Boolean).join(' | ')]);
    csvDownload(`${key}-invoices.csv`,rows);
  }else{
    const rows=[['date','type','amount','applied_to','ref','bank','entered','qbo_id']];
    for(const x of p.payments) rows.push([x.date,'payment',x.amount,x.applied.map(a=>`${a.doc||a.invoice_id}:${a.amount}`).join(' | '),x.ref_num||x.note||'',x.bank||'',x.created||'',x.id]);
    for(const r of p.direct_receipts) rows.push([r.date,'direct',r.amount,`${r.account} ${r.period}`,r.memo||'',r.bank||'',r.created||'',r.id]);
    rows.sort((a,b)=>a===rows[0]?-1:b===rows[0]?1:(a[0]<b[0]?1:-1));
    csvDownload(`${key}-activity.csv`,rows);
  }
}

/* ── boot ── */
load().then(()=>{ setInterval(poll,POLL_MS); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') poll(); }); });
</script></body></html>
