  // The day's drive is logged one LEG at a time: Home → stop → stop → … → Home.
  // Each leg saves as its own trip; the next leg's start auto-fills from this leg's
  // destination. Saved legs collapse to a summary you can tap to re-open/edit.
  const newPart = (startLabel)=>({ _start0:startLabel||'', startLabel:startLabel||'', startAddr:startLabel||'', startCoords:null,

    startOdo:null, endOdo:null, startPath:null, endPath:null, routePath:null, kind:null, tripId:null, saved:false });
  const partFromTrip = (t)=>({ startLabel:t.start_label||'', startAddr:t.start_label||'', startCoords:null,
    destLabel:t.dest_label||'', destAddr:'', destDispId:t.dispensary_id||null,
    method:(t.method==='odometer'?'odometer':'distance'), miles:t.miles!=null?Number(t.miles):null,
    milesSrc:t.miles_source||'manual', note:t.note||'', startOdo:t.start_odo, endOdo:t.end_odo,
    startPath:t.start_photo||null, endPath:t.end_photo||null, routePath:null, kind:t.kind||null, tripDate:t.trip_date,
    tripId:t.id, status:t.status||'draft', saved:true });

  // render read-only (the server trigger would silently revert edits anyway).
  const unlockedLeg = (p)=>isAdminCtx || !p.tripId || p.status==='draft' || p.status==='rejected';
  // is this leg still missing what the To-do rule requires? (live check on the part —
  // a non-store kind waives the location link, mirroring itemIssues)
  const partIssues = (p)=>!((p.destDispId||matchDispByText(p.destLabel)||isNonstoreKind(p.kind)) && p.kind && Number(p.miles)>0);

  const syncT=(rowOrId, del)=>{ dirty=true; const T=(typeof gridCtx==='function'&&gridCtx().T)||state._T; if(!Array.isArray(T)) return;

    // count in this period's totals and Submit), as a moved expense does

    if(!del && rowOrId && rowOrId.period_id && cper && !isAllPeriods(cper) && cper.id && rowOrId.period_id!==cper.id){ rowOrId=rowOrId.id; del=true; }
    const id=del?rowOrId:rowOrId.id, ix=T.findIndex(t=>String(t.id)===String(id));
    if(del){ if(ix>=0) T.splice(ix,1); }

    .sort((a,b)=>String(a.created_at||a.id).localeCompare(String(b.created_at||b.id)));

  let activeIdx;

    <div id="partsHost" style="margin-top:6px"></div>
    <button class="btn ghost block" id="tAddLeg" style="margin-top:10px;display:none">＋ Add another leg</button>
    <button class="btn ghost block" id="tDone" style="margin-top:10px">Done</button>

  const refreshAfter=()=>{ if(isAdminCtx){ if(state._dgHost) renderDayGrid(state._dgHost); if(typeof ctx.onChange==='function') ctx.onChange(); }
    else if(typeof drawBA==='function') drawBA(); };

  $('#tAddLeg').onclick=()=>{ const last=parts[parts.length-1]; parts.push(newPart(last?last.destLabel:'')); activeIdx=parts.length-1; render(); };
  // dismissing via ✕ or the backdrop must refresh too — otherwise the day grid keeps

  function summaryHtml(p,i){
    // one line, both ends readable: the LONG end eats the truncation while a short one
    // (a store name like "* Office (CA)") is protected from shrinking. Both long → both give.
    const homey=(t)=>isHomeAddr(t,homeAddr)?'Home':t;   // the owner's address reads as 'Home'
    const a=abbrPlace(homey(p.startLabel),40), b=abbrPlace(homey(p.destLabel),40), PROT=18;
    const sa=(a.length<=PROT && b.length>a.length)?0:1, sb=(b.length<=PROT && a.length>b.length)?0:1;
    const lock=!unlockedLeg(p);
    return `<div class="legsum" data-i="${i}">
      <div class="lgn">Leg ${i+1} · <span class="lmi">${p.miles!=null?p.miles+' mi':'— mi'}</span>${p.saved?(lock?' · '+esc(p.status):''):' · draft'}</div>
      <div class="t"><span class="pl" style="flex-shrink:${sa}">${esc(a)}</span><span class="ar">→</span><span class="pl" style="flex-shrink:${sb}">${esc(b)}</span></div>
      ${lock?`<span class="legx" style="cursor:default" title="${esc(p.status)} — an admin can change it">🔒</span>`
            :`<button class="legx" data-del="${i}" title="remove leg">✕</button>`}
    </div>`;
  }
  function activeFormHtml(p,i){
    const seg=(m,ic,t,s)=>`<button class="${p.method===m?'on':''}" data-m="${m}"><span class="mi">${ic}</span><b>${t}</b><small>${s}</small></button>`;
    // an expanded leg can always be collapsed back — except a lone, never-saved one
    // (there'd be nothing left to show)
    const canCollapse = parts.length>1 || p.saved;
    const lock=!unlockedLeg(p);
    return `<div class="legcard">
      <div class="leghd${canCollapse?' can':''}"${canCollapse?' id="tLegHd"':''}><b>Leg ${i+1}</b>

      ${lock?`<div class="small" style="color:var(--yellow);margin:-2px 0 8px">🔒 This leg is ${esc(p.status)} — ask an admin to change or delete it.</div>`:''}
      <label class="fl">How do you want the miles?</label>
      <div class="mtiles" id="tSeg">${seg('distance','📍','Addresses','A → B')}${seg('route','🗺','Nav screenshot','reads your map')}${seg('odometer','📷','Odometer','start &amp; end')}</div>
      <div id="tStartWrap" class="${p.method!=='distance'?'hide':''}">
        <label class="fl">Starting location</label>
        <div class="row" style="gap:8px">

          <button class="btn sm" id="tGps" type="button" style="white-space:nowrap">📍 Current</button>
        </div>
        <div id="tSug" class="tsug hide"></div>
        <div class="small muted" id="tStartHint" style="margin-top:4px"></div>
      </div>
      <label class="fl">Destination</label>
      <input id="tDest" placeholder="dispensary or address" value="${esc(p.destLabel)}" autocomplete="off">
      <div id="tSugDest" class="tsug hide"></div>
      <div id="tDistance" class="${p.method!=='distance'?'hide':''}" style="margin-top:12px"><button class="btn block" id="tCalc">Calculate miles</button></div>
      <div id="tRoutePanel" class="${p.method!=='route'?'hide':''}" style="margin-top:12px">
        <label class="btn block ghost">🗺 Upload route screenshot <span class="muted small">— we read the miles off it</span><input id="tRoute" type="file" accept="image/*" hidden></label>
        <div class="small muted" id="tRouteHint" style="margin-top:4px"></div>
      </div>

          <div class="grow"><label class="fl">Start odometer</label><input id="tStart" type="number" inputmode="decimal" placeholder="photo / number" value="${p.startOdo??''}">
            <label class="btn sm block ghost" style="margin-top:6px">📷 Start photo<input id="tStartPhoto" type="file" accept="image/*" capture="environment" hidden></label></div>
          <div class="grow"><label class="fl">End odometer</label><input id="tEnd" type="number" inputmode="decimal" placeholder="photo / number" value="${p.endOdo??''}">
            <label class="btn sm block ghost" style="margin-top:6px">📷 End photo<input id="tEndPhoto" type="file" accept="image/*" capture="environment" hidden></label></div>
        </div>
      </div>
      <label class="fl">Miles</label><input id="tMiles" type="number" inputmode="decimal" step="0.1" placeholder="calculated, or enter manually" value="${p.miles??''}">
      <label class="fl">Category <span class="muted">(pick all that apply)</span></label>
      <button type="button" class="selpick" id="tKind" value="${esc(p.kind||'')}">${p.kind?esc(p.kind):'<span class="pkph">— what kind of activity —</span>'}</button>
      <label class="fl">Location <span class="muted">(the dispensary this trip is associated with)</span></label>
      <button type="button" class="selpick" id="tLink"></button>
      <label class="fl">Note (optional)</label><input id="tNote" placeholder="e.g. dropped samples, met buyer, BJ's lunch" value="${esc(p.note||'')}">
      <div id="tCost" class="small muted" style="margin-top:10px"></div>
      ${lock?'':`<button class="btn primary block" id="tSave" style="margin-top:12px">${p.saved?(editMode?'Save changes':'Update leg '+(i+1)):'Save leg '+(i+1)}</button>`}
      ${p.tripId&&!lock?`<button class="btn ghost block" id="tDel" style="margin-top:8px;color:var(--red);border-color:color-mix(in srgb, var(--red) 40%, transparent)">🗑 Delete trip</button>`:''}
    </div>`;
  }
  function render(){
    const host=$('#partsHost'); if(!host) return;
    // every leg is followed by its connector — │ miles │ ↓ — so the day reads as one
    // chained journey. An expanded leg shows miles in its own form (no chip), and when
    // it's the last item nothing follows it, so its connector is dropped entirely.
    // a drawn arrow BETWEEN consecutive legs only (stem flowing into a chevron) — the
    // chain never dangles past the last leg. Miles live on the leg pills themselves.
    const arrow='<div class="legarrow" aria-hidden="true"><svg width="14" height="18" viewBox="0 0 14 18"><path d="M7 1v14.5M2.5 11.5 7 16l4.5-4.5"/></svg></div>';
    host.innerHTML = parts.map((p,i)=> (i?arrow:'') + (i===activeIdx ? activeFormHtml(p,i) : summaryHtml(p,i))).join('');
    const ab=$('#tAddLeg'); if(ab) ab.style.display = (activeIdx<0 && parts.length) ? 'block' : 'none';
    host.querySelectorAll('.legsum').forEach(el=>el.onclick=e=>{ if(e.target.closest('[data-del]')) return;
      activeIdx=prunePristine(Number(el.dataset.i)); render(); });
    host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delLeg(Number(b.dataset.del)));
    if(activeIdx>=0) wireActive(parts[activeIdx], activeIdx);
  }
  // navigating away from a pristine, never-saved leg drops it (else it'd linger as an
  // empty "? → ?" ghost pill). Returns the target index, adjusted if a splice shifted it.
  function prunePristine(target){
    const p=parts[activeIdx];
    if(activeIdx>=0 && p && !p.saved && !String(p.destLabel||'').trim() && p.miles==null && parts.length>1){
      parts.splice(activeIdx,1);
      if(target>activeIdx) target--;
    }
    return target;
  }
  // collapse the open leg back to its summary bar (dropping it if pristine)
  function collapseLeg(){ activeIdx=prunePristine(-1); render(); }
  let deleting=false;                        // re-entrancy guard: a 2nd tap while the DB
  async function delLeg(i){                  // call is in flight would splice a 2nd leg
    if(deleting) return; deleting=true;
    try{
      const p=parts[i]; if(!p) return;
      if(p.tripId){
        if(!confirm('Delete this trip? This can’t be undone.')) return;
        // .select('id') so an RLS-filtered no-op (locked trip) is detectable — a bare
        // delete returns no error even when it deleted nothing
        const {data,error}=await supabase.from('trips').delete().eq('id',p.tripId).select('id');
        if(error) return errToast(error,'Couldn’t delete');
        if(!data || !data.length) return toast('This trip is locked (already submitted) — ask an admin.','err');
        syncT(p.tripId,true);
        toast('Trip deleted','ok');
      }
      parts.splice(i,1);
      if(!parts.length){ closeSheet(); refreshAfter(); return; }   // nothing left → close
      if(activeIdx===i) activeIdx=-1;
      else if(activeIdx>i) activeIdx--;
      render();
    } finally { deleting=false; }
  }
  function wireActive(p,i){
    const showCost=()=>{ const c=$('#tCost'); if(c) c.innerHTML = (p.miles!=null&&p.miles>0) ? `Reimbursement: <b style="color:var(--accent2)">${money(p.miles*rate)}</b> &nbsp;<span class="muted">(${p.miles} mi × ${money(rate)})</span>` : '';
      if(Number(p.miles)>0){ const m=$('#tMiles'); if(m) clearNeed(m); } };   // auto-filled miles (odometer/Calculate/route) clear the red too
    showCost();
    // Location row = where this leg's cost lands (store or bucket). It mirrors the
    // save-time auto-link chain LIVE — destination store → return-home start store →
    // General-BA bucket — so the attribution is visible BEFORE saving; tapping the row
    // overrides it (picking nothing returns it to auto).
    const legLocked=!unlockedLeg(p);
    const calcLink=()=>{
      // locked legs show the SAVED attribution (the DB truth — can't change it, so don't
      // recompute and risk claiming a link the row doesn't have)
      if(legLocked) return p.destDispId||null;
      if(p.linkDispId!==undefined) return p.linkDispId;   // explicit picker override wins
      return legAttribution({ destText:$('#tDest')?.value||p.destLabel, startText:$('#tStartLoc')?.value||p.startLabel,
        destDispId:p.destDispId, kind:$('#tKind')?($('#tKind').value||null):p.kind, homeAddr });   // button value is truth — no p.kind fallback (a cleared category must read as cleared)
    };
    const linkLabel=()=>{ const b=$('#tLink'); if(!b) return; const d=calcLink();
      const auto = !legLocked && p.linkDispId===undefined;   // '· auto' only for a live-derived value
      b.innerHTML = d ? esc(dispName(d))+(auto?' <span class="muted small">· auto</span>':'')
                      : '<span class="pkph">— not linked yet —</span>'; };
    { const b=$('#tLink'); if(b){ linkLabel();
      // attribution targets = real retail stores + the legit '* ' buckets, in the viewed
      // BA's region. Exclude private home pins, errand stops (retail=false) and the retired
      // '* Lead' placeholder. '* New retailer' stays in: mileage is where a BA first meets
      // a store that isn't registered yet, and the picker turns that entry into the
      // add-store form (Leti, Sep 2026: five unregistered stores, no way to add them here).
      b.onclick=()=>{ const region=ctx.region||state.profile?.region||null;
        const lopts=(state.dispensaries||[])
          .filter(d=> d.active!==false && !d.private
             && (!region || !d.state || d.state===region)
             && !/^\*\s*lead/i.test(d.name||'')
             && (d.retail!==false || (d.name||'').startsWith('*')))
          .sort(dispSort).map(d=>({id:d.id, name:d.name, search:dispSearchText(d)}));
        const cur=calcLink();
        cellPickerSheet({ title:'Attribute this leg to…', options:lopts, selected:cur?[cur]:[],
          onSave:ids=>{ p.linkDispId = ids.length ? ids[0] : undefined; linkLabel();
            // a hand-picked link IS the store link fix-mode is asking for; the Destination
            // mark otherwise only clears on typing there, so it stayed red after linking
            if(ids.length){ const d=$('#tDest'); if(d) clearNeed(d); } } }); };
      ['#tDest','#tStartLoc'].forEach(sl=>{ const el=$(sl); if(el){
        el.addEventListener('input',()=>setTimeout(linkLabel,0));
        el.addEventListener('blur',()=>setTimeout(linkLabel,0)); }});
      { const k=$('#tKind'); if(k) k.addEventListener('change',()=>setTimeout(linkLabel,0)); }
    } }
    // admin: approved leg → back to submitted (also un-stamps the period submission)
    { const u=$('#tUndo'); if(u) u.onclick=async()=>{
        const cper=ctx.per||state.period;
        if(cper && cper.status==='closed' && !confirm('This pay period is CLOSED — it may already be paid out. Undo approval anyway?')) return;
        busy(u,true); const r=await undoApproval('trips', p.tripId); busy(u,false);
        if(!r) return;
        p.status='submitted'; syncT({id:p.tripId, status:'submitted'}); render(); }; }
    // submitted/approved leg → read-only card: the server trigger would silently revert
    // any edit, so don't pretend. Collapse is the only live control.
    if(!unlockedLeg(p)){
      const card=$('#partsHost')&&$('#partsHost').querySelector('.legcard');
      if(card) card.querySelectorAll('input,select,button').forEach(el=>{ if(el.id!=='tCollapse') el.disabled=true; });
      const hd=$('#tLegHd'); if(hd) hd.onclick=()=>collapseLeg();
      return;
    }
    $('#tSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      $('#tSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); p.method=b.dataset.m;
      $('#tStartWrap').classList.toggle('hide',p.method!=='distance');
      $('#tDistance').classList.toggle('hide',p.method!=='distance');
      $('#tRoutePanel').classList.toggle('hide',p.method!=='route');
      $('#tOdo').classList.toggle('hide',p.method!=='odometer');
    });
    $('#tMiles').oninput=e=>{ p.miles=e.target.value?Number(e.target.value):null; p.milesSrc='manual'; showCost(); };
    $('#tNote').oninput=e=>{ p.note=e.target.value||null; };
    // Category = MULTI-select (a leg can be e.g. "Store visit, Demo / PAD"); stored as one
    // comma-joined string in trips.kind. The button carries .value like the old select did,
    // so officeKind()'s programmatic set + the save handler keep working unchanged.
    { const kb=$('#tKind');
      const kLabel=()=>{ kb.innerHTML = kb.value ? esc(kb.value) : '<span class="pkph">— what kind of activity —</span>'; };
      kb.addEventListener('change', ()=>{ p.kind=kb.value||null; kLabel(); });
      kb.onclick=()=>{ const opts=laborKindNames().slice(); kindList(p.kind).forEach(k=>{ if(!opts.includes(k)) opts.push(k); });
        cellPickerSheet({ title:'Category (pick all that apply)', multi:true,
          options:opts.map(k=>({id:k,name:k})), selected:kindList(kb.value),
          onSave:ids=>{ kb.value=ids.join(', '); kb.dispatchEvent(new Event('change',{bubbles:true})); if(kb.value) clearNeed(kb); } });
      };
    }
    // a trip to an Office auto-defaults the category to General BA Activity/Admin (still editable)
    const officeKind=()=>{ const k=$('#tKind'); const def=p.destDispId&&defaultKindForDisp(p.destDispId); if(k && !p.kind && def){ p.kind=def; k.value=def; k.dispatchEvent(new Event('change',{bubbles:true})); } };
    $('#tGps').onclick=()=>{
      if(!navigator.geolocation) return toast('GPS not available on this device','err');
      $('#tStartHint').textContent='Getting your location…';
      navigator.geolocation.getCurrentPosition(pos=>{
        p.startCoords={lat:pos.coords.latitude,lng:pos.coords.longitude};
        $('#tStartLoc').value='📍 Current location'; p.startLabel='📍 Current location'; p.startAddr='';
        $('#tSug').classList.add('hide');
        $('#tStartHint').textContent=`Using GPS (${p.startCoords.lat.toFixed(4)}, ${p.startCoords.lng.toFixed(4)})`;
      }, ()=>{ toast('Couldn’t get location — allow access or type an address','err'); $('#tStartHint').textContent=''; },
        {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
    };
    attachPlaceTypeahead($('#tStartLoc'), $('#tSug'), r=>{ p.startAddr=r.addr; p.startCoords=null; $('#tStartHint').textContent=''; }, {home:homeAddr});
    $('#tStartLoc').addEventListener('input', e=>{ p.startLabel=e.target.value; p.startCoords=null; });
    attachPlaceTypeahead($('#tDest'), $('#tSugDest'), r=>{ p.destAddr=r.addr; p.destDispId=r.dispId; officeKind(); }, {home:homeAddr});
    $('#tDest').addEventListener('input', e=>{ p.destLabel=e.target.value; p.destDispId=null; });
    $('#tCalc').onclick=async ()=>{
      const destText=$('#tDest').value.trim(); if(!destText) return toast('Enter a destination first','err');
      const body={ roundtrip:false, for_ba:forBA };
      if(p.startCoords){ body.start_lat=p.startCoords.lat; body.start_lng=p.startCoords.lng; }
      else { const a=(p.startAddr||$('#tStartLoc').value).trim();
        if(a && a!=='📍 Current location'){
          // if the start is a known store/office, pass its cached coords or address (its
          // NAME alone — e.g. "* Office (CA)" — won't geocode)
          const sStore=(state.dispensaries||[]).find(d=>d.active!==false && d.name===a);
          if(sStore && sStore.lat!=null && sStore.lng!=null){ body.start_lat=sStore.lat; body.start_lng=sStore.lng; }
          else body.start_address=(sStore&&sStore.address)||dispAddrByText(a)||a;

          p.miles=Math.round(route.miles*100)/100; p.milesSrc=r.source; $('#tMiles').value=p.miles; showCost();

        } else toast(r.message||'Enter miles manually','err');
      }catch(e){ toast(e.message,'err'); }
      busy(btn,false);
    };
    async function readOdo(file, which){

    { const del=$('#tDel'); if(del) del.onclick=()=>delLeg(i); }       // delLeg itself confirms

      rememberPlaces(startLoc, p.destLabel);
      toast(wasUpdate?'Trip updated ✓':`Leg ${i+1} saved ✓`,'ok');
      // log flow: saving the last leg chains straight into the next one (start = this
      // stop). Edit flow: collapse back to the overview — '+ Add another leg' covers
      // extending the day. Fix flow: jump to the next broken leg, if any.
      if(!editMode && i===parts.length-1){ parts.push(newPart(p.destLabel)); activeIdx=parts.length-1; }
      else if(opts.fix){
        const nx=parts.findIndex((q,qi)=>qi!==i && q.tripId && unlockedLeg(q) && partIssues(q));
        if(nx>=0){ fixLeg=nx; fixArmed=true; activeIdx=nx; }
        else activeIdx=-1;
      }
      else { activeIdx=-1; }
      render();
    };
    // fix-mode: whenever a still-broken leg is open, red-highlight exactly what's
    // missing (same rule as the To-do). A mark clears only when its issue is actually
    // RESOLVED — not on any keystroke: Destination needs a real store link, Category a
    // real pick, Miles a positive number (programmatic fills clear via showCost).
    // Highlights survive collapse/reopen; the auto-scroll fires once per fix target.
    if(opts.fix){
      const mk=(el,ev,ok)=>{ if(!el) return; el.classList.add('needs');
        const pk=el.nextElementSibling; if(pk&&pk.classList.contains('selpick')) pk.classList.add('needs');
        el.addEventListener(ev,()=>{ if(ok()) clearNeed(el); }); };
      if(!(p.destDispId||matchDispByText(p.destLabel)||isNonstoreKind(p.kind)))
        mk($('#tDest'),'input',()=>!!(p.destDispId||matchDispByText($('#tDest').value)||isNonstoreKind($('#tKind')?.value)));
      if(!p.kind) mk($('#tKind'),'change',()=>!!$('#tKind').value);
      if(!(Number(p.miles)>0)) mk($('#tMiles'),'input',()=>Number($('#tMiles').value)>0);
      // picking a purely non-store category resolves the 'needs a location' issue too
      $('#tKind').addEventListener('change',()=>{ if(isNonstoreKind($('#tKind').value)){ const d=$('#tDest'); if(d) clearNeed(d); } });
      if(fixArmed && i===fixLeg){
        fixArmed=false;
        const card=$('#partsHost')&&$('#partsHost').querySelector('.legcard');
        if(card) requestAnimationFrame(()=>card.scrollIntoView({block:'center',behavior:'smooth'}));
      }
    }
  }
}

// After a snapped receipt is saved instantly, the OCR runs here and fills the
// still-empty fields in place when it returns — the popup never waits on it.
async function ocrFillInBackground(path, id, catTouched){
  try{
    const r=await callFn('extract-receipt',{path});
    if(!r) return;
    const row=(state._E||[]).find(x=>x.id===id)||{};
    const patch={ ocr_raw:r.raw||r };
    if(r.ok){
      if(r.total!=null && !(Number(row.amount)>0)) patch.amount=r.total;
      if(r.vendor && !((row.vendor||'').trim())) patch.vendor=r.vendor;
      if(r.category && !catTouched && (!row.category || row.category===EXPENSE_CATEGORIES[0])) patch.category=r.category;
    }
    const { data, error }=await supabase.from('expenses').update(patch).eq('id',id).eq('status','draft').select('*').single();
    if(error||!data) return;
    const i=(state._E||[]).findIndex(x=>x.id===id); if(i>=0) state._E[i]=data;
    refreshItems(); refreshTotals(); fillGridRowFromOcr(id, data); gridTotal();
  }catch{}
}
// fill a draft's grid cells without rebuilding the grid (won't clobber in-progress edits)
function fillGridRowFromOcr(id, data){
  const host=$('#gridcard'); if(!host) return;
  const tr=host.querySelector(`.g-body tr[data-id="${CSS.escape(id)}"]`); if(!tr) return;
  const amt=tr.querySelector('.g-amt'), desc=tr.querySelector('.g-desc'), cat=tr.querySelector('.g-cat');
  if(amt && document.activeElement!==amt && !amt.value && Number(data.amount)>0){ amt.value=data.amount; amt.classList.remove('needs'); }
  if(desc && document.activeElement!==desc && !desc.value && (data.vendor||'').trim()){ desc.value=data.vendor; desc.classList.remove('needs'); }
  if(cat && data.category) cat.value=data.category;
}

// Spend per dispensary — the app's core metric. Aggregates trips ($ mileage) +
// expenses (reimbursable + company card) by dispensary for the selected period.
async function adminReport(m){
  m.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  await reloadPeriods();
  const {start,end}=ensureRepRange();
  const [{data:profs},{data:disps},trips,exps,hrs]=await Promise.all([
    supabase.from('profiles').select('id,full_name,region,home_region,non_ba,base_address'),
    readStores('id,name,state'),
    // `state` on all three: rowRegion below reads the row's own state (it was never selected, so it fell through to
    // the logger's region; event costs from the books carry their event's state)
    supabase.from('trips').select('id,ba_id,dispensary_id,amount,trip_date,miles,method,kind,start_label,dest_label,start_odo,end_odo,note,status,state').gte('trip_date',start).lte('trip_date',end),
    selectExpenses('id,ba_id,dispensary_id,dispensary_ids,alloc,amount,payment,expense_date,vendor,category,receipt_path,note,status,state', q=>q.gte('expense_date',start).lte('expense_date',end)),
    supabase.from('hours').select('id,ba_id,dispensary_id,dispensary_ids,alloc,amount,work_date,hours,rate,job,kind,note,status,source,state').gte('work_date',start).lte('work_date',end),
  ]);
  const dById={}; (disps||[]).forEach(d=>dById[d.id]=d);
  const pById={}; (profs||[]).forEach(p=>pById[p.id]=p);
  const region=state.adminRegion;
  const dRegion=id=>{ const d=id&&dById[id]; return d?(d.state||null):null; };
  // Which region does this ROW belong to? In order:
  //   1. the linked store's state — spend at a NY store is NY spend, whoever logged it;
  //   2. the row's own `state`, stamped from the logger's region when it was created —
  //      this is what keeps general/unlinked work in the region it was actually done in;
  //   3. the logger's current region, only for old rows with no state at all.
  // Reading the row (not the person's CURRENT region) is what lets someone move between
  // regions without dragging their history with them: Keelin's FL hours stay in the FL
  // report after she becomes a CA BA, and her new CA work lands in CA.
  const rowRegion=(row,dispId)=>dRegion(dispId) || (row&&row.state) || personRegion(pById[row&&row.ba_id]) || null;
  const keep=(row,dispId)=>region==='all' || rowRegion(row,dispId)===region;
  // person-level fallback, still needed where there is no row in hand
  const inRegion=ba_id=>region==='all' || (pById[ba_id]&&personRegion(pById[ba_id])===region);
  const baName=ba_id=>(pById[ba_id]&&pById[ba_id].full_name)||'BA';
  const agg={}, items={}, evItems=[];   // dispensary_id|'none' -> totals / item list; evItems = expense shares with an event
  const ensure=k=>{ agg[k]=agg[k]||{mile:0,exp:0,card:0,labor:0,laborSales:0}; items[k]=items[k]||[]; };
  (trips.data||[]).forEach(t=>{ if(!keep(t,t.dispensary_id)) return; const k=t.dispensary_id||'none'; ensure(k); agg[k].mile+=Number(t.amount||0);
    items[k].push({kind:'trip',id:t.id,ba_id:t.ba_id,date:t.trip_date,ba:baName(t.ba_id),disp:(dById[k]&&dById[k].name)||'',
      start_label:t.start_label,dest_label:t.dest_label,label:t.dest_label||'',miles:t.miles,method:t.method,
      start_odo:t.start_odo,end_odo:t.end_odo,note:t.note,status:t.status,amount:Number(t.amount||0)}); });
  const dnm=id=>(id&&dById[id])?dById[id].name:'';
  (exps.data||[]).forEach(x=>{ const A=Number(x.amount||0), names=dispIds(x).map(dnm).filter(Boolean);
    dispSplit(x,A).forEach(({id,share,n})=>{ if(!keep(x,id)) return; const k=id||'none'; ensure(k); agg[k][isCoPaid(x.payment)?'card':'exp']+=share;
      const it={kind:'exp',id:x.id,ba_id:x.ba_id,date:x.expense_date,ba:isBooks(x)?BOOKS_OWNER:baName(x.ba_id),disp:dnm(id),dispNames:names,splitN:n,alSplit:!!(x.alloc&&x.alloc.length),
        vendor:x.vendor||'',category:x.category,payment:x.payment,receipt:x.receipt_path||'',note:x.note,status:x.status,amount:share,fullAmount:A,
        event:x.event_name||'',books:isBooks(x)};
      items[k].push(it); if(it.event) evItems.push(it); }); });
  (hrs.data||[]).forEach(h=>{ const A=Number(h.amount||0), H=Number(h.hours||0), names=dispIds(h).map(dnm).filter(Boolean);
    dispSplit(h,A).forEach(({id,share,n})=>{ if(!keep(h,id)) return; const k=id||'none'; ensure(k); agg[k].labor+=share; if(isSalesHours(h)) agg[k].laborSales+=share;
      items[k].push({kind:'hours',id:h.id,ba_id:h.ba_id,date:h.work_date,ba:baName(h.ba_id),disp:dnm(id),dispNames:names,splitN:n,
        hours:Math.round(H/n*1000)/1000,fullHours:H,rate:h.rate,job:h.job,cat:h.kind,note:h.note,status:h.status,amount:share,fullAmount:A}); }); });
  Object.values(items).forEach(a=>a.sort((p,q)=>(p.date||'').localeCompare(q.date||'')));
  const allItems={}; Object.values(items).forEach(a=>a.forEach(it=>allItems[it.kind+':'+it.id]=it));   // flat lookup for the detail popup
  let rows=Object.entries(agg).map(([k,v])=>({ id:k, name:k==='none'?'⚠ Not linked to a dispensary':(dById[k]?dById[k].name:'(deleted location)'), total:v.mile+v.exp+v.card+v.labor, ...v }))
    .filter(r=>Math.abs(r.total)>=0.005).sort((a,b)=>b.total-a.total);   // a store left negative by a credit stays listed
  const grand=rows.reduce((a,r)=>a+r.total,0), max=rows.reduce((a,r)=>Math.max(a,r.total),0)||1;
  const detailRows=k=>(items[k]||[]).map(it=>repDetailRow(it)).join('');
  const spendBody=`
    <div class="card">
      <h3>Spend by dispensary <span class="muted small">· ${rangeLabel()} · tap to expand</span></h3>
      ${rows.length?rows.map(r=>`
        <div class="repdrow" data-disp="${r.id}" style="padding:9px 0;border-top:1px solid var(--line);cursor:pointer">
          <div class="row" style="justify-content:space-between;align-items:baseline">
            <div class="t" style="font-weight:600${r.id==='none'?';color:var(--yellow)':''}"><span class="caret" style="display:inline-block;width:12px;color:var(--muted)">▸</span>${esc(r.name)}</div>
            <div style="font-weight:750;white-space:nowrap">${money(r.total)}</div>
          </div>
          <div style="height:7px;border-radius:4px;background:var(--panel2);margin:6px 0 5px;overflow:hidden"><div style="height:100%;width:${r.total>0?Math.max(3,Math.round(r.total/max*100)):0}%;background:var(--accent)"></div></div>
          <div class="small muted">${money(r.mile)} mileage · ${money(r.exp)} expenses${Math.abs(r.card)>=0.005?` · 💳 ${money(r.card)} card`:''}${r.labor>0?` · ⏱ ${money(r.labor)} labor${r.laborSales>0?` <span class="muted">(BA ${money(r.labor-r.laborSales)} · Sales ${money(r.laborSales)})</span>`:''}`:''}</div>

    </div>`;

  // Visits: the SAME data reorganized as discrete (BA, store, day) visits — each with
  // its round-trip mileage$, that day's labor$ share, and any expense$ rolled together.
  const visits=buildVisits(trips.data,exps.data,hrs.data,{keep,baName,dnm,homeOf:id=>(pById[id]||{}).base_address||''});
  // Not everything is a store visit — trips/expenses with no store linked are legit
  // (general driving, supplies, non-BA time). Tally them so nothing's lost, framed neutrally.
  const nvTrips=(trips.data||[]).filter(t=>keep(t,null) && !t.dispensary_id);
  const nvExps=(exps.data||[]).filter(x=>keep(x,null) && dispIds(x).length===0);
  const nonVisit={ tripCount:nvTrips.length, tripAmt:nvTrips.reduce((a,t)=>a+Number(t.amount||0),0),
    expCount:nvExps.length, expReimb:nvExps.filter(x=>!isCoPaid(x.payment)).reduce((a,x)=>a+Number(x.amount||0),0),
    expCard:nvExps.filter(x=>isCoPaid(x.payment)).reduce((a,x)=>a+Number(x.amount||0),0) };
  state._visitLookup={}; visits.forEach(v=>{ state._visitLookup[v.key]=v; });
  const visitsBody=visitsCardsHtml(visits, nonVisit);
  // Events: the same expense lines grouped by the event each one is tagged with (a cost synced from the books, or a
  // BA's own row the event sync matched to it). Budget vs actual lives in the events app; this is the field side.
  const evGroups=eventGroups(evItems);
  const eventsBody=eventsCardHtml(evGroups, region);

  const view=['visits','events'].includes(state.repView)?state.repView:'spend';
  const spendCount=rows.filter(r=>r.id!=='none').length;
  m.innerHTML=`
    <div class="card">
      ${rangeControlsHtml()}
      <div class="row" style="margin-top:8px"><div class="small muted grow">Region</div>
        ${adminRegionPicker('regSelRp')}</div>
      <div class="seg" id="repViewSeg" style="margin-top:12px">
        <button data-v="spend" class="${view==='spend'?'on':''}">Spend by dispensary</button>
        <button data-v="visits" class="${view==='visits'?'on':''}">Visits</button>
        <button data-v="events" class="${view==='events'?'on':''}">Events</button>
      </div>
      <div class="totbar" style="margin-top:12px">${view==='spend'
        ? `<div class="tot"><div class="k">Dispensaries</div><div class="v">${spendCount}</div></div><div class="tot sum"><div class="k">Total spend</div><div class="v">${money(grand)}</div></div>`
        : view==='events' ? eventsTotbar(evGroups) : visitsTotbar(visits)}</div>
    </div>
    ${view==='spend'?spendBody:view==='events'?eventsBody:visitsBody}`;
  wireRangeControls(()=>adminReport(m));
  wireRegionButtons('regSelRp', ()=>adminReport(m));
  const seg=$('#repViewSeg'); if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.repView=b.dataset.v; adminReport(m); });
  // dispensary-group expand/collapse is shared by both views (data-disp ↔ data-for)
  m.querySelectorAll('.repdrow').forEach(r=>r.onclick=()=>{ const d=m.querySelector(`.repdetail[data-for="${r.dataset.disp}"]`); if(!d) return;
    d.classList.toggle('hide'); const c=r.querySelector('.caret'); if(c) c.textContent=d.classList.contains('hide')?'▸':'▾'; });
  if(view==='spend'||view==='events'){   // both list the same report lines (repDetailRow)
    m.querySelectorAll('.repitem').forEach(el=>el.onclick=ev=>{ if(ev.target.closest('.reclink')) return;
      const it=allItems[el.dataset.item];
      if(it&&it.ba_id&&it.date&&!it.books) dayAuditSheet(it.ba_id, it.date, el.dataset.item); else reportItemSheet(it); });
    m.querySelectorAll('.reclink').forEach(a=>a.onclick=async ev=>{ ev.stopPropagation(); const u=await signedUrl('receipts',a.dataset.path); u?window.open(u,'_blank'):toast('Receipt unavailable','err'); });
  } else {
    m.querySelectorAll('.visitrow').forEach(el=>el.onclick=()=>visitSheet(state._visitLookup[el.dataset.visit]));
    const vc=$('#visitsCsv'); if(vc) vc.onclick=()=>exportVisitsCSV(visits);
  }
}
// ── Visits: derive discrete (BA × dispensary × day) visits from trips/hours/expenses ──
// A visit = one BA at one real store on one day. Mileage is the round-trip trip amount
// (miles already doubled); labor & expenses are the SAME even-split used by the spend
// report (a row linked to N stores contributes amount/N to each). Rows with no store
// don't form a visit (surfaced as a "complete these" nudge instead).
const isPlaceholderName=n=>/^\*\s/.test(n||'');
function buildVisits(trips, exps, hrs, ctx){
  const {keep,baName,dnm,homeOf}=ctx; const V={};
  const ens=(b,d,dt)=>{ const k=`${b}|${d}|${dt}`;
    if(!V[k]) V[k]={key:k,ba_id:b,disp_id:d,date:dt,ba:baName(b),disp:dnm(d)||'(deleted location)',
      home:(homeOf?homeOf(b):'')||'',
      mile:0,labor:0,laborSales:0,exp:0,card:0,miles:0,laborHrs:0,trips:[],hours:[],expenses:[]};
    return V[k]; };
  (trips||[]).forEach(t=>{ if(!t.dispensary_id||!keep(t,t.dispensary_id)) return;
    const v=ens(t.ba_id,t.dispensary_id,t.trip_date); v.mile+=Number(t.amount||0); v.miles+=Number(t.miles||0); v.trips.push(t); });
  (hrs||[]).forEach(h=>{ const A=Number(h.amount||0), H=Number(h.hours||0);
    dispSplit(h,A).forEach(({id,share,n,hrs:hshare})=>{ if(!id||!keep(h,id)) return; const v=ens(h.ba_id,id,h.work_date);
      v.labor+=share; if(isSalesHours(h)) v.laborSales+=share; v.laborHrs+=(hshare!=null?hshare:H/n); v.hours.push({row:h,share,n}); }); });
  (exps||[]).forEach(x=>{ if(isBooks(x)) return;   // synced from QuickBooks: dollars in Spend/Events, never a visit
    const A=Number(x.amount||0);
    dispSplit(x,A).forEach(({id,share,n})=>{ if(!id||!keep(x,id)) return; const v=ens(x.ba_id,id,x.expense_date);
      if(isCoPaid(x.payment)) v.card+=share; else v.exp+=share; v.expenses.push({row:x,share,n}); }); });
  return Object.values(V).map(v=>({...v,total:v.mile+v.labor+v.exp+v.card})).filter(v=>v.total>0);
}
function visitsTotbar(visits){
  const real=visits.filter(v=>!isPlaceholderName(v.disp));
  const stores=new Set(real.map(v=>v.disp_id)).size, tot=real.reduce((a,v)=>a+v.total,0);
  return `<div class="tot"><div class="k">Stores visited</div><div class="v">${stores}</div></div>
    <div class="tot"><div class="k">Visits</div><div class="v">${real.length}</div></div>
    <div class="tot sum"><div class="k">Visit cost</div><div class="v">${money(tot)}</div></div>`;
}
// '(10/3/26)' at the end of an event name -> '2026-10-03' (legacy folders may carry a 4-digit year); '' when absent
function eventDateOf(name){
  const m=/\((\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})\)\s*$/.exec(String(name||'')); if(!m) return '';
  return `${m[3].length===2?'20'+m[3]:m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
}
// report lines (one per store share, see adminReport) -> one group per event, newest event first. n counts
// expenses, not shares; card / exp split company-paid from reimbursed; books = the part synced from QuickBooks.
function eventGroups(items){
  const g={};
  (items||[]).forEach(it=>{ if(!it||!it.event) return;
    const x=g[it.event]||(g[it.event]={name:it.event,date:eventDateOf(it.event),total:0,card:0,exp:0,books:0,ids:new Set(),items:[]});
    const a=Number(it.amount||0); x.total+=a; if(isCoPaid(it.payment)) x.card+=a; else x.exp+=a; if(it.books) x.books+=a;
    x.ids.add(it.id); x.items.push(it); });
  return Object.values(g).map(({ids,...x})=>({...x, n:ids.size, items:x.items.slice().sort((p,q)=>(p.date||'').localeCompare(q.date||''))}))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'') || b.total-a.total || a.name.localeCompare(b.name));
}
function eventsTotbar(groups){
  const tot=(groups||[]).reduce((a,g)=>a+g.total,0);
  return `<div class="tot"><div class="k">Events</div><div class="v">${(groups||[]).length}</div></div><div class="tot sum"><div class="k">Event spend</div><div class="v">${money(tot)}</div></div>`;
}
function eventsCardHtml(groups, region){
  // a credit from the books (a refund) can leave an event at or below zero: it gets no bar, and a part that nets to
  // under a cent (a charge and its refund) is not listed
  const max=(groups||[]).reduce((a,g)=>Math.max(a,g.total),0)||1, nz=v=>Math.abs(v)>=0.005;
  return `<div class="card">
    <h3>Events <span class="muted small">· ${rangeLabel()} · tap to expand</span></h3>
    ${(groups||[]).length?groups.map((g,i)=>`
      <div class="repdrow" data-disp="ev${i}" style="padding:9px 0;border-top:1px solid var(--line);cursor:pointer">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <div class="t" style="font-weight:600;min-width:0;overflow-wrap:anywhere"><span class="caret" style="display:inline-block;width:12px;color:var(--muted)">▸</span>${esc(g.name)}</div>
          <div style="font-weight:750;white-space:nowrap">${money(g.total)}</div>
        </div>
        <div style="height:7px;border-radius:4px;background:var(--panel2);margin:6px 0 5px;overflow:hidden"><div style="height:100%;width:${g.total>0?Math.max(3,Math.round(g.total/max*100)):0}%;background:var(--accent)"></div></div>
        <div class="small muted">${g.n} expense${g.n!==1?'s':''}${nz(g.card)?` · 💳 ${money(g.card)} company-paid`:''}${nz(g.exp)?` · 💵 ${money(g.exp)} BA reimbursement`:''}${nz(g.books)?` · ${money(g.books)} from the books`:''}</div>
      </div>
      <div class="repdetail hide" data-for="ev${i}" style="padding-left:6px">${g.items.map(it=>repDetailRow(it)).join('')}</div>`).join('')
    :`<p class="muted small" style="margin-top:8px">No expenses tagged with an event${region&&region!=='all'?' in '+esc(region):''} for this range yet. An event cost gets its tag in QuickBooks, and the event sync brings it here.</p>`}
  </div>`;
}
function visitsGroupBy(list){
  const g={}; list.forEach(v=>{ const k=v.disp_id; (g[k]=g[k]||{id:k,name:v.disp,visits:[],total:0,mile:0,labor:0,exp:0,card:0});
    const x=g[k]; x.visits.push(v); x.total+=v.total; x.mile+=v.mile; x.labor+=v.labor; x.exp+=v.exp; x.card+=v.card; });
  return Object.values(g).map(x=>({...x, visits:x.visits.sort((a,b)=>(b.date||'').localeCompare(a.date||''))}))
    .sort((a,b)=>b.total-a.total);
}
function visitsCardsHtml(visits, nonVisit){
  const groups=visitsGroupBy(visits.filter(v=>!isPlaceholderName(v.disp)));
  const overhead=visitsGroupBy(visits.filter(v=>isPlaceholderName(v.disp)));
  const max=groups.reduce((a,g)=>Math.max(a,g.total),0)||1;
  const visitRow=v=>`<div class="item visitrow" data-visit="${v.key}" style="cursor:pointer">
    <div class="ic">🚗</div>
    <div class="grow" style="min-width:0"><div class="t">${fmtDate(v.date)}${v.ba?` · ${esc(v.ba)}`:''}</div>
      <div class="s">🚗 ${money(v.mile)} · ⏱ ${money(v.labor)}${v.exp>0?` · 🧾 ${money(v.exp)}`:''}${v.card>0?` · 💳 ${money(v.card)}`:''}</div></div>
    <div class="amt">${money(v.total)}</div><div class="muted" style="font-size:18px;flex:none;margin-left:6px">›</div></div>`;
  const groupHtml=g=>`
    <div class="repdrow" data-disp="${g.id}" style="padding:9px 0;border-top:1px solid var(--line);cursor:pointer">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div class="t" style="font-weight:600"><span class="caret" style="display:inline-block;width:12px;color:var(--muted)">▸</span>${esc(g.name)}</div>
        <div style="font-weight:750;white-space:nowrap">${money(g.total)}</div></div>
      <div style="height:7px;border-radius:4px;background:var(--panel2);margin:6px 0 5px;overflow:hidden"><div style="height:100%;width:${Math.max(3,Math.round(g.total/max*100))}%;background:var(--accent)"></div></div>
      <div class="small muted">${g.visits.length} visit${g.visits.length>1?'s':''} · avg ${money(g.total/g.visits.length)}/visit · ${money(g.mile)} mileage · ${money(g.labor)} labor${(g.exp+g.card)>0?` · ${money(g.exp+g.card)} expenses`:''}</div>
    </div>
    <div class="repdetail hide" data-for="${g.id}" style="padding-left:6px">${g.visits.map(visitRow).join('')}</div>`;
  const overHtml = overhead.length ? `<div class="card">
      <h3>Non-store labor <span class="muted small">· General / Non-BA activity — not counted as store visits</span></h3>
      ${overhead.map(g=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)"><div>${esc(g.name)} <span class="muted small">· ${g.visits.length} day${g.visits.length>1?'s':''}</span></div><div style="font-weight:700">${money(g.total)}</div></div>`).join('')}
    </div>` : '';
  // Not-a-visit costs are expected — show them plainly (not as errors), and don't lose them.
  const nv=nonVisit||{}, nvItems=(nv.tripCount||0)+(nv.expCount||0);
  const nvTotal=(nv.tripAmt||0)+(nv.expReimb||0)+(nv.expCard||0);
  const nvHtml = nvItems>0 ? `<div class="card">
      <div class="row" style="align-items:baseline"><h3 class="grow" style="margin:0">Not tied to a store visit</h3><div style="font-weight:750;white-space:nowrap">${money(nvTotal)}</div></div>
      <div class="small muted" style="margin-top:4px">Expected — general driving, supplies, or non-BA time. If any were actual visits, link a store on them and they'll roll up above.</div>
      <div class="small" style="margin-top:8px;line-height:1.7">${nv.tripCount>0?`🚗 ${money(nv.tripAmt)} mileage · ${nv.tripCount} trip${nv.tripCount>1?'s':''}`:''}${nv.tripCount>0&&nv.expCount>0?'<br>':''}${nv.expCount>0?`🧾 ${money((nv.expReimb||0)+(nv.expCard||0))} expenses · ${nv.expCount} item${nv.expCount>1?'s':''}`:''}</div>
    </div>` : '';
  return `<div class="card">
    <div class="row" style="align-items:baseline"><h3 class="grow" style="margin:0">Visits <span class="muted small">· ${rangeLabel()} · tap a store, then a visit</span></h3>${groups.length?`<button class="btn ghost sm" id="visitsCsv" title="Each store visit's mileage, labor and expense cost">⬇ Visit costs CSV</button>`:''}</div>
    ${groups.length?groups.map(groupHtml).join(''):`<p class="muted small" style="margin-top:8px">No store visits logged for this range yet.</p>`}
  </div>${overHtml}${nvHtml}`;
}
// one visit's full breakdown — the trip(s), that day's labor share, and any expenses
function visitSheet(v){
  if(!v){ toast('Visit unavailable — reopen the report','err'); return; }
  const kst='font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700';
  const line=(ic,lbl,val,sub)=>`<div class="row" style="justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)"><div><span style="margin-right:7px">${ic}</span>${lbl}${sub?` <span class="muted small">${sub}</span>`:''}</div><div style="font-weight:700;white-space:nowrap">${val}</div></div>`;
  // Each leg reads as a ROUTE (from → to), not just its destination — otherwise the drive
  // home shows only the home address and looks like a mystery second stop. A label matching
  // this BA's own base address renders as "Home" (clearer, and keeps addresses out of shared
  // reports); the leg's kind (Demo / PAD, Travel…) is more useful here than its method.
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const homeN=norm(v.home);
  const place=l=>{ const t=String(l||'').trim(); if(!t) return '—';
    return (homeN && norm(t)===homeN) ? '🏠 Home' : esc(t); };
  const tripLines=v.trips.map(t=>{
    const route=`${place(t.start_label)} → ${place(t.dest_label)}`;
    const bits=[t.miles!=null?`${t.miles} mi`:'', t.kind?esc(t.kind):''].filter(Boolean).join(' · ');
    return `<div class="s" style="padding:4px 0">🚗 ${route}${bits?` <span class="muted">· ${bits}</span>`:''} — <b>${money(t.amount)}</b></div>`;
  }).join('');
  const hourLines=v.hours.map(h=>`<div class="s" style="padding:3px 0">${isSalesHours(h.row)?'💼':'⏱'} ${Math.round((Number(h.row.hours||0)/h.n)*100)/100} hrs${h.row.kind?` · ${esc(h.row.kind)}`:''}${h.n>1?` · split ${h.n} stores`:''}${h.row.source==='salary'?' · salaried':''} — <b>${money(h.share)}</b></div>`).join('');
  const expLines=v.expenses.map(x=>`<div class="s" style="padding:3px 0">🧾 ${esc(x.row.vendor||'Expense')}${isCoPaid(x.row.payment)?' · '+payFlag(x.row.payment)+' company-paid':' · 💵 reimburse'}${x.n>1?` · split ${x.n}`:''} — <b>${money(x.share)}</b></div>`).join('');
  openSheet(`
    <h3 style="margin-bottom:2px">${esc(v.disp)}</h3>
    <div class="small muted">${fmtDate(v.date)}${v.ba?` · ${esc(v.ba)}`:''}</div>
    <div class="card" style="margin:12px 0">
      <div style="text-align:center;margin-bottom:4px"><div class="k" style="${kst}">Total visit cost</div>
        <div style="font-size:24px;font-weight:800;color:var(--accent2)">${money(v.total)}</div></div>
      ${line('🚗','Mileage <span class="muted small">up &amp; back</span>',money(v.mile), v.miles?`${Math.round(v.miles*10)/10} mi`:'')}
      ${line('⏱','Labor'+(v.laborSales>0?` <span class="muted small">BA ${money(v.labor-v.laborSales)} · Sales ${money(v.laborSales)}</span>`:''),money(v.labor), v.laborHrs?`${Math.round(v.laborHrs*100)/100} hrs that day`:'')}
      ${line('🧾','Expenses', v.exp>0?money(v.exp):'<span class="muted">none logged</span>')}
      ${v.card>0?line('💳','Company-paid',money(v.card),'not reimbursed'):''}
    </div>
    ${(tripLines||hourLines||expLines)?`<div class="card"><div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px">What made up this visit</div>${tripLines}${hourLines}${expLines}
      ${expLines?'':'<div class="s muted" style="padding:4px 0">🧾 No expenses were logged against this visit.</div>'}</div>`:''}
    <button class="btn block" id="vDay" style="margin-top:12px">🔍 See this whole day</button>
    <button class="btn ghost block" id="vClose" style="margin-top:8px">Close</button>
  `);
  // the visit is one store's slice of a day — this opens the BA's ENTIRE day (every leg,
  // expense and hour, including anything attributed elsewhere) so a number can be audited
  $('#vDay').onclick=()=>dayAuditSheet(v.ba_id, v.date);
  $('#vClose').onclick=closeSheet;
}

// ── Report → day audit: tap a report line → that BA's WHOLE DAY as the familiar
// bubble tracker, with the tapped item pre-expanded. Tapping any bubble toggles its
// inline detail, so a full day can be audited without leaving the popup.
async function dayAuditSheet(baId, date, focusKey){
  state._sheetReturn=null;               // parent popup — its own close is a plain close
  const [{data:prof},{data:T},{data:E},{data:H}] = await Promise.all([
    supabase.from('profiles').select('full_name,base_address').eq('id',baId).single(),
    supabase.from('trips').select('*').eq('ba_id',baId).eq('trip_date',date),
    supabase.from('expenses').select('*').eq('ba_id',baId).eq('expense_date',date),
    supabase.from('hours').select('*').eq('ba_id',baId).eq('work_date',date),
  ]);
  const trips=(T||[]).filter(t=>t.status!=='rejected').sort((a,b)=>String(a.created_at||a.id).localeCompare(String(b.created_at||b.id)));
  const exps=E||[], hrs=H||[];
  const ctx={ isAdmin: !actingAsBA(), baId, homeAddr: prof?.base_address||'', T:trips, E:exps, H:hrs, per: state.period, onChange(){} };
  const dm=trips.reduce((a,x)=>a+Number(x.amount||0),0), de=exps.reduce((a,x)=>a+Number(x.amount||0),0);
  const dh=hrs.reduce((a,x)=>a+Number(x.hours||0),0), dl=hrs.reduce((a,x)=>a+Number(x.amount||0),0);
  const sum=[dm>0?`🚗 ${money(dm)}`:'', de>0?`🧾 ${money(de)}`:'', dh>0||dl>0?`⏱ ${Math.round(dh*100)/100}h · ${money(dl)}`:''].filter(Boolean).join(' · ');
  openSheet(`
    <h3 style="text-align:center">${esc(prof?.full_name||'')} — ${fmtDate(date)}</h3>
    <div class="small muted" style="text-align:center;margin:-4px 0 10px">${sum||'nothing logged this day'}</div>
    <div id="adHost">${dgBubbles(ctx, date, trips, exps, hrs, [])||'<p class="muted small">No items.</p>'}</div>
    <button class="btn ghost block" id="adClose" style="margin-top:12px">Close</button>`);
  $('#adClose').onclick=closeSheet;
  const host=$('#adHost'); if(!host) return;
  const kv=(k,v)=> (v==null||v==='')?'':`<div class="row" style="justify-content:space-between;gap:12px;padding:4px 0;min-width:0"><span class="muted small" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k}</span><span style="flex:none;max-width:62%;text-align:right;overflow-wrap:break-word">${v}</span></div>`;
  const badge=st=>st?`<span class="badge ${esc(st)}">${esc(st)}</span>`:'';
  const detailFor=(bub)=>{
    if(bub.dataset.daymiles!=null){                       // the day's route: one row per leg
      const legs=trips.map(t=>kv(`${esc(abbrPlace(isHomeAddr(t.start_label,ctx.homeAddr)?'Home':t.start_label,24))} → ${esc(abbrPlace(isHomeAddr(t.dest_label,ctx.homeAddr)?'Home':t.dest_label,24))}`,
        `${t.miles??'—'} mi · ${money(Number(t.amount||0))}${t.kind?' · '+esc(t.kind):''} ${badge(t.status)}`)).join('');
      const ed=`<button class="btn sm ghost block adEdit" data-ed="trip" style="margin-top:8px">✎ Open in the day editor</button>`;
      return legs+ed;
    }
    const k=bub.dataset.k, id=bub.dataset.id;
    if(k==='hours'){
      const x=hrs.find(o=>String(o.id)===String(id)); if(!x) return '';
      let out=kv('Hours', x.source==='salary'?('salaried · '+money(Number(x.amount||0))):hoursHM(Number(x.hours||0)))
        + kv('Pay rate', x.source==='salary'?'—':('$'+Number(x.rate).toFixed(2)+'/hr'))
        + kv('Labor cost', money(Number(x.amount||0))) + kv('Status', badge(x.status));
      const shares=dispSplit(x, Number(x.amount||0));
      if(shares.length && shares[0].hrs!=null) shares.forEach(sh=>out+=kv(esc(dispName(sh.id))+(sh.kind?' · '+esc(sh.kind):''), `${hoursHM(sh.hrs)} · ${money(sh.share)}`));
      else out+=kv('Category', esc(x.kind||''))+kv('Dispensary', esc(dispName(x.dispensary_id||(x.dispensary_ids&&x.dispensary_ids[0]))||'—'));
      out+=kv('Note', esc(x.note||''));
      if(ctx.isAdmin) out+=`<button class="btn sm ghost block adEdit" data-ed="hours" data-id="${esc(id)}" style="margin-top:8px">✎ Edit</button>`;
      return out;
    }
    const x=exps.find(o=>String(o.id)===String(id)); if(!x) return '';
    let out=kv('Vendor', esc(x.vendor||''))+kv('Category', esc(x.category||''))+kv('Event', esc(x.event_name||''))
      + kv('Amount', money(Number(x.amount||0)))+kv('Paid with', payLabel(x.payment))
      + kv('Dispensaries', esc(dispIds(x).map(dispName).join(', ')||'—'))+kv('Status', badge(x.status))+kv('Note', esc(x.note||''));
    out+=kv('Receipt', x.receipt_path?`<a class="reclink" data-path="${esc(x.receipt_path)}" style="cursor:pointer">📄 View receipt</a>`:isBooks(x)?'<span class="muted">in QuickBooks</span>':'<span class="muted">none</span>');
    if(isBooks(x)) out+=`<div class="small muted" style="margin-top:8px">${BOOKS_NOTE}</div>`;
    else if(ctx.isAdmin||x.status==='draft'||x.status==='rejected') out+=`<button class="btn sm ghost block adEdit" data-ed="exp" data-id="${esc(id)}" style="margin-top:8px">✎ Edit</button>`;
    return out;
  };
  host.querySelectorAll('.bub').forEach(bub=>{
    const det=document.createElement('div');
    det.className='audet hide'; det.innerHTML=detailFor(bub);
    bub.insertAdjacentElement('afterend', det);
    bub.onclick=()=>{ det.classList.toggle('hide'); };
  });
  host.querySelectorAll('.reclink').forEach(a=>a.onclick=async ev=>{ ev.stopPropagation();
    const u=await signedUrl('receipts',a.dataset.path); u?window.open(u,'_blank'):toast('Receipt unavailable','err'); });
  host.querySelectorAll('.adEdit').forEach(b=>b.onclick=ev=>{ ev.stopPropagation();
    state._sheetReturn=()=>dayAuditSheet(baId, date, null);   // editor closes → back to this day
    const ed=b.dataset.ed;
    if(ed==='trip'){
      // hand the viewer-aware day editor a proper context for THIS BA's day
      state.grid={ baId, isAdmin:ctx.isAdmin, per:state.period, homeAddr:ctx.homeAddr, T:trips, E:exps, H:hrs, canAdd:false, onChange(){} };
      tripSheet(date, trips[0]||undefined);
    } else if(ed==='hours'){ adminEditItem('hours', b.dataset.id, ()=>{}, hrs.find(o=>String(o.id)===String(b.dataset.id))); }
    else { const x=exps.find(o=>String(o.id)===String(b.dataset.id));
      if(ctx.isAdmin) adminEditItem('exp', b.dataset.id, ()=>{}, x); else fixExpenseSheet(x); }
  });
  // pre-expand the tapped item + bring it into view
  if(focusKey){
    const [fk,fid]=String(focusKey).split(':');
    const target = fk==='trip' ? host.querySelector('.bub[data-daymiles]')
      : host.querySelector(`.bub[data-k="${fk==='exp'?'exp':'hours'}"][data-id="${fid}"]`);
    if(target){ const det=target.nextElementSibling;
      if(det&&det.classList.contains('audet')) det.classList.remove('hide');
      requestAnimationFrame(()=>target.scrollIntoView({block:'center',behavior:'smooth'})); }
  }
}

function exportVisitsCSV(visits){
  const real=visits.filter(v=>!isPlaceholderName(v.disp))
    .sort((a,b)=>(a.disp||'').localeCompare(b.disp) || (a.date||'').localeCompare(b.date));
  const rows=[['Date','BA','Dispensary','Miles','Mileage $','Labor $','Expense $','Card $','Visit total $']];
  real.forEach(v=>rows.push([v.date,v.ba,v.disp,Math.round(v.miles*10)/10,v.mile.toFixed(2),v.labor.toFixed(2),v.exp.toFixed(2),v.card.toFixed(2),v.total.toFixed(2)]));
  const byD={}; real.forEach(v=>{ const g=byD[v.disp]=byD[v.disp]||{mile:0,labor:0,exp:0,card:0,total:0,n:0};
    g.mile+=v.mile; g.labor+=v.labor; g.exp+=v.exp; g.card+=v.card; g.total+=v.total; g.n++; });
  rows.push([]); rows.push(['— Per dispensary (BA spend to port) —']);
  Object.entries(byD).sort((a,b)=>b[1].total-a[1].total).forEach(([d,g])=>
    rows.push(['',`${g.n} visit${g.n>1?'s':''}`,d,'',g.mile.toFixed(2),g.labor.toFixed(2),g.exp.toFixed(2),g.card.toFixed(2),g.total.toFixed(2)]));
  const csv=rows.map(r=>r.map(c=>{ let s=String(c??''); if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`visits_${rangeLabel().replace(/\W+/g,'_')}.csv`; a.click();
}

// admin: tap a line item in the Spend-by-dispensary report → full detail (note, category, route, odometer, receipt)
function reportItemSheet(it){
  if(!it){ toast('Item unavailable — reopen the report','err'); return; }
  const trip=it.kind==='trip', hours=it.kind==='hours';

  const icon=trip?'🚗':hours?'⏱':'🧾';
  const isSplit=it.splitN>1;
  const fullHours = hours ? (it.fullHours!=null?it.fullHours:it.hours) : null;
  const title=trip?(it.dest_label||it.disp||'Trip'):hours?(`${fullHours} hours`+((it.cat||it.job)?` · ${it.cat||it.job}`:'')):(it.vendor||'Expense');
  let body='';
  body+=kv('BA', esc(it.ba||''));

  body+=kv(isSplit?'Dispensaries':'Dispensary',
    isSplit ? `${(it.dispNames||[]).map(esc).join(', ')} <span class="muted">(${it.alSplit?'split by amount':'split '+it.splitN+' ways'})</span>`
            : (it.disp?esc(it.disp):'<span style="color:var(--yellow)">⚠ Not linked</span>'));
  if(trip){
    body+=kv('Route', (it.start_label||it.dest_label)?`${esc(it.start_label||'—')} → ${esc(it.dest_label||'—')}`:'');
    body+=kv('Miles', it.miles!=null?`${it.miles} mi${it.method?' · '+esc(it.method):''}`:'');
    body+=kv('Odometer', (it.start_odo!=null||it.end_odo!=null)?`${it.start_odo??'—'} → ${it.end_odo??'—'}`:'');
    body+=kv('Mileage reimbursement', money(it.amount));
  } else if(hours){
    body+=kv('Category', it.cat?esc(it.cat):(it.job?esc(it.job):''));
    body+=kv('Hours', isSplit?`${fullHours} total · ${it.hours} to this store`:`${fullHours}`);

  } else {
    body+=kv('Category', it.category?esc(it.category):'');
    body+=kv('Event', it.event?esc(it.event):'');
    body+=kv('Paid with', isCoPaid(it.payment)?payLabel(it.payment)+' (not reimbursed)':'💵 Reimburse the BA');
    body+=kv('Amount', isSplit?`${money(it.fullAmount)} total · ${money(it.amount)} here`:money(it.amount));
  }
  body+=kv('Status', it.status?`<span class="badge ${it.status}">${it.status}</span>`:'');
  const noteBlock=it.note
    ? `<label class="fl">Note</label><div class="card" style="margin:2px 0 0;padding:10px;background:var(--panel2);white-space:pre-wrap">${esc(it.note)}</div>`
    : `<div class="small muted" style="margin-top:12px">No note added.</div>`;
  const recBtn=(!trip && !hours && it.receipt)?`<button class="btn block" id="riRec" style="margin-top:12px">📄 View receipt</button>`:'';
  openSheet(`
    <h3 style="margin-bottom:2px">${icon} ${esc(title)}</h3>
    <div class="small muted">${money(it.fullAmount!=null?it.fullAmount:it.amount)}</div>
    <div style="margin-top:10px">${body}</div>
    ${noteBlock}
    ${recBtn}
    ${it.books?`<div class="small muted" style="margin-top:12px">${BOOKS_NOTE}</div>`
      :!actingAsBA()?`<button class="btn primary block" id="riEdit" style="margin-top:12px">✎ Edit</button>`:''}
    <button class="btn ghost block" id="riClose" style="margin-top:8px">Close</button>
  `);
  $('#riClose').onclick=closeSheet;
  const riE=$('#riEdit'); if(riE) riE.onclick=()=>adminEditItem(it.kind, it.id, ()=>drawAdmin());   // admin-only: re-render the report after a save
  const rec=$('#riRec'); if(rec) rec.onclick=async()=>{ const u=await signedUrl('receipts',it.receipt); u?window.open(u,'_blank'):toast('Receipt unavailable','err'); };
}
// Admin: edit any single trip/expense in any period (incl. past/approved). onSaved re-renders the caller.
async function adminEditItem(kind, id, onSaved, preloaded){
  const table = kind==='trip' ? 'trips' : kind==='hours' ? 'hours' : 'expenses';
  const x = preloaded || (await supabase.from(table).select('*').eq('id',id).single()).data;
  if(!x){ toast('Could not load item — try again','err'); return; }
  if(kind==='exp' && isBooks(x)) return itemDetailSheet('exp', x);   // synced from QuickBooks: fix it in the books
  const isNew = !!x._new;   // add-bubble create mode: insert on save instead of update
  const write = patch => isNew
    ? supabase.from(table).insert({ ...patch, ba_id:x.ba_id, period_id:x.period_id, status:x.status||'draft', state:x.state }).select('*').single()
    : supabase.from(table).update(patch).eq('id',id).select('*').single();
  // Delete lives in the same popup (trips + expenses; hours sync from Gusto). RLS is the
  // real gate — BAs may delete own draft/rejected rows, admins anything in their region.
  const delBtn = (!isNew && kind!=='hours')
    ? `<button class="btn ghost block" id="aDel" style="margin-top:8px;color:var(--red);border-color:color-mix(in srgb, var(--red) 40%, transparent)">🗑 Delete ${kind==='trip'?'trip':'expense'}</button>` : '';
  // approved items get an escape hatch back to review (per-item; also un-stamps the submission)
  let canUndo = !isNew && x.status==='approved';
  // Gusto-imported hours arrive approved with NO submission — undoing one would strand it
  // at 'submitted' (no “Approve all” exists to bring it back). Only offer undo on hours
  // when the period's submission really is stamped approved.
  if(canUndo && kind==='hours'){
    const {data:sub}=await supabase.from('submissions').select('status').eq('ba_id',x.ba_id).eq('period_id',x.period_id).maybeSingle();
    canUndo = !!(sub && sub.status==='approved');
  }
  const undoBtn = canUndo
    ? `<button class="btn ghost block" id="aUndo" style="margin-top:8px">↩ Undo approval <span class="muted small">— back to submitted</span></button>` : '';
  const wireUndo = () => { const u=$('#aUndo'); if(!u) return; u.onclick=async()=>{
    const per=(state.periods||[]).find(p=>p.id===x.period_id);
    if(per && per.status==='closed' && !confirm('This pay period is CLOSED — it may already be paid out. Undo approval anyway?')) return;
    busy(u,true);
    const r=await undoApproval(table, id);
    busy(u,false);
    if(!r) return;
    closeSheet(); onSaved&&onSaved({...x, status:'submitted'});
  }; };
  const wireDel = () => { const d=$('#aDel'); if(!d) return; d.onclick=async()=>{
    if(!confirm(`Delete this ${kind==='trip'?'trip':'expense'}? This can’t be undone.`)) return;
    busy(d,true);
    // .select('id') so an RLS-filtered no-op errors instead of silently "succeeding"
    const {data,error}=await supabase.from(table).delete().eq('id',id).select('id');
    busy(d,false);
    if(error) return errToast(error,'Couldn’t delete');   // in QuickBooks: the guard's own words
    if(!data||!data.length) return toast('Couldn’t delete — this item is locked.','err');
    closeSheet(); toast(kind==='trip'?'Trip deleted':'Expense deleted','ok');
    onSaved&&onSaved({_deleted:true, id});
  }; };
  // mirror itemIssues(): flag the same missing fields the To-do lists, so opening an
  // item straight from a To-do row shows exactly what needs filling, highlighted red
  const hasDisp = x.dispensary_id || (x.dispensary_ids && x.dispensary_ids.length)
    || (kind==='trip' && isNonstoreKind(x.kind));   // non-store trips need no location (mirrors itemIssues)
  const needMiles = kind==='trip' && !(Number(x.miles)>0);
  const iss = itemIssues({...x, _k: kind==='trip'?'trip':kind==='hours'?'hours':'exp'});
  const issHint = iss.length ? `<div class="small" style="margin-top:2px;color:var(--yellow)">Highlighted below: needs ${iss.join(', ')}.</div>` : '';
  // trips: hide the category-placeholder locations (Lead / Non-BA / General BA) — the
  // Category field covers those now. A trip still LINKED to one keeps it listed+selected.
  const allDisp = [...(state.dispensaries||[])]
    .filter(d=> kind!=='trip' || x.dispensary_id===d.id || !NONSTORE_PLACE_RE.test(d.name||''))
    .sort(dispSort);
  const dispOpts = `<option value="">— none —</option>`+allDisp.map(d=>`<option value="${d.id}" data-search="${esc(dispSearchText(d))}" ${x.dispensary_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('');
  if(kind==='trip'){
    openSheet(`
      <h3>${isNew?'Add trip':'Edit trip'} ${isNew?'':`<span class="badge ${x.status}" style="vertical-align:middle">${x.status}</span>`}</h3>${issHint}
      <label class="fl">Date</label><input id="aDate" type="date" value="${x.trip_date||''}">
      <label class="fl">Location <span class="muted">(the dispensary this trip is associated with)</span></label><select id="aDisp" data-searchable class="${!hasDisp?'needs':''}">${dispOpts}</select>
      <label class="fl">Category</label><select id="aKind" data-searchable class="${!x.kind?'needs':''}"><option value="">Pick…</option>${laborKindNames().map(k=>`<option ${x.kind===k?'selected':''}>${esc(k)}</option>`).join('')}${x.kind&&!laborKindNames().includes(x.kind)?`<option selected>${esc(x.kind)}</option>`:''}</select>
      <label class="fl">Starting location</label><input id="aStart" value="${esc(x.start_label||'')}" autocomplete="off" class="${needMiles&&!x.start_label?'needs':''}">
      <label class="fl">Destination</label><input id="aDest" value="${esc(x.dest_label||'')}" autocomplete="off" class="${needMiles&&!x.dest_label?'needs':''}">
      <div class="row">
        <div class="grow"><label class="fl">Miles</label><input id="aMiles" type="number" inputmode="decimal" value="${x.miles!=null?x.miles:''}" class="${needMiles?'needs':''}"></div>
        <div class="grow"><label class="fl">Method</label><select id="aMethod" data-searchable><option value="manual" ${x.method==='manual'?'selected':''}>manual</option><option value="odometer" ${x.method==='odometer'?'selected':''}>odometer</option></select></div>
      </div>
      <button type="button" id="aRoutes" class="btn ghost sm block" style="display:none;margin-top:8px"></button>
      <label class="row" style="gap:8px;font-size:13px;margin-top:10px"><input type="checkbox" id="aRound" ${x.roundtrip?'checked':''} style="width:auto;min-height:auto"> Round trip (there &amp; back) <span class="muted">— toggling adjusts the miles</span></label>
      <label class="fl">Note</label><textarea id="aNote" rows="2">${esc(x.note||'')}</textarea>
      <div id="aMsg" class="small" style="margin-top:8px;color:var(--red);min-height:1px"></div>
      <button class="btn primary block" id="aSave" style="margin-top:8px">Save changes</button>
      <button class="btn ghost block" id="aNext" style="margin-top:8px">＋ Save &amp; add next leg</button>
      <button class="btn ghost block" id="aCancel" style="margin-top:8px">Cancel</button>
      ${undoBtn}
      ${delBtn}
    `);
    $('#aCancel').onclick=closeSheet; wireUndo(); wireDel(); wireNewRetailerSelect($('#aDisp'));
    $('#aDisp').addEventListener('change',()=>{ if($('#aDisp').value) clearNeed($('#aDisp')); const k=$('#aKind'); const def=$('#aDisp').value&&defaultKindForDisp($('#aDisp').value); if(k && !k.value && def){ k.value=def; k.dispatchEvent(new Event('change',{bubbles:true})); clearNeed(k); } });   // office → General BA Activity/Admin (change keeps picker label in sync)
    $('#aKind').addEventListener('change',()=>{ if($('#aKind').value) clearNeed($('#aKind')); });
    // as the user fills a missing field, drop its red highlight (searchified selects clear via the picker)
    ['#aStart','#aDest','#aMiles'].forEach(s=>{ const el=$(s); if(el) el.addEventListener('input',()=>{ if(String(el.value).trim()) clearNeed(el); }); });
    // address/store suggestions while typing, same as the BA popups; picking a store
    // as the destination also fills the Location select (change syncs its picker label)
    const aSetDisp=id=>{ const d=$('#aDisp'); if(d && d.value!==id){ d.value=id; d.dispatchEvent(new Event('change',{bubbles:true})); clearNeed(d); } };
    // 🏠 = the TRIP OWNER's saved home (not the admin's) — top suggestion for their trips
    const {data:ownerP}=await supabase.from('profiles').select('base_address').eq('id',x.ba_id).maybeSingle();
    const ownerHome=ownerP?.base_address||null;
    // normalize Start/Destination to canonical store names + set Location (the destination
    // store, or the START store on a going-home leg) so it reads consistently and the
    // return-home mileage still counts toward that dispensary. Only fills an EMPTY Location.
    function aRelink(){
      const r=resolveTripPlaces($('#aStart').value.trim(), $('#aDest').value.trim(), ownerHome);
      if(r.startCanon!==$('#aStart').value) $('#aStart').value=r.startCanon;
      if(r.destCanon!==$('#aDest').value) $('#aDest').value=r.destCanon;
      if(r.linkDispId && !$('#aDisp').value) aSetDisp(r.linkDispId);
    }
    attachGridTypeahead($('#aStart'), ()=>{ aRelink(); }, {home:ownerHome});
    attachGridTypeahead($('#aDest'),  r=>{ if(r.dispId) aSetDisp(r.dispId); aRelink(); aRecalc(); }, {home:ownerHome});
    $('#aDest').addEventListener('blur', ()=>{ aRelink(); aRecalc(); });
    $('#aStart').addEventListener('blur', ()=>{ aRelink(); aRecalc(); });
    aRelink();   // on open: normalize an existing leg's fields + fill Location if it was blank
    // LIVE distance: fill Miles the moment both ends are known (no need to hit Save first).
    // Skips if miles already entered; office/store dest uses the saved address the router trusts.
    let aBusy=false;
    async function aRecalc(){
      if(aBusy || Number($('#aMiles').value)>0) return;

      if(!s || !(de||dId)) return;

        // the fallback when Destination is blank.
        const destStore = de ? matchDispByText(de) : null;
        if(de){ if(destStore) body.dispensary_id=destStore; else body.dest_address=dispAddrByText(de)||de; }
        else if(dId){ body.dispensary_id=dId; }
        const r=await callFn('calc-distance', body);
        if(applyRoutes(r, ()=>$('#aRound').checked, $('#aMiles'), $('#aRoutes'))){
          clearNeed($('#aMiles'));
          $('#aMsg').textContent=''; const n=r.routes.length;
          toast(`Distance: ${$('#aMiles').value} mi${n>1?` · ${n} routes — tap "Choose route"`:''}`,'ok');
        } else { const msg=(r&&r.message)||'Couldn’t auto-calculate — type the miles.'; $('#aMsg').style.color='var(--yellow)'; $('#aMsg').textContent=msg; }
      }catch(_){ $('#aMsg').textContent=''; }
      aBusy=false;
    }
    $('#aDisp').addEventListener('change', ()=>setTimeout(aRecalc,0));
    // flipping round-trip doubles/halves the miles in place — admin sees (and can correct) the result before saving
    $('#aRound').onchange=()=>{ const m=Number($('#aMiles').value);
      if(m>0) $('#aMiles').value=Math.round(m*($('#aRound').checked?2:0.5)*100)/100;
      else aRecalc(); };
    setTimeout(aRecalc,0);   // if the trip opened with both ends set (like this one) and no miles, calc now
    $('#aSave').onclick=()=>doSave(false);
    { const nb=$('#aNext'); if(nb) nb.onclick=()=>doSave(true); }   // save, then chain into the day's next leg
    async function doSave(chainNext){
      const btn=chainNext?$('#aNext'):$('#aSave');

      // store NAME becomes its saved address; the Location select wins as destination.

          else { const msg=(r&&r.message)||'Couldn’t auto-calculate — type the miles.'; $('#aMsg').style.color='var(--yellow)'; $('#aMsg').textContent=msg; toast(msg,'err'); }
        }catch(e){ toast('Distance service unavailable — type the miles.','err'); }

      }
      const patch={ trip_date:$('#aDate').value||x.trip_date, dispensary_id:$('#aDisp').value||null, kind:$('#aKind').value||null,
        start_label:start||null, dest_label:dest||null,
        miles:Number($('#aMiles').value)||null, method:$('#aMethod').value, miles_source:$('#aMethod').value,
        roundtrip:$('#aRound').checked, note:$('#aNote').value.trim()||null };
      busy(btn,true);
      const {data,error}=await write(patch);
      busy(btn,false);
      if(error){ $('#aMsg').style.color='var(--red)'; $('#aMsg').textContent=qboRefusal(error)||('Couldn’t save: '+error.message); return; }
      const keepRet=chainNext?state._sheetReturn:null; if(chainNext) state._sheetReturn=null;
      closeSheet(); toast(isNew?'Trip added ✓':'Trip updated ✓','ok'); onSaved&&onSaved(data);
      // chain the day like the BA multi-leg logger: fresh popup, same BA + date,
      // start pre-filled with the leg we just saved's destination
      if(chainNext) state._sheetReturn=keepRet;
      if(chainNext) adminEditItem('trip', null, onSaved, { _new:true, ba_id:x.ba_id,
        period_id:(data&&data.period_id)||x.period_id, status:'draft', state:x.state, roundtrip:false,
        trip_date:(data&&data.trip_date)||patch.trip_date, start_label:(data&&data.dest_label)||patch.dest_label||'' });
    }
  } else if(kind==='hours'){
    openSheet(`
      <h3>Edit hours <span class="badge ${x.status}" style="vertical-align:middle">${x.status}</span></h3>${issHint}
      <label class="fl">Date</label><input id="aDate" type="date" value="${x.work_date||''}">

      <label class="fl">Dispensaries <span class="muted">(tap all stores this shift covered — cost splits evenly)</span></label>
      ${dispChipsHtml(x.dispensary_ids||(x.dispensary_id?[x.dispensary_id]:[]), {all:true, id:'aDispChips', needs:!hasDisp})}
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="fl">Hours</label><input id="aHours" type="number" inputmode="decimal" step="0.001" value="${x.hours!=null?x.hours:''}"></div>
        <div class="grow"><label class="fl">Pay rate</label><input value="$${Number(x.rate).toFixed(2)}/hr" disabled style="opacity:.65"></div>
      </div>
      <div class="small muted" style="margin-top:4px">Labor cost = hours × rate (auto). Change the rate on the BA's profile in Settings.</div>
      <label class="fl">Note</label><textarea id="aNote" rows="2">${esc(x.note||'')}</textarea>
      <div id="aMsg" class="small" style="margin-top:8px;color:var(--red);min-height:1px"></div>
      <button class="btn primary block" id="aSave" style="margin-top:8px">Save changes</button>
      <button class="btn ghost block" id="aCancel" style="margin-top:8px">Cancel</button>
      ${undoBtn}
    `);
    $('#aCancel').onclick=closeSheet; wireUndo(); wireDispChips('aDispChips');
    $('#aSave').onclick=async()=>{
      const btn=$('#aSave');
      const patch={ work_date:$('#aDate').value||x.work_date, kind:$('#aKind').value, ...dispPatch('aDispChips'),
        hours:Number($('#aHours').value)||0, note:$('#aNote').value.trim()||null };
      busy(btn,true);
      const {data,error}=await supabase.from('hours').update(patch).eq('id',id).select('*').single();
      busy(btn,false);
      if(error){ $('#aMsg').textContent='Couldn’t save: '+error.message; return; }
      closeSheet(); toast('Hours updated ✓','ok'); onSaved&&onSaved(data);
    };
  } else {
    const cats=catOptions(x.category);
    const needAmt=!(Number(x.amount)>0), needRec=!x.receipt_path && x.status!=='approved';   // same as itemIssues()
    const recUrl=x.receipt_path?await signedUrl('receipts',x.receipt_path):null;
    openSheet(`
      <h3>${isNew?'Add expense':'Edit expense'} ${isNew?'':`<span class="badge ${x.status}" style="vertical-align:middle">${x.status}</span>`}</h3>${issHint}
      <label class="fl">Date</label><input id="aDate" type="date" value="${x.expense_date||''}">
      <label class="fl">Vendor</label><input id="aVendor" value="${esc(x.vendor||'')}">
      <div class="row">
        <div class="grow"><label class="fl">Amount</label><input id="aAmt" type="number" inputmode="decimal" step="0.01" value="${x.amount!=null?x.amount:''}" class="${needAmt?'needs':''}"></div>
        <div class="grow"><label class="fl">Category</label><select id="aCat">${cats}</select></div>
      </div>
      <label class="fl">Paid with</label><select id="aPay" data-searchable>${PAYMENTS.map(([v,l])=>`<option value="${v}" ${x.payment===v?'selected':''}>${l}</option>`).join('')}</select>
      <label class="fl">Dispensaries <span class="muted">(tap all stores)</span></label>
      ${dispChipsHtml(x.dispensary_ids||(x.dispensary_id?[x.dispensary_id]:[]), {all:true, id:'aDispChips', needs:!hasDisp})}
      ${splitEditorHtml('aSplit')}

    `);

    $('#aAmt')?.addEventListener('input', ()=>aSplit&&aSplit.refresh());
    { const a=$('#aAmt'); if(a) a.addEventListener('input',()=>{ if(Number(a.value)>0) clearNeed(a); }); }
    let receiptPath=x.receipt_path||null, recChanged=false;
    const aRec=$('#aRec'); if(aRec) aRec.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
      toast('Uploading receipt…');
      try{ receiptPath=await uploadPhoto('receipts',f); recChanged=true; toast('Receipt attached','ok'); }
      catch(err){ toast('Upload failed — try again','err'); } };
    $('#aSave').onclick=async()=>{
      const btn=$('#aSave');
      const aspl=aSplit?aSplit.result():{alloc:null};
      if(aspl.error){ $('#aMsg').textContent=aspl.error; return; }
      const patch={ expense_date:$('#aDate').value||x.expense_date, vendor:$('#aVendor').value.trim()||null,

        ...dispPatch('aDispChips'), alloc:aspl.alloc, note:$('#aNote').value.trim()||null };
      if(recChanged){ patch.receipt_path=receiptPath; patch.ocr_raw=null; }   // new image → stale OCR no longer applies
      busy(btn,true);
      const {data,error}=await write(patch);
      busy(btn,false);
      if(error){ $('#aMsg').textContent=qboRefusal(error)||('Couldn’t save: '+error.message); return; }   // in QuickBooks: the guard's own words
      closeSheet(); toast(isNew?'Expense added ✓':'Expense updated ✓','ok'); onSaved&&onSaved(data);
    };
