}

async function adminDash(m){
  m.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  await reloadPeriods();
  const per=state.period;
  const all=isAllPeriods(per);
  const perQ=q=>all?q:q.eq('period_id',per.id);   // 'All pay periods' = no period filter
  const [{data:profs}, trips, exps, subs] = await Promise.all([
    supabase.from('profiles').select('*').order('full_name'),
    per?perQ(supabase.from('trips').select('ba_id,amount,status')):{data:[]},
    per?selectExpenses('ba_id,amount,status,payment,receipt_path', perQ):{data:[]},
    per?perQ(supabase.from('submissions').select('*')):{data:[]},
  ]);
  const T=trips.data||[],E=exps.data||[],S=subs.data||[];
  const byBa={};
  (profs||[]).forEach(b=>byBa[b.id]={p:b,mile:0,exp:0,card:0,items:0,receipts:0,status:'open',subN:0});
  T.forEach(x=>{ const b=byBa[x.ba_id]; if(b){ b.mile+=Number(x.amount||0); b.items++; } });
  E.forEach(x=>{ if(isBooks(x)) return; const b=byBa[x.ba_id]; if(b){ if(isCoPaid(x.payment)) b.card+=Number(x.amount||0); else b.exp+=Number(x.amount||0); b.items++; if(x.receipt_path) b.receipts++; } });
  S.forEach(s=>{ const b=byBa[s.ba_id]; if(b){ if(!all) b.status=s.status; if(['submitted','approved'].includes(s.status)) b.subN++; } });
  // every field worker (BAs + regional admins like Maddy), plus anyone else who logged something
  let rows=Object.values(byBa).filter(r=> isFieldWorker(r.p) || r.items>0 );
  if(state.adminRegion!=='all') rows=rows.filter(r=>personRegion(r.p)===state.adminRegion);
  const grand=rows.reduce((a,r)=>a+r.mile+r.exp,0);
  m.innerHTML=`
    <div class="card">
      <div class="row"><div class="small muted grow">Pay period</div>${periodPicker(()=>adminDash(m))}</div>
      ${(state.qboCanBook && !all && per)?`<div id="payPaidD" data-start="${esc(per.start_date)}"></div>`:''}
      <div class="row" style="margin-top:8px"><div class="small muted grow">Region</div>
        ${adminRegionPicker('regSel')}</div>
      <div class="totbar" style="margin-top:12px">
        <div class="tot"><div class="k">People</div><div class="v">${rows.length}</div></div>
        <div class="tot"><div class="k">${all?'Periods in':'Submitted'}</div><div class="v">${all?rows.reduce((a,r)=>a+r.subN,0):rows.filter(r=>r.status==='submitted').length}</div></div>
        <div class="tot sum"><div class="k">${all?'All-time total':'Period total'}</div><div class="v">${money(grand)}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Team activity <span class="muted small">— tap to see uploads</span></h3>
      ${rows.length?rows.map(r=>`
        <div class="item" data-ba="${r.p.id}" style="cursor:pointer">
          <div class="ic">${(r.p.full_name||'?').slice(0,1).toUpperCase()}</div>
          <div class="grow" style="min-width:0">
            <div class="t" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.p.full_name||r.p.email)}${r.p.id===state.session.user.id?' <span class="pill">you</span>':''}</div>
            ${r.p.region?`<div class="s">${esc(r.p.region)}</div>`:''}
          </div>
          ${all ? (r.subN>0?`<span class="pill" style="margin-left:8px;flex:none">${r.subN} period${r.subN>1?'s':''} in</span>`:'')
                : (r.status&&r.status!=='open'?`<span class="badge ${r.status}" style="margin-left:8px;flex:none">${r.status}</span>`:'')}
          <div style="font-weight:700;white-space:nowrap;margin-left:8px;flex:none">${money(r.mile+r.exp)}</div>
        </div>`).join(''):`<p class="muted small">No people${state.adminRegion!=='all'?' in '+state.adminRegion:''} yet — add them in Settings.</p>`}
    </div>`;
  m.querySelectorAll('[data-ba]').forEach(el=>el.onclick=()=>adminBaDetail(el.dataset.ba));
  wireRegionButtons('regSel', ()=>adminDash(m));
  if(state.qboCanBook && !all && per) payrollPaidPeriodNote(per, 'payPaidD');   // bookers: Gusto already paid this period
}

// live-refresh the admin review header + day-grid summary after an inline edit
function admRefreshTotals(){

  const lab=H.reduce((a,x)=>a+Number(x.amount||0),0), th=H.reduce((a,x)=>a+Number(x.hours||0),0);
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('admMile',money(mile)); set('admReimb',money(mile+reimb)); set('admExp',money(reimb)); set('admLabor',money(lab)); set('admHrs',th.toFixed(2));
  dgRefreshSummary();
  const tb=document.getElementById('admTodo'); if(tb) tb.innerHTML=todoCard([...T.map(x=>({...x,_k:'trip'})),...E.map(x=>({...x,_k:'exp'})),...H.map(x=>({...x,_k:'hours'}))],false,true);
}

// Approve a BA's period. Normal path (subStatus 'submitted'): the BA pressed “Submit
// period” → approve exactly their submitted items. Admin-override path (anything else):
// the BA never submitted — the boss approves anyway, sweeping draft+submitted items,
// and the submissions row is UPSERTED because it may not exist yet. Rejected items are
// never swept either way.
// Submit a period ON BEHALF of a BA. Managers (Maddy for NY) chase their own team, and
// doing it for someone was previously only possible by accident — an admin submitting in
// preview mode locked the BA out of their own period with no notice, which is exactly how
// Terrance lost his last Friday. So this does three things the ad-hoc route didn't:
// names the person and what's being submitted, records WHO submitted it, and emails them.
async function submitForBA(baId, periodId, T, E, H, subStatus){
  const who=state._admProf && state._admProf.id===baId ? state._admProf : {};
  const first=(who.full_name||'this BA').split(' ')[0];
  const draft=x=>x.status==='draft';
  const items=[...(T||[]).filter(draft).map(x=>({...x,_k:'trip'})), ...(E||[]).filter(draft).map(x=>({...x,_k:'exp'}))];
  if(!items.length) return toast(`${first} has nothing waiting to submit.`);
  const todoN=items.filter(x=>itemIssues(x).length).length;
  const mile=(T||[]).filter(x=>draft(x)||x.status==='submitted').reduce((a,x)=>a+Number(x.amount||0),0);
  const {reimb,card}=expSplit((E||[]).filter(x=>draft(x)||x.status==='submitted'));
  const labor=(H||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  // a period that hasn't ended yet is the trap: submitting freezes them out of the days
  // they haven't worked yet (Amanda did this to herself twice on day 1 of 14)
  const per=(state.periods||[]).find(p=>p.id===periodId);
  const left = per ? Math.round((new Date(per.end_date+'T12:00')-new Date(todayISO()+'T12:00'))/864e5) : 0;
  const warn = left>0
    ? `\n\n⚠ This period doesn't end until ${fmtDate(per.end_date)} — ${left} day${left===1?'':'s'} left. ${first} won't be able to add anything after this unless you reopen it.`
    : `\n\n${first} won't be able to edit this period after you submit it.`;
  if(!confirm(`Submit this period for ${who.full_name||'this BA'}?\n\n`
    + `${items.length} item${items.length===1?'':'s'} · ${money(mile)} mileage + ${money(reimb)} expenses = ${money(mile+reimb)} to reimburse`
    + `${todoN?`\n\n⚠ ${todoN} still have open to-dos (missing receipt, miles, or location).`:''}`
    + `${warn}\n\nThey'll be emailed that you did this.`)) return;
  const { error:e1 }=await supabase.from('submissions').upsert({ba_id:baId, period_id:periodId, status:'submitted',
    submitted_at:new Date().toISOString(), submitted_by:state.session.user.id,
    totals:{mileage:mile, expenses:reimb, company_card:card, labor, total:mile+reimb}},{onConflict:'ba_id,period_id'});
  if(e1) return toast('Submit failed: '+e1.message,'err');
  const { error:e2 }=await supabase.from('trips').update({status:'submitted',reject_note:null}).eq('ba_id',baId).eq('period_id',periodId).eq('status','draft');
  if(e2) return toast('Submit failed: '+e2.message,'err');
  const { error:e3 }=await supabase.from('expenses').update({status:'submitted',reject_note:null}).eq('ba_id',baId).eq('period_id',periodId).eq('status','draft');
  if(e3) return toast('Submit failed: '+e3.message,'err');
  // The BA is emailed by the submissions trigger (it sees submitted_by <> ba_id) — a
  // period going read-only without warning is how this went wrong before.
  toast(`Submitted for ${first} — they've been emailed`,'ok'); closeSheet(); drawAdmin();
}
// opts.reopen: open this person's sheet again afterwards ("Approve late items")
async function approveSubmission(baId,periodId,T,E,H,subStatus,opts={}){
  const sweep = subStatus!=='submitted';
  // 'approved': items that came in, or went back for review, after the period was approved ("Approve late items", for
  // every admin). Only draft and submitted items change; the submission stays approved (its guard refuses un-approving a
  // period that is in QuickBooks) and its totals are re-stamped.
  const late = subStatus==='approved';
  const take = x=> x.status==='submitted' || (sweep && x.status==='draft');
  const pend=[...(T||[]).filter(take).map(x=>({...x,_k:'trip'})), ...(E||[]).filter(take).map(x=>({...x,_k:'exp'}))];
  const todoN=pend.filter(x=>itemIssues(x).length).length;
  const perL=(state.periods||[]).find(p=>p.id===periodId);
  if(late){
    const pendH=(H||[]).filter(x=>x.status==='draft'||x.status==='submitted');
    if(!pend.length && !pendH.length) return toast('Nothing new to approve.','err');
    const lateAmt=pend.reduce((a,x)=>a+((x._k==='exp'&&isCoPaid(x.payment))?0:Number(x.amount||0)),0);
    const what=[pend.length?`${pend.length} item${pend.length===1?'':'s'}`:'', pendH.length?`${pendH.length} hours entr${pendH.length===1?'y':'ies'}`:''].filter(Boolean).join(' and ');
    if(!confirm(`Approve the ${what} in ${perL?.label||'this period'} not approved yet${pend.length?` (${money(lateAmt)} to reimburse)`:''}? Everything already approved stays as it is.${todoN?`\n\n⚠ ${todoN} still ${todoN===1?'has':'have'} open to-dos.`:''}`)) return;
  } else if(sweep && !pend.length && !(H||[]).some(x=>x.status==='draft'||x.status==='submitted')){
    if(!confirm(`Mark ${perL?.label||'this period'} done for this person with nothing to claim? That stops their daily reminder for it.`)) return;
  } else {
  // Approving a period that hasn't ended freezes the stamped totals while the BA can still
  // log more days — those land outside the approved snapshot. Name the risk with the real
  // end date rather than letting it happen silently (Drew, Jul 21: approved 10 days early).
  const per=(state.periods||[]).find(p=>p.id===periodId) || (state.period&&state.period.id===periodId?state.period:null);
  const endsOn=per&&per.end_date, openDays = endsOn ? Math.round((new Date(endsOn+'T12:00')-new Date(todayISO()+'T12:00'))/864e5) : 0;
  const earlyWarn = openDays>0
    ? `\n\n⚠ This period doesn’t end until ${fmtDate(endsOn)} — ${openDays} day${openDays===1?'':'s'} left. Anything logged after you approve won’t be in these totals.`
    : '';
  const msg = sweep
    ? `This BA never pressed “Submit period” — approve ALL their current items for this period (${pend.length} item${pend.length===1?'':'s'}, including drafts)?${todoN?`\n\n⚠ ${todoN} still have open to-dos (missing receipt, miles, or location).`:''}${earlyWarn}`
    : `Approve all submitted items for this BA this period?${todoN?`\n\n⚠ ${todoN} still have open to-dos.`:''}${earlyWarn}`;
  if(!confirm(msg)) return;
  }
  // the stamped TOTALS cover the whole period as it stands AFTER this click (already-
  // approved + what's being approved now) — never just this batch, or an undo→re-approve
  // cycle would overwrite the totals with just the one redone item's amounts.
  const apr=x=>x.status==='approved'||take(x);
  const subMile=(T||[]).filter(apr).reduce((a,x)=>a+ +x.amount,0);
  const {reimb:subExp, card:subCard}=expSplit((E||[]).filter(apr));
  // labor snapshot covers ALL the period's hours (they're payroll-managed, usually already approved on import)
  const subLabor=(H||[]).reduce((a,x)=>a+Number(x.amount||0),0);
  const sts = sweep?['draft','submitted']:['submitted'];
  const { error:e1 }=await supabase.from('trips').update({status:'approved'}).eq('ba_id',baId).eq('period_id',periodId).in('status',sts);
  if(e1) return errToast(e1,'Approve failed');
  const { error:e2 }=await supabase.from('expenses').update({status:'approved'}).eq('ba_id',baId).eq('period_id',periodId).in('status',sts);
  if(e2) return errToast(e2,'Approve failed');
  const { error:eH }=await supabase.from('hours').update({status:'approved'}).eq('ba_id',baId).eq('period_id',periodId).in('status',['draft','submitted']);
  if(eH) return errToast(eH,'Approve failed');
  const { error:e3 }=await supabase.from('submissions').upsert({ba_id:baId, period_id:periodId, status:'approved',
    approved_by:state.session.user.id, approved_at:new Date().toISOString(),
    totals:{mileage:subMile,expenses:subExp,company_card:subCard,labor:subLabor,total:subMile+subExp}}, {onConflict:'ba_id,period_id'});
  if(e3) return errToast(e3,'Approve failed');
  toast('Approved','ok');
  if(opts.reopen){ drawAdmin(); return adminBaDetail(baId); }
  closeSheet(); drawAdmin();
}

// Whole-period unapprove — the true inverse of “Approve all”: every approved item
// (trips, expenses, hours) returns to 'submitted' and the submission is un-stamped,
// so the BA is back in the review queue and “Approve all” reappears.
async function unapprovePeriod(baId, periodId){
  const per=(state.periods||[]).find(p=>p.id===periodId);
  if(per && per.status==='closed' && !confirm('This pay period is CLOSED — it may already be paid out. Unapprove anyway?')) return;
  // Was this a REAL BA submission, or an admin override-approve of a never-submitted
  // period? submitted_at is only set when the BA presses Submit; approveSubmission's
  // sweep upsert leaves it null. If it was a sweep, unapprove must return items to
  // 'draft' (not 'submitted') so the BA can still edit/delete them — RLS locks BAs out
  // of submitted rows — and the submission goes back to 'open', not 'submitted'.
  const {data:sub}=await supabase.from('submissions').select('submitted_at').eq('ba_id',baId).eq('period_id',periodId).maybeSingle();
  const wasSwept = !sub || !sub.submitted_at;
  const itemStatus = wasSwept ? 'draft' : 'submitted';
  const subStatus  = wasSwept ? 'open'  : 'submitted';
  if(!confirm(`Undo this approval? Every approved item this period goes back to “${itemStatus}”${wasSwept?' so the BA can finish it':' for re-review'} (nothing is deleted).`)) return;
  // The submission goes first. A period that is in QuickBooks (or on its way there) refuses this, in the guard's words,
  // and then nothing has changed; moving the items first would leave some back in review under a period still approved.
  const {error:e2}=await supabase.from('submissions').update({status:subStatus, approved_by:null, approved_at:null})
    .eq('ba_id',baId).eq('period_id',periodId).eq('status','approved');
  if(e2) return errToast(e2,'Unapprove failed');
  // trips/expenses follow itemStatus (draft on a sweep-undo so the BA regains edit access);
  // hours are payroll-managed + never BA-editable → 'submitted' regardless (re-approve restores them)
  const half=e=>{ toast(`The period is back in review, but some items are still approved (${qboRefusal(e)||e.message}). Approve all puts them back together.`,'err',9000);
    try{ drawAdmin(); }catch(_){} adminBaDetail(baId); };
  for(const t of ['trips','expenses']){
    const {error}=await supabase.from(t).update({status:itemStatus}).eq('ba_id',baId).eq('period_id',periodId).eq('status','approved');
    if(error) return half(error);
  }
  const {error:eh}=await supabase.from('hours').update({status:'submitted'}).eq('ba_id',baId).eq('period_id',periodId).eq('status','approved');
  if(eh) return half(eh);
  toast('Approval undone — period is back in review','ok');
  try{ drawAdmin(); }catch(_){}
  adminBaDetail(baId);
}
// Undo an approval: the item drops back to 'submitted' for re-review. If the whole
// submission had already been stamped approved, it reverts too — so the BA's card
// reads "awaiting approval" again and the “Approve all” button comes back.
// The item goes first, as it always has. An item in QuickBooks is refused by its own guard (its words, and nothing
// changes). When the item went back but the period's stamp is refused because part of the period is in QuickBooks, the
// period stays approved and the item waits on its own: "Approve late items" on the person's sheet takes it again.
async function undoApproval(table, id){
  const {data:rows, error}=await supabase.from(table).update({status:'submitted'}).eq('id',id).select('ba_id,period_id');
  if(error || !rows || !rows.length){
    const g=qboRefusal(error);
    toast(g || 'Couldn’t undo approval'+(error?': '+error.message:''),'err', g?9000:2600);
    return null;
  }
  const r=rows[0];
  if(r.ba_id && r.period_id){
    const {error:e2}=await supabase.from('submissions')
      .update({status:'submitted', approved_by:null, approved_at:null})
      .eq('ba_id',r.ba_id).eq('period_id',r.period_id).eq('status','approved');
    if(e2 && qboRefusal(e2)){
      toast(`The period stays approved because part of it ${qboPartWords(qboRefusal(e2))}; this item went back to submitted.`, 'ok', 9000);
      try{ if(state.profile && state.profile.role==='admin') drawAdmin(); }catch(_){}
      return r;
    }
    if(e2){ toast('Item is back to submitted, but the period is still stamped approved — reopen and retry.','err'); return r; }
  }
  toast('Approval undone — back to submitted','ok');
  // the Dashboard/Review page BEHIND the popups was drawn pre-undo — refresh it so the
  // BA reappears in the awaiting-approval queue (mirrors approveSubmission's drawAdmin)
  try{ if(state.profile && state.profile.role==='admin') drawAdmin(); }catch(_){}
  return r;
}
// Link each unlinked hours entry to the dispensaries of that day's trips (else expenses).
async function autoLinkHours(baId, periodId, H){
  const un=(H||[]).filter(x=>!x.dispensary_id && !(x.dispensary_ids&&x.dispensary_ids.length));
  if(!un.length) return toast('All hours are already linked','ok');
  const dates=un.map(x=>x.work_date);
  // NB: trips has only the single dispensary_id (no dispensary_ids array column) —
  // selecting a missing column makes PostgREST reject the whole query silently here
  const [{data:T},{data:E}]=await Promise.all([
    supabase.from('trips').select('trip_date,dispensary_id').eq('ba_id',baId).in('trip_date',dates),
    supabase.from('expenses').select('expense_date,dispensary_id,dispensary_ids').eq('ba_id',baId).in('expense_date',dates),
  ]);
  const idsOn=(rows,dateField,d)=>{ const s=new Set();
    (rows||[]).filter(r=>r[dateField]===d).forEach(r=>dispIds(r).forEach(id=>s.add(id))); return [...s]; };
  let linked=0, skipped=0;
  for(const h of un){
    const ids = idsOn(T,'trip_date',h.work_date);
    const eIds = ids.length?ids:idsOn(E,'expense_date',h.work_date);
    if(!eIds.length){ skipped++; continue; }
    const { error }=await supabase.from('hours').update({dispensary_ids:eIds, dispensary_id:eIds[0]}).eq('id',h.id);
    if(error){ toast(error.message,'err'); return; }
    linked++;
  }
  toast(linked?`Linked ${linked} shift${linked>1?'s':''}${skipped?` · ${skipped} had no same-day activity`:''}`:'No same-day trips/expenses to match','ok');
  if(linked) adminBaDetail(baId);
}

// bundle every uploaded file for the viewed BA/period — expense receipts + trip
// odometer/route photos — into one ZIP (per-file downloads get browser-blocked).
// JSZip loads lazily from the CDN only when the button is used.
async function downloadAllAttachments(prof, per, T, E, btn){
  const files=[]; const seen=new Set();
  const push=(bucket,path,name)=>{ if(!path||seen.has(bucket+':'+path)) return; seen.add(bucket+':'+path); files.push({bucket,path,name}); };
  (E||[]).forEach(x=>push('receipts', x.receipt_path,
    `${x.expense_date}_receipt_${(x.vendor||'expense').replace(/[^\w-]+/g,'-').slice(0,30)}_${Number(x.amount||0).toFixed(2)}`));
  (T||[]).forEach(t=>{ const d=(t.dest_label||'trip').replace(/[^\w-]+/g,'-').slice(0,24);
    push('odometer', t.start_photo, `${t.trip_date}_odo-start_${d}`);
    push('odometer', t.end_photo,   `${t.trip_date}_odo-end_${d}`); });
  if(!files.length) return toast('No attachments in this period','err');
  busy(btn,true); toast(`Fetching ${files.length} attachment${files.length>1?'s':''}…`);
  try{
    const { default: JSZip } = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm');
    const zip=new JSZip(); let ok=0; const used=new Set();
    for(const f of files){
      try{
        const u=await signedUrl(f.bucket, f.path); if(!u) continue;
        const r=await fetch(u); if(!r.ok) continue;
        const ext=(String(f.path).match(/\.(\w{2,4})$/)||[])[1]||'jpg';
        let nm=`${f.name}.${ext}`, i=2;
        while(used.has(nm)) nm=`${f.name}_${i++}.${ext}`;
        used.add(nm);
        zip.file(nm, await r.blob()); ok++;
      }catch(_e){ /* skip unfetchable file, keep going */ }
    }
    if(!ok){ busy(btn,false); return toast('Couldn’t fetch any attachments','err'); }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`attachments_${(prof.full_name||prof.email||'ba').replace(/\W+/g,'_')}_${per?per.start_date:'all-periods'}.zip`;
    a.click();
    toast(ok===files.length?`Downloaded ${ok} attachment${ok>1?'s':''} ✓`:`Downloaded ${ok}/${files.length} (some files were unavailable)`,'ok');
  }catch(e){ toast('Download failed: '+(e&&e.message||e),'err'); }
  busy(btn,false);
}

  H.forEach(x=>rows.push(['Labor',x.work_date,dispLabel(x)||dispName(x.dispensary_id),x.kind||x.job||'',`Payroll`,x.hours??'',x.rate??'',Number(x.amount||0).toFixed(2),x.status,x.note||'']));
  const mile=T.reduce((a,x)=>a+ +x.amount,0); const {reimb,card}=expSplit(E);
  const labor=H.reduce((a,x)=>a+Number(x.amount||0),0), laborHrs=H.reduce((a,x)=>a+Number(x.hours||0),0);

// With the person's adjustments (ba_reimb_adjustments rows): a payroll that paid this amount plus their adjustments on that

// The Review list's tag for one person and period (cents = what is still bookable): a booking in flight, what is in

// why "Book all ready" leaves someone out ([] = they go in): a period it can still book, linked with a class, nothing to

  const { plan=null, person=null, setup=null, warnings=[], date=null, tooOld=false, keys=null } = o||{};

  if(tooOld) return [QBO_OLD_WHY];
  if(!person || !person.company) return ['not linked to anyone in Gusto yet'];
  if(!setup) return ['their QuickBooks company isn’t set up yet'];
  const why=[];
  if(person.problem) why.push(String(person.problem));
  if(!plan.cls) why.push('no class yet');
  const picks=plan.lines.filter(l=>l.pick);
  if(picks.length) why.push(picks.map(l=>l.category).join(', ')+(picks.length===1?' needs':' need')+' an account');
  if((warnings||[]).length) why.push(`QuickBooks has ${warnings.length===1?'a JE':warnings.length+' JEs'} to check first`);

  else if(date.how!=='payday' && date.how!=='paid') why.push('Gusto has no payday for this period, so its date is a guess: check it on the card');

// Pure: no DOM, no database; tests/ba-payroll.test.mjs runs it with the QBO PLAN MODEL block (qboCents, qboUsd,
// qboPaidTotal) and the payment helpers (isCoPaid, isBooks). The Payroll list (ba/docs/qbo-reimbursements.md, "Payroll list
// and the after-submit check"), for bookers: one list per Gusto check date, and for each person what to type into Gusto
// that day: their approved claim for the period the check pays, plus their adjustments on that payday
// (ba_reimb_adjustments, supabase/ba-payroll-checks.sql). Below zero it can't be typed, so the rest is carried to a later
// payday. Money in whole cents; the inputs are the tables' rows as read.
const PAYROLL_COS=['wtny','filifera','wafgus'];

const PAYROLL_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const payrollIso=v=>typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v);

function payrollMD(iso,today,year){

const payrollWd=iso=>payrollIso(iso) ? PAYROLL_WD[new Date(iso+'T12:00:00Z').getUTCDay()] : '';
// a check date: "Wed Dec 9" (with the year when it isn't today's)
const payrollDay=(iso,today)=>payrollIso(iso) ? `${payrollWd(iso)} ${payrollMD(iso,today)}` : '';

const payrollRange=(start,end,today)=>`${payrollMD(start,today)} to ${payrollMD(end,today)}`;

function payrollRangeFull(start,end){

}
// "A", "A and B", "A, B and C"
const payrollNames=list=>{ const l=(list||[]).filter(Boolean); return l.length<2 ? (l[0]||'') : l.slice(0,-1).join(', ')+' and '+l[l.length-1]; };

function payrollPacific(ts){

  return d.toLocaleString('en-US',{ timeZone:'America/Los_Angeles', weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })
    .replace(/[  ]/g,' ').replace(/^([A-Za-z]+),/,'$1')+' Pacific';
}
const payrollInt=v=>{ const n=Number(v); return Number.isFinite(n) ? Math.round(n) : 0; };

const payrollSigned=c=>(c>0?'+':'')+qboUsd(c);

// The day a ba_payroll_checks row belongs to: its payroll's payday in ba_qbo_paydays (Gusto can move a check date), else its

function payrollCheckDay(c,paydays){

  return (r && r.check_date) || (c && c.check_date) || '';

  (paydays||[]).forEach(r=>{ if(r && PAYROLL_CO[r.company] && payrollIso(r.check_date)) days.add(r.check_date); });
  (checks||[]).forEach(c=>{ if(c && PAYROLL_CO[c.company]){ const d=payrollCheckDay(c,paydays); if(payrollIso(d)) days.add(d); } });

// "Wed Dec 9 · pays Nov 21 to Dec 4 · not run yet", saying which companies when they differ, and when the Mac's check of a
// payroll that day found something
function payrollChoiceLabel(day,cos,today){

    reg.forEach(c=>{ const k=(c.start||'')+'|'+(c.end||''); if(!ranges.has(k)) ranges.set(k,[]); ranges.get(k).push(c.name); });
    const pays=[...ranges].map(([k,names])=>{ const [s,e]=k.split('|'), r=(s && e) ? payrollRange(s,e,today) : 'an unknown period';

// the check date the list opens on: one whose payroll the Mac's check found problems in while it can still be cancelled in

function payrollDefaultDay(choices,today,now){

    const hot=l.map(c=>({ day:c.day, dl:Math.min(...c.cos.filter(x=>x.problem && x.deadline).map(x=>Date.parse(x.deadline)).filter(ms=>Number.isFinite(ms) && ms>now)) }))

// One person's claim for one period, in cents. approved: the approved claim (approved trips, plus approved expenses the

function payrollClaim(T,E){

  const age=(x,y)=>String(x.a.created_at||'').localeCompare(String(y.a.created_at||'')) || String(x.a.id).localeCompare(String(y.a.id));
  const fit=m.filter(x=>-x.left>=short).sort(age)[0];
  if(fit) return { short, from:fit.a.id, cents:-short, to:next, whole:true };
  const big=m.slice().sort((x,y)=>(x.left-y.left) || age(x,y))[0];
  return { short, from:big.a.id, cents:big.left, to:next, whole:false };
}

// A person's earlier approved claims and what became of them before `day` (the Mac's ledger, ba-payroll-watch-core.mjs):
// each claim whose own payday ran before `day` (at most PAYROLL_LATE_DAYS before it) is paid there or later, or still owed:
// that payday paid less than the claim plus its adjustments, and no later payroll paid that amount (or everything owed
// then) on top of what it owed itself; an off-cycle payment settles one the same way. One more than the Mac: an adjustment
// added for the claim (its source_check_date the claim's payday: the Payroll list's "Add ... to this payday") on a payday
// after that and before `day` settles that much of it.
//   claims [{start, end, approved}]  approved claims (cents above zero) of periods that start before `before`
//   runs   qboRuns entries, each with paid = what it paid this person (cents)
//   offs   [{check_date, paid}]      what the other payrolls the Mac checked paid this person
//   adjOn  run => this person's adjustments on that payday (cents)
//   tagged (ownDay, run) => what this person's adjustments on that payday add for the claim whose payday was ownDay (cents)
// -> [{start, end, approved, ownDay, owed, partly, paidOn}] oldest first; owed above zero and paidOn null: still owed (owed is
// what is left of it)
const PAYROLL_LATE_DAYS=120;
function payrollLedger(o){
  const { claims=[], runs=[], offs=[], adjOn=()=>0, tagged=()=>0, day='', before='', lateDays=PAYROLL_LATE_DAYS } = o||{};
  if(!payrollIso(day)) return [];
  const from=qboAddDays(day,-lateDays);
  const ran=(runs||[]).filter(r=>r && r.processed && payrollIso(r.check_date) && r.check_date<day);
  const items=[];
  for(const c of claims||[]){
    if(!(c && c.approved>0 && c.start<before)) continue;
    const own=ran.find(r=>r.period_start===c.start);
    if(!own || own.check_date<from) continue;
    const got=own.paid||0, owed=c.approved+adjOn(own)-got;
    items.push({ start:c.start, end:c.end, approved:c.approved, ownDay:own.check_date, owed:owed>0 ? owed : 0, partly:owed>0 && got>0, paidOn:owed>0 ? null : own.check_date });
  }
  items.sort((a,b)=>a.start.localeCompare(b.start));
  // adjustments added for a claim on a later payday (run or not) before `day`; what they used isn't counted again below
  const usedOn=new Map();
  for(const i of items){
    if(!(i.owed>0)) continue;
    for(const r of (runs||[]).filter(x=>x && x.check_date>i.ownDay && x.check_date<day).sort((a,b)=>a.check_date.localeCompare(b.check_date))){
      const t=Math.min(i.owed, Math.max(0, tagged(i.ownDay, r)||0)); if(!t) continue;
      i.owed-=t; usedOn.set(r.check_date, (usedOn.get(r.check_date)||0)+t);
      if(!i.owed){ i.paidOn=r.check_date; break; }
    }
  }
  const claimOf=start=>(claims||[]).find(c=>c && c.start===start);
  const events=[];
  for(const r of ran){
    const c=claimOf(r.period_start), own=c && c.approved>0 ? c.approved : 0, adj=adjOn(r), got=r.paid||0, rest=adj-(usedOn.get(r.check_date)||0);
    // what it paid beyond what it owed for its own period: a late claim; an adjustment it paid can settle one too
    events.push({ day:r.check_date, regular:true, amounts:[got-own-adj, rest>0 && got>=own+adj ? rest : 0] });
  }
  for(const x of offs||[]) if(x && payrollIso(x.check_date) && x.check_date<day && x.paid>0) events.push({ day:x.check_date, regular:false, amounts:[x.paid] });
  events.sort((a,b)=>a.day.localeCompare(b.day) || (a.regular===b.regular ? 0 : a.regular ? -1 : 1));
  for(const ev of events){
    const open=items.filter(i=>i.owed>0 && !i.paidOn && (ev.regular ? i.ownDay<ev.day : i.start<=ev.day));
    if(!open.length) continue;
    for(const amt of ev.amounts){
      if(!(amt>0)) continue;
      const total=open.reduce((s,i)=>s+i.owed,0);
      if(amt===total){ open.forEach(i=>{ i.paidOn=ev.day; }); break; }
      const one=open.find(i=>i.owed===amt);
      if(one){ one.paidOn=ev.day; break; }
    }
  }
  return items;
}
// a late claim in words: "their approved claim for Aug 15 to Aug 28, which the Wed Sep 2 payroll didn't pay"
const payrollLateWords=(i,today)=>i.partly
  ? `the rest of their approved claim for ${payrollRange(i.start,i.end,today)}, which the ${payrollDay(i.ownDay,today)} payroll paid only in part`
  : `their approved claim for ${payrollRange(i.start,i.end,today)}, which the ${payrollDay(i.ownDay,today)} payroll didn’t pay`;
// the reason an "Add ... to this payday" adjustment carries
const payrollLateReason=(i,today)=>i.partly ? `Rest of the claim for ${payrollRange(i.start,i.end,today)}, paid only in part on ${payrollMD(i.ownDay,today)}`
  : `Late claim for ${payrollRange(i.start,i.end,today)}, not paid on ${payrollMD(i.ownDay,today)}`;

// a row's line about Gusto once the payroll ran and what it paid was read: {ok, main, note}; null before. While the Mac's
// check of the payroll expected what the app says now, its verdict and words (a warn line is a warning, a note or an ok is a
// check mark); otherwise (no check, or the app changed since) the page's own: equal to Type in Gusto, or Type in Gusto plus
// a late claim still owed, is a check mark, anything else a warning with how far off it is.
function payrollPaidWords(r,today){
  if(!r || !r.paid) return null;
  const p=r.paid.cents, t=r.type, l=r.paid.line||null;
  const main=p ? `Gusto paid ${qboUsd(p)}` : 'Gusto paid no reimbursement';
  const text=(l && l.text) ? String(l.text) : '';
  const raw=Number.isInteger(r.raw) ? r.raw : t;
  if(l && (l.tone==='ok' || l.tone==='info' || l.tone==='warn') && (!Number.isInteger(l.expected_cents) || l.expected_cents===raw))
    return { ok:l.tone!=='warn', main, note:l.tone==='ok' ? '' : text };
  const mac=(text && l.tone!=='ok') ? text+((Number.isInteger(l.expected_cents) && l.expected_cents!==t) ? ` The app now says ${qboUsd(t)}.` : '') : '';
  if(p===t) return { ok:true, main, note:mac };
  const late=(r.late||[]).filter(i=>i.rest>0), extra=p-t, lateSum=late.reduce((s,i)=>s+i.rest,0);
  const paidLate=extra>0 ? (extra===lateSum ? late : late.filter(i=>i.rest===extra).slice(0,1)) : [];
  if(paidLate.length) return { ok:true, main, note:`That’s Type in Gusto plus ${qboUsd(extra)}, ${paidLate.length>1 ? 'their late claims' : payrollLateWords(paidLate[0], today||r.today||'')}.` };
  return { ok:false, main, note:mac || (p>t ? `That’s ${qboUsd(p-t)} more than Type in Gusto.` : `That’s ${qboUsd(t-p)} less than Type in Gusto.`) };
}

// every person's claim per period from the rows read: Map 'ba_id|period_id' -> {approved, waiting} (payrollClaim's rules)
function payrollClaimsBy(T,E){
  const by=new Map(), slot=x=>{ const k=x.ba_id+'|'+x.period_id; let v=by.get(k); if(!v){ v={ T:[], E:[] }; by.set(k,v); } return v; };
  (T||[]).forEach(t=>{ if(t && t.ba_id && t.period_id) slot(t).T.push(t); });
  (E||[]).forEach(e=>{ if(e && e.ba_id && e.period_id) slot(e).E.push(e); });
  const out=new Map(); by.forEach((v,k)=>out.set(k, payrollClaim(v.T,v.E)));
  return out;
}

// One company's part of a check date: its payday, the Mac's check of it, a row for everyone ba_qbo_people links to the

// not in those rows (outside), and the other payrolls the Mac checked that day (offs). null when the company has no payroll
// that day. T, E and subs are the rows of the periods the day pays and of the earlier ones (for late claims).
//   A payday's adjustments are those whose day belongs to it (qboAdjHome: also one added before Gusto moved this payday).
//   The claim counts in Type in Gusto once it is approved, as the Mac's check counts it; approved items under a claim that

function payrollCompany(o){

  const per=start ? (periods||[]).find(p=>p && p.start_date===start) || null : null;

  const all=(adjustments||[]).filter(payrollLive);
  const live=all.filter(a=>a.company===company && !(floor && String(a.check_date)<floor));
  const next=regular ? payrollNextOpen(company,day,paydays,checks) : null;
  const profBy=new Map((profiles||[]).filter(Boolean).map(p=>[p.id,p]));
  const gName=uuid=>{ const g=(gustoPeople||[]).find(x=>x && x.company===company && x.gusto_uuid===uuid); return g ? String(g.name||'') : ''; };
  const age=(a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || String(a.id).localeCompare(String(b.id));
  const claimsBy=payrollClaimsBy(T,E), subBy=new Map((subs||[]).filter(Boolean).map(s=>[s.ba_id+'|'+s.period_id, s]));
  const hist=start ? (periods||[]).filter(x=>x && payrollIso(x.start_date) && x.start_date<start) : [];

  const paidOn=(r,uuid)=>{ if(!uuid || !r.processed) return 0;
    if(r.check) return (Array.isArray(r.check.lines) ? r.check.lines : []).filter(l=>l && low(l.gusto_uuid)===low(uuid)).reduce((s,l)=>s+Math.max(0,payrollInt(l.paid_cents)),0);
    return qboPaidTotal(r.row && r.row.paid ? r.row.paid[uuid] : null); };

    .filter(l=>l && l.kind==='offcycle' && low(l.gusto_uuid)===low(uuid) && payrollInt(l.paid_cents)>0).map(l=>({ check_date:c.check_date, paid:payrollInt(l.paid_cents) })));
  const rows=[];
  if(regular) (people||[]).filter(p=>p && p.company===company && p.profile_id).forEach(p=>{
    const prof=profBy.get(p.profile_id) || {};
    const claim=(per && claimsBy.get(p.profile_id+'|'+per.id)) || { approved:0, waiting:0 };
    const state=payrollClaimState(per ? subBy.get(p.profile_id+'|'+per.id) : null);
    const counted=state==='approved' ? claim.approved : 0, held=state==='approved' ? 0 : claim.approved;
    const theirs=live.filter(a=>a.profile_id===p.profile_id), mine=theirs.filter(a=>home(a.check_date)).sort(age);
    const adj=mine.map(a=>{ const fam=payrollCancelFamily(all,a.id);
      const canCancel=open && fam.every(f=>payrollDayOpen(f.company,f.check_date,paydays,checks));
      const gone=fam.some(f=>!(paydays||[]).some(r=>r && r.company===f.company && r.check_date===f.check_date));
      return { id:a.id, cents:payrollInt(a.cents), reason:String(a.reason||''), carried:!!a.carried_from, day:a.check_date, moved:a.check_date!==day,

      const tagFor=(ownDay,h)=>theirs.filter(a=>payrollInt(a.cents)>0 && a.source_check_date===ownDay && h(a.check_date)).reduce((s,a)=>s+payrollInt(a.cents),0);
      const items=claims.length ? payrollLedger({ claims, runs:runs.map(r=>({ ...r, paid:paidOn(r,p.gusto_uuid) })), offs:offsOf(p.gusto_uuid),

        return { ...i, here, later, rest:Math.max(0, i.owed-here-later.reduce((s,x)=>s+x.cents,0)), reason:payrollLateReason(i,today) };
      });
    }
    let paid=null;
    if(src==='check'){
      const l=lines.find(x=>!used.has(x) && x.profile_id && x.profile_id===p.profile_id)
        || lines.find(x=>!used.has(x) && !x.profile_id && p.gusto_uuid && x.gusto_uuid===p.gusto_uuid) || null;
      if(l) used.add(l);

    } else if(src==='payday'){

      approved:claim.approved, counted, held, waiting:claim.waiting, adj, adjust, raw, type, short:raw<0 ? -raw : 0, settled,
      carry:(raw<0 && open) ? payrollCarry({ raw, adjustments:mine, all, next, movable:a=>payrollDayOpen(company,a.check_date,paydays,checks) }) : null,
      late, lateRest:late.reduce((s,i)=>s+i.rest,0), paid, quiet:!has };
    r.pw=payrollPaidWords(r,today); r.same=r.pw ? r.pw.ok : null;

    lines:(Array.isArray(c.lines) ? c.lines : []).filter(l=>l && payrollInt(l.paid_cents))
      .map(l=>({ name:String(l.name || gName(l.gusto_uuid) || 'Someone in Gusto'), cents:payrollInt(l.paid_cents), text:String(l.text||''), tone:String(l.tone||'') })) }));

    period:per ? { id:per.id, label:String(per.label||'') } : null, src, next,
    check:check ? { status:String(check.status||''), summary:String(check.summary||''), checkedAt:check.checked_at||null,

// Live adjustments no company's list shows: no payday the app has takes their day (after the last payday read, or Gusto

function payrollPaidPersonNote(rows,person,today){
  if(!person || !person.company || !person.gusto_uuid) return payrollPaidNote(rows,today);
  const r=(rows||[]).find(x=>x && x.company===person.company && x.processed && payrollIso(x.check_date));
  if(!r) return '';
  const c=qboPaidTotal(r.paid ? r.paid[person.gusto_uuid] : null);
  return `The ${payrollDay(r.check_date,today)} payroll, which pays this period, paid them ${c ? qboUsd(c) : 'no reimbursement'}.`;
}

/* ── Book in QuickBooks: the page side (only when state.qboCanBook) ──
   The page asks, the Mac books, the page shows the result (ba/docs/qbo-reimbursements.md). It reads only the ba_qbo_*
   tables (bookers only) and writes only through their RPCs; QuickBooks itself is never called from the page. */
const QBO_CO={ filifera:'Filifera LLC', wtny:'WTNY', wafgus:'Waf & Gus LLC' };   // until the Mac's ba_qbo_setup names them
const qboCoName=(co,setupBy)=>(setupBy && setupBy[co] && setupBy[co].label) || QBO_CO[co] || co || '';
const qboPlural=(n,one,many)=>`${n} ${n===1?one:(many||one+'s')}`;
const qboReceiptWords=n=>`CSV + ${qboPlural(n,'receipt')}`;
const qboFirst=prof=>String((prof&&(prof.full_name||prof.email))||'this person').trim().split(/\s+/)[0];
function qboWhen(ts){
  if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return '';
  const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return localISO(ts)===todayISO() ? t : d.toLocaleDateString([],{month:'short',day:'numeric'})+', '+t;
}
function qboAgo(ts){
  if(!ts) return ''; const s=(Date.now()-new Date(ts).getTime())/1000;
  if(!(s>=0) || s<90) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<48*3600) return Math.round(s/3600)+' h ago';
  return 'on '+new Date(ts).toLocaleDateString([],{month:'short',day:'numeric'});
}
// how old the Mac's copy of QuickBooks and Gusto is, a Refresh, and a warning when the Mac hasn't checked in for 5 minutes
function qboFreshHtml(w){
  const hb=w && w.heartbeat_at ? new Date(w.heartbeat_at).getTime() : 0;
  const stale=!hb || Date.now()-hb>5*60e3;
  const asked=!!(w && w.refresh_requested_at && (!w.refreshed_at || new Date(w.refresh_requested_at)>new Date(w.refreshed_at)));
  const data=w && w.refreshed_at ? `QuickBooks and Gusto as of ${qboAgo(w.refreshed_at)}.` : 'The Mac hasn’t read QuickBooks and Gusto yet.';
  return `<div class="row" style="gap:8px;align-items:center;margin-top:4px">
      <div class="small muted grow">${esc(data)}${asked?' A refresh is waiting for the Mac.':''}</div>
      <button type="button" class="btn sm ghost" data-qbo="refresh" data-prev="${esc((w&&w.refreshed_at)||'')}" style="flex:none">⟳ Refresh</button></div>
    ${stale?`<div class="small qbo-warn" style="margin-top:4px">⚠ The Mac hasn’t checked in ${hb?'since '+esc(qboWhen(w.heartbeat_at)):'yet'}. Bookings wait until it does.</div>`:''}`;
}
async function qboRefresh(btn, after){
  if(!btn || btn.disabled) return;
  const prev=btn.dataset.prev||'';
  busy(btn,true);
  const { error }=await supabase.rpc('ba_qbo_refresh');
  if(error){ busy(btn,false); return toast(error.message,'err',9000); }
  toast('Asked the Mac to read QuickBooks and Gusto again. It takes about a minute.','ok',5000);
  const t0=Date.now();
  while(btn.isConnected && Date.now()-t0<6*60e3){
    await new Promise(r=>setTimeout(r, Date.now()-t0<3*60e3 ? 5000 : 20000));
    if(!btn.isConnected) return;   // the screen changed meanwhile
    const { data:w }=await supabase.from('ba_qbo_worker').select('refreshed_at').eq('id',1).maybeSingle();
    if(w && w.refreshed_at && w.refreshed_at!==prev){ toast('QuickBooks and Gusto are read again.','ok'); return after && after(); }
  }
  if(btn.isConnected){ busy(btn,false); toast('The Mac hasn’t answered yet. Bookings wait until it does.','err',6000); }
}
// Following one booking row: every 5 seconds for 3 minutes, then every 20 seconds, until it ends (QBO_DONE) or 30 minutes
// pass. Named subscribers hear each change; unless every subscriber asked for quiet, the end is a toast (Booked: with Undo).
const QBO_W=new Map();
function qboWatch(id, name, fn, opts={}){
  if(!id) return;
  let w=QBO_W.get(id);
  if(!w){ w={ subs:new Map(), t0:Date.now(), last:null, quiet:!!opts.quiet }; QBO_W.set(id,w); setTimeout(()=>qboTick(id), 5000); }
  else if(!opts.quiet) w.quiet=false;
  if(fn) w.subs.set(name, fn);
}
async function qboTick(id){
  const w=QBO_W.get(id); if(!w) return;
  let row=null;
  try{ const { data }=await supabase.from('ba_qbo_bookings').select('*').eq('id',id).maybeSingle(); row=data||null; }catch(_){}
  // a change of status, of the Mac's note, or of the number (the Mac reserves it while 'working') is heard
  if(row && (!w.last || w.last.status!==row.status || w.last.detail!==row.detail || w.last.doc_number!==row.doc_number)){ w.last=row; w.subs.forEach(fn=>{ try{ fn(row); }catch(_){} }); }
  if(row && QBO_DONE.has(row.status)){ QBO_W.delete(id); if(!w.quiet) qboToastResult(row); return; }
  const age=Date.now()-w.t0;
  if(age>30*60e3 || !state.session){ QBO_W.delete(id); return; }
  setTimeout(()=>qboTick(id), age<3*60e3 ? 5000 : 20000);
}
function qboToastResult(b){
  const je=b.doc_number ? 'JE '+b.doc_number : 'the JE';
  // the Mac's note on a booked JE is something to check ("this file didn't attach, so attach it in QuickBooks: ..."); the
  // rows and the card show it in full, the toast only says it is there (a long toast would cover the card on a phone)
  if(b.status==='booked') return toastAction(`Booked ${je} in QuickBooks${b.detail&&qboNoteAsks(b.detail)?', with a note from the Mac to check':''}.`, 'Undo', ()=>qboUndo(b), 12000);
  if(b.status==='undone') return toast(b.source==='hand' ? 'Unlinked. QuickBooks wasn’t changed.' : `${je} is out of QuickBooks.`,'ok',5000);
  if(b.status==='failed') return toast('Didn’t book: '+(b.detail||'the Mac didn’t say why.'),'err',9000);
  if(b.status==='expired') return toast('Not booked: the Mac didn’t pick it up in 15 minutes.','err',9000);
  if(b.status==='undo_failed') return toast(`Couldn’t undo ${je}: `+(b.detail||'the Mac didn’t say why.'),'err',9000);
  if(b.status==='cancelled') return toast('Cancelled. Nothing was booked.','ok');
}
// a booking moved on: redraw this person's QuickBooks section if it is open, and the Review list's tags behind it
let qboRevT=null;
function qboAfterChange(row){
  if(!row) return;
  const h=document.getElementById('qboSec');
  if(h && h.dataset.ba===String(row.ba_id) && h.dataset.per===String(row.period_id)) qboSection(row.ba_id, state.period, state._admProf, h.dataset.sub);
  clearTimeout(qboRevT);
  qboRevT=setTimeout(()=>{ const m=$('#main');
    if(m && m.querySelector('#qboRev') && state.adminTab==='review' && state.period && state.period.id===row.period_id && state._qboRevRows)
      qboReviewExtras(m, state.period, state._qboRevRows); }, 1500);
}
async function qboUndo(b){
  const je=b.doc_number ? 'JE '+b.doc_number : 'this JE';
  if(!confirm(`Take ${je} out of QuickBooks?\n\nThe Mac deletes the JE and the files it attached, usually within a minute. If someone changed the JE in QuickBooks since it was booked, the Mac leaves it alone and says so.`)) return false;
  const { error }=await supabase.rpc('ba_qbo_undo',{ p_id:b.id });
  if(error){ toast(error.message,'err',9000); return false; }
  toast('Undo asked. The Mac takes it out within about a minute.','ok',5000);
  qboWatch(b.id,'after',qboAfterChange);
  qboAfterChange({ ...b, status:'undo_queued' });
  return true;
}
async function qboCancel(b){
  if(!confirm('Cancel this booking? The Mac hasn’t picked it up yet, so nothing is in QuickBooks.')) return false;
  const { error }=await supabase.rpc('ba_qbo_cancel',{ p_id:b.id });
  if(error){ toast(error.message,'err',9000); qboAfterChange(b); return false; }
  toast('Cancelled. Nothing was booked.','ok');
  const w=QBO_W.get(b.id); if(w) w.quiet=true;   // said once here; the follow ends quietly when it reads it
  qboAfterChange({ ...b, status:'cancelled' });
  return true;
}
async function qboUnlink(b){
  const je=b.doc_number ? 'JE '+b.doc_number : 'that JE';
  if(!confirm(`Is ${je} not for these items?\n\nThe Mac matched ${je}, which you booked by hand, to these items. Unlinking forgets that match, so they can be booked here again. QuickBooks isn’t changed.`)) return false;
  const { error }=await supabase.rpc('ba_qbo_unlink',{ p_id:b.id });
  if(error){ toast(error.message,'err',9000); return false; }
  toast('Unlinked. QuickBooks wasn’t changed.','ok',5000);
  qboAfterChange({ ...b, status:'undone' });
  return true;
}
// The JE number on every booking (hand or app, any status, any period) of one person, or of everyone (baId null): the
// names they were booked under, for their name keys (qboPersonKeys). Read in pages, since the database hands back at most
// 1,000 rows a request; an error throws, and then nothing is booked from what was read.
async function qboLoadDocs(baId){
  const PAGE=1000, out=[];
  for(let p=0;;p++){
    if(p>=200) throw new Error('Too many bookings to read their JE numbers.');
    let q=supabase.from('ba_qbo_bookings').select('ba_id,doc_number').not('doc_number','is',null);
    if(baId) q=q.eq('ba_id',baId);
    const { data, error }=await q.order('id').range(p*PAGE, p*PAGE+PAGE-1);
    if(error) throw error;
    (data||[]).forEach(r=>{ if(r && r.doc_number!=null && r.doc_number!=='') out.push({ ba_id:r.ba_id, doc_number:r.doc_number }); });
    if(!data || data.length<PAGE) return out;
  }
}
// one person and period: who pays them, their bookings and booked items, the JE numbers of all their bookings (for their
// name keys), the company's paydays and the JEs to check
async function qboLoadPerson(baId, per){
  const ok=r=>{ if(r && r.error) throw r.error; return r ? r.data : null; };
  const [pp, st, bk, wk, docs]=await Promise.all([
    supabase.from('ba_qbo_people').select('*').eq('profile_id',baId).maybeSingle(),
    supabase.from('ba_qbo_setup').select('*'),
    supabase.from('ba_qbo_bookings').select('*').eq('ba_id',baId).eq('period_id',per.id).order('requested_at',{ascending:false}),
    supabase.from('ba_qbo_worker').select('*').eq('id',1).maybeSingle(),
    qboLoadDocs(baId),
  ]);
  const person=ok(pp)||null, setupBy={}; (ok(st)||[]).forEach(s=>{ setupBy[s.company]=s; });
  const bookings=ok(bk)||[], worker=ok(wk)||null, co=person && person.company;
  const ids=bookings.map(b=>b.id);
  const [it, pd, je, adj]=await Promise.all([
    ids.length ? supabase.from('ba_qbo_booking_items').select('*').in('booking_id',ids) : { data:[] },
    // from the payday before this period's too: an adjustment belongs to a payday by its day and the one before (qboAdjHome)
    co ? supabase.from('ba_qbo_paydays').select('*').eq('company',co).gte('period_start',qboAddDays(per.start_date,-31)).order('check_date') : { data:[] },
    co ? supabase.from('ba_qbo_jes').select('*').eq('company',co).gt('txn_date',per.end_date).lte('txn_date',qboAddDays(per.end_date,120)).order('txn_date') : { data:[] },
    qboLoadAdjustments(baId),
  ]);
  const jes=ok(je)||[];
  // a JE any live booking holds, of this period or another, is matched: read the bookings that carry these JEs' ids
  const jeIds=[...new Set(jes.map(j=>String(j.je_id)))];
  const byJe=jeIds.length ? ok(await supabase.from('ba_qbo_bookings').select('id,company,je_id,status').eq('company',co).in('je_id',jeIds))||[] : [];
  return { person, setupBy, bookings, bookingItems:ok(it)||[], paydays:ok(pd)||[], jes, held:qboHeldJes([...bookings, ...byJe]), worker,
    adjustments:adj, docs:(docs||[]).filter(d=>String(d.ba_id)===String(baId)) };
}
// The adjustments (supabase/ba-payroll-checks.sql) of one person, or of everyone (baId null), cancelled ones left out: a
// payroll that paid a claim plus that payday's adjustments paid the claim, and one that added it as a late claim paid it
// there (the Book card's date and Gusto line). Before that table exists: none. Any other error throws, like the other reads.
async function qboLoadAdjustments(baId){
  let q=supabase.from('ba_reimb_adjustments').select('id,profile_id,company,check_date,cents,source_check_date,cancelled_at').is('cancelled_at',null);
  if(baId) q=q.eq('profile_id',baId);
  const { data, error }=await q;
  if(error){ if(/42P01|PGRST205|does not exist|schema cache/i.test(String(error.code||'')+' '+String(error.message||''))) return []; throw error; }
  return data||[];
}
// the person's name keys on their sheet and card: the name the page shows, their Name in Gusto, their bookings' numbers
const qboCtxKeys=ctx=>qboPersonKeys({ fullName:(ctx.prof||{}).full_name, person:ctx.person, bookings:ctx.docs });
// the person's items as the review sheet holds them now (inline edits included)
function qboArrays(ctx){
  const c=gridCtx(), mine=!!c && String(c.baId)===String(ctx.baId);
  return { T:(mine&&c.T)||ctx.T||[], E:(mine&&c.E)||ctx.E||[], H:(mine&&c.H)||ctx.H||[] };
}
// the QuickBooks section of the person's review sheet (adminBaDetail), for bookers only
let qboSecGen=0;
async function qboSection(baId, per, prof, subStatus){
  const host=document.getElementById('qboSec'); if(!host || !per || isAllPeriods(per)) return;
  const gen=++qboSecGen;
  if(!host.dataset.drawn) host.innerHTML=`<div class="card" style="margin:0 0 12px"><h3 style="margin:0">QuickBooks</h3><div class="loading" style="padding:12px"><span class="spin"></span></div></div>`;
  let ctx;
  try{ ctx=await qboLoadPerson(baId, per); }catch(e){ ctx={ error:String((e&&e.message)||e) }; }
  const h=document.getElementById('qboSec');
  if(gen!==qboSecGen || !h || h.dataset.ba!==String(baId) || h.dataset.per!==String(per.id)) return;   // the sheet moved on
  Object.assign(ctx, { baId, per, prof:prof||{}, subStatus:subStatus||h.dataset.sub||'open' });
  h.dataset.drawn='1';
  qboDrawSection(h, ctx);
}
function qboBookingRowHtml(b, n){
  const je=b.doc_number ? `JE ${esc(b.doc_number)}` : 'the JE';
  const amt=money(Number(b.total)), day=esc(fmtDate(b.txn_date));
  const files=Array.isArray(b.attachments) ? b.attachments.length : 0;
  const why=b.detail ? esc(b.detail) : '';
  const btn=(act,label)=>`<button type="button" class="btn sm ghost" data-qbb="${esc(b.id)}" data-act="${act}">${label}</button>`;
  const row=(ic,main,sub,button,cls)=>`<div class="qbo-row"><div class="ic${cls?' '+cls:''}">${ic}</div><div class="grow small" style="min-width:0"><div class="${cls||''}">${main}</div>${sub?`<div class="muted" style="margin-top:2px">${sub}</div>`:''}</div>${button||''}</div>`;
  switch(b.status){
    // a booked JE of this app's carries the Mac's note only when there is something to check in QuickBooks
    case 'booked': return b.source==='hand'
      ? row('✓',`Booked by hand: <b>${je}</b> · ${day} · ${amt}`,`The Mac matched this JE to ${qboPlural(n,'item')} here.`,btn('unlink','Not these items'))
      : row('✓',`In QuickBooks: <b>${je}</b> · ${day} · ${amt}`,`${qboPlural(files,'file')} attached${n?' · '+qboPlural(n,'item'):''}${why?(qboNoteAsks(b.detail)?`<div class="qbo-warn" style="margin-top:2px">⚠ ${why}</div>`:`<div class="muted" style="margin-top:2px">${why}</div>`):''}`,btn('undo','Undo'));
    case 'queued': return row('⏳',`Waiting for the Mac: ${amt}, dated ${day}`,`Asked ${esc(qboWhen(b.requested_at))}. The Mac checks every minute.`,btn('cancel','Cancel'));
    // the number the Mac took for it, and its note when QuickBooks didn't answer (it then looks again in about 15 minutes)
    case 'working': return row('⏳',`The Mac is booking ${amt}${b.doc_number?` as <b>${je}</b>`:''}${why?'':' now'}…`,why||'Usually done within a minute.');
    case 'undo_queued': return row('⏳',`Taking ${je} out of QuickBooks: waiting for the Mac`,b.undo_at?`Asked ${esc(qboWhen(b.undo_at))}.`:'');
    case 'undoing': return row('⏳',`Taking ${je} out of QuickBooks…`,'');
    case 'undo_failed': return row('⚠',`Couldn’t undo ${je} (${day} · ${amt})`,why||'The Mac didn’t say why.',btn('undo','Try again'),'qbo-warn');
    case 'failed': return row('⚠',`Didn’t book ${amt}`,`${why||'The Mac didn’t say why.'} (${esc(qboWhen(b.finished_at||b.requested_at))})`,'','qbo-warn');
    case 'expired': return row('⚠','Not booked: the Mac didn’t pick it up in 15 minutes.',why,'','qbo-warn');
    case 'cancelled': return row('·','Cancelled before the Mac picked it up. Nothing was booked.','');
    case 'undone': return row('·', b.source==='hand' ? `Unlinked ${je}: it isn’t for these items. QuickBooks wasn’t changed.` : `Undone: ${je} is out of QuickBooks.`, b.undo_at?esc(qboWhen(b.undo_at)):'');
  }
  return '';
}
function qboDrawSection(host, ctx){

      <button type="button" class="selpick" data-qbo="link" style="margin-top:8px"><span class="pkph">Pick them from the Gusto list…</span></button>

  } else {

    parts.push(`<div class="qbo-row"><div class="ic">👤</div><div class="grow small" style="min-width:0">Paid by <b>${esc(co)}</b>${person.gusto_name?` (${esc(person.gusto_name)} in Gusto${person.department?', '+esc(person.department):''})`:''}.
      Class ${cls?`<b>${esc(cls)}</b>`:'<span class="qbo-warn">not set yet: pick one on the Book card</span>'}.
      ${person.problem?`<div class="${waiting?'muted':'qbo-warn'}" style="margin-top:4px">${waiting?'<span class="spin" style="width:11px;height:11px;vertical-align:-1px"></span> ':''}${esc(person.problem)}</div>`:''}</div>
      <button type="button" class="btn sm ghost" data-qbo="link">Change</button></div>`);
    if(waiting) qboWaitPerson(ctx.baId);
  }
  // bookings: everything live, and the newest one if it ended without a JE (a failure, an expiry, an undo)
  const bookings=ctx.bookings.slice().sort((a,b)=>String(b.requested_at).localeCompare(String(a.requested_at)));

  // trips and expenses still waiting for approval, company-paid ones too (never the books' rows): Approve all takes them, or

  const notYet=[...T.filter(t=>t.status==='draft'||t.status==='submitted'), ...E.filter(e=>(e.status==='draft'||e.status==='submitted') && !isBooks(e))];
