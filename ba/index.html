    $('#stDate').classList.toggle('needs',!rec.task_date);
    if(!rec.task_date||!rec.account) return;
    const btn=$('#stSave'); btn.disabled=true; btn.textContent='Saving…';
    try{
      if(task&&task.dbId){
        const { error }=await supabase.from('schedule_tasks').update({...rec,updated_at:new Date().toISOString()}).eq('id',task.dbId);
        if(error) throw error;
      }else{
        rec.created_by=state.session?.user?.id||null;
        const { error }=await supabase.from('schedule_tasks').insert(rec);
        if(error) throw error;
      }
      if(moved) await schedAutocomplete(state.schedState||'CA', rec.task_date<task.iso?rec.task_date:task.iso, true);
      const told=schedNoticeWords(rec, task, wantDone);   // done after this save: no email
      const said=(task?'Saved':'Added to the schedule')+(told?'. '+told:'');
      // a slow save closes only its own form, never one opened since
      if(preset.onSaved){ if($('#sheet')===formSh) closeSheet(); await schedReloadTasks(); if(!$('#sheet')||$('#sheet')===formSh) await preset.onSaved(rec); toast(said,'ok'); }
      else if(!$('#sheet')||$('#sheet')===formSh){ await refresh(rec.task_date, rec.driver); if(told) toast(said,'ok'); }
      else { await schedReloadTasks(); const m=$('#main'); if(m&&m.querySelector('.sb-wrap,.loading')) schedRender(m); toast(said,'ok'); }
    }catch(e){ btn.disabled=false; btn.textContent=task?'Save changes':'Add to schedule'; toast('Could not save: '+(e.message||e)); }
  };
  if(task&&task.dbId) $('#stDel').onclick=async()=>{
    if(!confirm('Delete this task?')) return;
    try{
      // SOFT delete: the row stays in the table with deleted_at set, so this is
      // undoable (Undo here, or Backup & restore → Undo deletions). Nothing in the
      // app hard-deletes a task — the DELETE privilege is revoked in the database.
      const { error }=await supabase.from('schedule_tasks')
        .update({deleted_at:new Date().toISOString(),deleted_by:state.session?.user?.id||null,
                 updated_at:new Date().toISOString()}).eq('id',task.dbId);
      if(error) throw error;
      await refresh(task.iso);
      toastAction('Task deleted.','Undo',async()=>{
        const { error:e2 }=await supabase.rpc('schedule_undelete',{p_id:task.dbId,p_minutes:null});
        if(e2){ toast('Could not undo: '+e2.message); return; }
        toast('Task restored'); await refresh(task.iso, task.driver);
      });
    }catch(e){ toast('Could not delete: '+(e.message||e)); }
  };
}
// Ask the database to mark done the open visits of a board that the BAs have since logged (a trip or hours
// at that store that day, or the post-visit report). At most every 2 minutes per board and start day unless
// forced; it never throws, and a board you can't see is simply not touched.
const SCHED_AUTOC={};
async function schedAutocomplete(st, fromIso, force){
  const k=st+'|'+fromIso;
  if(!force && SCHED_AUTOC[k] && Date.now()-SCHED_AUTOC[k]<120000) return 0;
  SCHED_AUTOC[k]=Date.now();
  try{ const { data }=await supabase.rpc('schedule_tasks_autocomplete',{p_state:st, p_from:fromIso, p_to:schedIso(new Date())}); return +data||0; }
  catch(_){ return 0; }
}
// "Done Nov 18 · trip logged · trained 3 budtenders"
function schedDoneTitle(v){
  if(!v||!v.doneAt) return '';
  const day=schedDoneDay(v, ts=>schedIso(new Date(ts))), d=new Date(day+'T12:00:00');
  return `Done ${isNaN(d)?'':`${SCHED_MONL[d.getMonth()]} ${d.getDate()}`}${SCHED_DONE_HOW[v.doneHow]?' · '+SCHED_DONE_HOW[v.doneHow]:''}${v.doneNote?' · '+v.doneNote:''}`;
}
// Mark one app task done (by you, now) or not done (reopened: the automatic check leaves it alone from then
// on), with Undo. after() redraws whatever showed it. Returns true when it saved.
async function schedMarkDone(v, done, after){
  if(!v||!v.dbId) return false;
  const now=()=>new Date().toISOString();
  const before={done_at:v.doneAt||null, done_by:v.doneBy||null, done_how:v.doneHow||null, done_note:v.doneNote||null, done_on:v.doneOn||null};
  const patch=done?{done_at:now(), done_by:state.session?.user?.id||null, done_how:'marked', done_note:v.doneNote||null, done_on:null}
                  :{done_at:null, done_by:null, done_note:null, done_on:null,
                    // a visit still to come, reopened, is left to the automatic check; anything else stays reopened
                    done_how:(SCHED_VISIT_KINDS.has(schedKindOf(v))&&v.iso>schedIso(new Date()))?null:'reopened'};
  const { error }=await supabase.from('schedule_tasks').update({...patch, updated_at:now()}).eq('id',v.dbId);
  if(error){ toast('Could not save: '+error.message); return false; }
  if(after) await after();
  toastAction(done?'Marked done.':'Marked not done.','Undo',async()=>{
    const { error:e2 }=await supabase.from('schedule_tasks').update({...before, updated_at:now()}).eq('id',v.dbId);
    if(e2){ toast('Could not undo: '+e2.message); return; }
    if(after) await after();
  });
  return true;
}
// after a task changes: reload the tasks, redraw the calendar behind, and reopen the day
async function schedAfterTaskChange(iso){
  await schedReloadTasks();
  const m=$('#main'); if(m&&m.querySelector('.sb-wrap,.loading')) schedRender(m);
  const sh=$('#sheet');
  if(iso && sh && sh.dataset.day===iso){
    const sc=sh.querySelector('.sb-sheet')?.scrollTop||0;
    schedDaySheet(iso);
    const s2=$('#sheet .sb-sheet'); if(s2) s2.scrollTop=sc;
  }
}
// Export: a spreadsheet of what the calendar holds between two days, for the names picked above the calendar
// (everyone when none are), with type, address, done or not, and the post-visit report (Amanda 2026-11-20:
// "export schedules for all CA BAs")
function schedExportSheet(){
  const S=state.sched; if(!S) return;
  const y=S.month.getFullYear(), mo=S.month.getMonth();
  const who=S.sel?[...S.sel].join(', '):`everyone on the ${esc(state.schedState||'CA')} board`;
  openSheet(`<h3 style="margin:0 0 4px">Export the schedule</h3>
    <div class="small muted" style="margin-bottom:10px">A spreadsheet of every visit, task and delivery on the calendar: who, where, what type, done or not, and the post-visit report. People: <b>${esc(who)}</b>${S.sel?' (the names picked above the calendar)':''}.</div>
    <label class="fl">From</label><input type="date" id="sxFrom" value="${schedIso(new Date(y,mo,1))}">
    <label class="fl">To</label><input type="date" id="sxTo" value="${schedIso(new Date(y,mo+1,0))}">
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="sxNoDel" style="width:auto;margin:0"> Leave out deliveries</label>
    <div id="sxMsg" class="small muted" style="margin-top:8px"></div>
    <button class="btn primary block" id="sxGo" style="margin-top:12px">⬇ Download CSV</button>`);
  $('#sxGo').onclick=async()=>{
    const f=$('#sxFrom').value, t=$('#sxTo').value, msg=$('#sxMsg'), btn=$('#sxGo');
    if(!f||!t||t<f){ msg.textContent='Pick a From day on or before the To day.'; return; }
    if((new Date(t+'T12:00:00')-new Date(f+'T12:00:00'))/864e5>186){ msg.textContent='Pick 6 months or less at a time.'; return; }
    btn.disabled=true; btn.textContent='Gathering…';
    try{
      // the calendar holds the month on screen and its neighbours; load every month the range touches
      for(let d=new Date(f.slice(0,7)+'-15T12:00:00'); schedIso(d).slice(0,7)<=t.slice(0,7); d=new Date(d.getFullYear(),d.getMonth()+1,15))
        await schedLoad(new Date(d.getFullYear(),d.getMonth(),15));
      // a month the workbook didn't answer for, or reports that didn't load, would make a file that looks
      // complete and isn't: stop and say so instead
      const missing=[];
      for(let d=new Date(f.slice(0,7)+'-15T12:00:00'); schedIso(d).slice(0,7)<=t.slice(0,7); d=new Date(d.getFullYear(),d.getMonth()+1,15))
        if(!S.tried.has(`${d.getFullYear()}-${d.getMonth()}`)) missing.push(`${SCHED_MONL[d.getMonth()]} ${d.getFullYear()}`);
      if(missing.length||S.actsErr){
        msg.textContent=missing.length?`Couldn't read ${missing.join(', ')} of the schedule sheet (connection). Try again.`
          :`Couldn't read the post-visit reports (connection). Try again.`;
        btn.disabled=false; btn.textContent='⬇ Download CSV'; return;
      }
      await schedAutocomplete(state.schedState||'CA', f, true);
      await schedReloadTasks();
      const rows=schedExportRows(schedAllRows(), { from:f, to:t, sel:S.sel, noDeliveries:$('#sxNoDel').checked, todayIso:schedIso(new Date()),
        place:v=>{ const p=schedDeliveryPlace(v); return v.location||(p&&p.address)||''; },
        reports:v=>schedActsFor(v).length, localDay:ts=>schedIso(new Date(ts)) });
      if(rows.length<2){ msg.textContent='Nothing on the calendar for those days and people.'; btn.disabled=false; btn.textContent='⬇ Download CSV'; return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+schedCsv(rows)],{type:'text/csv;charset=utf-8'}));
      a.download=`schedule_${state.schedState||'CA'}_${f}_to_${t}.csv`; a.click();
      closeSheet(); toast(`Downloaded ${rows.length-1} row${rows.length===2?'':'s'}.`);
      const m=$('#main'); if(m&&m.querySelector('.sb-wrap')) schedRender(m);
    }catch(e){ btn.disabled=false; btn.textContent='⬇ Download CSV'; msg.textContent='Could not gather the schedule: '+(e.message||e); }
  };
}
// My tasks (home screen): the signed-in person's tasks on their own board, assigned by first name the way the
// Schedule writes it, from the last 30 days and the next 14. The card shows what needs them first (overdue
// trainings, follow-ups and visits), then today's and the next ones, 5 rows at most; the rest (visits still
// waiting for their trip, hours or report, and anything past the 5) sit behind one button. It is read alongside
// the rest of the home screen and drawn with it, so nothing jumps; the database's catch-up runs after, and the
// card is redrawn only when it changed something.
// the signed-in person's schedule name (her first name, as the Schedule writes it)
function schedMyName(){ return schedCanon(String((state.profile&&state.profile.full_name)||'').trim().split(/\s+/)[0]); }
function myTasksWho(){
  const st=personRegion(state.profile), me=schedMyName();
  return st&&me?{st,me}:null;
}
async function myTasksLoad(){
  const w=myTasksWho(); if(!w) return null;
  const today=schedIso(new Date()), from=schedIso(schedAdd(new Date(),-30)), to=schedIso(schedAdd(new Date(),14));
  const { data, error }=await supabase.from('schedule_tasks')
    .select('id,task_date,account,kind,notes,so_num,driver,done_at,done_how,done_note,done_by,done_on,created_at,task_time,booking,title')
    .eq('state',w.st).is('deleted_at',null).gte('task_date',from).lte('task_date',to).order('task_date');
  if(error||!data) return { error:true };
  const mine=data.filter(t=>schedCanon(t.driver)===w.me).map(t=>({ dbId:t.id, iso:t.task_date, account:t.account||'', kind:t.kind||null,
    soNum:t.so_num||'', soNotes:t.notes||'', doneAt:t.done_at||null, doneHow:t.done_how||null, doneNote:t.done_note||'',
    doneBy:t.done_by||null, doneOn:t.done_on||null, createdAt:t.created_at||null,
    taskTime:t.task_time||'', time:schedClock(t.task_time), booking:t.booking||null, title:t.title||'' }));
  const st=v=>schedTaskStatus(v,today);
  const overdue=mine.filter(v=>st(v)==='overdue')
    .sort((a,b)=>(SCHED_VISIT_KINDS.has(schedKindOf(a))?1:0)-(SCHED_VISIT_KINDS.has(schedKindOf(b))?1:0) || a.iso.localeCompare(b.iso));
  const next=mine.filter(v=>st(v)==='open');
  const waiting=mine.filter(v=>st(v)==='unconfirmed').sort((a,b)=>b.iso.localeCompare(a.iso));
  const card=[...overdue, ...next].slice(0,5);
  const rest=[...overdue, ...next].slice(5);
  const done7=mine.filter(v=>v.doneAt&&v.iso>=schedIso(schedAdd(new Date(),-7))&&v.iso<=today).length;
  return { today, card, rest, waiting, done7, for:state.session?.user?.id };
}
function myTaskRowHtml(v, src, i, today){
  const stt=schedTaskStatus(v,today);
  const d=new Date(v.iso+'T12:00:00'), DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const day=v.iso===today?'Today':`${DOW[d.getDay()]} ${SCHED_MONL[d.getMonth()]} ${d.getDate()}`;
  const word=stt==='overdue'?' · overdue':stt==='unconfirmed'?' · waiting for your trip, hours or report':'';

// Resolves true only when it marked the task: opening the report saves nothing yet, so the caller gives its
// Done button back (the report covers it, and closing the report must not leave it greyed out).
function schedDoneFlow(v, afterReport, afterDone){
  if(!v||!v.dbId) return Promise.resolve(false);
  if(schedTooEarly(v, schedIso(new Date()))){ const d=new Date(v.iso+'T12:00:00');
    toast(`This visit is on ${SCHED_MONL[d.getMonth()]} ${d.getDate()}. It can be marked done on that day or after, and it marks itself done when the trip or hours there are logged.`);
    return Promise.resolve(false); }
  if(['visit','pad','edu','training'].includes(schedKindOf(v))){ schedReportSheet({ task:v, iso:v.iso, after:afterReport, afterSkip:afterDone }); return Promise.resolve(false); }
  return schedMarkDone(v, true, afterDone);
}

// Read once per board, again after 5 minutes or a change: the plans, the 6-month sales (managers only; the
// database refuses everyone else), what the BAs logged and, for managers, the registry sync's notes on billed
// names it couldn't place (store_registry_review: a read that fails, say before supabase/ba-store-registry-add.sql
// is applied, only leaves the notes out). The store list itself is state.dispensaries.
async function storesLoad(force){
  const S=state.sched, st=state.schedState||'CA';
  if(!force && S.storesData && S.storesData.st===st && Date.now()-S.storesData.at<300000) return S.storesData;
  if(state.dispPending) await state.dispPending;
  const mgr=state.profile?.role==='admin';
  const [pl, sa, vi, rv]=await Promise.all([
    supabase.from('store_plan').select('*'),
    mgr ? supabase.from('store_sales').select('sales_key,name,net,orders,first_order,last_order,channel,window_from,window_to,updated_at,dispensary_ids').eq('state',st) : Promise.resolve({ data:[] }),
    supabase.rpc('store_visit_summary',{ p_state:st, p_since:schedIso(schedAdd(new Date(),-365)) }),
    mgr ? supabase.from('store_registry_review').select('customer,sales_key,kind,why,conflict,license,legal_name,address,candidate_id,updated_at').eq('state',st)
      .then(r=>r, e=>({ data:null, error:e })) : Promise.resolve({ data:[] }),
  ]);
  const bad=[pl,sa,vi].find(r=>r&&r.error);
  if(bad && !S.storesData) throw bad.error;
  const keep=S.storesData&&S.storesData.st===st?S.storesData:{};
  // reviewOk: this read of the sync's notes worked, so their age says whether the sync is still running (spSyncStale)
  S.storesData={ st, at:Date.now(), plans:pl.error?keep.plans||[]:pl.data||[], sales:sa.error?keep.sales||[]:sa.data||[],
    visits:vi.error?keep.visits||[]:vi.data||[], review:rv.error?keep.review||[]:rv.data||[], reviewOk:mgr && !rv.error && Array.isArray(rv.data),
    err:bad?(bad.error.message||'error'):'' };
  return S.storesData;
}

  if(!list.length){ box.innerHTML=staleHtml+licHtml; storesLicWire(m, box, lic); return; }

  const hb=$('#spUnlHead'); if(hb) hb.onclick=()=>{ S.storesUnl.open=!open; storesDrawUnl(m); };

// the shared store list's own checks and writes (supabase/ba-store-registry-add.sql), in plain words when the
// database update isn't there yet
function storesErr(e){
  const t=String((e&&e.message)||e||'');
  return /PGRST202|Could not find the function|schema cache/i.test(t+' '+((e&&e.code)||''))
    ? 'Adding stores here isn\'t switched on yet: the database update for it hasn\'t been applied.' : t;
}
// the registry rows that may already be this store: p = {name, address, license}, names = other names it goes by
async function storesMatch(st, p, names){
  const { data, error }=await supabase.rpc('store_registry_match',{ p_state:st, p_name:p.name, p_address:p.address||null,
    p_license:p.license||null, p_names:(names||[]).filter(Boolean) });
  if(error) throw error;
  return Array.isArray(data)?data:[];
}
async function storesLinkRpc(id, alias){
  const { data, error }=await supabase.rpc('store_registry_link',{ p_id:id, p_alias:alias });
  if(error) throw error;
  return data||{};
}
// turn a store that was turned off back on (managers): this one row only; a change the database didn't make is an error
async function storesTurnOn(id){
  const { data, error }=await supabase.from('dispensaries').update({ active:true }).eq('id', id).select('id');
  if(error) throw error;

// Add a store to the shared store list (managers): empty from "＋ Add store", or filled from a billed account and the
// registry sync's note on it (its name without the [At-Risk] style tags, license, legal name and premises; the billing
// name goes with it). Add checks the list first (storesMatch) and shows what may already be this store; adding a new
// one anyway takes a second tap. A change to the name, address or license checks again. Errors keep the form open with
// what was typed; a save that fails after the sheet was closed offers it back.
function storeAddSheet(m, o={}){
  const st=state.schedState||'CA', u=o.account||null, r=(u&&u.review)||{}, f=o.prefill||null;
  const terrs=[...new Set([...(SP_TERRITORIES[st]||[]), ...storesRows().map(x=>x.territory).filter(Boolean), ...(f&&f.territory?[f.territory]:[])])];
  const val=(k, def)=>esc(f?f[k]||'':def||'');
  openSheet(`<h3 style="margin:0 0 2px">Add a store</h3>
    <div class="small muted">${u?`Billed as <b>${esc(u.name)}</b>${u.net!=null?` · ${spMoney(u.net)} in 6 months`:''}. The store will answer to that name, so its sales show here and in the sales app.`
      :`Adds it to the shared ${esc(st)} store list, the one the sales app uses too.`}</div>
    <label class="fl">Name</label><input id="saName" value="${val('name', u?spCleanName(u.name):'')}" autocomplete="off">
    <label class="fl">Address</label><textarea id="saAddr" placeholder="start typing a street address…" autocomplete="off">${val('address', r.address)}</textarea>
    <div id="saSug" class="tsug hide"></div>
    <div id="saAddrHint" class="small addr-hint" hidden>${esc(ADDR_HINT)}</div>
    <label class="fl">License # <span class="muted">(optional)</span></label><input id="saLic" value="${val('license', r.license)}" autocomplete="off">
    <label class="fl">Legal name <span class="muted">(optional)</span></label><input id="saLegal" value="${val('legal_name', r.legal_name)}" autocomplete="off">
    <label class="fl">Territory</label>
    <select id="saTerr" data-searchable><option value="">None</option>${terrs.map(t=>`<option${f&&t===f.territory?' selected':''}>${esc(t)}</option>`).join('')}</select>
    <div id="saMatch"></div>
    <div id="saMsg" class="small" style="color:var(--red);margin-top:8px"></div>
    <button class="btn primary block" id="saSave" style="margin-top:12px">Add store</button>
    <button class="btn ghost block" id="saCancel" style="margin-top:8px">Cancel</button>`);
  const sh=$('#sheet'), mine=()=>$('#sheet')===sh, q=s=>sh.querySelector(s);
  const msg=t=>{ if(mine()) q('#saMsg').textContent=t||''; };
  q('#saCancel').onclick=closeSheet;
  attachPlaceTypeahead(q('#saAddr'), q('#saSug'), ()=>{}, {addressOnly:true});
  const hint=addrHint(q('#saAddr'), q('#saAddrHint'));
  const read=()=>({ name:q('#saName').value.trim().replace(/\s+/g,' '), address:q('#saAddr').value.trim(), license:q('#saLic').value.trim(),
    legal_name:q('#saLegal').value.trim(), territory:q('#saTerr').value||'' });
  // what the check found is only for the fields it checked
  let shown=false;
  const stale=()=>{ if(!shown) return; shown=false; q('#saMatch').innerHTML=''; q('#saSave').classList.remove('hide'); };
  ['#saName','#saAddr','#saLic'].forEach(s=>q(s).addEventListener('input', stale));
  const lock=on=>sh.querySelectorAll('input,textarea,select,.selpick,#saMatch button,#saSave').forEach(x=>{ x.disabled=on; });
  const failed=(p, e)=>{
    if(mine()){ lock(false); msg(storesErr(e)); return; }
    toastAction(`Couldn't add ${p.name}.`,'Open it',()=>storeAddSheet(m, { ...o, prefill:p }), 30000);
  };
  const add=async force=>{
    const p=read();
    if(!p.name){ msg('Give the store a name.'); q('#saName').focus(); return; }
    hint(true);
    lock(true); msg('');
    try{
      if(!force){
        const ms=await storesMatch(st, p, u?[u.name]:[]);
        if(!mine()) return;
        if(ms.length){ lock(false); shown=true; q('#saSave').classList.add('hide');
          regMatchPanel(q('#saMatch'), ms, { mgr:true, account:u, onNew:()=>add(true), onUse:use, onRevive:revive }); return; }
      }
      const { error }=await supabase.rpc('store_registry_add',{ p:{ name:p.name, state:st, address:p.address||null, license:p.license||null,
        legal_name:p.legal_name||null, billing:u?u.name:null, territory:p.territory||null, force:!!force } });
      if(error) throw error;
      if(mine()) closeSheet();
      toast(`Added ${p.name}`,'ok');
      await storesAfterRegistry(m);
    }catch(e){ failed(p, e); }
  };
  // Use this one: from a billed account, that store answers to the billing name from now on; else it is already there
  const use=async row=>{
    const p=read(); lock(true); msg('');
    try{
      let words=`${row.name} is already in the store list`;
      if(u){ const res=await storesLinkRpc(row.id, u.name); words=res.added===false?`${row.name} already answers to ${u.name}`:`Linked ${u.name} to ${row.name}`; }
      else if(state.sched?.storesF && storesRows().some(x=>x.id===row.id)){
        const S2=state.sched; S2.storesF.q=row.name; S2.storesF.limit=60;
        // a search change keeps ticked only the stores it still shows, so Assign never writes one off screen
        const still=new Set(spFilter(storesRows(), S2.storesF).slice(0, S2.storesF.limit).map(x=>x.id));
        if(S2.storesSel) [...S2.storesSel].forEach(id=>{ if(!still.has(id)) S2.storesSel.delete(id); }); }
      if(mine()) closeSheet();
      toast(words,'ok');
      await storesAfterRegistry(m);
    }catch(e){ failed(p, e); }
  };
  const revive=async row=>{
    const p=read(); lock(true); msg('');
    try{
      await storesTurnOn(row.id);
      let words=`Turned ${row.name} back on`;
      if(u){ try{ await storesLinkRpc(row.id, u.name); words+=` and linked ${u.name} to it`; }
        catch(e){ words+=`, but couldn't link ${u.name} to it: ${storesErr(e)}`; } }
      if(mine()) closeSheet();
      toast(words, /couldn't/.test(words)?'err':'ok', /couldn't/.test(words)?9000:2600);
      await storesAfterRegistry(m);
    }catch(e){ failed(p, e); }
  };
  q('#saSave').onclick=()=>add(false);
  if(!u && !f) setTimeout(()=>{ if(mine()) q('#saName').focus(); }, 60);
}
// "It's one of our stores": pick the board's store this billed account is (by name or address), and it answers to the

function storeLinkPick(m, u){

  cellPickerSheet({ title:`Which store is ${u.name}?`, multi:false, selected:[],
    options:stores.map(d=>({ id:d.id, name:d.name+(d.address?' · '+d.address:'')+(d.id===cand?' (the store sync\'s guess)':''),
      search:[dispSearchText(d), d.pistil_name, ...(d.aliases||[])].filter(Boolean).join(' ') })),
    onSave:async ids=>{ const d=stores.find(x=>x.id===ids[0]); if(!d) return;

// who a visit or task planned from a store starts assigned to: a manager plans for the store's first team
// member, a BA for herself
function spAssignee(team){ return state.profile?.role==='admin' ? ((team||[])[0]||'') : schedMyName(); }
// save one store's plan fields (managers; the database refuses anyone else)
async function storesSavePlan(rows){
  const me=state.session?.user?.id||null, now=new Date().toISOString();
  const { error }=await supabase.from('store_plan').upsert(rows.map(r=>({ ...r, updated_at:now, updated_by:me })),{ onConflict:'dispensary_id' });
  if(error) throw error;
}
// assign the ticked stores to people: add them to each store's team, make them its whole team, take them off
// it, or hand a person's stores over to them (the people picked take that person's place on each team)
function storesAssignSheet(m){
  const S=state.sched, ids=[...S.storesSel]; if(!ids.length){ toast('Tick some stores first.'); return; }
  const rows=storesRows(), byId=new Map(rows.map(r=>[r.id,r])), known=schedKnownPeople();
  const lab=n=>schedGone(n,known)?n+' (can\'t be reached)':n;
  const nS=`${ids.length} store${ids.length!==1?'s':''}`;
  cellPickerSheet({ title:`${nS}: who to add, hand over to or take off?`, multi:true,
    options:storesPeople(rows).map(n=>({ id:n, name:lab(n), search:(n+' '+schedAlsoKnown(n)).trim() })), selected:[],
    onSave:names=>{ if(!names.length) return;
      // the teams "whole team" would replace: a store that has a team other than exactly these names
      const same=t=>t.length===names.length && t.every(n=>names.includes(n));
      const teamOf=id=>(byId.get(id)||{}).team||[];
      const nRep=ids.filter(id=>{ const t=teamOf(id); return t.length && !same(t); }).length;
      const nOn=ids.filter(id=>teamOf(id).some(n=>names.includes(n))).length;
      // who could hand their stores over: anyone on these stores' teams who is not one of the people picked
      const others=[...new Set(ids.flatMap(teamOf))].filter(n=>!names.includes(n)).sort((a,b)=>a.localeCompare(b));
      openSheet(`<h3 style="margin:0 0 4px">Assign ${nS}</h3>
        <div class="small muted" style="margin-bottom:10px">People picked: <b>${esc(names.map(lab).join(', '))}</b></div>
        <button class="btn primary block" id="spAddT">Add to each store's team</button>
        <button class="btn block" id="spRepT" style="margin-top:8px">Make them each store's whole team</button>
        <div class="small muted" style="margin-top:6px">${nRep?`Making them the whole team replaces the team ${nRep} of these stores already ${nRep!==1?'have':'has'}.`:'None of these stores has another team now, so nothing is replaced.'}</div>
        <button class="btn block" id="spSwapT" style="margin-top:14px"${others.length?'':' disabled'}>Hand over to them from…</button>
        <div class="small muted" style="margin-top:6px">${others.length?'They take one person\'s place on each of these stores that person is on. Pick the person next.':'Nobody else is on these stores\' teams, so there is nothing to hand over.'}</div>
        <button class="btn block" id="spRemT" style="margin-top:14px;color:var(--red);border-color:var(--red)"${nOn?'':' disabled'}>Take them off each store's team</button>
        <div class="small muted" style="margin-top:6px">${nOn?`${nOn} of these stores ${nOn!==1?'have':'has'} one of them on the team.`:'None of these stores has any of them on its team.'}</div>`);
      const sh=$('#sheet');
      const go=async(op, from)=>{
        const bs=[...sh.querySelectorAll('button:not(.sheetx)')]; const was=bs.map(b=>b.disabled); bs.forEach(b=>b.disabled=true);
        try{
          // every change but "whole team" is made on each store's team as it is now (someone may have changed it
          // since this page read it); a store whose team would not change is not written
          let cur=new Map();
          if(op!=='whole'){ const { data, error }=await supabase.from('store_plan').select('dispensary_id,team').in('dispensary_id', ids);
            if(error) throw error;
            cur=new Map((data||[]).map(x=>[x.dispensary_id, Array.isArray(x.team)?x.team:[]])); }
          const out=[];
          for(const id of ids){
            const before=cur.get(id)||[], after=spTeamEdit(before, op, names, from);
            if(op==='whole' || JSON.stringify(after)!==JSON.stringify(before)) out.push({ dispensary_id:id, team:after });
          }
          if(!out.length){ bs.forEach((b,i)=>b.disabled=was[i]);
            toast(op==='swap'?`${from} is not on any of these stores' teams now.`:'Nothing to change on these stores.'); return; }
          await storesSavePlan(out);
          if($('#sheet')===sh) closeSheet();
          S.storesSel.clear();
          toast(op==='remove'?`Taken off ${out.length} store${out.length!==1?'s':''}`
            :op==='swap'?`Handed over ${out.length} store${out.length!==1?'s':''} from ${from}`
            :`Assigned ${out.length} store${out.length!==1?'s':''}`,'ok');
          await storesLoad(true).catch(()=>{}); if(S.view==='stores') storesDrawList(m);
        }catch(e){ bs.forEach((b,i)=>b.disabled=was[i]); toast('Couldn\'t save: '+(e.message||e),'err'); } };
      $('#spAddT').onclick=()=>go('add'); $('#spRepT').onclick=()=>go('whole'); $('#spRemT').onclick=()=>go('remove');
      // the list says how many of these stores each person is on, and the hand over is asked once more
      const nWith=n=>ids.filter(id=>teamOf(id).includes(n)).length;
      $('#spSwapT').onclick=()=>cellPickerSheet({ title:`Hand over to ${names.join(', ')} from`, multi:false,
        options:others.map(n=>{ const k=nWith(n); return { id:n, name:`${lab(n)}: ${k} store${k!==1?'s':''}`, search:(n+' '+schedAlsoKnown(n)).trim() }; }), selected:[],
        onSave:pick=>{ const f=pick&&pick[0], k=f?nWith(f):0;
          if(f && $('#sheet')===sh && confirm(`Hand ${f}'s place on ${k} store${k!==1?'s':''} to ${names.join(', ')}?`)) go('swap', f); } });
    } });
}
// one store's profile: managers edit it, everyone else reads it
function storeProfileSheet(r, m){
  const S=state.sched, st=state.schedState||'CA', mgr=state.profile?.role==='admin', p=r.plan||{};
  const terrs=[...new Set([...(SP_TERRITORIES[st]||[]), ...(r.territory?[r.territory]:[]), ...storesRows().map(x=>x.territory).filter(Boolean)])];
  const dis=mgr?'':' disabled';
  let team=r.team.slice();
  const link=/^https?:\/\//i.test(p.demo_link||'')?p.demo_link:'';
  const fact=(k,v)=>v?`<div class="k">${k}</div><div>${v}</div>`:'';
  const tasks=r.tasks.slice().sort((a,b)=>a.iso.localeCompare(b.iso));
  openSheet(`<h3 style="margin:0 0 2px">${esc(r.name)}</h3>
    ${r.address?`<div class="sb-addr"><a href="https://maps.google.com/?q=${encodeURIComponent(r.address)}" target="_blank" rel="noopener">📍 ${esc(r.address)}</a></div>`:''}
    <div class="sp-facts">
      ${fact('6-month sales', mgr&&r.sales!=null?`${spMoney(r.sales)}${r.orders?` · ${r.orders} order${r.orders!==1?'s':''}`:''}${r.salesShared>1?` <span class="muted">(the whole account, ${r.salesShared} stores)</span>`:''}`:'')}
      ${fact('Last visit', r.lastVisit?`${esc(spShort(r.lastVisit))} · ${spAgo(r.daysSince)}${r.lastBy?' · '+esc(r.lastBy):''}`:'None logged in the last year')}
      ${fact('In the last year', `${r.visits} visit day${r.visits!==1?'s':''} · ${r.edu} EDU${r.lastEdu?` (last ${esc(spShort(r.lastEdu))})`:''} · ${r.pad} PAD`)}
      ${fact('Open tasks', tasks.length?tasks.map(t=>`${esc(spShort(t.iso))} ${esc(schedKindLabel(schedKindOf(t)))}${t.canon?' · '+esc(t.canon):''}`).join('<br>'):'')}
    </div>
    <label class="fl">Territory</label>
    <select id="spfTerr" data-searchable${dis}><option value="">Not set</option>${terrs.map(t=>`<option${t===r.territory?' selected':''}>${esc(t)}</option>`).join('')}</select>
    <label class="fl">Team</label>
    <div class="sp-team" id="spfTeam"></div>
    ${mgr?'<button class="btn sm ghost" id="spfTeamPick" style="margin-top:6px">Choose the team…</button>':''}
    <label class="fl">Samples</label>
    <div class="sp-checks">${SP_SAMPLES.map(o=>`<label><input type="checkbox" data-spsample="${o.k}"${(p.sample_rules||[]).includes(o.k)?' checked':''}${dis}> ${esc(o.label)}</label>`).join('')}</div>
    <label class="fl">Promo days</label>
    <div class="sp-checks">${SP_DAYS.map(d=>`<label><input type="checkbox" data-spday="${d}"${(p.promo_days||[]).includes(d)?' checked':''}${dis}> ${d}</label>`).join('')}</div>
    <label class="fl">Demo booking link</label><input id="spfLink" type="url" placeholder="https://…" value="${esc(p.demo_link||'')}"${dis}>
    ${link?`<div class="small" style="margin-top:4px"><a href="${esc(link)}" target="_blank" rel="noopener">Open the booking link ↗</a></div>`:''}
    <label class="fl">Demo contact</label><input id="spfContact" placeholder="Name, phone or email" value="${esc(p.demo_contact||'')}"${dis}>
    <label class="fl">Good to know</label><textarea id="spfNotes" rows="3" placeholder="Best times, who to ask for, parking…"${dis}>${esc(p.notes||'')}</textarea>
    ${mgr?'<button class="btn primary block" id="spfSave" style="margin-top:12px">Save</button>':''}
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="spfVisit" style="flex:1">＋ Plan a visit</button><button class="btn ghost" id="spfTask" style="flex:1">＋ Add task</button></div>`);
  const drawTeam=()=>{ const t=$('#spfTeam'), known=schedKnownPeople(), gone=team.filter(n=>schedGone(n,known)); if(t) t.innerHTML=team.length?team.map(n=>`<span class="sb-who" style="--dv:${schedColor(n)}">${esc(n)}${schedGone(n,known)?' ⚠':''}</span>`).join('')
      +(gone.length?`<div class="small" style="color:var(--orange);flex-basis:100%">${esc(gone.join(', '))} can't be reached on this board now (no active login, or two people share that first name), so a visit or task for ${gone.length!==1?'them':'that name'} reaches nobody.</div>`:''):'<span class="small muted">Nobody assigned</span>'; };
  drawTeam();
  const today=schedIso(new Date()), sh=$('#sheet');
  const reopen=async()=>{ await storesLoad(true).catch(()=>{}); if(S.view==='stores') storesDrawList(m); };
  // the profile's fields as they stand; what the sheet opened with is kept to send only what a manager changed
  const read=()=>({ territory:sh.querySelector('#spfTerr').value||null, team:team.slice(),
    sample_rules:[...sh.querySelectorAll('[data-spsample]')].filter(x=>x.checked).map(x=>x.dataset.spsample),
    promo_days:[...sh.querySelectorAll('[data-spday]')].filter(x=>x.checked).map(x=>x.dataset.spday),
    demo_link:sh.querySelector('#spfLink').value.trim()||null, demo_contact:sh.querySelector('#spfContact').value.trim()||null,
    notes:sh.querySelector('#spfNotes').value.trim()||null });
  const start=read();
  const changes=()=>{ const now=read(), out={};
    for(const k in now) if(JSON.stringify(now[k])!==JSON.stringify(start[k])) out[k]=now[k];
    return out; };
  // Save: dispensary_id and only the fields changed here, so a field someone else changed since this page read
  // the stores stays theirs (a store with no profile yet gets a new row; the fields not sent keep their defaults).
  // True when there was nothing to save or it saved; false (with the reason shown) otherwise.
  const saveProfile=async()=>{
    const diff=changes(); if(!Object.keys(diff).length) return true;
    if(diff.demo_link && !/^https?:\/\//i.test(diff.demo_link)){ toast('The booking link should start with https://','err'); return false; }
    const b=sh.querySelector('#spfSave'); b.disabled=true; b.textContent='Saving…';
    try{ await storesSavePlan([{ dispensary_id:r.id, ...diff }]); Object.assign(start, diff); toast('Saved','ok'); return true; }
    catch(e){ toast('Couldn\'t save: '+(e.message||e),'err'); return false; }
    finally{ b.disabled=false; b.textContent='Save'; }
  };
  // planning a visit or a task from here saves a manager's changes first, and stays on the profile if that fails
  const plan=kind=>async()=>{
    if(mgr && Object.keys(changes()).length){ if(!await saveProfile()) return; reopen(); }
    if($('#sheet')!==sh) return;   // closed meanwhile
    schedTaskSheet(today, null, { account:r.name, kind, ...(kind==='visit'?{booking:'needs'}:{}), driver:mgr?(team[0]||''):schedMyName(), onSaved:reopen });
  };
  $('#spfVisit').onclick=plan('visit');
  $('#spfTask').onclick=plan('followup');
  if(!mgr) return;
  $('#spfTeamPick').onclick=()=>cellPickerSheet({ title:'Team for '+r.name, multi:true,
    options:storesPeople(storesRows()).map(n=>({ id:n, name:schedGone(n,schedKnownPeople())?n+' (can\'t be reached)':n, search:(n+' '+schedAlsoKnown(n)).trim() })), selected:team.slice(),
    onSave:names=>{ team=names.slice(); drawTeam(); } });
  $('#spfSave').onclick=async()=>{
    const had=Object.keys(changes()).length;
    if(!await saveProfile()) return;
    if($('#sheet')===sh) closeSheet();
    if(!had) toast('Nothing changed');
    else await reopen();
  };
}
function schedRender(m){
  const S=state.sched, todayIso=schedIso(new Date());
  if(S.view==='stores') return storesRender(m);
  const vis=v=>!S.sel||S.sel.has(v.canon);
  const y=S.month.getFullYear(), mo=S.month.getMonth();
  const first=new Date(y,mo,1), start=schedWeekStart(first);
  const nWeeks=Math.ceil((((first.getDay()+1)%7)+new Date(y,mo+1,0).getDate())/7);
  const days=[...Array(nWeeks*7)].map((_,i)=>schedAdd(start,i));
  // person chips: counts for THIS month
  const moDrv=new Map(); let moCount=0;
  for(const v of schedAllRows()){ const d=new Date(v.iso+'T12:00:00');
    if(d.getFullYear()===y&&d.getMonth()===mo){ moDrv.set(v.canon,(moDrv.get(v.canon)||0)+1); if(vis(v)) moCount++; } }
  for(const n of schedRoster().bas) if(!moDrv.has(n)) moDrv.set(n,0);   // nothing this month yet, still selectable
  const chips=[...moDrv.entries()].sort((a,b)=>b[1]-a[1]).filter(([n])=>n&&n!=='—').map(([n,cnt])=>{
    const col=schedColor(n), on=S.sel&&S.sel.has(n);
    return `<div class="sb-chip${on?' on':''}" data-sbd="${esc(n)}" style="${on?`background:color-mix(in srgb,${col} 24%,transparent);border-color:${col}`:''}">
      <span class="dot" style="background:${col}"></span>${esc(n)} <span class="n">${cnt}</span></div>`;
  }).join('');
  // How many entries fit before "+N". First paint uses an estimate; the
  // measure pass at the end of this function reads the REAL cell box (rows
  // stretch to fill the window on desktop) and re-renders once if it differs.
  const mobile=matchMedia('(max-width:600px)').matches, wide=matchMedia('(min-width:900px)').matches;
  // The embed on a laptop is a frame of fixed height: the fit pass makes the grid exactly as tall as
  // the frame leaves it (S._gridH), and a row may get as small as one entry plus its "+N" line
  // before the frame scrolls. Everywhere else the grid grows with the page as before.
  const fitGrid=EMBED&&wide, minFit=fitGrid?1:3;
  const chipH=mobile?11:15.7, headH=mobile?23:37;
  const rowH=fitGrid?(S._gridH||innerHeight-170)/nWeeks:wide?Math.max(118,(innerHeight-190)/nWeeks):(mobile?88:112);
  const maxChips=S._fit||Math.max(minFit,Math.min(16,Math.floor((rowH-headH-(fitGrid?14:0))/chipH)));
  const cells=days.map(d=>{
    const iso=schedIso(d), list=schedDaySorted(iso,vis);
    const dim=d.getMonth()!==mo?' dim':'', today=iso===todayIso?' today':'';
    // one extra fits when nothing is hidden (no "+N" line to leave room for)
    const shown=list.length===maxChips+1?list.length:maxChips;
    const minis=list.slice(0,shown).map(v=>{ const tst=schedTaskStatus(v,todayIso);
      return `<div class="sb-mini${tst==='overdue'?' od':''}" style="--dv:${v.color};--dvink:${schedInk(v.color)}"${v.canon==='Driver needed'?' title="Driver needed"':tst==='overdue'?' title="Overdue: not marked done"':tst==='done'?' title="Done"':''}><span class="dot"></span>${v.canon==='Driver needed'?'⚠︎ ':''}${tst==='done'?'✓ ':''}${esc(v.account)}</div>`; }).join('')
      +(list.length>shown?`<div class="sb-more">+${list.length-shown}</div>`:'');
    return `<div class="sb-cell${dim}${today}" data-sbday="${iso}">
      <div class="sb-dnum">${d.getDate()}${(()=>{const n=schedDayReportCount(iso,list);
        return n?`<span class="sb-pvdot" title="${n} post-visit report${n!==1?'s':''}">📋${n>1?n:''}</span>`:'';})()}</div>${list.length?`<div class="sb-minis">${minis}</div>`:''}</div>`;
  }).join('');
  // State switcher — shown only to people who can see more than one board (the
  // RLS grants that to Universal Admins only, i.e. Gianni + Victoria). Everyone
  // else is pinned to their own region's board and never sees these buttons.
  const boards=state.scheduleBoards||[];
  const switcher=boards.length>1?`<div class="sb-states">${boards.map(b=>
    `<button class="sb-st${b.state===state.schedState?' on':''}" data-sbst="${esc(b.state)}">${esc(b.state)}</button>`).join('')}</div>`:'';
  m.innerHTML=`<div class="sb-wrap">
    ${switcher}
    <div class="sb-nav">
      <button class="btn sm ghost" id="sbPrev">‹</button>
      <div class="sb-wk">${SCHED_MONL[mo]} ${y}</div>
      <button class="btn sm ghost" id="sbNext">›</button>
      <button class="btn sm ghost" id="sbToday">Today</button>
      <span class="grow"></span>
      <button class="btn sm ghost" id="sbStores" title="Plan by store: territory, team, sales, last visit">🏪 Stores</button>
      <button class="btn sm ghost" id="sbExport" title="Download the schedule as a spreadsheet">⬇ Export</button>
      <button class="btn sm ghost" id="sbReload" title="Re-fetch the workbook">⟳</button>
      ${state.profile?.role==='admin'?`<button class="btn sm ghost" id="sbBackup" title="Backup &amp; restore tasks">🛟</button>`:''}
      ${EMBED?`<button class="btn sm primary sb-addnav" id="sbAddNav" title="New task">＋ New task</button>`:''}
    </div>
    <div class="sb-chips">
      <div class="sb-chip${!S.sel?' on':''}" id="sbAll" style="${!S.sel?'background:var(--accent);border-color:var(--accent)':''}">All</div>
      ${chips}
    </div>
    <div class="sb-cal">
      <div class="sb-dow"><div>Sat</div><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div></div>
      <div class="sb-grid"${fitGrid&&S._gridH?` style="height:${S._gridH}px"`:''}>${cells}</div>
    </div>
    ${S.sel?`<div class="sb-filt">Showing only <b>${esc([...S.sel].join(', '))}</b>${moCount?'':' (nothing for them this month)'} <button class="btn sm ghost" id="sbClearF">Show everyone</button></div>`:''}
    ${S.netFail?`<div class="sb-warn">⚠︎ Some of the workbook didn't load (connection). Tap ⟳ to try again. A month may look empty until then.</div>`
      :S.wbStale?`<div class="sb-warn">⚠︎ The workbook didn't refresh (connection), so it may be out of date. Tap ⟳ to try again.</div>`:''}
    ${(S.undated&&S.undated.length)?`<div class="sb-warn" title="Open Distru orders with no delivery date yet. They go on the calendar once the date is set in Distru.">📦 Needs a delivery date in Distru: ${S.undated.map(o=>`<b>${esc(o.customer||o.so_num)}</b> (${esc(o.so_num)}${o.order_date?`, ordered ${esc(fmtDate(o.order_date))}`:''})`).join(' · ')}</div>`:''}
    <div class="sb-src">${moCount} visit${moCount!==1?'s':''} in ${SCHED_MONL[mo]} · tap a day for details · source: workbook + Distru orders (${esc(S.label||'')})</div>
    ${SCHED_NY_WARN.length?`<div class="sb-warn" title="${esc(SCHED_NY_WARN.join('\n'))}">⚠︎ ${SCHED_NY_WARN.length} date cell${SCHED_NY_WARN.length!==1?'s':''} in the workbook look wrong, so the week's other days were used instead. Tap to see which.</div>`:''}
  </div>
  <button class="sb-fab" id="sbAdd" title="New task">＋</button>`;
  const go=async n=>{ S.month=new Date(y,mo+n,1);
    m.innerHTML='<div class="loading"><span class="spin"></span></div>';
    if(EMBED) embedSlow(m);
    await schedLoad(S.month).catch(()=>{});
    if(state.sched===S) schedRender(m); };   // a ⟳ or Retry meanwhile draws its own calendar
  $('#sbPrev').onclick=()=>go(-1);
  $('#sbNext').onclick=()=>go(1);
  if($('#sbBackup')) $('#sbBackup').onclick=()=>schedBackupSheet();
  if($('#sbClearF')) $('#sbClearF').onclick=()=>{ S.sel=null; schedRender(m); };
  const addTask=()=>{ const t=new Date();
    schedTaskSheet(t.getFullYear()===y&&t.getMonth()===mo?schedIso(t):schedIso(first),null); };
  $('#sbAdd').onclick=addTask;
  if($('#sbAddNav')) $('#sbAddNav').onclick=addTask;   // the embed's desktop + (the round button is hidden there)
  $('#sbToday').onclick=()=>{ S.month=new Date(new Date().getFullYear(),new Date().getMonth(),1); schedRender(m); };
  // ⟳ is the user's "this looks wrong, fetch it again" — it must also clear the
  // negative markers on disk, or a month that failed once stays blank for 6 hours
  // no matter how many times they tap it.
  $('#sbReload').onclick=()=>{ schedClearMisses(state.schedState); const pp=state.schedPeople&&state.schedPeople[state.schedState||'CA']; if(pp) pp.at=0;
    state.sched=null; drawSchedule(m); };
  $('#sbExport').onclick=()=>schedExportSheet();
  $('#sbStores').onclick=()=>{ S.view='stores'; storesRender(m); };
  // switching board = a different workbook AND a different task set: drop the
  // whole cache so no CA row can survive into the NY calendar
  m.querySelectorAll('[data-sbst]').forEach(b=>b.onclick=()=>{
    const st=b.dataset.sbst; if(st===state.schedState) return;
    state.schedState=st;
    state.scheduleWb=schedBoard()?.workbook_id||null;
    if(!EMBED) try{ localStorage.setItem('ba.schedstate',st); }catch(_){}
    state.sched=null; drawSchedule(m);
  });
  $('#sbAll').onclick=()=>{ S.sel=null; schedRender(m); };
  m.querySelectorAll('[data-sbd]').forEach(c=>c.onclick=()=>{
    if(!S.sel) S.sel=new Set();
    const n=c.dataset.sbd;
    if(S.sel.has(n)) S.sel.delete(n); else S.sel.add(n);
    if(!S.sel.size) S.sel=null;
    schedRender(m);
  });
  m.querySelectorAll('[data-sbday]').forEach(c=>c.onclick=()=>schedDaySheet(c.dataset.sbday));

  // ── fit pass ───────────────────────────────────────────────────────────
  // Grow the grid into whatever space is actually left under it, then count
  // how many entry rows truly fit in a cell and re-render once if that beats
  // the estimate. Self-correcting for any window size or surrounding chrome.
  requestAnimationFrame(()=>{
    const grid=m.querySelector('.sb-grid'), cell=m.querySelector('.sb-cell');
    if(!grid||!cell||!grid.isConnected) return;
    if(fitGrid){
      // The embed's frame: the grid gets exactly the room everything else leaves (the month row and
      // chips above it; the filter, warning and source lines and the padding under it), so the frame
      // scrolls only when even the smallest rows can't fit.
      const de=document.documentElement, wrap=m.querySelector('.sb-wrap');
      const gh=grid.getBoundingClientRect().height;
      const rest=wrap.getBoundingClientRect().bottom+scrollY-gh;
      const floor=nWeeks*(parseFloat(getComputedStyle(cell).minHeight)||0);
      let want=Math.max(floor, Math.floor(de.clientHeight-rest));
      grid.style.height=want+'px';
      const over=de.scrollHeight-de.clientHeight;   // a line that wrapped once the grid changed size
      if(over>0 && want-over>=floor){ want-=over; grid.style.height=want+'px'; }
      S._gridH=want;
    } else if(matchMedia('(min-width:900px)').matches){
      const cal=m.querySelector('.sb-cal'), src=m.querySelector('.sb-src');
      const slack=innerHeight-cal.getBoundingClientRect().bottom-(src?src.getBoundingClientRect().height:0)-14;
      if(slack>12) grid.style.minHeight=(grid.getBoundingClientRect().height+slack)+'px';
    }
    const cs=getComputedStyle(cell), dn=cell.querySelector('.sb-dnum');
    const head=(dn?dn.getBoundingClientRect().height+parseFloat(getComputedStyle(dn).marginBottom||0):22);
    const sample=cell.parentElement.querySelector('.sb-mini');
    const row=sample?sample.getBoundingClientRect().height+parseFloat(getComputedStyle(sample).marginBottom||0):15.7;
    // a fixed-height cell can't grow, so the "+N" line has to fit under the entries too; measured on
    // a second-week cell, which has the row's top border
    const probe=fitGrid?(grid.children[7]||cell):cell;
    const more=fitGrid?((m.querySelector('.sb-more')||{}).offsetHeight||14):0;
    const avail=probe.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0)-head;
    const fit=Math.max(minFit,Math.min(16,Math.floor((avail-more)/row)));
    S._fitPass=(S._fitPass||0)+1;
    if(fit!==maxChips && S._fitPass<4){ S._fit=fit; schedRender(m); }
    else S._fitPass=0;
  });

  // window resize → drop the measured fit and re-render
  if(!state._sbResize){ state._sbResize=true;
    let t; addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=>{
      const host=$('#main'); if(host&&host.querySelector('.sb-cal')){ Object.assign(state.sched||{},{_fit:null,_gridH:null}); schedRender(host); }
    },180); });
  }
}

/* ═══════════════════ EMBED: the schedule inside the Production Pipeline ═══════════════════ */
/* pipeline.html shows this page in a same-origin iframe: ba/index.html?embed=schedule&board=CA
   Same site, same Supabase project and storage key, so the pipeline's Google sign-in is this
   page's sign-in. It runs ONLY the schedule (full task editing, exactly as the BA app allows;
   the database's row rules decide). It never draws the login form, the password screens, the top
   bar, the view switcher, the tab bars, the update bar or any Sign out: this app's Sign out ends
   the person's sessions everywhere, the pipeline included. The pipeline owns signing in and out.
   Messages, each side checking this origin and the other window:
     to the pipeline:   {source:'ba-schedule', status:'loading'|'ready'|'signed-out'|'no-access'|'error', board, message?}
     from the pipeline: {source:'pipeline', type:'show'|'refresh'}
       show    = the tab just became visible: redraw at the real size, and when the last load is
                 over 10 minutes old re-read the workbook rows, tasks, Distru orders and post-visit
                 reports in place (the calendar stays up with what it has while they load)
       refresh = reload everything now, the same as the ⟳ button; while a load is still on its
                 way (it may never answer) it starts that load again
   While the schedule is on screen, the same in-place refresh also runs every 10 minutes. */
const EMBED_STALE_MS = 10*60*1000, EMBED_SLOW_MS = 15000;
let embedStatus='loading', embedGen=0, embedUid=null, embedLoadedAt=0, embedRefreshing=false, embedWired=false;
function embedPost(status, message){
  embedStatus=status;
  if(window.parent===window) return;   // opened on its own: nobody to tell
  const msg={ source:'ba-schedule', status, board: state.schedState || EMBED_BOARD || null };
  if(message) msg.message=String(message);
  try{ window.parent.postMessage(msg, location.origin); }catch(_){}
}
const embedWhy=e=>/timeout/.test(String(e&&e.message))
  ? 'The connection stalled. Check it, then tap Retry.' : String((e&&e.message)||e||'Something went wrong.');
function embedMain(){
  let m=$('#main');
  if(!m){ app.innerHTML='<main id="main"></main>'; m=$('#main'); }
  return m;
}
function embedMessage(html){ embedMain().innerHTML=`<div class="card embed-msg">${html}</div>`; }
function embedReady(){ embedLoadedAt=Date.now(); embedPost('ready'); }
// the caller has already drawn its own card (the workbook one carries a Retry)
function embedFailed(message){ embedPost('error', message); }
function embedError(message){
  embedMessage(`<b>Couldn’t load the schedule.</b><p class="small muted">${esc(message)}</p>
    <button class="btn primary sm" id="embedRetry" style="margin-top:10px">Retry</button>`);
  $('#embedRetry').onclick=()=>bootEmbed();
  embedFailed(message);
}
// A load that never answers (a request that hangs in a dead zone) must not leave a spinner up for
// good: after 15 seconds the loading screen in `m` offers Retry, which starts the schedule again.
function embedSlow(m){
  const el=m && m.querySelector('.loading'); if(!el) return;
  setTimeout(()=>{
    if(!el.isConnected || el.querySelector('.embed-slow')) return;
    el.insertAdjacentHTML('beforeend', `<div class="embed-slow muted">This is taking longer than it should.<button class="btn sm primary">Retry</button></div>`);
    el.querySelector('.embed-slow button').onclick=()=>bootEmbed();
  }, EMBED_SLOW_MS);
}
// Is the schedule on screen? The browser tab must be showing, and so must this frame: the pipeline
// keeps it loaded but hidden (visibility:hidden) while another of its pages is open.
function embedOnScreen(){
  if(document.hidden) return false;
  try{
    const f=window.frameElement; if(!f) return true;
    if(f.checkVisibility) return f.checkVisibility({visibilityProperty:true, checkVisibilityCSS:true});
    return f.getClientRects().length>0 && f.ownerDocument.defaultView.getComputedStyle(f).visibility!=='hidden';
  }catch(_){ return true; }
}
function embedNoAccess(){
  embedMessage(`<b>The delivery and visit schedule isn’t on for your account.</b><p class="small muted">Ask Gianni.</p>`);
  embedPost('no-access');
}
function embedSignedOut(){
  embedGen++; schedGen++;                         // nothing still loading may paint over this card
  state._sheetReturn=null; $('#sheet')?.remove(); closeSheet2();   // no half-filled form outlives the sign-in
  state.session=null; state.profile=null; state.dispPending=null; embedUid=null;
  schedForget();                                  // memory only in the embed
  embedMessage(`<b>Sign in to the Production Pipeline to see the delivery and visit schedule.</b>`);
  embedPost('signed-out');
}
function embedWire(){
  if(embedWired) return; embedWired=true;
  // The sign-in is the pipeline's. Losing it there (or anywhere on this site) signs this
  // frame out too; signing in there brings the schedule back without a reload.
  supabase.auth.onAuthStateChange((ev, s)=>{
    if(ev==='INITIAL_SESSION') return;            // bootEmbed reads the starting session itself
    if(!s){ if(embedStatus!=='signed-out') setTimeout(embedSignedOut,0); return; }
    state.session=s;
    // deferred: supabase calls made inside this callback can stall the client
    if(embedStatus==='signed-out' || (embedUid && s.user && s.user.id!==embedUid)) setTimeout(bootEmbed,0);
  });
  addEventListener('message', e=>{
    if(window.parent===window || e.source!==window.parent || e.origin!==location.origin) return;
    const d=e.data; if(!d || typeof d!=='object' || d.source!=='pipeline') return;
    if(d.type==='show') embedShow();
    else if(d.type==='refresh') embedRefresh();
  });
  // The crew keeps the pipeline open all day and still plans in the sheet: while the schedule is
  // on screen, re-read it in place once the last load is over 10 minutes old (checked every minute,
  // and as soon as the browser tab comes back).
  const tick=()=>{ if(embedOnScreen() && Date.now()-embedLoadedAt>=EMBED_STALE_MS) embedRefreshInPlace(); };
  setInterval(tick, 60*1000);
  document.addEventListener('visibilitychange', tick);
}
async function bootEmbed(){
  const gen=++embedGen;
  schedGen++;                                     // a load from an earlier boot must not paint over this one
  state.adminTab='sched'; state.baTab='sched';    // what schedShowing() asks: the schedule is all there is here
  state.sched=null; state.profile=null; state.dispPending=null;
  document.title='Delivery and visit schedule';
  app.innerHTML='<main id="main"><div class="loading"><span class="spin"></span> Loading the schedule…</div></main>';
  embedSlow($('#main'));
  embedPost('loading');
  if(!supabase) return embedError('The schedule isn’t set up on this device.');
  embedWire();
  let session=null;
  try{ ({ data:{ session } } = await withTimeout(supabase.auth.getSession())); }
  catch(e){ if(gen===embedGen) embedError(embedWhy(e)); return; }
  if(gen!==embedGen) return;
  if(!session) return embedSignedOut();
  state.session=session; embedUid=session.user.id;
  // Round 1, all at once: who you are, which boards you may see, and the store list (only the
  // columns the schedule reads). The store list isn't waited for here: schedLoad waits for it
  // just before it pairs reports and Distru orders, so the workbook and tasks start sooner.
  const dispP=withTimeout(readStores('id,name,address,lat,lng,license,state,private,retail,sales_key,pistil_name,aliases',
      q=>q.eq('active',true)))
    .then(r=>r, e=>({ data:null, error:e }));
  const [prof, boardsOk]=await Promise.all([
    withTimeout(supabase.from('profiles').select('id,role,region,home_region,active,full_name').eq('id',embedUid).maybeSingle())
      .then(r=>r, e=>({ data:null, error:e })),
    loadScheduleBoards(EMBED_BOARD),
  ]);
  if(gen!==embedGen) return;
  state.profile=(prof&&prof.data)||null;          // only the 🛟 button and the default board read it
  if(!boardsOk) return embedError('The schedule settings didn’t load. Check the connection, then tap Retry.');
  // locked to the board asked for, when the database gave this person that board (no switcher)
  if(EMBED_BOARD) state.scheduleBoards=state.scheduleBoards.filter(b=>b.state===EMBED_BOARD);
  schedPickBoard(EMBED_BOARD);
  if(!state.scheduleWb) return embedNoAccess();
  state.dispPending=dispP.then(r=>{
    if(gen!==embedGen) return;
    if(r&&r.error) console.warn('schedule: the store list did not load', r.error);
    const rows=(r&&r.data)||[];
    try{ state.dispensaries=rows.sort(dispSort); }catch(_){ state.dispensaries=rows; }
    state.dispPending=null;
  });
  try{ await drawSchedule($('#main')); }          // reports ready, or error from its own Retry card
  catch(e){ if(gen===embedGen) embedError(embedWhy(e)); }
}
async function embedShow(){
  if(embedStatus==='loading' || embedStatus==='no-access') return;
  if(embedStatus==='signed-out'){
    // the sign-in may have landed while this frame wasn't listening
    let s=null; try{ ({ data:{ session:s } } = await supabase.auth.getSession()); }catch(_){}
    if(s && embedStatus==='signed-out') bootEmbed();
    return;
  }
  if(embedStatus==='error') return bootEmbed();
  const S=state.sched, m=$('#main');
  if(!S || !S.ready || !m || !m.querySelector('.sb-cal')) return;   // still loading a month: it paints itself
  Object.assign(S, {_fit:null, _fitPass:0, _gridH:null});   // measured while hidden, or at another size
  schedRender(m);
  if(Date.now()-embedLoadedAt >= EMBED_STALE_MS) embedRefreshInPlace();
}
// Re-read the workbook rows, the tasks, the Distru orders and the post-visit reports IN PLACE: the
// calendar stays up with what it has until the new copy is in. A part that fails keeps its last copy
// (the workbook says so in a quiet line under the calendar, the tasks in a toast). Runs on 'show' and
// from the on-screen timer, when the last load is over 10 minutes old.
async function embedRefreshInPlace(){
  const S=state.sched;
  if(embedRefreshing || embedStatus!=='ready' || !S || !S.ready) return;
  embedRefreshing=true;
  try{
    // a request that never answers must not stop every later refresh: give up waiting after 45 s
    // (a late answer still lands in state.sched and shows on the next draw)
    await withTimeout(Promise.all([schedRefreshWorkbook().catch(()=>false), schedReloadTasks(),
      schedLoadActivity().catch(()=>{}), schedLoadOrders(schedBoard()).catch(()=>{})]), 45000).catch(()=>{});
    if(state.sched!==S) return;                   // reloaded, switched board or signed out meanwhile
    schedRebuildIndex();
    embedLoadedAt=Date.now();                     // failed or not: the next try is in 10 minutes, not every minute
    const m=$('#main'); if(m && m.querySelector('.sb-cal')) schedRender(m);
  }finally{ embedRefreshing=false; }
}
function embedRefresh(){
  // also while loading: a load that never answers must be restartable from the pipeline's Refresh
  const m=$('#main');
  if(embedStatus==='ready' && state.sched && m){  // the ⟳ button
    schedClearMisses(state.schedState); state.sched=null;
    drawSchedule(m).catch(e=>embedError(embedWhy(e)));
    return;
  }
  bootEmbed();
}

/* ─────────────────────────── go ─────────────────────────── */
if(EMBED) bootEmbed(); else boot();
// not in the embed: a worker the BA app already installed still serves the frame, and the
// pipeline page itself is outside its scope
if(!EMBED && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
// local-preview debug hook (dev servers only; never active on the deployed host)
if(location.hostname==='127.0.0.1'||location.hostname==='localhost')
  window.__ba={ get state(){return state}, tripSheet, expenseSheet, fixExpenseSheet, adminEditItem, dispSort, baDispensaries, dispChipsHtml, openSheet, closeSheet, checkForUpdate, showUpdateBar, renderDayGrid, gridCtx, profileTypeOpts, adminRegionPicker, isRegionalAdmin, isUniversalAdmin, viewSwitcher, recalcMiles, userTypeLabel, userCat, drawSchedule, renderAdmin };
</script>
