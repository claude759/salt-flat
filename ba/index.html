<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Wizard Trees — Mileage & Expenses</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WT Field">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>/* ?embed=schedule = the schedule alone, inside the Production Pipeline's iframe. Flagged before the
   first paint so the light look applies at once instead of flashing the dark app first. */
if(new URLSearchParams(location.search).get('embed')==='schedule')document.documentElement.classList.add('embed');</script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7eaf0; --muted:#9aa3b2; --accent:#7c5cff; --accent2:#9d86ff;
    --green:#2fbf71; --yellow:#e7b416; --orange:#f08a24; --red:#ef4d56;
    --shadow:0 6px 24px rgba(0,0,0,.35);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  a{color:var(--accent2);text-decoration:none}
  .muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
  .row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap}
  .grow{flex:1} .right{margin-left:auto}
  .hide{display:none!important}

  /* layout */
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  /* desktop: give the app room (tables, day-grid, calendar) — phones keep the 560px column */
  @media(min-width:900px){ #app,.tabbar{max-width:1100px} }
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .brand b{font-size:15px} .brand .sub{color:var(--muted);font-size:11px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
  .pill.admin{color:#fff;background:var(--accent);border-color:var(--accent)}
  .pill.ev{color:var(--accent2);border-color:color-mix(in srgb, var(--accent2) 45%, transparent);font-size:10px;padding:1px 7px;white-space:normal}
  main{flex:1;padding:14px 14px calc(96px + var(--safe-b));display:flex;flex-direction:column;gap:14px}

  /* cards & controls */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 10px;font-size:14px}
  label.fl{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input.needs,select.needs,textarea.needs{border-color:var(--red);box-shadow:0 0 0 2px rgba(239,77,86,.22)}
  textarea{min-height:60px;resize:vertical}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;
    padding:12px 15px;cursor:pointer;font:inherit;font-weight:650;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;min-height:46px}
  .btn:hover{border-color:var(--accent)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:#fff;background:var(--red);border-color:var(--red)}
  .btn.ok{color:#fff;background:var(--green);border-color:var(--green)}
  .btn.sm{min-height:34px;padding:6px 11px;border-radius:9px;font-size:13px}
  .btn.block{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:650;
    padding:9px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  /* trip measuring-method tiles (icon + label + caption) */
  .mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  .mtiles button{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);font:inherit;
    border-radius:12px;padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .mtiles button .mi{font-size:22px;line-height:1.15}
  .mtiles button b{font-size:12.5px;color:var(--text);font-weight:650}
  .mtiles button small{font-size:10px;line-height:1.25;text-align:center;padding:0 2px}
  .mtiles button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
  /* "new version available" refresh bar */
  #updbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;max-width:92%;
    background:var(--accent);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:650;
    padding:11px 18px;box-shadow:0 6px 24px rgba(0,0,0,.4);cursor:pointer;animation:updpop .25s ease}
  @keyframes updpop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  /* multi-select dispensary dropdown (checkbox list) */
  .msel{position:relative;margin-top:6px}
  .msel-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
    font:inherit;padding:11px 12px;cursor:pointer;text-align:left}
  .msel-toggle .msel-sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msel-caret{color:var(--muted);flex:none}
  .msel.open .msel-caret{transform:rotate(180deg)}
  .msel-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:264px;overflow-y:auto;padding:4px}
  .msel-search{position:sticky;top:0;z-index:2;width:100%;margin:0 0 4px;padding:9px 10px;font:inherit;font-size:14px;
    color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;outline:none}
  .msel-search:focus{border-color:var(--accent)}
  .msel-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .msel-opt:hover{background:var(--panel)}
  .msel-opt input{width:17px;height:17px;flex:none;accent-color:var(--accent);margin:0}
  .g-rt{width:15px;height:15px;min-height:0;flex:none;accent-color:var(--muted);cursor:pointer;margin:0;opacity:.8}
  .g-rt:checked{accent-color:var(--accent);opacity:1}
  /* tap-to-search replacement for long native selects (searchifySelect) */
  .selpick{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;min-height:44px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between}
  .selpick::after{content:'▾';color:var(--muted);margin-left:8px;flex:none}
  .selpick.needs{border-color:var(--red)}
  .msel-toggle.needs{border-color:var(--red);box-shadow:0 0 0 2px rgba(239,77,86,.22)}

  /* big action buttons (BA home) */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .bigbtn{--c:var(--accent);display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 10px;border-radius:16px;
    background:linear-gradient(165deg, color-mix(in srgb, var(--c) 20%, var(--panel)) 0%, color-mix(in srgb, var(--c) 6%, var(--panel)) 100%);
    border:1.5px solid color-mix(in srgb, var(--c) 45%, transparent);cursor:pointer;font:inherit;color:var(--text);
    box-shadow:0 4px 16px color-mix(in srgb, var(--c) 16%, transparent);transition:transform .12s cubic-bezier(.34,1.56,.64,1),filter .12s}
  .bigbtn:hover{filter:brightness(1.08)} .bigbtn:active{transform:scale(.97)}
  .bigbtn .ic{font-size:30px;filter:saturate(1.2)}
  .bigbtn b{font-size:15px;color:color-mix(in srgb, var(--c) 45%, var(--text))}
  .bigbtn.b-miles{--c:#3d9bff} .bigbtn.b-exp{--c:#2fbf71}
  /* segmented state filter (All / CA / FL / NY) */
  .segbtns{display:flex;gap:6px;flex-wrap:wrap}
  .segbtn{padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .segbtn:hover{border-color:var(--accent2);color:var(--text)}
  .segbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* multi-leg trip logger */
  .legcard{border:1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);border-radius:14px;padding:13px;margin-top:9px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, var(--panel)) 0%, var(--panel) 70%)}
  .leghd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .leghd b{font-size:15px}
  .leghd.can{cursor:pointer;margin:-4px -4px 6px;padding:4px;border-radius:9px}
  .leghd.can:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
  .leghd .hdr{display:flex;align-items:center;gap:8px;min-width:0}
  .legcol{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--muted);
    font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:5px 8px;flex:none}
  .leghd.can:hover .legcol{color:var(--text);border-color:var(--accent2)}
  /* a collapsed leg = a blue mileage pill (same colour language as the day-view bubbles),
     text centred; the ✕ floats at the right edge */
  .legsum{--c:#3d9bff;position:relative;text-align:center;border:1.5px solid color-mix(in srgb, var(--c) 48%, transparent);
    border-radius:14px;padding:10px 36px;margin-top:9px;cursor:pointer;
    background:linear-gradient(100deg, color-mix(in srgb, var(--c) 20%, var(--panel)) 0%, color-mix(in srgb, var(--c) 6%, var(--panel)) 100%);
    box-shadow:0 3px 12px color-mix(in srgb, var(--c) 14%, transparent), inset 0 1px 0 rgba(255,255,255,.05);transition:filter .12s}
  .legsum:hover{filter:brightness(1.1)}
  /* start → dest on ONE line: each end ellipsizes on its own (flex-shrink trims the long
     address harder than the short store name), so both stay readable at any width */
  .legsum .t{display:flex;justify-content:center;align-items:baseline;gap:5px;font-size:13.5px;white-space:nowrap;min-width:0}
  .legsum .t .pl{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .legsum .t .ar{color:var(--muted);flex:none}
  .legsum .lgn{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:color-mix(in srgb, var(--c) 58%, var(--text))}
  /* the day reads as one chained journey: leg ─│─ miles ─│─↓─ leg …
     drawn as SVG strokes (stem flows into a round-capped chevron) so it reads as ONE
     arrow interrupted by the miles chip, not stacked glyphs */
  .legarrow{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:8px;user-select:none}
  .legarrow svg{display:block;color:color-mix(in srgb, #3d9bff 45%, var(--line))}
  .legarrow svg path{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .legsum .lgn .lmi{font-size:10.5px;color:color-mix(in srgb, var(--c) 28%, var(--text))}
  .legx{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 4px;line-height:1}
  .legx:hover{color:var(--red)}

  /* totals */
  .totbar{display:flex;gap:8px}
  .tot{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 9px}
  .tot .k{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tot .v{font-size:clamp(13px,4vw,20px);font-weight:750;margin-top:2px;white-space:nowrap}
  .tot.sum .v{color:var(--accent2)}

  /* list items */
  .item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;
    justify-content:center;font-size:17px;flex:none}
  .item .t{font-weight:600} .item .s{font-size:12px;color:var(--muted)}
  .item .amt{margin-left:auto;font-weight:700;white-space:nowrap}
  .item.todo-fix{cursor:pointer;border-radius:10px;margin:0 -6px;padding-left:6px;padding-right:6px}
  .item.todo-fix:active{background:var(--panel2)}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.draft{color:var(--muted)} .badge.submitted{color:var(--yellow);border-color:var(--yellow)}
  .badge.approved{color:var(--green);border-color:var(--green)}
  .badge.rejected{color:var(--red);border-color:var(--red)}
  /* Book in QuickBooks (only for ba_qbo_can_book(): the person's QuickBooks section, the Book card, the Review tags) */
  .qbo-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);white-space:nowrap;vertical-align:1px}
  .qbo-tag.in{color:var(--green);border-color:var(--green)} .qbo-tag.part{color:var(--yellow);border-color:var(--yellow)}
  .qbo-tag.ready{color:var(--accent2);border-color:var(--accent2)} .qbo-tag.wait{color:var(--text)}
  .qbo-tag.check{color:var(--yellow);border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,transparent)}
  .qbo-tag.check::before{content:'⚠ '}
  .qbo-warn{color:var(--yellow)} .qbo-bad{color:var(--red)} .qbo-good{color:var(--green)}
  .qbo-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .qbo-row .ic{flex:none;width:18px;text-align:center;line-height:1.4}
  .qbo-row .btn{flex:none}
  .qbo-kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .qbo-kv>span:last-child{text-align:right;min-width:0}
  .qbo-head{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:14px 0 4px}
  .qbo-line{border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-top:8px;background:var(--panel2)}
  .qbo-line.pick{border-color:var(--red)}
  .qbo-line .selpick{min-height:38px;padding:7px 10px;font-size:14px;background:var(--panel);min-width:0}
  .qbo-line .selpick>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qbo-link{background:none;border:0;padding:0;color:var(--accent2);font:inherit;font-size:12px;cursor:pointer}
  .qbo-items{margin-top:6px}
  .qbo-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
  .qbo-item .btn{min-height:28px;padding:3px 9px;font-size:12px;flex:none}
  .qbo-status{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:12px;background:var(--panel2);font-size:13px}
  .qbo-status.ok{border-color:var(--green)} .qbo-status.bad{border-color:var(--red)}
  /* the Payroll list (bookers only): per check date and company, what to type into Gusto for each person; one column on
     phones, the person beside the amounts on wider screens */
  .pay-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:11px 0;border-top:1px solid var(--line)}
  .pay-row.quiet{gap:2px;padding:8px 0;font-size:13px;color:var(--muted)}
  .pay-row.quiet b{color:var(--text);font-weight:650}
  .pay-who{min-width:0}
  .pay-who .badge{vertical-align:1px}
  .pay-kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding:2px 0}
  .pay-kv>span:first-child{min-width:0}
  .pay-kv>span:last-child{text-align:right;white-space:nowrap;flex:none}
  .pay-adj{border-left:2px solid var(--line);padding:3px 0 3px 9px;margin:4px 0}
  .pay-type{border-top:1px dashed var(--line);margin-top:4px;padding-top:7px;font-size:14px;align-items:center}
  .pay-type .v{font-size:16px;font-weight:800}
  .pay-copy{min-height:28px;padding:3px 9px;font-size:12px;margin-left:6px}
  .pay-note{margin-top:8px}
  .totbar.pay-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  @media(min-width:760px){ .pay-row:not(.quiet){grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px} }
  .thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none;border:1px solid var(--line)}

  /* bottom tab bar (BA) */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
    display:flex;background:rgba(23,26,33,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-b)}
  .tabbar button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;
    font-weight:650;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button .ic{font-size:20px}
  .tabbar button.on{color:var(--accent2)}

  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;
    justify-content:center}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;
    max-width:560px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + var(--safe-b))}
  /* mobile: vh ignores the browser's URL bar, clipping tall sheets' tops — size to the VISIBLE viewport */
  .sheet{max-height:min(92vh,calc(100dvh - 14px))}
  @media(min-width:560px){.backdrop{align-items:center}.sheet{border-radius:18px}}
  .sheetx{position:sticky;top:0;float:right;width:32px;height:32px;flex:none;border-radius:9px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:15px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;margin:-4px -4px 4px 10px;z-index:3}
  .sheetx:hover{color:var(--text);border-color:var(--muted)}
  .sheet h3{margin:2px 0 4px}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translateX(-50%);z-index:80;
    background:#000;border:1px solid var(--line);color:#fff;padding:10px 15px;border-radius:11px;font-size:13px;
    box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  #toast.err{border-color:var(--red)} #toast.ok{border-color:var(--green)}
  #toast.show .toast-act{pointer-events:auto}
  .toast-act{margin-left:9px;background:transparent;border:1px solid rgba(255,255,255,.45);color:inherit;
    font:inherit;font-weight:800;padding:2px 10px;border-radius:999px;cursor:pointer}

  /* spinner */
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);justify-content:center;padding:24px}

  /* admin table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;white-space:nowrap}

  /* collapsible dispensary groups */
  .dghead{display:flex;align-items:center;gap:8px;padding:11px 2px;cursor:pointer;border-top:1px solid var(--line);user-select:none}
  .dghead .caret{color:var(--muted);width:12px;text-align:center;flex:none}
  .dghead b{font-size:14px} .dghead:hover b{color:var(--accent2)}

  .auth-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;gap:16px;max-width:420px;margin:0 auto}
  .hero{text-align:center} .hero .logo{width:56px;height:56px;border-radius:15px;margin:0 auto 12px;font-size:28px}

  /* ── ?embed=schedule: the schedule inside the Production Pipeline, a same-origin iframe of fixed
     height that scrolls inside itself. Light like the pipeline's board; the BA app itself stays dark. ── */
  html.embed{

  html.embed input,html.embed select,html.embed textarea{color-scheme:light}

    html.embed .sb-wrap{padding-bottom:14px}

<body>
<div id="app"><div class="loading"><span class="spin"></span> Loading…</div></div>
<div id="toast"></div>
<div id="printarea"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ─────────────────────────── embed mode ─────────────────────────── */
// ba/index.html?embed=schedule&board=CA shows ONLY the schedule, for the Production Pipeline's iframe
// (same site, same Supabase sign-in). See bootEmbed() near the end of this script.
const EMBED = new URLSearchParams(location.search).get('embed')==='schedule';
const EMBED_BOARD = EMBED ? (new URLSearchParams(location.search).get('board')||'').trim().toUpperCase() : '';

/* ─────────────────────────── config ─────────────────────────── */
// Paste your Supabase project URL + anon (public) key below, OR set them once at
// runtime via the gear on the sign-in screen (saved to this device's localStorage).
// The embed always uses the pipeline's project: a saved override would mean a different sign-in.
const CONFIG = {
  url:  (!EMBED && localStorage.getItem('ba.url'))  || 'https://dhiqhgtmelxwelyoowle.supabase.co',
  anon: (!EMBED && localStorage.getItem('ba.anon')) || 'sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14',
};
const CONFIGURED = !/YOUR-PROJECT|YOUR-ANON-KEY/.test(CONFIG.url + CONFIG.anon);

let supabase = null;
if (CONFIGURED) {
  supabase = createClient(CONFIG.url, CONFIG.anon, {
    auth: { persistSession: true, autoRefreshToken: true, experimental: { passkey: true } },
  });
}

/* ─────────────────────────── state ─────────────────────────── */
const state = {
  session: null, profile: null, settings: null, loadError: null,
  period: null, periods: [], dispensaries: [],
  baTab: 'home', adminTab: 'dash', adminRegion: 'all', dispOpen: {}, preview: null, gridMode: 'miles', recentPlaces: [],
};
const APP_VERSION = '2026-11-25.2';   // shown top-left; bump on each deploy so we can confirm the live build
const REGIONS = ['CA','FL','NY'];
// profile types map to role|region: Universal Admin = admin|, {R} Admin = admin|{R}, {R} BA = ba|{R}
const isRegionalAdmin = ()=> state.profile?.role==='admin' && !!state.profile?.region;   // admin scoped to one state
const isUniversalAdmin = ()=> state.profile?.role==='admin' && !state.profile?.region;
// options for the profile-type <select>; a regional admin can only pick their own region's types
// human label for a profile's type (Universal Admin / NY Admin / NY BA …)
function userTypeLabel(b){
  if(b.role==='admin') return b.region ? `${b.region} Admin` : 'Universal Admin';
  return b.region ? `${b.region} BA` : 'BA';
}
// which filter bucket a user falls in: 'universal', or their region code
function userCat(b){ return (b.role==='admin' && !b.region) ? 'universal' : (b.region||''); }
function profileTypeOpts(sel, lockRegion){
  const regions = lockRegion ? [lockRegion] : REGIONS;
  const o=(v,label)=>`<option value="${v}" ${sel===v?'selected':''}>${label}</option>`;
  let html = lockRegion ? '' : o('admin|','Universal Admin');
  for(const r of regions){ html += o('ba|'+r, `${r} Brand Ambassador`) + o('admin|'+r, `${r} Admin`); }
  return html;
}
// Order matters twice: index 0 is treated as "not set yet" by the receipt-OCR autofill,
// and 'Other' stays last as the catch-all. New categories go in between.
// Mirrored in supabase/functions/extract-receipt/index.ts — keep the two in step.
const EXPENSE_CATEGORIES = ['Travel/Parking/Tolls','Meals','Food for retailer','Flights','Lodging','Displays','Events','Supplies','Quality Control','Other'];
// category <select> options: a stored value that's NOT in the list still renders as
// itself (selected) — otherwise the browser silently shows the first option and the
// row looks categorized when it isn't
const catOptions = cur => (cur && !EXPENSE_CATEGORIES.includes(cur) ? [cur,...EXPENSE_CATEGORIES] : EXPENSE_CATEGORIES)
  .map(c=>`<option ${cur===c?'selected':''}>${esc(c)}</option>`).join('');
const PAYMENTS = [['reimbursement','💵 Reimburse me'],['company','💳 Company card'],['company_bank','🏦 Company bank']];
// company-PAID methods (card or bank) are never reimbursed to the BA — one predicate so a
// future method can't silently land in the reimburse bucket at some call sites only
const isCoPaid = p => p==='company' || p==='company_bank';
// Sales-titled hours (Joanna, Jesse) vs Brand-Ambassador hours. Both attribute to the
// stores driven to that day, but they're different budgets — reports keep them apart.
const isSalesHours = h => /^sales$/i.test((h&&h.job)||'') || /^sales$/i.test((h&&h.kind)||'');
const payLabel = p => p==='company' ? '💳 Company card' : p==='company_bank' ? '🏦 Company bank' : '💵 Reimburse';
const payFlag  = p => p==='company' ? '💳' : p==='company_bank' ? '🏦' : '';
function expSplit(E){ let reimb=0, card=0; (E||[]).forEach(x=>{ if(isCoPaid(x.payment)) card+=Number(x.amount||0); else reimb+=Number(x.amount||0); }); return {reimb, card}; }
// Rows the event sync writes from QuickBooks (source 'books', supabase/ba-expense-events.sql): company-paid event
// costs owned by the Automation profile. Reports show them with their event, never as anyone's field work (no visit,
// no to-do, no approval), and every editor opens them read-only: the books are where they get fixed.
const BOOKS_NOTE = 'Synced from QuickBooks. Fix it in the books.';
const BOOKS_OWNER = 'From the books';
const isBooks = x => !!x && x.source==='books';
const eventPill = name => name ? `<span class="pill ev" title="Event">🎪 ${esc(name)}</span>` : '';
// The event columns (event_name, event_id, books_key, source) arrive with supabase/ba-expense-events.sql. Until it is
// applied, a select that names them fails (Postgres 42703, undefined column), so the explicit expenses selects ask
// once with them and fall back to the plain list; select('*') reads pick them up on their own.
const EXP_EVENT_COLS = 'event_name,event_id,books_key,source';
let expEventCols = null;   // null = not asked yet; true / false = the columns exist / don't
const missingColumn = e => !!e && (e.code==='42703' || /column .* does not exist/i.test(e.message||''));
// where(builder) adds the filters, e.g. q=>q.gte('expense_date',start); resolves to the usual {data, error}
async function selectExpenses(cols, where){
  if(expEventCols!==false){
    const r = await where(supabase.from('expenses').select(cols+','+EXP_EVENT_COLS));
    if(!missingColumn(r.error)){ if(!r.error) expEventCols=true; return r; }
    expEventCols=false;
  }
  return where(supabase.from('expenses').select(cols));
}

/* ─────────────────────────── helpers ─────────────────────────── */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
// a credit (a negative amount: a refund or vendor credit synced from the books) reads -$12.34, never $-12.34
const money = n => { const v=Number(n)||0, s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (v<0&&s!=='0.00'?'-':'')+'$'+s; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';

function toast(msg, kind='', ms=2600) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className=''; }, ms);
}
// The QuickBooks guard (supabase/ba-qbo-bookings.sql, ba_qbo_held_msg) refuses a change to an item or a period that is in
// QuickBooks or on its way there, in plain words that follow the booking's status and say what the person asking can do:
// queued "This is on its way to QuickBooks. Cancel that booking first." (or "Ask Gianni to cancel that booking first.");
// working "This is being booked in QuickBooks right now as JE 123138 Cesar, so try again in a few minutes."; undo asked
// "This is being taken out of QuickBooks right now, so try again in a few minutes."; booked "This is in QuickBooks as JE
// 123138 Cesar. Undo the booking first." (or "... Ask Gianni to undo that booking first.", or "... booked by hand, so it
// can't change here. ..."); "This period ..." for a period. Its words as they are; '' for any other error.
const qboRefusal = e => { const m=String((e&&e.message)||''); return /in QuickBooks as JE|in QuickBooks right now|out of QuickBooks right now|on its way to QuickBooks/.test(m) ? m : ''; };
// where a refused period's booked part is, in the guard's terms: "The period stays approved because part of it ..."
const qboPartWords = m => /on its way to QuickBooks/.test(m) ? 'is on its way to QuickBooks' : /out of QuickBooks right now/.test(m) ? 'is being taken out of QuickBooks right now'
  : /in QuickBooks right now/.test(m) ? 'is being booked in QuickBooks right now' : 'is in QuickBooks';
// an error toast: the guard's own words, held long enough to read; anything else as before ("lead: message")
function errToast(e, lead){
  const g=qboRefusal(e); if(g) return toast(g,'err',9000);
  const m=(e&&e.message)||(typeof e==='string'?e:'');
  toast(lead ? (m ? lead+': '+m : lead) : m, 'err');
}
// A toast carrying one action (Undo after a delete). Separate from toast() so the
// plain-text path keeps its exact behaviour; stays up longer because it needs a click.
function toastAction(msg, label, fn, ms=9000){
  const t=$('#toast');
  t.innerHTML=`${esc(msg)} <button type="button" class="toast-act">${esc(label)}</button>`;
  t.className='show';
  t.querySelector('.toast-act').onclick=async()=>{
    t.className=''; clearTimeout(toast._t); await fn();
  };

        <div class="seg" style="margin:0"><button type="button" data-m="even" class="${st.custom?'':'on'}">Evenly</button><button type="button" data-m="custom" class="${st.custom?'on':''}">By amount</button></div>
      </div>${rows}
      ${st.custom?`<div class="small" data-splitsum style="margin-top:6px"></div>`
                 :`<div class="small muted" style="margin-top:4px">${A>0?money(A/ids.length)+' each':''}</div>`}`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ st.custom = b.dataset.m==='custom'; render(); });
    // typing updates only the sum line — a full re-render would steal focus mid-keystroke
    box.querySelectorAll('.spl-amt').forEach(inp=>inp.oninput=()=>{ st.amts[inp.dataset.id]=inp.value; sumLine(); });
    if(st.custom) sumLine();
  }
  render();
  return {
    refresh: render,
    // {alloc:null} = even split · {alloc:[…]} = custom · {error} blocks the save
    result(){
      const ids=selIds();
      if(!st.custom || ids.length<2) return {alloc:null};
      const A=amount();
      const entries=ids.map(id=>({d:id, w:Math.round((Number(st.amts[id])||0)*100)/100}));
      if(entries.some(e=>e.w<0)) return {error:'Split amounts can’t be negative.'};
      const sum=entries.reduce((a,e)=>a+e.w,0);
      if(Math.abs(sum-A)>0.011) return {error:`Split adds to ${money(sum)} but the amount is ${money(A)} — they must match.`};
      return {alloc:entries};
    }
  };
}
function busy(btn, on){ if(!btn) return; btn.disabled=on; btn.dataset._txt ??= btn.innerHTML;

async function compress(file, max=1600, q=0.7){
  try{
    const bmp = await createImageBitmap(file);
    let {width:w,height:h}=bmp;
    if(Math.max(w,h)>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }catch(e){ return file; } // fall back to original if decode fails
}
// Receipts may be photos OR PDFs (emailed Uber/airline receipts etc.). PDFs skip the
// canvas compressor (it can't decode them) and upload as-is; images compress to JPEG.
const isPdfFile = f => !!f && (f.type==='application/pdf' || /\.pdf$/i.test(f.name||''));
const isPdfPath = p => /\.pdf$/i.test(p||'');
// stand-in thumbnail for PDF receipts — <img> can't render a PDF
const PDF_THUMB = 'data:image/svg+xml;utf8,'+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" rx="14" fill="#232838"/><text x="60" y="54" font-size="34" text-anchor="middle">📄</text><text x="60" y="88" font-size="17" fill="#9aa3b5" font-family="-apple-system,system-ui" text-anchor="middle" font-weight="700">PDF</text></svg>');
async function uploadPhoto(bucket, file){
  const pdf = isPdfFile(file);
  if(pdf && file.size > 15*1024*1024) throw new Error('PDF too large — 15 MB max');
  const blob = pdf ? file : await compress(file);
  const path = `${state.session.user.id}/${crypto.randomUUID()}.${pdf?'pdf':'jpg'}`;
  const { error } = await supabase.storage.from(bucket).upload(path, blob, { contentType: pdf?'application/pdf':'image/jpeg', upsert:false });
  if(error) throw error;
  return path;
}
async function signedUrl(bucket, path, secs=3600){
  if(!path) return null;
  const { data } = await supabase.storage.from(bucket).createSignedUrl(path, secs);
  return data?.signedUrl || null;
}
async function callFn(name, body){
  const { data, error } = await supabase.functions.invoke(name, { body });

    let msg = error.message;
    try{ const j = await error.context?.json?.(); if(j?.message||j?.error) msg = j.message||j.error; }catch{}

// A stalled request must not become a permanent spinner. supabase-js has no timeout:
// on a phone that has signal but no working connection (a dead zone, a captive wifi,
// carrier trouble at midnight) a query can hang indefinitely, and the app sits on
// "Loading…" with no error, no retry and nothing to tap. Losing the race just shows
// the existing "Couldn't load your account" card, which already has a Retry button.
const LOAD_TIMEOUT_MS = 20000;
const withTimeout = (p, ms=LOAD_TIMEOUT_MS) => Promise.race([p,
  new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
/* ── PAGED READS (no DOM; tests/ba-store-prevent.test.mjs runs this block) ──
   The API answers at most 1,000 rows a request (PostgREST max_rows on this project) and says nothing about the rest.
   The store list had 879 rows on 2026-11-25 and grows by about 70 a month: read in one request, past 1,000 the stores
   late in the alphabet would vanish from every picker, the Schedule's store matching and the Stores page, with no
   error. readAll reads a query a page of 1,000 at a time, in a stable order (`order`, its last column unique), until a
   short page, and answers {data, error} as the query itself would: an error on any page is the answer's error, with no
   rows, so a caller that keeps its last list on an error keeps it whole. When the query asked for its count
   (select(cols, {count:'exact'})), a short page ends the read only once the count is reached: a cap set lower than
   1,000 one day (to save egress, say) can't cut the list either, and the 879 stores of today still take one request.
   build() makes the query afresh for each page (a query runs once), with its columns and filters; readAll adds the
   order and the range. A row read twice (a store added between two pages moves the rest down one) is kept once. */
const PAGE_ROWS=1000;
async function readAll(build, order=['name','id']){
  const rows=[], seen=new Set();
  for(let from=0, n=0; n<100; n++){
    let q=build(); for(const c of order) q=q.order(c);
    const { data, error, count }=await q.range(from, from+PAGE_ROWS-1);
    if(error) return { data:null, error };
    const page=Array.isArray(data)?data:[];
    let fresh=0;
    for(const r of page){ const k=r&&r.id; if(k!=null){ if(seen.has(k)) continue; seen.add(k); } rows.push(r); fresh++; }
    const more=typeof count==='number' ? from+page.length<count : page.length>=PAGE_ROWS;
    if(!more || !page.length || !fresh) break;   // the last page, or a server that ignored the range
    from+=page.length;
  }
  return { data:rows, error:null };
}
// Every read of the store list (public.dispensaries) goes through here, so it comes back whole whatever its size
// (tests/ba-store-prevent.test.mjs fails on one that doesn't). cols as for select(); where(q) adds the filters.
function readStores(cols, where){
  return readAll(()=>{ const q=supabase.from('dispensaries').select(cols, { count:'exact' }); return where?where(q):q; });
}
/* ── end PAGED READS ── */
async function loadMe(){
  try{
    const { data: prof, error } = await withTimeout(
      supabase.from('profiles').select('*').eq('id', state.session.user.id).single());
    if(error || !prof){ state.loadError = error?.message || 'Your profile could not be found.'; state.profile=null; return; }
    state.loadError = null; state.profile = prof;
    const { data: s } = await supabase.from('app_settings').select('*').eq('id',1).single();
    state.settings = s;
    // Book in QuickBooks (ba/docs/qbo-reimbursements.md) is only for the accounts in ba_qbo_bookers. Read once; any error
    // or a slow answer means no: nobody else sees any of it, and the database refuses everyone else anyway.
    state.qboCanBook = false;
    if(prof.role==='admin'){
      try{ const { data: cb, error: ce } = await withTimeout(supabase.rpc('ba_qbo_can_book'), 8000); state.qboCanBook = !ce && cb===true; }
      catch(_){ state.qboCanBook = false; }
    }
    // make sure today's period exists, then load periods + dispensaries
    await withTimeout(supabase.rpc('ensure_period'));
    const { data: per } = await withTimeout(supabase.from('pay_periods').select('*').order('start_date',{ascending:false}));
    state.periods = per||[];
    const _t = todayISO();
    state.period = state.periods.find(p=>p.start_date<=_t && p.end_date>=_t)   // current
      || state.periods.find(p=>p.end_date<_t)                                  // else most recent past (never default to a future period)
      || state.periods[0] || null;
    const { data: disp } = await withTimeout(readStores('*', q=>q.eq('active',true)));
    state.dispensaries = (disp||[]).sort(dispSort);
    // labor kinds (admin-editable list); fall back to the defaults if the table isn't reachable
    try{ const { data: lk } = await supabase.from('labor_kinds').select('*').order('sort'); if(lk&&lk.length) state.laborKinds=lk; }catch{}
    // recent start/destination labels for the trip autocomplete
    const { data: rt } = await supabase.from('trips').select('start_label,dest_label').eq('ba_id',state.session.user.id).order('created_at',{ascending:false}).limit(60);
    const places=new Set(); (rt||[]).forEach(t=>{ if(t.start_label)places.add(t.start_label); if(t.dest_label)places.add(t.dest_label); });
    state.recentPlaces=[...places].filter(p=>p&&p!=='📍 Current location').slice(0,30);
    await loadScheduleBoards();
  }catch(e){
    state.loadError = /timeout/.test(String(e && e.message))
      ? 'The connection stalled. Check your signal and tap Retry.'
      : String(e?.message||e);
    state.profile=null; }
}
// Schedule boards (one per state). RLS returns only the boards this user may see: their
// own region's, plus every board for a universal admin. 0 rows = no Schedule tab. Seeing
// more than one is what earns the CA/NY switcher. Shared by loadMe and the embed (which
// runs it alongside the profile, so it picks again once the profile is in). Resolves
// true when the database answered, false when it didn't (the boards are then empty).
async function loadScheduleBoards(prefer){
  try{
    const { data: sbc, error } = await withTimeout(supabase.from('schedule_board')
      .select('state,workbook_id,layout,label').order('state'));
    if(error) throw error;
    state.scheduleBoards = sbc || [];
    schedPickBoard(prefer);
    return true;
  }catch(_){ state.scheduleBoards = []; state.schedState = null; state.scheduleWb = null; return false; }
}
// default board: the one asked for (the embed's ?board=) when it came back, else whichever
// one you last looked at, else your own region's, else the first you're allowed to see
function schedPickBoard(prefer){
  const bs = state.scheduleBoards || [];
  let last=null; if(!EMBED){ try{ last=localStorage.getItem('ba.schedstate'); }catch(_){} }
  const pick = (prefer && bs.find(b=>b.state===prefer))
    || bs.find(b=>b.state===last)
    || bs.find(b=>b.state===state.profile?.region);
  state.schedState = (pick || bs[0] || {}).state || null;
  state.scheduleWb = schedBoard()?.workbook_id || null;
}

// after saving an item, make sure the selected period covers that item's date so
// it's actually visible (a back/forward-dated item lands in a different period).
async function ensurePeriodForDate(date){
  try{

    const { data } = await supabase.from('pay_periods').select('*').order('start_date',{ascending:false});
    state.periods = data || state.periods;

// Replace a long native <select> with a button that opens the searchable picker.
// The select stays in the DOM (hidden) as the value holder, so all existing
// .value reads and change handlers keep working untouched.
function searchifySelect(sel, title){
  if(!sel || sel._searchified || sel.disabled || (sel.options.length<8 && !sel.hasAttribute('data-searchable'))) return;
  sel._searchified=true;
  if(!title){ let el=sel.previousElementSibling;                       // use the field's label as the picker title
    while(el && !(el.tagName==='LABEL'&&el.classList.contains('fl'))) el=el.previousElementSibling;
    title=(el?el.childNodes[0]?.textContent:'')?.trim()||'Choose'; }
  const btn=document.createElement('button'); btn.type='button'; btn.className='selpick'+(sel.classList.contains('needs')?' needs':'');
  const label=()=>{ const o=sel.options[sel.selectedIndex];
    btn.innerHTML=(o&&o.text.trim())?esc(o.text):'<span class="pkph">Pick…</span>';
    btn.classList.toggle('needs', sel.classList.contains('needs')); };
  sel.style.display='none'; sel.insertAdjacentElement('afterend', btn); label();
  sel.addEventListener('change', label);
  const NONE='~none~';
  btn.onclick=()=>cellPickerSheet({ title, multi:false,
    options:[...sel.options].map(o=>({id:o.value===''?NONE:o.value, name:o.text, search:o.dataset.search||undefined})),
    selected: sel.value===''?[NONE]:[sel.value],
    onSave:ids=>{ const v=ids[0];
      if(v===undefined) return;                                        // unchecked current = no change
      // a store just added (or turned back on) from the picker's "* New retailer" isn't an option yet: add it
      if(v!==NONE && ![...sel.options].some(o=>o.value===v)){ const d=(state.dispensaries||[]).find(x=>x.id===v);
        if(d){ const o=document.createElement('option'); o.value=d.id; o.textContent=d.name; o.dataset.search=dispSearchText(d); sel.appendChild(o); } }
      sel.value = v===NONE?'':v; sel.classList.remove('needs');
      sel.dispatchEvent(new Event('change',{bubbles:true})); label(); } });
}

// Pay-period phase relative to today, and who may edit it.
function actingAsBA(){ return !!state.preview || state.profile?.role!=='admin'; }
// people who log field data = BAs + regional admins (e.g. Maddy = NY admin who also works
// as a BA). Universal admins (admin, no region) are pure oversight and don't appear as BAs.
// Active field staff only: inactive profiles (e.g. ar-reports-only logins that the
// handle_new_user trigger auto-minted as role 'ba') stay out of Review/Dashboard lists.
// The region a person WORKS in. `region` also means "the region I administer", so a
// Universal Admin who still does field work carries it in home_region instead — every
// reader that asks "is this person CA?" must go through here or she falls out of the
// CA lists while her own mileage sits in them.
const personRegion = b => (b && (b.region || b.home_region)) || null;
// A field worker files their own mileage/hours: BAs, regional admins, and universal
// admins with a home_region. Pure oversight admins (no region either way) are not.
// `non_ba` logins (app access, but not brand-ambassador work) never are, and neither is a
// region-less 'ba': handle_new_user makes every Google sign-in to the other apps on this project
// one (Norma, Raul via Timesheets), and the reminder job already skips them (Gianni 2026-11-08).
function isFieldWorker(b){ return !!b && b.active!==false && !b.non_ba && !!personRegion(b)
  && (b.role==='ba' || b.role==='admin'); }
// A just-ended period stays editable through a GRACE window — until the following
// SUNDAY 11:00am (device-local) — so BAs can still finish + submit after the
// period closes Friday and the reminder email lands Saturday (per Gianni 2026-07-18).
function periodGraceEnd(p){
  if(!p || !p.end_date || !/^\d{4}-/.test(p.end_date)) return null;
  const d=new Date(p.end_date+'T11:00:00');
  do{ d.setDate(d.getDate()+1); }while(d.getDay()!==0);   // advance to the next Sunday
  // an admin can REOPEN a period (edit_until) — extends the window for late submitters
  if(p.edit_until){ const e=new Date(p.edit_until); if(!isNaN(e) && e>d) return e; }
  return d;                                               // Sunday 11:00 local (or the reopen deadline)
}
// is this period open past its natural grace because an admin reopened it?
function periodReopened(p){ if(!p||!p.edit_until) return false; const e=new Date(p.edit_until); return !isNaN(e) && e>new Date(); }
// short human deadline for the editable window ("Sun 11am" or a reopened date)
function graceLabel(p){ const g=periodGraceEnd(p); if(!g) return ''; const now=new Date();
  const days=Math.round((g-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  return (days>=0&&days<=6 ? g.toLocaleDateString([],{weekday:'short'}) : g.toLocaleDateString([],{month:'short',day:'numeric'}))
    + ' ' + g.toLocaleTimeString([],{hour:'numeric',minute:g.getMinutes()?'2-digit':undefined}); }
function periodPhase(p){ if(!p) return 'none'; const t=todayISO();
  if(p.start_date>t) return 'future';
  if(p.end_date<t){ const g=periodGraceEnd(p); return (g && new Date()<g) ? 'current' : 'past'; }
  return 'current'; }
// LATE SUBMIT (Gianni 2026-09-26: reminders keep going out until everyone submits). An ended
// period that THIS person hasn't submitted stays open to them past the Sunday cutoff, so the
// daily reminder is always something they can act on. Starts with the period ending 9/25
// (mirrors CHASE_FROM in ba-notify). It ends when they submit (or tap Nothing to claim), or an
// admin approves / marks the period done for them. state._mySubs is
// this user's {period_id: status}, loaded by drawBA before any period is picked.
const LATE_SUBMIT_FROM='2026-09-25';
function mySubmitted(pid){ const st=(state._mySubs||{})[pid]; return st==='submitted'||st==='approved'; }
// local calendar date of a timestamp (a profile's created_at) — compared with period dates
const localISO = ts => { const d=new Date(ts); return isNaN(d) ? '' : new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
function lateOpen(p){ const me=state.profile;
  return !!p && !!p.end_date && p.status!=='closed' && p.end_date>=LATE_SUBMIT_FROM
    && periodPhase(p)==='past' && !!state._mySubs && !mySubmitted(p.id)
    // the same people ba-notify chases: field workers with a work region, for periods that
    // ended on/after they joined (a new hire never owes an older period)
    && isFieldWorker(me) && !!personRegion(me) && (!me.created_at || localISO(me.created_at)<=p.end_date); }
// periods this person still owes, oldest first (the Home banner + reminder email are about these)
const owedPeriods = () => (state.periods||[]).filter(lateOpen).sort((a,b)=>a.end_date.localeCompare(b.end_date));
// default date for a NEW item: today, clamped into the open period — so adding to a late (or
// grace) period files the item there instead of in the current period
function addDefaultDate(){ const p=state.period, t=todayISO();
  if(!p || isAllPeriods(p) || !p.end_date) return undefined;
  return t>p.end_date ? p.end_date : (t<p.start_date ? p.start_date : undefined); }
// In the BA surface only the current(+grace) period, or one this person still owes (lateOpen),
// is editable; upcoming/past are view-only (admins manage those from the admin tools).
// A real admin outside preview always passes.
function canEditPeriod(p){ if(!actingAsBA()) return true; if(p?.status==='closed') return false;
  return periodPhase(p)==='current' || lateOpen(p); }

const ALL_PERIODS={ id:'all', label:'All pay periods', start_date:'all', end_date:'', status:'open' };
const isAllPeriods=p=>!!p && p.id==='all';
function periodPicker(onChange, opts={}){
  let list = state.periods;
  if(opts.hideFuture) list = list.filter(p=>periodPhase(p)!=='future');   // BAs can't pick a not-yet-started period
  if(!list.length) list = state.periods;                                  // never render an empty picker
  const html = `<option value="all" ${isAllPeriods(state.period)?'selected':''}>All pay periods</option>` + list.map(p=>{
    const tag = p.status==='closed' ? ' (closed)'
      : periodPhase(p)==='current' ? (p.end_date<todayISO() ? ` (${periodReopened(p)?'reopened':'submit'} — by ${graceLabel(p)})` : ' (current)')
      : (opts.hideFuture && lateOpen(p) ? ' (not submitted yet)'
      : (opts.hideFuture && periodPhase(p)==='past' ? ' (view only)' : ''));
    return `<option value="${p.id}" ${state.period?.id===p.id?'selected':''}>${esc(p.label)}${tag}</option>`;
  }).join('');
  // type-to-search (Gianni's rule for every pick-list): the select stays as the value holder behind the picker button
  setTimeout(()=>{ const s=$('#perSel'); if(s){ s.onchange=()=>{ state.period = s.value==='all' ? ALL_PERIODS : state.periods.find(p=>p.id===s.value); onChange(); };
    searchifySelect(s, 'Pay period'); } },0);
  return `<select id="perSel" data-searchable>${html||'<option>No periods</option>'}</select>`;
}

/* ── Report date range: presets + custom start/end. Reports query by trip_date / expense_date,
   so a range can span any set of days (not tied to a single pay period). ── */
const REPORT_PRESETS = [
  ['this_period','This pay period'],
  ['last_period','Last pay period'],
  ['this_month','This month'],
  ['last_month','Last month'],
  ['last_6_months','Last 6 months'],
  ['custom','Custom range'],
];
function isoLocal(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; }
// the period covering today (or most recent past), plus the one right before it
function periodPair(){
  const t=todayISO(); const ps=[...(state.periods||[])].sort((a,b)=>b.start_date.localeCompare(a.start_date));
  let i=ps.findIndex(p=>p.start_date<=t&&p.end_date>=t);
  if(i<0) i=ps.findIndex(p=>p.end_date<t);
  if(i<0) i=0;
  return { thisP:ps[i]||null, lastP:ps[i+1]||null };
}
function computeRange(mode){
  const t=todayISO(), now=new Date(t+'T00:00:00');
  if(mode==='this_period'){ const {thisP}=periodPair(); return thisP?{start:thisP.start_date,end:thisP.end_date}:null; }
  if(mode==='last_period'){ const {lastP}=periodPair(); return lastP?{start:lastP.start_date,end:lastP.end_date}:null; }
  if(mode==='this_month'){ const s=new Date(now.getFullYear(),now.getMonth(),1), e=new Date(now.getFullYear(),now.getMonth()+1,0); return {start:isoLocal(s),end:isoLocal(e)}; }
  if(mode==='last_month'){ const s=new Date(now.getFullYear(),now.getMonth()-1,1), e=new Date(now.getFullYear(),now.getMonth(),0); return {start:isoLocal(s),end:isoLocal(e)}; }
  if(mode==='last_6_months'){ const s=new Date(now.getFullYear(),now.getMonth()-5,1); return {start:isoLocal(s),end:isoLocal(now)}; }
  return null;   // custom: keep whatever start/end are set
}
function ensureRepRange(){
  if(state.repRange && state.repRange.start && state.repRange.end) return state.repRange;
  const r=computeRange('this_period');
  if(r) state.repRange={mode:'this_period', ...r};
  else { const mr=computeRange('this_month'); state.repRange={mode:'this_month', ...mr}; }
  return state.repRange;
}
function setRepPreset(mode){
  if(mode==='custom'){ state.repRange={...ensureRepRange(), mode:'custom'}; return; }
  const r=computeRange(mode);
  if(r) state.repRange={mode, ...r};
  else toast('No matching pay period yet','err');
}
function rangeControlsHtml(){
  const r=ensureRepRange();
  return `<div class="row"><div class="small muted grow">Date range</div>
      <select id="rpPreset">${REPORT_PRESETS.map(([v,l])=>`<option value="${v}" ${r.mode===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px;gap:8px">
      <input type="date" id="rpStart" class="grow" value="${r.start}">
      <span class="muted small">to</span>
      <input type="date" id="rpEnd" class="grow" value="${r.end}"></div>`;
}
function wireRangeControls(rerender){
  const ps=$('#rpPreset'); if(ps) ps.onchange=()=>{ setRepPreset(ps.value); rerender(); };
  const s=$('#rpStart'), e=$('#rpEnd');
  const onDate=()=>{ const a=s.value||state.repRange.start, b=e.value||state.repRange.end;
    if(a>b) toast('Swapped so the start date comes first','');
    state.repRange={mode:'custom', start:a<=b?a:b, end:a<=b?b:a}; rerender(); };   // keep start ≤ end
  if(s) s.onchange=onDate; if(e) e.onchange=onDate;
}
function rangeLabel(){ const r=ensureRepRange(); return `${fmtDate(r.start)} – ${fmtDate(r.end)}`; }

/* ═══════════════════════════ BA SURFACE ═══════════════════════════ */
function renderBA(){
  app.innerHTML = topbar() + viewSwitcher() + `<main id="main"></main>` + baTabs();
  wireTop(); wireSwitcher();
  $('#tab-home').onclick=()=>{state.baTab='home';drawBA();};

  $('#tab-exp').onclick =()=>expenseSheet(addDefaultDate());

  const _ts=$('#tab-sched'); if(_ts) _ts.onclick=()=>{state.baTab='sched';drawBA();};
  $('#tab-loc').onclick =()=>{state.baTab='loc';drawBA();};
  drawBA();
}
function baTabs(){
  const on=t=>state.baTab===t?'on':'';
  return `<div class="tabbar">
    <button id="tab-home" class="${on('home')}"><span class="ic">🏠</span>Home</button>
    <button id="tab-trip"><span class="ic">🚗</span>Trip</button>
    <button id="tab-exp"><span class="ic">🧾</span>Expense</button>
    <button id="tab-report" class="${on('report')}"><span class="ic">📊</span>Report</button>
    ${state.scheduleWb?`<button id="tab-sched" class="${on('sched')}"><span class="ic">🗓️</span>Schedule</button>`:''}
    <button id="tab-loc" class="${on('loc')}"><span class="ic">📍</span>Locations</button>
  </div>`;
}
async function drawBA(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('on'));
  const activeTab = ['home','loc','report','sched'].includes(state.baTab) ? state.baTab : 'home';
  $(`#tab-${activeTab}`)?.classList.add('on');
  const m=$('#main');
  if(state.baTab==='loc') return drawLocations(m);
  if(state.baTab==='report') return baReport(m);
  if(state.baTab==='sched') return drawSchedule(m);
  await flushGrid();                                  // commit pending grid edits before reading
  const seq = state._drawSeq = (state._drawSeq||0)+1; // latest render wins
  const myTasksP = myTasksLoad().catch(()=>null);     // read alongside the rest, drawn with the page (no jump)
  m.innerHTML = `<div class="loading"><span class="spin"></span></div>`;

  // Periods the BA may see: current + past. A not-yet-started period stays hidden
  // until local midnight (12am) of its first day — periodPhase uses todayISO().
  const visible = state.periods.filter(p=>periodPhase(p)!=='future');
  // the grace window can make TWO periods phase-'current' (just-ended + date-current);
  // an explicitly tapped, still-editable one (state._baPickPid, set by togglePeriod) wins,
  // else the DATE-current period (matched by date, not phase, so grace doesn't shadow it)
  const t=todayISO();
  // one query for every period's submission → header status + stored totals (cheap, no per-period
  // item loads). Loaded BEFORE picking: a period this person still owes stays editable (lateOpen).
  const { data:subs, error:subErr } = await supabase.from('submissions').select('*').eq('ba_id',state.session.user.id);
  if(seq !== state._drawSeq) return;
  if(subErr){
    // without them we can't tell submitted periods from owed ones: show nothing editable
    state._mySubs=undefined;
    m.innerHTML=`<div class="card"><p class="small">Couldn't load your pay periods (${esc(subErr.message||'network error')}).</p><button class="btn block" id="baRetry">Retry</button></div>`;
    const r=$('#baRetry'); if(r) r.onclick=()=>drawBA();
    return;
  }
  const subByPid={}; (subs||[]).forEach(s=>subByPid[s.period_id]=s);
  state._mySubs=Object.fromEntries((subs||[]).map(s=>[s.period_id,s.status]));
  const picked  = state._baPickPid ? visible.find(p=>p.id===state._baPickPid && canEditPeriod(p)) : null;
  const current = picked || visible.find(p=>p.start_date<=t && p.end_date>=t) || visible.find(p=>periodPhase(p)==='current') || null;
  const active  = current || visible[0] || null;      // pre-expanded period: the current one, else most recent
  state.period = active; state._activePid = active ? active.id : null;


  // load only the active (expanded) period's items; past periods load lazily on expand
  let T=[],E=[],H=[],S=null;
  if(active){
    // salaried users: ensure this period's even-split daily labor exists before reading
    if(Number(state.profile?.salary_per_period)>0){
      try{ await supabase.rpc('generate_salary_labor',{p_ba:state.session.user.id, p_period:active.id}); }catch(_){}
    }
    const [tr,ex,hr] = await Promise.all([
      supabase.from('trips').select('*').eq('ba_id',state.session.user.id).eq('period_id',active.id).order('trip_date',{ascending:false}),
      supabase.from('expenses').select('*').eq('ba_id',state.session.user.id).eq('period_id',active.id).order('expense_date',{ascending:false}),
      supabase.from('hours').select('*').eq('ba_id',state.session.user.id).eq('period_id',active.id).order('work_date',{ascending:false}),
    ]);
    if(seq !== state._drawSeq) return;
    T=tr.data||[]; E=ex.data||[]; H=hr.data||[]; S=subByPid[active.id]||null;
  }
  state._T=T; state._E=E; state._H=H;
  const submittedLock = S && (S.status==='submitted'||S.status==='approved');
  const canEdit = active && canEditPeriod(active) && !submittedLock;
  // grid context for the shared day-grid (BA editing own current period)
  state.grid = canEdit ? { baId: state.session.user.id, isAdmin:false, per: active, region: state.preview || state.profile?.region, T, E, H, canAdd:true,
    onChange(){ dgRefreshSummary(); refreshTotals(); refreshItems(); } } : null;

  if(!visible.length){ m.innerHTML='<div class="card"><p class="muted small">No pay periods yet.</p></div>'; return; }

  const owed=owedPeriods().filter(p=>p.id!==(active&&active.id));
  const owedBanner = owed.length ? `<div class="card" style="border-color:var(--yellow);margin-bottom:12px">
      <b style="color:var(--yellow)">Still to submit</b>
      <div class="small muted" style="margin:4px 0 6px">Open it, add anything missing and submit. No mileage or expenses? Tap “Nothing to claim”. You'll get a reminder each morning until it's in.</div>
      ${owed.map(p=>`<button class="btn block" data-owed="${p.id}" style="margin-top:6px">Open ${esc(p.label)}</button>`).join('')}
    </div>` : '';
  let mt=await myTasksP; if(seq !== state._drawSeq) return;
  if(!mt||mt.error) mt=(state._myTasks&&state._myTasks.for===state.session?.user?.id)?state._myTasks:null;   // the last good copy
  else state._myTasks=mt;
  m.innerHTML = owedBanner + `<div id="myTasks">${myTasksHtml(mt)}</div>` + visible.map(p=>{
    const open=active && p.id===active.id;
    const sub=subByPid[p.id];
    const headTotal = open ? reimburseTotal() : (sub&&sub.totals? Number(sub.totals.total||0) : null);
    const badge = sub ? `<span class="badge ${sub.status}">${sub.status}</span>` : '';
    return `<div class="peracc" data-pid="${p.id}" style="margin-bottom:12px">
      ${periodHeadHtml(p, open, headTotal, badge)}
      <div class="perbody ${open?'':'hide'}" data-body="${p.id}">${open ? (canEdit ? editableBodyHtml(S) : readOnlyBodyHtml(p,T,E,H)) : ''}</div>
    </div>`;
  }).join('');

  if(active && canEdit) wireEditableBody();
  m.querySelectorAll('.perhead').forEach(h=>h.onclick=()=>togglePeriod(h.dataset.pid));
  m.querySelectorAll('[data-owed]').forEach(b=>b.onclick=()=>{ state._baPickPid=b.dataset.owed; drawBA(); });
  wireMyTasks(mt);
  // the database marks visits done from what the BAs logged; redraw the card only if that changed something
  const mw=myTasksWho();
  if(mw) schedAutocomplete(mw.st, schedIso(schedAdd(new Date(),-30))).then(n=>{ if(n>0) drawMyTasks(); }).catch(()=>{});
}

function roItemRow(x){

async function togglePeriod(pid){

// what's missing on a trip/expense — drives the BA + admin to-do list
function itemIssues(x){
  if(isBooks(x)) return [];   // synced from QuickBooks: never anyone's to-do
  const hasDisp = x.dispensary_id || (x.dispensary_ids && x.dispensary_ids.length);   // single or multi
  if(x._k==='hours') return hasDisp ? [] : ['a dispensary'];   // hours only ever need a dispensary link
  const trip = x._k==='trip';
  const out=[];
  // trips whose CATEGORY is a non-store kind (Lead / Non-BA / General BA) don't happen
  // at a store — the kind explains them, so no location link is required
  if(!hasDisp && !(trip && isNonstoreKind(x.kind))) out.push(trip?'a location':'a dispensary');
  if(trip){
    if(!x.kind) out.push('a category');                      // every trip needs an activity category
    if(!(Number(x.miles)>0)){
      const so=x.start_odo!=null, eo=x.end_odo!=null, hs=!!x.start_label, hd=!!x.dest_label;
      if(so!==eo) out.push('the 2nd odometer reading');
      else if(hs!==hd) out.push('a start + destination');
      else out.push('the miles');
    }
  } else {
    if(!(Number(x.amount)>0)) out.push('an amount');
    // receipts matter before payment; once approved (paid) a missing one is history,
    // not a to-do (e.g. historical toll/congestion charges that never had receipts)
    if(!x.receipt_path && x.status!=='approved') out.push('a receipt');
  }
  return out;
}

  // tap the thumbnail (or the "view" caption) to open the receipt — a signed URL fetched

  { const openRec=async()=>{ if(!receiptPath) return; const u=await signedUrl('receipts',receiptPath); u?window.open(u,'_blank'):toast('Receipt unavailable','err'); };

// how many of this period's still-editable items are incomplete (drives submit gating)
function pendingTodos(){
  return periodItems().filter(x=>(x.status==='draft'||x.status==='rejected') && itemIssues(x).length).length;
}
function submitAreaHtml(){
  const pend=pendingTodos();
  if(pend) return `<button class="btn ok block" id="submitBtn" disabled style="opacity:.5;cursor:not-allowed">Submit period for reimbursement</button>
    <p class="small center" style="color:var(--yellow);margin-top:6px">Clear the ${pend} to-do item${pend>1?'s':''} above to submit.</p>`;
  // nothing logged: once the period has ENDED, let them close it out as "nothing to claim"
  // (that's what stops the daily reminder). Before it ends there's nothing to do yet —
  // offering it early is how periods got submitted on day one and locked.
  const drafts=[...(state._T||[]),...(state._E||[])].filter(x=>x.status==='draft'||x.status==='rejected').length;
  if(!drafts){
    if(state.period && state.period.end_date && state.period.end_date<todayISO())
      return `<button class="btn ok block" id="submitEmptyBtn">Nothing to claim · submit this period</button>
        <p class="small muted center" style="margin-top:6px">No mileage or expenses for this period? Submit it anyway so we know it's complete.</p>`;
    return `<p class="small muted center" style="margin:8px 0">Log miles or expenses above. You'll submit once the period ends.</p>`;
  }
  return `<button class="btn ok block" id="submitBtn">Submit period for reimbursement</button>`;
}
function wireSubmit(){ const b=$('#submitBtn'); if(b) b.onclick=()=>submitPeriod();
  const e=$('#submitEmptyBtn'); if(e) e.onclick=()=>submitPeriod({empty:true}); }
async function delItem(kind,id){
  if(kind==='hours') return;                        // payroll-managed — BAs can never delete hours
  if(!confirm('Delete this item?')) return;
  const { error } = await supabase.from(kind).delete().eq('id',id);
  if(error) return toast(error.message,'err');
  const arr = kind==='trips'?state._T:state._E; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1);
  toast('Deleted'); refreshItems(); refreshTotals(); renderGrid();
}
async function submitPeriod(opts={}){
  await flushGrid();                          // commit any pending grid edits before snapshotting state
  const T=state._T||[], E=state._E||[];
  const submittable = x => x.status==='draft' || x.status==='rejected';
  const ids=T.filter(submittable).map(x=>x.id), eids=E.filter(submittable).map(x=>x.id);
  if(!ids.length && !eids.length){
    // "Nothing to claim": record the submission with no items so the period counts as done
    // (stops the daily reminder). Only offered once the period has ended (submitAreaHtml).
    if(!opts.empty) return toast('Nothing to submit','err');
    if(!(state.period && state.period.end_date<todayISO())) return toast('You can submit once the period has ended.','err');
    if(!confirm(`Submit ${state.period.label||'this period'} with no mileage or expenses? You won’t be able to add any after.`)) return;
  }
  // hard rule: every item must be complete (dispensary linked, miles/odometer set, amount + receipt) before submitting
  const incomplete=[...T.filter(submittable).map(x=>({...x,_k:'trip'})),...E.filter(submittable).map(x=>({...x,_k:'exp'}))]
    .filter(x=>itemIssues(x).length).length;
  if(incomplete) return toast(`Finish the ${incomplete} to-do item${incomplete>1?'s':''} above first — tap each one to fill it in.`,'err');
  if(ids.length || eids.length){
    const early = state.period && state.period.end_date>=todayISO();
    const lbl = state.period?.label || 'this period';
    if(!confirm(early
      ? `${lbl} doesn’t end until ${fmtDate(state.period.end_date)}. Submitting now locks it, so anything you log after today can’t be added. Submit ${lbl} now anyway?`
      : `Submit all items in ${lbl}? You won’t be able to edit them after.`)) return;
  }
  const mile=T.reduce((a,x)=>a+Number(x.amount||0),0); const {reimb,card}=expSplit(E);
  const labor=(state._H||[]).reduce((a,x)=>a+Number(x.amount||0),0);   // recorded for reporting; NOT part of reimburse
  // record the submission FIRST so items are never locked without a workflow row
  const { error:se } = await supabase.from('submissions').upsert({
    ba_id:state.session.user.id, period_id:state.period.id, status:'submitted',
    submitted_at:new Date().toISOString(), totals:{mileage:mile, expenses:reimb, company_card:card, labor, total:mile+reimb}
  },{onConflict:'ba_id,period_id'});
  if(se) return toast('Submit failed: '+se.message,'err');
  if(ids.length){ const {error}=await supabase.from('trips').update({status:'submitted',reject_note:null}).in('id',ids);
    if(error) return toast('Submit failed: '+error.message,'err'); }
  if(eids.length){ const {error}=await supabase.from('expenses').update({status:'submitted',reject_note:null}).in('id',eids);
    if(error) return toast('Submit failed: '+error.message,'err'); }
  toast('Submitted — thank you!','ok'); drawBA();
}

// Mileage priority: odometer (start+end) > nav-image reading > start/destination calc.
// Sets the Miles cell to the highest-priority source that's filled + records which.
function recalcMiles(tr){
  const mi=tr.querySelector('.g-mi'); if(!mi) return;
  const os=Number(tr.querySelector('.g-os')?.value), oe=Number(tr.querySelector('.g-oe')?.value);
  let src=null, val=null;
  if(os && oe && oe>=os){ val=Math.round((oe-os)*10)/10; src='odometer'; }
  else if(tr._routeMiles>0){ val=tr._routeMiles; src='route'; }
  else if(tr._calcMiles>0){ val=tr._calcMiles; src='distance'; }
  if(src){ mi.value=val; mi.classList.remove('needs'); tr.dataset.msrc=src; gridTotal(); }
}

// ── Day-grouped, inline-editable grid — shared by the BA home and admin review. ──
// Every day of the pay period is a block; a day's trips/expenses/hours show in
// spreadsheet rows. Locked rows (submitted/approved for a BA, or hours for a BA)

// expenses on a BA's behalf, so those add-rows are hidden for admins).
function periodDays(start,end){ const out=[]; if(!start||!end) return out;
  let d=new Date(start+'T12:00:00Z'); const e=new Date(end+'T12:00:00Z'); let g=0;
  while(d<=e && g++<400){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); } return out; }
function dgWeekday(iso){ return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'}); }
function dgDateLbl(iso){ return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
function dgCanEdit(ctx, kind, it){ if(kind==='hours') return !!ctx.isAdmin;
  if(isBooks(it)) return false;   // synced from QuickBooks: read-only (itemDetailSheet says so)
  return !!ctx.isAdmin || (it && (it.status==='draft'||it.status==='rejected')); }
function dgCanAdd(ctx, kind){ if(kind==='hours') return false;   // hours only ever come from the Gusto import, never added by hand
  return !!(ctx.isAdmin || ctx.canAdd); }   // admins add on a BA's behalf (RLS insert now allows is_admin); BAs add on an editable period

function abbrPlace(s, max=18){
  s=String(s||'').replace(/,\s*(usa|u\.?s\.?a?\.?)\s*$/i,'').split(',')[0].trim();
  if(!s) return '?';

// one pill for the whole day's drive: "Home → stop → stop → …" + total miles. Nodes are

// A submitted/approved leg with gaps is the ADMIN's problem, not a BA to-do.

function dayRouteBubble(ctx, day, trips){
  const legs=trips.slice().sort((a,b)=>String(a.created_at||a.id).localeCompare(String(b.created_at||b.id)));
  const total=legs.reduce((a,t)=>a+Number(t.miles||0),0);
  const warn=legs.some(t=>((ctx&&ctx.isAdmin)||tripFixable(t))&&itemIssues({...t,_k:'trip'}).length>0);
  const home=(ctx&&ctx.homeAddr!=null)?ctx.homeAddr:((state.profile&&state.profile.base_address)||'');
  // The route shows where they DROVE (dest label), not the Location tag (which is just
  // the reporting bucket — a return-home leg stays tagged to the store, a venue leg to
  // '* Brand event'). Canonicalize to the store name only when the destination IS that
  // store; placeholders never override a real place.
  const node=(label,dispId)=>{
    if(isHomeAddr(label,home)) return 'Home';
    const dn=dispId?dispName(dispId):null;
    if(dn && !/^\*/.test(dn) && (!label || matchDispByText(label)===dispId)) return dn;
    return (label||dn||'');
  };
  const chain=[ node(legs[0].start_label, null) ];
  legs.forEach(t=>chain.push(node(t.dest_label, t.dispensary_id||(t.dispensary_ids&&t.dispensary_ids[0]))));

    +`<span class="bub-sub route">${esc(route)}</span></button>`;
}

// after a calc: fill the miles input with the shortest route (× roundtrip), and if there

function applyRoutes(r, roundtrip, milesEl, btnEl){

/* ── reusable place typeahead: Home + dispensaries + recent + live ORS address ── */
function rememberPlaces(...labels){
  const cur=state.recentPlaces||[];
  for(const l of labels){ const v=(l||'').trim(); if(!v||v==='📍 Current location') continue;
    const i=cur.findIndex(p=>p.toLowerCase()===v.toLowerCase()); if(i>=0) cur.splice(i,1); cur.unshift(v); }
  state.recentPlaces=cur.slice(0,30);

function placeItems(q, home){
  // home: override whose 🏠 shows — an admin editing a BA's trip sees THAT BA's home.
  // Matches loosely: full-address substring, 'home', or any typed token hitting it
  // ('376 sto' → '376 Stockton St, Brooklyn…').
  q=(q||'').trim().toLowerCase(); const out=[];
  const base = home!==undefined ? home : state.profile?.base_address;

  if(base && (q===''||'home'.includes(q)||'base'.includes(q)||q.split(/\s+/).every(t=>bl.includes(t))))
    out.push({display:base, addr:base, dispId:null, label:'🏠 Home', sub:base});

  // the NAME matches, so what you typed the start of comes first.

    if(n.startsWith(q)) return 0;                                   // "green" → Green Flower…
    if(new RegExp('\\b'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(n)) return 1;   // a word in the name starts with it

    return a.includes(q)?4:5;                                       // address-only match

  baDispensaries().filter(d=>!NONSTORE_PLACE_RE.test(d.name||'')&&(!q||hitD(d)))
    .map(d=>({d,s:score(d)}))
    .sort((x,y)=> x.s-y.s || (x.d.name||'').localeCompare(y.d.name||''))
    .slice(0,8).map(x=>x.d)
    .forEach(d=>out.push({display:d.name, addr:d.address||d.name, dispId:d.id, label:'🏬 '+d.name, sub:d.address||''}));

    .forEach(p=>out.push({display:p, addr:p, dispId:null, label:'🕘 '+p, sub:'recent'}));
  const seen=new Set();
  return out.filter(o=>{const k=o.display.toLowerCase(); if(seen.has(k))return false; seen.add(k); return true;}).slice(0,10);
}
/* ── ADDRESS CHECK (pure; tests/ba-store-prevent.test.mjs runs this block) ──
   A house number at the start of an address or of one of its comma parts, then the street: "280 Higuera St",
   "Unit 102, 3257 W Shaw Ave", "18-33 42nd St", "100 Main St #5". It is the rule of store_address_key in
   supabase/ba-store-registry-add.sql (the test keeps the two the same), which is how the store list and the registry
   sync compare premises. An address without one, like a place's name and street as Places lists a business ("NUG
   Vallejo, Lewis Brown Drive, Vallejo, CA, USA"), names no premises: the store can't be matched to its license, and the
   sync held real stores for a person because of rows saved that way (12 on 2026-11-25, all made in this app). */
const ADDR_NUMBER_RE=/(?:^|,)\s*(\d+)[a-z]?(?:-\d+[a-z]?)?\s+(?:(?:n|s|e|w|north|south|east|west|ne|nw|se|sw)\.?\s+)?([a-z0-9]+)/;
function addrHasNumber(s){ return ADDR_NUMBER_RE.test(String(s||'').toLowerCase()); }
// a number started at the front of the address or of a comma part: the person is typing one
function addrNumberStarted(s){ return /(?:^|,)\s*\d/.test(String(s||'')); }
const ADDR_HINT='No street number: add it so the store can be matched to its license.';
/* ── end ADDRESS CHECK ── */
// The short line under a store form's address when it has no house number (ADDR_HINT). It never stops a save. It shows
// as the form opens and when the field is left (once the tap that left it has landed, so it can't move a button from
// under the finger), and goes as soon as a number is typed; never while typing, when a number may be half typed.
// applies() says whether the line is wanted at all (not for a private place). Returns check(show), which a save runs.
function addrHint(input, el, applies=()=>true){
  const check=show=>{ const v=input.value.trim(), bad=!!v && applies() && !addrHasNumber(v);
    if(!bad) el.hidden=true; else if(show) el.hidden=false; };
  input.addEventListener('input', ()=>check(false));
  input.addEventListener('blur', ()=>setTimeout(()=>check(true), 200));
  check(true);
  return check;
}
// onResolve({display,addr,dispId}) fires on pick AND on free typing, so the caller always has the current value.
// opts.addressOnly (the store forms and the home address): no stores or recent places, and only street addresses with a
// house number (addrHasNumber); when none is left the list says to type the street number.
function attachPlaceTypeahead(input, box, onResolve, opts={}){
  let local=[], timer=null;
  const paint=(items, searching, note)=>{
    if(!items.length && !searching && !note){ box.classList.add('hide'); box.innerHTML=''; return; }
    let html=items.map((it,i)=>`<div class="sg" data-i="${i}"><b>${esc(it.label)}</b>${it.sub?`<span>${esc(it.sub)}</span>`:''}</div>`).join('');
    if(searching) html+=`<div class="sg searching"><span class="spin"></span>Searching addresses…</div>`;
    if(note) html+=`<div class="sg note">${esc(note)}</div>`;
    box.innerHTML=html; box.classList.remove('hide');
    box.querySelectorAll('.sg[data-i]').forEach(el=>el.onmousedown=ev=>{ ev.preventDefault();
      if(input.disabled) return;   // a form that is checking or saving keeps what it checked
      const it=items[+el.dataset.i]; input.value=it.display; box.classList.add('hide');
      // a pick must behave like typing: fire 'input' FIRST (label/state listeners run,
      // red 'needs' highlights clear), THEN resolve with the richer pick data (dispId,
      // address) so the resolve handler's values win over the generic input handler's
      input.dispatchEvent(new Event('input',{bubbles:true}));
      clearTimeout(timer);         // the input handler's render() re-opened the list + queued a remote search
      box.classList.add('hide'); box.innerHTML='';
      onResolve({display:it.display, addr:it.addr, dispId:it.dispId}); });
  };
  // only street numbers when the form says the place is a store (opts.numbered(); always, without one)
  const numbered=()=>!!opts.addressOnly && (!opts.numbered || !!opts.numbered());
  const render=()=>{
    const q=input.value; local=opts.addressOnly?[]:placeItems(q, opts.home); clearTimeout(timer);
    const wantRemote = !!(q && q.trim().length>=3);
    paint(local, wantRemote);
    if(wantRemote) timer=setTimeout(async()=>{
      let r; try{ r=await callFn('geocode-suggest',{text:q}); }catch{ if(input.value===q) paint(local,false); return; }
      // an answer that comes after the field was left, or locked for a save, opens nothing
      if(input.value!==q || input.disabled || document.activeElement!==input) return;
      const have=new Set(local.map(x=>x.display.toLowerCase()));
      const addr=(r?.suggestions||[]).filter(s=>s && s.label && !have.has(s.label.toLowerCase())
          && (!numbered() || addrHasNumber(s.label))).slice(0,5)
        .map(s=>({display:s.label, addr:s.label, dispId:null, label:'📍 '+s.label, sub:'address'}));
      paint([...local, ...addr], false,
        numbered() && !addr.length && !addrNumberStarted(q) ? 'Type the street number too' : '');
    },250);
  };
  input.oninput=()=>{ onResolve({display:input.value, addr:input.value, dispId:null}); render(); };
  input.onfocus=render;
  input.onblur=()=>setTimeout(()=>box.classList.add('hide'),150);
}

  // may edit any status/period (the server trigger recomputes amount admin-side).
  const ctx=(typeof gridCtx==='function'&&gridCtx())||{};
  const isAdminCtx=!!ctx.isAdmin;

  if(!isAdminCtx && !canEditPeriod(state.period)) return toast('This pay period is view-only — ask an admin to make changes.','err');
  const editMode = !!editTrip;
