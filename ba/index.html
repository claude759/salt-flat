    parts.push(`<div class="qbo-row"><div class="ic">⏳</div><div class="grow small" style="min-width:0">${qboPlural(notYet.length,'item')} not approved yet${amt?`: <b>${money(amt/100)}</b> to reimburse`:''}${coN?` (${coN} company-paid)`:''}.${late?' Approve late items, at the bottom, takes them.':' Approve all, at the bottom, takes them.'}</div></div>`);
  }
  if(plan.cents>0){
    const what=`<b>${money(plan.cents/100)}</b> (${qboPlural(plan.items.length,'item')})`;
    if(old) parts.push(`<div class="qbo-row"><div class="ic">🔒</div><div class="grow small">Approved and not in a booking here: ${what}. Older than the JEs the Mac reads from QuickBooks; book it by hand.</div></div>`);
    else if(!person || !person.company) parts.push(`<div class="qbo-row"><div class="ic">💵</div><div class="grow small">Ready to book ${what} once ${esc(first)} is linked to Gusto.</div></div>`);
    else if(!setup) parts.push(`<div class="qbo-row"><div class="ic">💵</div><div class="grow small">Ready to book ${what}, but ${esc(co)} isn’t set up for booking yet. The Mac sets it up on its next refresh.</div></div>`);
    else if(!keys.size) parts.push(`<div class="qbo-row" id="qboNoKey"><div class="ic qbo-warn">⚠</div><div class="grow small qbo-warn" style="min-width:0">${QBO_NOKEY_WHY}, so ${what} can’t be booked here. The Mac looks for their JEs by their app name, their Name in Gusto and the names on their past JEs, and none of them has a letter. Add their name in the app first.</div></div>`);
    else if(plan.docName && !qboNameKey(plan.docName)) parts.push(`<div class="qbo-row"><div class="ic qbo-warn">⚠</div><div class="grow small qbo-warn" style="min-width:0">${QBO_NONAME_WHY}, so ${what} can’t be booked here. Give them a first name with letters in the app first.</div></div>`);
    else parts.push(`<div class="qbo-row" style="align-items:center"><div class="ic">💵</div><div class="grow small">Ready to book: ${what}${plan.full?'':'. The rest of the period is already in QuickBooks'}.</div>
      <button type="button" class="btn sm primary" data-qbo="book">Book in QuickBooks</button></div>`);
  } else if(!live.length) parts.push(`<div class="small muted" style="margin-top:8px">${notYet.length?'Nothing approved to book yet.':'Nothing to reimburse this period.'}</div>`);
  host.innerHTML=card(parts.join(''));
  host.querySelectorAll('[data-qbo]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.qbo;
    if(k==='refresh') return qboRefresh(b, ()=>qboSection(ctx.baId, per, prof, ctx.subStatus));
    if(k==='link') return qboLinkPick(ctx);
    if(k==='book') return flushGrid($('#admGrid')).then(()=>qboBookCard(ctx));
  });
  host.querySelectorAll('[data-qbb]').forEach(b=>b.onclick=()=>{
    const bk=ctx.bookings.find(x=>String(x.id)===b.dataset.qbb); if(!bk) return;
    const k=b.dataset.act; if(k==='undo') qboUndo(bk); else if(k==='cancel') qboCancel(bk); else if(k==='unlink') qboUnlink(bk);
  });
}
// "Who is this in Gusto?": a typable picker over the three companies' Gusto people (the people still there first, then the
// ones who left Gusto within the Mac's 400 days, marked "(left)"), then the Mac fills the department
async function qboLinkPick(ctx){
  const prof=ctx.prof||{}, name=prof.full_name||prof.email||'this person', first=qboFirst(prof);
  const { data:all, error }=await supabase.from('ba_qbo_gusto_people').select('*').order('name');
  if(error) return toast('Couldn’t read the Gusto list: '+error.message,'err',6000);
  const data=[...(all||[]).filter(g=>g.active!==false), ...(all||[]).filter(g=>g.active===false)];
  if(!data.length) return toast('The Mac hasn’t sent the Gusto list yet. Try Refresh in a minute.','err',6000);
  const opts=data.map(g=>{ const co=qboCoName(g.company, ctx.setupBy), left=g.active===false;
    return { id:g.company+'|'+g.gusto_uuid, name:`${g.name}${left?' (left)':''} · ${co}${g.department?' · '+g.department:''}`, search:`${g.name} ${co} ${g.department||''}${left?' left':''}` }; });
  const cur=ctx.person && ctx.person.company && ctx.person.gusto_uuid ? ctx.person.company+'|'+ctx.person.gusto_uuid : '';
  cellPickerSheet({ title:`Who is ${first} in Gusto?`, multi:false, options:opts, selected:cur?[cur]:[], onSave:async ids=>{
    const v=ids && ids[0]; if(!v || v===cur) return;
    const i=v.indexOf('|'), co=v.slice(0,i), uuid=v.slice(i+1);
    const g=data.find(x=>x.company===co && x.gusto_uuid===uuid); if(!g) return;
    const coName=qboCoName(co, ctx.setupBy);
    if(!confirm(`${name} is ${g.name} in ${coName}’s Gusto${g.active===false?' (who has left Gusto)':''}?\n\nTheir reimbursements are then booked in ${coName}, with the class their Gusto department gives.`)) return;
    const { error:e2 }=await supabase.rpc('ba_qbo_link_person',{ p_profile:ctx.baId, p_company:co, p_gusto_uuid:uuid });
    if(e2) return toast(e2.message,'err',9000);
    toast('Linked. The Mac reads their department from Gusto within about a minute.','ok',5000);
    qboSection(ctx.baId, ctx.per, ctx.prof, ctx.subStatus);
  } });
}
// after a link: wait for the Mac to read the person's Gusto department (and so their class), then redraw
const QBO_PW=new Set();
async function qboWaitPerson(baId){
  if(QBO_PW.has(baId)) return; QBO_PW.add(baId);
  const t0=Date.now();
  try{
    while(Date.now()-t0<15*60e3 && state.session){
      await new Promise(r=>setTimeout(r, Date.now()-t0<3*60e3 ? 5000 : 20000));
      const { data }=await supabase.from('ba_qbo_people').select('department,class,problem').eq('profile_id',baId).maybeSingle();
      if(data && (data.department || (data.class && data.class.id!=null) || !/^Getting their department/i.test(data.problem||''))){
        const h=document.getElementById('qboSec');
        if(h && h.dataset.ba===String(baId)) qboSection(baId, state.period, state._admProf, h.dataset.sub);
        return;
      }
    }
  } finally { QBO_PW.delete(baId); }
}
// The Book card: the JE as it will be booked, with typable account and class pickers; Book asks the Mac and follows it
function qboBookCard(ctx){
  const per=ctx.per, prof=ctx.prof||{}, name=prof.full_name||prof.email||'', first=qboFirst(prof);
  const person=ctx.person, setup=ctx.setupBy[person.company];
  const { T, E }=qboArrays(ctx);
  const taken=qboTaken(ctx.bookingItems);
  const st={ ov:{ lines:{}, items:{} }, cls:null, open:new Set(), busy:false, err:'', sent:null, row:null };
  const mk=()=>qboPlan({ T, E, taken, setup, person, overrides:st.ov, cls:st.cls, fullName:prof.full_name });
  let P=mk();
  const old=qboTooOld(per, todayISO());
  const keys=qboCtxKeys(ctx);   // every name they have been booked under (the Mac's set)
  const def=qboDefaultDate({ period:per, paydays:ctx.paydays, gustoUuid:person.gusto_uuid, cents:P.cents, today:todayISO(), jes:ctx.jes, company:person.company, keys, adjustments:ctx.adjustments });
  st.date=(def && def.date) || '';
  // the JEs to check: Book asks "Book anyway?" over them, and the plan names them (checked_jes) so the Mac lets them by
  const warns=old ? [] : qboHandWarnings({ jes:ctx.jes, company:person.company, keys, periodEnd:per.end_date, held:ctx.held });
  const accts=(setup.accounts||[]).filter(a=>a && a.id!=null).map(a=>({ id:String(a.id), name:String(a.name||a.id), search:`${a.name||''} ${a.id}` }))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const classes=(setup.classes||[]).filter(c=>c && c.id!=null).map(c=>({ id:String(c.id), name:String(c.name||c.id) })).sort((a,b)=>a.name.localeCompare(b.name));
  const today=todayISO(), minD=qboAddDays(today,-400), maxD=qboAddDays(today,60);   // what ba_qbo_request() accepts
  const acctOf=id=>{ const a=accts.find(x=>x.id===id); return a ? { id:a.id, name:a.name } : null; };
  const itemWords=l=>{ const t=l.items.filter(i=>i.kind==='trip').length, e=l.items.length-t;
    return [t?qboPlural(t,'trip'):'', e?qboPlural(e,'expense'):''].filter(Boolean).join(' + '); };
  const itemLabel=it=>{ if(it.kind==='trip'){ const d=it.disp ? dispName(it.disp) : ''; return (d && d!=='—') ? d : it.label; } return it.label+(it.category?' · '+it.category:''); };
  const noAccts=()=>toast('The Mac hasn’t sent this company’s accounts yet. Try Refresh in a minute.','err',6000);
  const blocker=()=>{
    if(old) return 'This period is older than the JEs the Mac reads from QuickBooks, so book it by hand.';
    if(!(P.items.length && P.cents>0)) return 'There is nothing to book.';
    if(!keys.size) return QBO_NOKEY_WHY+'. Add their name in the app first.';
    if(P.needsPick.length){ const n=P.lines.filter(l=>l.pick).length; return n===1 ? 'Pick an account for the line in red first.' : `Pick an account for the ${n} lines in red first.`; }
    if(!P.cls) return 'Pick a class first.';
    if(!P.credit) return 'The Mac hasn’t sent this company’s Reimbursements account yet. Try Refresh.';
    if(!P.docName) return 'The Mac hasn’t sent a name for the JE number yet.';
    if(!qboNameKey(P.docName)) return QBO_NONAME_WHY+'. Give them a first name with letters in the app first.';
    if(!st.date) return 'Pick a date first.';
    if(st.date<minD || st.date>maxD) return 'Pick a date within the last year or the next two months.';
    return P.problems[0] || '';
  };
  state._sheetReturn=()=>adminBaDetail(ctx.baId);   // closing the card goes back to the person's sheet
  openSheet(`<div id="qbCard"></div>`);
  const follow=id=>qboWatch(id,'card',row=>{ st.row=row; if(document.getElementById('qbCard') && st.sent && String(st.sent.id)===String(row.id)) draw(); });
  async function book(){
    P=mk(); const why=blocker(); if(why){ st.err=why; return draw(); }
    if(warns.length && !confirm(`QuickBooks already has ${warns.map(j=>`JE ${j.doc_number||j.je_id} (${fmtDate(j.txn_date)}, ${money(Number(j.total))})`).join(', ')} for ${first}, not matched to any items.\n\nIf it is this reimbursement, booking it again puts it in QuickBooks twice. Book anyway?`)) return;
    const d=st.date===(def && def.date) ? def : { how:'typed', note:`Picked on the card${def?` (the default was ${def.note})`:''}` };
    const p={ ba_id:ctx.baId, period_id:per.id, company:person.company, txn_date:st.date, plan:qboRequestPlan(P, d, warns.map(j=>j.je_id)) };
    st.busy=true; st.err=''; draw();
    const { data, error }=await supabase.rpc('ba_qbo_request',{ p });
    st.busy=false;
    if(error || !data){ st.err=(error && error.message) || 'The database didn’t take it. Try again.'; return draw(); }
    st.sent={ id:data, at:new Date().toISOString() }; st.row=null; draw();
    follow(data); qboWatch(data,'after',qboAfterChange);
  }
  function statusHtml(){
    const r=st.row, s=r ? r.status : 'queued', je=r && r.doc_number ? 'JE '+esc(r.doc_number) : 'the JE';
    const btn=(k,l)=>`<div style="margin-top:8px"><button type="button" class="btn sm ghost" data-qbs="${k}">${l}</button></div>`;
    let cls='', html;
    if(s==='queued') html=`⏳ <b>Waiting for the Mac.</b> It checks every minute and books it within about a minute after that (asked ${esc(qboWhen(st.sent.at))}).${btn('cancel','Cancel this booking')}`;
    // working: the number the Mac took for it, and its note when QuickBooks didn't answer; booked: its note is a check to make
    else if(s==='working') html=`⏳ <b>The Mac is booking it${r.doc_number?' as '+je:''}${r.detail?'…':' now…'}</b> ${r.detail?esc(r.detail):'Each receipt takes a second or two to attach.'}`;
    else if(s==='booked'){ cls='ok'; html=`✓ <b>Booked: ${je}</b> on ${esc(fmtDate(r.txn_date))} for ${money(Number(r.total))}, ${qboPlural(Array.isArray(r.attachments)?r.attachments.length:0,'file')} attached.${r.detail?(qboNoteAsks(r.detail)?`<div class="qbo-warn" id="qbStatusNote" style="margin-top:6px">⚠ ${esc(r.detail)}</div>`:`<div class="muted" id="qbStatusNote" style="margin-top:6px">${esc(r.detail)}</div>`):''}${btn('undo','Undo')}`; }
    else if(s==='failed'){ cls='bad'; html=`⚠ <b>Didn’t book.</b> ${esc(r.detail||'The Mac didn’t say why.')}`; }
    else if(s==='expired'){ cls='bad'; html=`⚠ <b>Not booked:</b> the Mac didn’t pick it up in 15 minutes. ${esc(r.detail||'')}`; }
    else if(s==='cancelled') html='Cancelled. Nothing was booked.';
    else if(s==='undo_queued') html=`⏳ Taking ${je} out of QuickBooks: waiting for the Mac.`;
    else if(s==='undoing') html=`⏳ Taking ${je} out of QuickBooks…`;
    else if(s==='undone') html=`Undone: ${je} is out of QuickBooks.`;
    else if(s==='undo_failed'){ cls='bad'; html=`⚠ <b>Couldn’t undo ${je}.</b> ${esc(r.detail||'')}${btn('undo','Try again')}`; }
    else html=esc(s);
    return `<div class="qbo-status ${cls}" id="qbStatus">${html}</div>`;
  }
  function draw(){
    const host=document.getElementById('qbCard'); if(!host) return;
    P=mk();
    const locked=!!(st.sent || st.busy);
    const gusto=qboGustoPaid({ period:per, paydays:ctx.paydays, gustoUuid:person.gusto_uuid, cents:P.cents, adjustments:ctx.adjustments, company:person.company });
    const how=st.date===(def && def.date) ? (def ? def.note : '') : `Picked here${def?` (the default was ${def.note})`:''}`;
    const why=blocker();
    const ownCls=person.class && person.class.id!=null;
    host.innerHTML=`
      <h3>Book in QuickBooks</h3>
      <div class="small muted">${esc(name)} · ${esc(per.label)}</div>
      <div class="qbo-kv" style="margin-top:10px"><span class="muted">Company</span><span><b>${esc(qboCoName(person.company, ctx.setupBy))}</b></span></div>
      <div class="qbo-kv" style="align-items:center"><span class="muted">Class</span><span>${ownCls?`<b>${esc(person.class.name)}</b>`
        :`<button type="button" class="selpick${P.cls?'':' needs'}" id="qbCls" ${locked?'disabled':''} style="min-height:36px;padding:6px 10px;min-width:150px">${P.cls?esc(P.cls.name):'<span class="pkph">Pick a class…</span>'}</button>`}</span></div>
      <div class="qbo-kv" style="align-items:center"><span class="muted">Date</span><span><input type="date" id="qbDate" value="${esc(st.date)}" min="${minD}" max="${maxD}" ${locked?'disabled':''} style="width:auto;padding:7px 9px"></span></div>
      <div class="small muted" id="qbDateHow" style="margin:-3px 0 4px;text-align:right">${esc(how)}</div>
      <div class="qbo-kv"><span class="muted">Number</span><span>${setup.next_doc!=null?`<b>${esc(String(setup.next_doc))} ${esc(P.docName)}</b> is the next number; it’s set when it’s booked.`:`The Mac sets it when it books it: its next number and ${esc(P.docName)}.`}</span></div>
      <div class="qbo-head">Credit</div>
      <div class="qbo-line"><div class="row" style="gap:10px"><b class="grow">${P.credit?esc(P.credit.name):'<span class="qbo-bad">No Reimbursements account from the Mac yet</span>'}</b><b style="flex:none">${money(P.cents/100)}</b></div>
        <div class="small muted" style="margin-top:3px">No class, description or name on the credit line.</div></div>
      <div class="qbo-head">Debits${P.cls?` · class ${esc(P.cls.name)}`:''}</div>
      ${P.lines.map((l,i)=>{ const open=st.open.has(l.key);
        return `<div class="qbo-line${l.pick?' pick':''}" data-line="${esc(l.key)}">
          <div class="row" style="gap:10px"><button type="button" class="selpick grow${l.pick?' needs':''}" data-qbl="${i}" ${locked?'disabled':''}><span>${l.account?esc(l.account.name):'Pick an account…'}</span></button><b style="flex:none">${money(l.cents/100)}</b></div>
          <div class="small muted" style="margin-top:5px">${l.description?`${esc(l.description)} · `:''}${itemWords(l)}${l.pick?` · <span class="qbo-bad">${esc(l.category)} has no default account</span>`:''}
            · <button type="button" class="qbo-link" data-qbi="${i}">${open?'Hide':'Show'} items</button></div>
          ${open?`<div class="qbo-items">${l.items.map(it=>`<div class="qbo-item"><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(fmtDate(it.date))} · ${esc(itemLabel(it))}</span><span style="flex:none">${money(it.cents/100)}</span>${locked?'':`<button type="button" class="btn sm ghost" data-qbm="${esc(it.key)}">Move</button>`}</div>`).join('')}</div>`:''}
        </div>`; }).join('')}
      <div class="qbo-kv" style="margin-top:12px"><span class="muted">Attachments</span><span>${qboReceiptWords(P.receipts.length)}</span></div>
      <div class="small muted" style="margin:-3px 0 4px;text-align:right">${P.full?'Every approved expense’s receipt in the period, company-paid ones too':'Only these items’ receipts: the rest of the period is already in QuickBooks'}</div>
      <div class="qbo-kv"><b>Total</b><b id="qbTotal">${money(P.cents/100)}</b></div>
      ${gusto?`<div class="qbo-kv"><span class="muted">Gusto</span><span class="${gusto.same?'qbo-good':'qbo-warn'}" id="qbGusto">${gusto.same?'✓':'⚠'} ${gusto.cents||gusto.lines.length
        ? `Paid ${money(gusto.cents/100)} on ${esc(qboMD(gusto.date))}${gusto.lines.length>1?` (${gusto.lines.map(c=>money(c/100)).join(' + ')})`:''}${gusto.same?'':`, not ${money((P.cents+(gusto.adj||0))/100)}`}`
        : `The ${esc(qboMD(gusto.date))} payroll paid ${esc(first)} no reimbursement`}${gusto.adj?` (this claim ${esc(qboAdjWords(gusto.adj))})`:''}</span></div>`:''}
      ${warns.length?`<div class="small qbo-warn" id="qbWarn" style="margin-top:10px">⚠ QuickBooks already has ${warns.map(j=>`<b>JE ${esc(j.doc_number||j.je_id)}</b> (${esc(fmtDate(j.txn_date))}, ${money(Number(j.total))})`).join(', ')} for ${esc(first)}, not matched to any items. Check it isn’t this reimbursement before booking.</div>`:''}
      ${st.sent ? statusHtml() : `
        <div class="small" id="qbMsg" style="color:var(--red);min-height:1px;margin-top:10px">${esc(st.err||why)}</div>
        <button type="button" class="btn primary block" id="qbBook" style="margin-top:8px" ${why||st.busy?'disabled':''}>${st.busy?'<span class="spin"></span>':'Book in QuickBooks'}</button>
        <div class="small muted center" style="margin-top:6px">The Mac books it within about a minute.</div>`}
      <button type="button" class="btn ghost block" id="qbClose" style="margin-top:8px">${st.sent?'Close':'Cancel'}</button>`;
    host.querySelector('#qbClose').onclick=closeSheet;
    const dt=host.querySelector('#qbDate'); if(dt) dt.onchange=()=>{ st.date=dt.value; st.err=''; draw(); };
    const cb=host.querySelector('#qbCls'); if(cb) cb.onclick=()=>{ if(!classes.length) return toast('The Mac hasn’t sent this company’s classes yet. Try Refresh in a minute.','err',6000);
      cellPickerSheet({ title:'Class', multi:false, options:classes, selected:P.cls?[String(P.cls.id)]:[],
        onSave:ids=>{ const c=classes.find(x=>x.id===(ids && ids[0])); if(!c) return; st.cls={ id:c.id, name:c.name }; st.err=''; draw(); } }); };
    host.querySelectorAll('[data-qbl]').forEach(b=>b.onclick=()=>{ const l=P.lines[Number(b.dataset.qbl)]; if(!l) return; if(!accts.length) return noAccts();
      cellPickerSheet({ title:l.description?`Account for ${l.description}`:`Account for ${itemWords(l)}`, multi:false, options:accts,
        selected:l.account?[String(l.account.id)]:[], onSave:ids=>{ const a=acctOf(ids && ids[0]); if(!a) return;
          const was=st.open.has(l.key); l.items.forEach(it=>{ st.ov.items[it.key]=a; }); if(was) st.open.add('a'+a.id+'|'+l.description);
          st.err=''; draw(); } }); });
    host.querySelectorAll('[data-qbi]').forEach(b=>b.onclick=()=>{ const l=P.lines[Number(b.dataset.qbi)]; if(!l) return; if(st.open.has(l.key)) st.open.delete(l.key); else st.open.add(l.key); draw(); });
    host.querySelectorAll('[data-qbm]').forEach(b=>b.onclick=()=>{ const it=P.items.find(x=>x.key===b.dataset.qbm); if(!it) return; if(!accts.length) return noAccts();
      cellPickerSheet({ title:`Account for ${itemLabel(it)} (${money(it.cents/100)})`, multi:false, options:accts, selected:it.account?[String(it.account.id)]:[],
        onSave:ids=>{ const a=acctOf(ids && ids[0]); if(!a) return; st.ov.items[it.key]=a; st.open.add('a'+a.id+'|'+it.description); st.err=''; draw(); } }); });
    const bk=host.querySelector('#qbBook'); if(bk) bk.onclick=book;
    host.querySelectorAll('[data-qbs]').forEach(b=>b.onclick=async()=>{
      const r=st.row || { id:st.sent.id, status:'queued', ba_id:ctx.baId, period_id:per.id, total:P.cents/100 };
      if(b.dataset.qbs==='cancel'){ if(await qboCancel(r)){ st.row={ ...r, status:'cancelled' }; draw(); } }
      else if(b.dataset.qbs==='undo'){ if(await qboUndo(r)){ st.row={ ...r, status:'undo_queued' }; draw(); follow(r.id); } }
    });
  }
  draw();
}
// The Review list (adminReview) for bookers: everyone's bookable items, bookings, paydays and JEs for the period, and the
// JE numbers of everyone's bookings in any period (docsBy, for their name keys)
async function qboLoadPeriod(per){
  const ok=r=>{ if(r && r.error) throw r.error; return r ? r.data : null; };
  const [st, pp, bk, wk, tr, ex, pd, je, docs]=await Promise.all([
    supabase.from('ba_qbo_setup').select('*'),
    supabase.from('ba_qbo_people').select('*'),
    supabase.from('ba_qbo_bookings').select('*').eq('period_id',per.id).order('requested_at',{ascending:false}),
    supabase.from('ba_qbo_worker').select('*').eq('id',1).maybeSingle(),
    supabase.from('trips').select('id,ba_id,period_id,amount,status,trip_date,dest_label,start_label,dispensary_id').eq('period_id',per.id),
    selectExpenses('id,ba_id,period_id,amount,status,payment,category,receipt_path,expense_date,vendor,dispensary_id', q=>q.eq('period_id',per.id)),
    supabase.from('ba_qbo_paydays').select('*').gte('period_start',qboAddDays(per.start_date,-31)).order('check_date'),   // and the payday before (qboAdjHome)
    supabase.from('ba_qbo_jes').select('*').gt('txn_date',per.end_date).lte('txn_date',qboAddDays(per.end_date,120)),
    qboLoadDocs(null),
  ]);
  const setupBy={}; (ok(st)||[]).forEach(s=>{ setupBy[s.company]=s; });
  const people={}; (ok(pp)||[]).forEach(p=>{ people[p.profile_id]=p; });
  const docsBy={}; (docs||[]).forEach(r=>{ (docsBy[r.ba_id]=docsBy[r.ba_id]||[]).push(r); });
  const bookings=ok(bk)||[], ids=bookings.map(b=>b.id);
  const [it, adj]=await Promise.all([ids.length ? supabase.from('ba_qbo_booking_items').select('*').in('booking_id',ids) : { data:[] }, qboLoadAdjustments(null)]);
  const adjBy={}; (adj||[]).forEach(a=>{ (adjBy[a.profile_id]=adjBy[a.profile_id]||[]).push(a); });
  const jes=ok(je)||[];
  // a JE any live booking holds, of this period or another, is matched: read the bookings that carry these JEs' ids
  const jeIds=[...new Set(jes.map(j=>String(j.je_id)))];
  const byJe=jeIds.length ? ok(await supabase.from('ba_qbo_bookings').select('id,company,je_id,status').in('je_id',jeIds))||[] : [];
  return { setupBy, people, bookings, items:ok(it)||[], worker:ok(wk)||null, T:ok(tr)||[], E:ok(ex)||[], paydays:ok(pd)||[], jes, held:qboHeldJes([...bookings, ...byJe]), adjBy, docsBy };
}
// one person's line in the Review list: what is bookable, its date, the JEs to check, why Book all ready would leave them
// out (why), and the tag, which says "Ready to book" only when Book all ready takes them
function qboPersonSummary(b, per, d, today){
  const person=d.people[b.id]||null, co=person && person.company, setup=co ? d.setupBy[co]||null : null;
  const T=d.T.filter(x=>x.ba_id===b.id), E=d.E.filter(x=>x.ba_id===b.id);
  const bookings=d.bookings.filter(x=>x.ba_id===b.id), mine=new Set(bookings.map(x=>x.id));
  const plan=qboPlan({ T, E, taken:qboTaken(d.items.filter(i=>mine.has(i.booking_id))), setup, person, fullName:b.full_name });
  const tooOld=qboTooOld(per, today);
  // every name they have been booked under, the Mac's set (an app rename can't hide an old JE; none: not ready)
  const keys=qboPersonKeys({ fullName:b.full_name, person, bookings:(d.docsBy||{})[b.id]||[] });
  const date=qboDefaultDate({ period:per, paydays:d.paydays.filter(r=>r.company===co), gustoUuid:person && person.gusto_uuid, cents:plan.cents, today,
    jes:d.jes, company:co, keys, adjustments:(d.adjBy||{})[b.id]||[] });
  const warnings=(co && !tooOld) ? qboHandWarnings({ jes:d.jes, company:co, keys, periodEnd:per.end_date, held:d.held }) : [];
  const why=qboReadyWhy({ plan, person, setup, warnings, date, tooOld, keys });
  // the newest booking, when it ended without a JE: Book all ready says so beside them
  const newest=bookings.slice().sort((a,c)=>String(c.requested_at).localeCompare(String(a.requested_at)))[0];
  const lastFail=newest && (newest.status==='failed' || newest.status==='expired') ? newest : null;
  return { b, person, setup, plan, date, warnings, why, tooOld, bookings, lastFail, coName:co ? qboCoName(co, d.setupBy) : '',
    badge:qboBadge({ bookings, cents:plan.cents, warnings, person, tooOld, ready:!why.length }) };
}

// a Book all ready row's words for its booking; undo=false once its Undo was pressed (the row then only follows it). Working:
// the number the Mac took and its note when QuickBooks didn't answer; booked: its note is a check to make in QuickBooks.
function qboAllWords(row, undo=true){
  const je=row.doc_number ? 'JE '+esc(row.doc_number) : 'the JE';
  switch(row.status){
    case 'queued': return '⏳ Waiting for the Mac…';
    case 'working': return '⏳ Booking'+(row.doc_number?' as '+je:'')+(row.detail?'… '+esc(row.detail):' now…');
    case 'booked': return `✓ Booked ${je}`+(undo?` <button type="button" class="qbo-link" data-qbau="${esc(row.id)}">Undo</button>`:'')
      +(row.detail?(qboNoteAsks(row.detail)?`<div class="qbo-warn">⚠ ${esc(row.detail)}</div>`:`<div class="muted">${esc(row.detail)}</div>`):'');
    case 'failed': return '⚠ Didn’t book: '+esc(row.detail||'the Mac didn’t say why.');
    case 'expired': return '⚠ Not booked: the Mac didn’t pick it up in 15 minutes.';
    case 'cancelled': return 'Cancelled. Nothing was booked.';
    case 'undo_queued': case 'undoing': return `⏳ Taking ${je} out of QuickBooks…`;
    case 'undone': return `Undone: ${je} is out of QuickBooks.`;
    case 'undo_failed': return `⚠ Couldn’t undo ${je}: `+esc(row.detail||'');
  }
  return esc(row.status||'');
}
// "Book all ready": everyone with nothing to pick, a company and a class, no JE to check first and a date from Gusto, one
// request at a time (none carries checked JEs: anyone with a JE to check is booked from their card)
function qboBookAllSheet(per, ready, held){
  const list=ready.slice().sort((a,b)=>String(a.b.full_name||'').localeCompare(String(b.b.full_name||'')));
  const total=list.reduce((s,x)=>s+x.plan.cents,0);

  openSheet(`<h3>Book all ready</h3>
    <div class="small muted">${esc(per.label)}</div>
    <p class="small" style="margin:10px 0 4px">${qboPlural(list.length,'person','people')} with nothing to pick, a company and a class, no JE in QuickBooks to check first, and a date from Gusto. Each becomes its own JE, dated as shown.</p>
    <div id="qbaList">${list.map((x,i)=>`<div class="qbo-row" style="align-items:flex-start"><div class="grow small" style="min-width:0">
        <b>${esc(x.b.full_name||x.b.email)}</b> · ${esc(x.coName)} · ${esc(x.plan.cls.name)} · ${qboPlural(x.plan.items.length,'item')}
        <div class="muted">${esc(fmtDate(x.date.date))}: ${esc(x.date.note)} · ${qboReceiptWords(x.plan.receipts.length)}</div>
        ${x.lastFail?`<div class="qbo-warn">The last try didn’t book: ${esc(x.lastFail.status==='expired'?'the Mac didn’t pick it up in 15 minutes.':(x.lastFail.detail||'the Mac didn’t say why.'))}</div>`:''}
        <div id="qbaSt${i}" class="muted" style="margin-top:2px"></div></div>
      <b style="flex:none">${money(x.plan.cents/100)}</b></div>`).join('')}</div>
    <div class="qbo-kv"><b>Total</b><b>${money(total/100)}</b></div>
    ${held.length?`<div class="qbo-head">Not included</div>${held.map(x=>`<div class="small" style="padding:3px 0"><b>${esc(x.b.full_name||x.b.email)}</b> (${money(x.plan.cents/100)}): ${esc(x.why.join('; '))}</div>`).join('')}
      <div class="small muted" style="margin-top:2px">Open them from the list to book them one by one.</div>`:''}
    <div id="qbaMsg" class="small muted" style="margin-top:10px"></div>
    <button type="button" class="btn primary block" id="qbaGo" style="margin-top:8px">Book ${list.length}</button>
    <div class="small muted center" style="margin-top:6px">The Mac books them one at a time, each within about a minute.</div>
    <button type="button" class="btn ghost block" id="qbaClose" style="margin-top:8px">Close</button>`);
  $('#qbaClose').onclick=closeSheet;
  const rowsBy={};   // booking id -> its latest row (for Undo)
  let going=false, sent=0, answered=0, booked=0, notBooked=0;
  const clsOf=row=>row.status==='booked' ? 'qbo-good' : (['failed','expired','cancelled','undo_failed'].includes(row.status) ? 'qbo-warn' : 'muted');
  const setSt=(i,html,cls)=>{ const el=document.getElementById('qbaSt'+i); if(!el) return; el.className=cls||'muted'; el.innerHTML=html;
    el.querySelectorAll('[data-qbau]').forEach(u=>u.onclick=async()=>{ const r=rowsBy[u.dataset.qbau]; if(!r || u.disabled) return;
      u.disabled=true;
      if(!(await qboUndo(r))){ u.disabled=false; return; }
      // undo asked: it no longer counts as booked, and the row follows it (text only) to "Undone"; an undo the Mac couldn't
      // do leaves the JE in QuickBooks, so it counts as booked again
      booked=Math.max(0,booked-1); tally();
      rowsBy[r.id]={ ...r, status:'undo_queued' }; setSt(i, qboAllWords(rowsBy[r.id], false), 'muted');
      qboWatch(r.id,'allu',row=>{ rowsBy[row.id]=row; setSt(i, qboAllWords(row, false), clsOf(row)); if(row.status==='undo_failed'){ booked++; tally(); } }); }); };
  const tally=()=>{
    const words=going ? `Sent ${sent} of ${list.length}…` : (answered<sent ? `Sent ${sent}. ${answered} answered so far.`
      : `Booked ${booked} of ${list.length}${notBooked?`; ${notBooked} not booked`:''}.`);
    const el=document.getElementById('qbaMsg');
    if(el) el.textContent=words;
    else if(!going && sent && answered===sent) toast(words, notBooked?'err':'ok', 6000);   // the sheet was closed: say it once
  };
  $('#qbaGo').onclick=async()=>{
    const go=$('#qbaGo'); if(going || !go || go.disabled) return;
    going=true; go.disabled=true; go.textContent='Sending…';
    for(let i=0;i<list.length;i++){
      const x=list[i];
      setSt(i,'Sending…');
      const p={ ba_id:x.b.id, period_id:per.id, company:x.person.company, txn_date:x.date.date, plan:qboRequestPlan(x.plan, x.date, []) };
      const { data, error }=await supabase.rpc('ba_qbo_request',{ p });
      if(error || !data){ notBooked++; setSt(i,'⚠ Not sent: '+esc((error && error.message)||'no answer from the database'),'qbo-warn'); tally(); continue; }
      sent++; setSt(i,'⏳ Waiting for the Mac…'); tally();
      qboWatch(data,'all',row=>{
        rowsBy[row.id]=row;
        setSt(i, qboAllWords(row), clsOf(row));
        if(QBO_DONE.has(row.status)){ answered++; if(row.status==='booked') booked++; else notBooked++; tally(); }   // once: the follow ends here
      },{ quiet:true });
      qboWatch(data,'after',qboAfterChange,{ quiet:true });
    }
    going=false; tally();
    if(go.isConnected) go.textContent=sent ? `Sent ${sent}` : 'Nothing was sent';
  };
}

/* ── Payroll list: the page side (bookers only) ──
   One list per Gusto check date with what to type into Gusto for each person that day (ba/docs/qbo-reimbursements.md,
   "Payroll list and the after-submit check"; the PAYROLL MODEL block). It keeps its own check date (state.payrollDay), never
   the shared pay period picker's; it reads the payroll tables and the claims of the periods that date pays, and changes
   adjustments only through ba_reimb_adjust_add, ba_reimb_adjust_carry and ba_reimb_adjust_cancel. */
let payrollGen=0;
// every row of a read that can pass the database's 1,000-row answer, page by page (get(from, to) answers {data, error})
async function payrollPaged(get){
  const PAGE=1000, out=[];
  for(let p=0;p<50;p++){
    const { data, error }=await get(p*PAGE, p*PAGE+PAGE-1);
    if(error) throw error;
    (data||[]).forEach(x=>out.push(x));
    if(!data || data.length<PAGE) return out;
  }
  throw new Error('Too many rows to read.');
}
// the paydays (about 230 days back and all ahead), the Mac's checks, who is linked to which Gusto, the live adjustments and
// the pay periods (from further back, for late claims); any error throws
async function payrollLoad(){
  const ok=r=>{ if(r && r.error) throw r.error; return r ? r.data : null; };
  const from=qboAddDays(todayISO(),-230);
  const [pd, ck, pp, pr, gp, ad, wk, ps]=await Promise.all([
    supabase.from('ba_qbo_paydays').select('company,period_start,period_end,check_date,processed,late,payroll_uuid,paid').gte('check_date',from).order('check_date'),
    supabase.from('ba_payroll_checks').select('company,payroll_uuid,check_date,period_start,period_end,off_cycle,processed_at,deadline,status,lines,summary,checked_at').gte('check_date',from).order('check_date'),
    supabase.from('ba_qbo_people').select('profile_id,company,gusto_uuid,gusto_name'),
    supabase.from('profiles').select('id,full_name,email,active'),
    supabase.from('ba_qbo_gusto_people').select('company,gusto_uuid,name'),
    supabase.from('ba_reimb_adjustments').select('id,profile_id,company,check_date,cents,reason,source_check_date,carried_from,carry_group,created_at,cancelled_at').is('cancelled_at',null),
    supabase.from('ba_qbo_worker').select('*').eq('id',1).maybeSingle(),
    supabase.from('pay_periods').select('id,label,start_date,end_date').gte('end_date',qboAddDays(from,-PAYROLL_LATE_DAYS-40)),
  ]);
  return { paydays:ok(pd)||[], checks:ok(ck)||[], people:ok(pp)||[], profiles:ok(pr)||[], gustoPeople:ok(gp)||[], adjustments:ok(ad)||[],
    worker:ok(wk)||null, periods:ok(ps)||[] };
}
// the trips, expenses and submissions of the periods a check date pays and of the ones before it that a late claim can come
// from (everyone's: the claims are worked out on the page)
async function payrollLoadClaims(ids){
  if(!ids.length) return { T:[], E:[], subs:[] };
  const [T, E, sb]=await Promise.all([
    payrollPaged((a,z)=>supabase.from('trips').select('id,ba_id,period_id,amount,status').in('period_id',ids).order('id').range(a,z)),
    payrollPaged((a,z)=>selectExpenses('id,ba_id,period_id,amount,status,payment', q=>q.in('period_id',ids).order('id').range(a,z))),
    supabase.from('submissions').select('ba_id,period_id,status').in('period_id',ids),
  ]);
  if(sb.error) throw sb.error;
  return { T, E, subs:sb.data||[] };
}
// when Gusto ran it, in this device's time: "today at 2:14 PM", "on Mon, Nov 23 at 2:14 PM"
function payrollWhen(ts){
  const d=new Date(ts); if(!ts || isNaN(d)) return '';
  const t=d.toLocaleTimeString([],{ hour:'numeric', minute:'2-digit' });
  return localISO(ts)===todayISO() ? `today at ${t}` : `on ${d.toLocaleDateString([],{ weekday:'short', month:'short', day:'numeric' })} at ${t}`;
}
async function copyText(s){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(s); return true; } }catch(_){}
  try{
    const t=document.createElement('textarea'); t.value=s; t.setAttribute('readonly',''); t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); return !!ok;
  }catch(_){ return false; }
}

// Gusto's side of one company's payday: not run yet, or run (when, when the Mac checked it, until when it can be cancelled,
// and what the check found)
function payrollGustoHtml(c){
  if(!c.regular) return '';
  if(!c.run) return `<div class="small muted" style="margin-top:4px">Not run in Gusto yet${c.late?'. Gusto has it as late':''}.</div>`;
  const k=c.check, n=c.totals.mismatched, out=[];
  const bad=n>0 || !!(k && (k.status==='problems' || k.status==='error'));
  out.push(`<div class="small" style="margin-top:4px">Run in Gusto${k && k.processedAt ? ' '+esc(payrollWhen(k.processedAt)) : ''}.${k ? (k.checkedAt ? ` The Mac checked it ${esc(qboAgo(k.checkedAt))}.` : '') : ' The Mac hasn’t checked it yet.'}</div>`);
  if(k && k.deadline && Date.now()<new Date(k.deadline).getTime()) out.push(`<div class="small ${bad?'qbo-warn':'muted'}">It can be cancelled in Gusto until ${esc(payrollPacific(k.deadline))}.</div>`);
  if(k && k.status==='error') out.push(`<div class="small qbo-warn">⚠ The Mac couldn’t check it${k.summary ? ': '+esc(k.summary) : '.'}</div>`);
  else if(k && k.status==='problems') out.push(`<div class="small qbo-warn">⚠ ${esc(k.summary || 'The Mac found reimbursements that don’t match.')}</div>`);
  else if(k && k.status==='ok' && k.summary && !n) out.push(`<div class="small qbo-good">✓ ${esc(k.summary)}</div>`);
  if(n && !(k && k.status==='problems')) out.push(`<div class="small qbo-warn">⚠ ${n===1 ? 'One person’s reimbursement doesn’t' : n+' people’s reimbursements don’t'} match Type in Gusto.</div>`);
  if(!c.src) out.push('<div class="small muted">What it paid isn’t read yet.</div>');
  return out.join('');
}

// an earlier approved claim still owed (payrollLedger): what is left of it, where adjustments already add it, and while

function payrollLateHtml(c, r, today){
  const list=(r.late||[]).filter(i=>i.rest>0 || (i.later||[]).length);
  if(!list.length) return '';
  const paidHere=!c.open && r.pw && r.pw.ok && r.paid && r.paid.cents>r.type;   // its verdict already counts the extra as late claims
  return list.map(i=>{
    const where=[...(i.here ? [`${qboUsd(i.here)} of it is added to this payday`] : []),
      ...(i.later||[]).map(x=>`${qboUsd(x.cents)} of it is added to ${payrollDay(x.day,today)}`)];
    if(!i.rest) return `<div class="small muted" style="margin-top:4px">Late claim: ${esc(payrollLateWords(i,today))}. ${esc(where.join('; '))}.</div>`;

    return c.open ? what+`<button type="button" class="btn sm" data-paylate="${esc(i.start)}" data-pid="${esc(r.profileId)}" style="margin-top:6px">Add ${esc(qboUsd(i.rest))} to this payday</button>`

// picked, so its amounts don't get typed into another payroll. On a person's sheet (baId) it says what that payroll paid
// them. One small read (two on a sheet); no line on an error.
async function payrollPaidPeriodNote(per, hostId, baId){
  if(!state.qboCanBook || !per || isAllPeriods(per) || !per.start_date || !document.getElementById(hostId)) return;
  let rows, person=null;
  try{

      supabase.from('ba_qbo_paydays').select(baId ? 'company,check_date,processed,paid' : 'company,check_date,processed').eq('period_start',per.start_date),
      baId ? supabase.from('ba_qbo_people').select('company,gusto_uuid').eq('profile_id',baId).maybeSingle() : { data:null },
    ]);
    if(pd.error || pp.error) return;

  if(!h || h.dataset.start!==per.start_date || (baId && h.dataset.ba!==String(baId))) return;   // the screen moved on

/* ── Admin: review queue ── */
async function adminReview(m){
  m.innerHTML=`<div class="loading"><span class="spin"></span></div>`;
  await reloadPeriods();
  const per=state.period;
  const allPer=isAllPeriods(per);
  const perQ=q=>allPer?q:q.eq('period_id',per.id);   // 'All pay periods' = no period filter
  const [{data:bas}, subs, trips, exps, hours] = await Promise.all([
    supabase.from('profiles').select('*').order('full_name'),
    per?perQ(supabase.from('submissions').select('*')):{data:[]},
    per?perQ(supabase.from('trips').select('ba_id')):{data:[]},
    per?perQ(supabase.from('expenses').select('ba_id')):{data:[]},
    per?perQ(supabase.from('hours').select('ba_id')):{data:[]},
  ]);
  // per-period: one submission per BA. All-periods: aggregate — a BA counts as awaiting
  // if ANY period is sitting at 'submitted'; badge shows how many periods are in.
  const subBy={}, subN={};
  (subs.data||[]).forEach(s=>{
    if(['submitted','approved'].includes(s.status)) subN[s.ba_id]=(subN[s.ba_id]||0)+1;
    const cur=subBy[s.ba_id];
    if(!cur || s.status==='submitted' || (cur.status!=='submitted' && (s.submitted_at||'')>(cur.submitted_at||''))) subBy[s.ba_id]=s;
  });
  const cnt={}; (trips.data||[]).concat(exps.data||[]).forEach(x=>cnt[x.ba_id]=(cnt[x.ba_id]||0)+1);
  const hrsBy={}; (hours.data||[]).forEach(h=>hrsBy[h.ba_id]=(hrsBy[h.ba_id]||0)+1);
  let rows=(bas||[]).filter(isFieldWorker);   // BAs + regional admins (Maddy); not universal admins
  if(state.adminRegion!=='all') rows=rows.filter(b=>personRegion(b)===state.adminRegion);
  const turnedIn=b=>allPer ? (subN[b.id]||0)>0 : ['submitted','approved'].includes(subBy[b.id]?.status);
  // order: awaiting your approval → not submitted → approved
  const rank=b=>{ const s=subBy[b.id]?.status; return s==='submitted'?0 : s==='approved'?2 : 1; };
  rows=rows.slice().sort((a,b)=>rank(a)-rank(b)||(a.full_name||'').localeCompare(b.full_name||''));
  const inCount=rows.filter(turnedIn).length;
  const awaiting=rows.filter(b=>subBy[b.id]?.status==='submitted').length;
  m.innerHTML=`
    <div class="card">
      <div class="row"><div class="small muted grow">Pay period</div>${periodPicker(()=>adminReview(m))}</div>

// minimal RFC-4180 CSV parser (handles quoted fields with embedded commas + newlines)
function parseCSV(text){
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r') field+=c;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
// pull per-day Brand Ambassador hours out of a Gusto "time tracking hours" export
function gustoBaHours(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(r=>r.some(c=>/^date$/i.test(c.trim())) && r.some(c=>/job 1 title/i.test(c)));
  if(hi<0) return {error:'Couldn’t find the daily table (needs Date / Job 1 title / Job 1 hours columns).'};
  const head=rows[hi].map(c=>c.trim().toLowerCase());
  const dCol=head.indexOf('date'), j1t=head.indexOf('job 1 title'), j1h=head.indexOf('job 1 hours'),
        j2t=head.indexOf('job 2 title'), j2h=head.indexOf('job 2 hours');
  if(dCol<0||j1t<0||j1h<0) return {error:'Missing required columns in the Gusto file.'};
  const isBA=t=>/brand ambassador/i.test((t||'').trim());
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i];
    const m=((r[dCol]||'').trim()).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) continue;
    const yy=m[3].length===2?('20'+m[3]):m[3];
    const date=`${yy}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    let h=0; if(isBA(r[j1t])) h+=Number(r[j1h]||0); if(j2t>=0&&isBA(r[j2t])) h+=Number(r[j2h]||0);
    if(h>0) out.push({date, hours:Math.round(h*1000)/1000, note:gustoShiftNote(r,head)});
  }
  return {rows:out, total:Math.round(out.reduce((a,x)=>a+x.hours,0)*1000)/1000};
}
// free-text shift note off a Gusto daily row (mirrors gusto-sync/parse.mjs shiftNote):
// a 'Notes' column if present, else the last prose cell; strips a trailing " - Name Name".
function gustoShiftNote(r, head){
  const nc = head.indexOf('notes')>=0 ? head.indexOf('notes') : head.indexOf('note');
  let note = nc>=0 ? (r[nc]||'').trim() : '';
  if(!note){ for(let k=r.length-1;k>9;k--){ const c=(r[k]||'').trim();
    if(!c || /^-?\d[\d.]*$/.test(c)) continue;
    if(/^(un)?approved$/i.test(c)) continue;
    if(/\b(am|pm|now)\b/i.test(c)) continue;
    if(/brand ambassador|brand rep|^sales$/i.test(c)) continue;
    note=c; break; } }
  return note.replace(/\s*[-–]\s*[A-Z][\w'’.-]+(?:\s+[A-Z][\w'’.-]+){1,2}\s*$/,'').trim();
}

// "Pull from Gusto now": inserts a request row that the local gusto-sync daemon polls for.
// The button then live-polls the request until the daemon finishes (or 5 min pass).
function wireGustoPull(m){
  const btn=$('#pullGusto'), status=$('#gustoStatus'); if(!btn) return;
  const showLast=async ()=>{
    const { data, error }=await supabase.from('gusto_pull_requests').select('*').order('requested_at',{ascending:false}).limit(1);
    if(error){ if(status) status.textContent='Gusto sync isn’t set up yet (ask Claude to apply the migration).'; return null; }
    const r=data&&data[0]; if(!r||!status) return;
    const when=new Date(r.requested_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    status.innerHTML = r.status==='done' ? `Last pull: ✅ ${when}${r.detail?' · '+esc(r.detail):''}`
      : r.status==='error' ? `Last pull: ⚠️ ${when} · <span style="color:var(--red)">${esc(r.detail||'failed')}</span>`
      : `Last pull: ⏳ ${r.status} (${when})…`;
    return r;
  };
  showLast();
  btn.onclick=async ()=>{
    busy(btn,true);
    const { data, error }=await supabase.from('gusto_pull_requests')
      .insert({requested_by:state.session.user.id}).select('*').single();
    if(error){ busy(btn,false); return toast(error.message,'err'); }
    toast('Pull requested — your Mac will grab it within a minute','ok');
    if(status) status.textContent='⏳ Waiting for the sync daemon to pick this up…';
    const t0=Date.now();
    const poll=setInterval(async ()=>{
      const { data:r }=await supabase.from('gusto_pull_requests').select('*').eq('id',data.id).single();
      if(!r) return;
      if(r.status==='running' && status) status.textContent='⏳ Pulling from Gusto…';
      if(r.status==='done'||r.status==='error'||Date.now()-t0>5*60*1000){
        clearInterval(poll); busy(btn,false); showLast();
        if(r.status==='done'){ toast('Gusto hours imported ✓','ok'); }
        else if(r.status==='error'){ toast('Gusto pull failed — '+(r.detail||'see status'),'err'); }
        else if(status){ status.innerHTML='⚠️ No response from the sync daemon — is the Mac on and gusto-sync set up? <span class="muted">(falling back: Import a CSV manually)</span>'; busy(btn,false); }
      }
    }, 5000);
  };
}

/* ── auto-update: a PWA tab can keep running an old build forever (the shell stays
   in memory even though the SW is network-first). Poll the live build's APP_VERSION
   and, when it's newer, offer a one-tap refresh. Never force-reloads mid-form. ── */
async function checkForUpdate(){
  try{
    // cache-bust the query so the SW's stale-while-revalidate can't answer from cache
    const html = await (await fetch(`./index.html?v=${Date.now()}`,{cache:'no-store'})).text();
    const m = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] && m[1] !== APP_VERSION) showUpdateBar(m[1]);
  }catch{}
}
function showUpdateBar(v){
  if(document.getElementById('updbar')) return;
  const b=document.createElement('button');
  b.id='updbar'; b.textContent=`🔄 New version — tap to update`;
  b.title=`v${v}`;
  b.onclick=()=>{ b.textContent='Updating…'; location.reload(); };
  document.body.appendChild(b);
}
// Not in the embed: the pipeline page is its own app, and a frame that stays open all day
// would fetch the whole page every 5 minutes for a button nobody there should need.
if(!EMBED){
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkForUpdate(); });
  setInterval(()=>{ if(!document.hidden) checkForUpdate(); }, 5*60*1000);
  setTimeout(checkForUpdate, 15000);   // also shortly after open
}

/* ═══════════════════ SCHEDULE BOARD (workbook viewer) ═══════════════════ */
/* Read-only weekly board of the shared scheduling workbook (Google Sheet).
   Feature-gated: state.scheduleWb only arrives for emails on the
   schedule_board.allowed_emails RLS allowlist — everyone else never sees the
   tab, and the workbook id never ships in this file. Data is fetched straight
   from the sheet's gviz CSV endpoint (link-shared → CORS ok), then the messy
   grid — bands of 7 day-blocks across, "Account Name"/"BRAND" headers, banner
   rows — is flattened to visit cards. */
const SCHED_ALIASES={makennna:'Makenna',makenna:'Makenna',mckenna:'Makenna',mckennna:'Makenna',leticia:'Ledy',ledy:'Ledy',leti:'Ledy','leticia (ledy)':'Ledy',
  // every way the workbook writes a customer pickup is ONE schedule "person" with its own colour
  pickup:'Pickup','pick up':'Pickup','pick-up':'Pickup','customer pick up':'Pickup','customer pickup':'Pickup','customer pick-up':'Pickup',
  'nabis pick up':'Pickup','nabis pickup':'Pickup'};
const SCHED_COLORS={
  // CA: one clearly different colour per person (team request 2026-10-15: "red, orange, yellow, green,
  // purple, pink, brown"), so no two people on the board look alike
  // picked to be far apart in hue AND lightness (min CIEDE2000 distance 26.5; the first set had pink/red and
  // orange/yellow under 22): true red, deep orange, light lemon, green, violet, light pink, dark brown
  Carlos:'#e3121b', Jesse:'#ff8c00', Cesar:'#ffe14d', Ledy:'#2fbf71', Joanna:'#7c4dff', Makenna:'#ff9ed8',
  Amanda:'#888800', Keelin:'#dd0088',   // 2026-11-23: the two names the board's people list adds (the most distinct left)
  Pickup:'#6d4c2e',                     // brown: Metrc driver who isn't one of ours, or a pickup on the sheet
  Al:'#4f9dff', AJ:'#22c6c6', Team:'#b98cff',
  'Driver needed':'#9ca3af',            // grey + ⚠: an upcoming delivery with no driver yet
  // NY field crew
  Rachel:'#ff6fae',Terrance:'#37c8f0',Jackie:'#ffb02e',Chandler:'#7ee081',Maddy:'#c58cff'};
// the board (state) currently being viewed, and its workbook/layout
function schedBoard(){
  const bs=state.scheduleBoards||[];
  return bs.find(b=>b.state===state.schedState) || bs[0] || null;
}
// Drop every trace of the signed-in user's schedule. Sign-out on a shared phone
// otherwise leaves the previous person's board cached in memory, and their last
// board pinned in localStorage for whoever signs in next.
function schedForget(){
  state.sched=null; state.scheduleBoards=[]; state.schedState=null; state.scheduleWb=null; state.schedPeople=null;
  if(EMBED) return;   // the embed never touches what the BA app itself remembers on this device
  try{ localStorage.removeItem('ba.schedstate');
    Object.keys(localStorage).filter(k=>k.startsWith('ba.schedtab.')).forEach(k=>localStorage.removeItem(k));
  }catch(_){}
}
function schedCanon(raw){
  const s=(raw||'').trim(); if(!s) return '';
  if(s.includes('/')||s.includes(',')) return 'Team';
  const k=s.toLowerCase().replace(/\s+/g,' ');
  if(Object.prototype.hasOwnProperty.call(SCHED_ALIASES,k)) return SCHED_ALIASES[k];
  return s.replace(/[\p{L}\p{N}_]\S*/gu,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
}
// '#rrggbb' → [r,g,b] (0-255), null for anything else; and its WCAG relative luminance
const schedRgb=c=>{ const m=/^#([0-9a-f]{6})$/i.exec(String(c||'')); return m?[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)):null; };
const schedLum=rgb=>{ const ch=v=>{ v/=255; return v<=0.03928?v/12.92:((v+0.055)/1.055)**2.4; };
  return 0.2126*ch(rgb[0])+0.7152*ch(rgb[1])+0.0722*ch(rgb[2]); };
// text colour that stays readable on a solid chip of colour c (phone month grid): white on dark colours
function schedInk(c){ const rgb=schedRgb(c); return rgb && schedLum(rgb)<0.18 ? '#ffffff' : '#0b0d10'; }
function schedColor(c){
  let col=Object.prototype.hasOwnProperty.call(SCHED_COLORS,c)?SCHED_COLORS[c]:null;
  if(!col){ let h=0; for(const ch of c) h=(h*31+ch.charCodeAt(0))>>>0; col=`hsl(${h%360} 62% 62%)`; }
  return EMBED ? schedOnWhite(col) : col;
}
// The embed is light. On white, a person's colour as a month-cell dot, a day-sheet border or a
// chip needs at least 3:1 contrast, or yellow and pink vanish (Cesar's #ffe14d is 1.3:1). Same hue
// and saturation, darker until it reaches 3:1; a colour that already does is kept. Returns hex,
// so schedInk can pick the text colour for it. The dark BA app keeps the colours as they are.
const schedWhiteCache=new Map();
function schedOnWhite(c){
  if(schedWhiteCache.has(c)) return schedWhiteCache.get(c);
  const hsl2rgb=(h,s,l)=>{ s/=100; l/=100; const a=s*Math.min(l,1-l), k=n=>(n+h/30)%12;
    return [0,8,4].map(n=>255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1)))); };
  let rgb=schedRgb(c), m;
  if(!rgb && (m=/^hsl\(\s*([\d.]+)(?:deg)?[\s,]+([\d.]+)%[\s,]+([\d.]+)%\s*\)$/i.exec(String(c||'')))) rgb=hsl2rgb(+m[1],+m[2],+m[3]);
  if(!rgb){ schedWhiteCache.set(c,c); return c; }   // a CSS variable or a name: left alone
  const [r,g,b]=rgb.map(v=>v/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0, l=(mx+mn)/2*100; const s=d?d/(1-Math.abs(mx+mn-1))*100:0;
  if(d){ h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h=(h*60+360)%360; }
  const onWhite=x=>1.05/(schedLum(x.map(Math.round))+0.05);
  while(onWhite(rgb)<3 && l>0){ l=Math.max(0,l-0.5); rgb=hsl2rgb(h,s,l); }
  const hex='#'+rgb.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  schedWhiteCache.set(c,hex); return hex;
}
// earliest clock time mentioned in the notes → sort each day chronologically
function schedTime(txt){
  if(!txt) return null;
  const re=/\b(1[0-2]|0?[1-9])(?::([0-5]\d))?\s*(a\.?m\.?|p\.?m\.?)?\b/gi;
  let m,best=null;
  while((m=re.exec(txt))){
    let h=+m[1]; const min=m[2]?+m[2]:0;
    let ap=m[3]?m[3][0].toLowerCase():null;
    const ctx=txt.slice(Math.max(0,m.index-2),m.index+m[0].length+3);
    if(!ap && !/\d\s*[-–]\s*\d/.test(ctx) && !/\bpm\b|\bam\b/i.test(ctx)) continue;
    if(!ap) ap=(h>=8&&h<=11)?'a':'p';
    let hh=h%12; if(ap==='p') hh+=12;
    const mins=hh*60+min;
    if(best===null||mins<best.mins) best={mins,h,min,ap};

        else if(offs.region==null&&x==='region') offs.region=j;
        else if(offs.driver==null&&x==='driver') offs.driver=j;

        // "MAKENNA- AVALIABLE AFTER 12PM", "MAKENNNA - out". The old test only matched
        // the word "out" at the very END of the cell, so every other phrasing the team
        // uses became a phantom visit card (and a bogus "no post-visit report" flag).
        // As in NY, a merged banner is also repeated across the block's columns.

          when:cell('time'),deals:cell('deals'),rep:cell('rep'),sheet:sheetName});
      }
    }

// The winning name is cached so later sessions make exactly one request.

  // the workbook fetched, and the parser. CA and NY name their tabs differently,

  // "no tab" marker — under the other board's key.

  const my=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

  const lic=o&&o.license ? (state.dispensaries||[]).find(d=>d.license && d.license.trim().toUpperCase()===o.license.toUpperCase()) : null;
  const byName=schedRegistryFor(v.account);
  const address=(o&&o.address) || (lic&&lic.address) || (byName&&byName.address) || '';
  const pt=[lic, o, byName].find(x=>x && x.lat!=null && x.lng!=null);
  return { address, lat:pt?+pt.lat:null, lng:pt?+pt.lng:null };
}
// where CA deliveries leave from: the '* Office (CA)' location in the store list
const SCHED_CA_ORIGIN={lat:34.038809, lng:-118.234161};   // 1375 E 6th St, Los Angeles (fallback)
function schedOrigin(){ const o=(state.dispensaries||[]).find(d=>/^\* Office \(CA\)/.test(d.name||'') && d.lat!=null);
  return o ? {lat:+o.lat, lng:+o.lng} : SCHED_CA_ORIGIN; }

function schedMiles(a,b){ if(!a||!b||a.lat==null||b.lat==null) return null;
  const R=3958.8, rad=x=>x*Math.PI/180, dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }

  if(o && o.is_pickup!=null) return o.is_pickup;   // Metrc knows who carried it
  return v.canon==='Pickup' || /pick\s*-?\s*up/i.test([v.driver,v.region,v.account].join(' '))
    || /^nabis\b/i.test((o&&o.customer)||'') || ((o&&o.license)||'').toUpperCase()===NABIS_LICENSE; };

function schedApplyOrders(){
  const S=state.sched, orders=S.orders||new Map();
  const onSheet=new Set(), today=schedIso(new Date());
  // rows that carry an INV total but no SO# (the planner left it blank): matched to an order by day + amount
  const amtKey=x=>{ const n=parseFloat(String(x??'').replace(/[$,\s]/g,'')); return Number.isFinite(n)&&n>0 ? n.toFixed(2) : ''; };
  const noSo=new Set();
  for(const v of S.rows.concat(S.dbRows)){
    if(!v.soNum){ const a=amtKey(v.inv); if(a) noSo.add(v.iso+'|'+a); continue; }
    const k=schedSoKey(v.soNum); onSheet.add(k);
    for(const t of String(v.soNum).toUpperCase().match(/SO-?\d+/g)||[]) onSheet.add(t.replace(/^SO-?/,'SO-'));   // "#SO-0000412 / #SO-0000414"
    const o=orders.get(k);
    if(v._sheetCanon===undefined) v._sheetCanon=v.canon;           // remember the sheet's own driver once
    const lbl=o&&o.driver_label ? schedCanon(o.driver_label) : '';   // same nickname rules as the sheet (Leti → Ledy)
    v.canon = lbl || v._sheetCanon;
    if(!v.canon && v.iso>=today && !(o&&o.is_pickup)) v.canon='Driver needed';   // upcoming, nobody assigned

  const sameDelivery=o=>[o.invoice_total,o.order_total].some(a=>{ const k=amtKey(a); return k && noSo.has(o.delivery_date+'|'+k); });
  S.undated=[...orders.values()].filter(o=>!o.delivery_date).sort((a,b)=>String(a.order_date||'').localeCompare(String(b.order_date||'')));
  S.synth=[...orders.values()].filter(o=>o.delivery_date && !onSheet.has(o.so_num) && !sameDelivery(o) && loaded(o.delivery_date)).map(o=>{

      teamNotes:'', soNum:'#'+o.so_num, sheet:'distru', synth:true, canon, color:canon?schedColor(canon):'var(--muted)', time:null,

  const S=state.sched;

    if(!S.byIso.has(v.iso)) S.byIso.set(v.iso,[]); S.byIso.get(v.iso).push(v);
  }

// fetch app-created tasks and rebuild the date index (workbook rows + app rows)
async function schedReloadTasks(){
  const S=state.sched;
  try{
    // tasks belong to a board; RLS already scopes to boards you may see, and this
    // keeps the viewed board's calendar from showing the other state's tasks
    // deleted_at is null → the live rows. Deletes are soft (see migrate-schedule-backup.sql),
    // so a removed task is still in the table and can be undeleted.
    // visits the BA has since logged are marked done by the database: ask it to catch up on this board's
    // last weeks first (at most every 2 minutes; the calendar loads the same if it can't)
    await schedAutocomplete(state.schedState||'CA', schedIso(schedAdd(S.month||new Date(),-45)));
    let q=supabase.from('schedule_tasks').select('*').is('deleted_at',null).order('created_at');
    if(state.schedState) q=q.eq('state',state.schedState);
    const { data:tasks, error } = await q;
    // supabase-js RESOLVES with {data:null,error} on 401/5xx/offline — it doesn't throw.
    // Ignoring `error` turned every hiccup into "all app tasks vanished", which right
    // after a save reads as "the save didn't work". Keep what we had and say so.
    if(error) throw error;
    S.dbRows=(tasks||[]).map(t=>{
      const canon=schedCanon(t.driver);
      return { iso:t.task_date, account:t.account, region:t.region||'', driver:t.driver||'',
        inv:t.inv_total==null?'':String(t.inv_total), soNotes:t.notes||'', teamNotes:'',
        soNum:t.so_num||'', sheet:'app', dbId:t.id, canon, color:schedColor(canon),
        time:schedClock(t.task_time)||schedTime(t.notes||''), taskTime:t.task_time||'', booking:t.booking||null, title:t.title||'',
        kind:t.kind||null, doneAt:t.done_at||null, doneHow:t.done_how||null, doneNote:t.done_note||'', doneBy:t.done_by||null,
        createdAt:t.created_at||null, createdBy:t.created_by||null, doneOn:t.done_on||null };
    });
  }catch(e){ S.dbRows=S.dbRows||[];        // keep the last good rows rather than blanking
    toast('Couldn’t refresh tasks. Showing the last loaded copy.'); }
  schedRebuildIndex();
}

// Each board's people: its BAs get a name tag even in a month with nothing on it yet, so they can be
// picked and scheduled (Amanda 2026-11-09: "kenna is missing from the calendar"); drivers are only
// offered in the task form. The BAs come from the database (schedule_people, 2026-11-23: the board's active
// field people, so a new hire needs no change here and someone who has left drops off). The names below are used
// until that answer is in, and whenever it can't be read.
const SCHED_ROSTER={ CA:{ bas:['Cesar','Jesse','Joanna','Ledy','Makenna'], drivers:['Al','AJ'] },
  NY:{ bas:['Rachel','Terrance','Jackie','Chandler','Maddy'], drivers:[] } };
// the database's answer for a board, {names: the field people (the pick-lists), reach: every name that reaches one
// active person of the board}, or null while it isn't known
function schedPeopleOf(st){ const p=state.schedPeople&&state.schedPeople[st]; return (p&&p.names)?p:null; }
const schedRoster=()=>{ const base=SCHED_ROSTER[state.schedState==='NY'?'NY':'CA'], live=schedPeopleOf(state.schedState||'CA');
  return live?{ bas:live.names, drivers:base.drivers }:base; };
// every schedule name that reaches one active person of the board, as a Set; null while the database's list isn't
// known (nothing is flagged then: the built-in names may be out of date)
function schedKnownPeople(){ const l=schedPeopleOf(state.schedState||'CA'); return l?new Set(l.reach):null; }
// true for a name on a store's team or a task that reaches nobody: no active login on the board, or a first name
// two active people share
function schedGone(name, known){ return !!(known && name && name!=='Team' && !known.has(schedCanon(name))); }
// Read the board's people with the calendar: again when the last answer is over 10 minutes old (⟳ asks at once),
// keeping the last answer while it asks. Never throws.
async function schedLoadPeople(){
  const st=state.schedState||'CA', P=(state.schedPeople=state.schedPeople||{}), cur=P[st];
  if(cur && Date.now()-cur.at<600000) return;
  P[st]={ ...(cur||{ names:null, reach:null }), at:Date.now() };
  try{
    const { data, error }=await supabase.rpc('schedule_people',{ p_state:st });
    if(error || !Array.isArray(data)) return;
    const rows=data.filter(x=>x&&typeof x.name==='string').map(x=>({ n:schedCanon(x.name), field:x.field!==false }))
      .filter(x=>x.n&&x.n!=='Team');

// What the new-task email will do (ba-task-notices.sql), in words for the line after a save, or '' when it may not
// go: an open task from today on (the board's day), not a delivery, given to someone the board can reach who isn't
// the person saving it, and new to them (a new task, or one this person made and moved to them; the database never
// tells people about tasks they made, and the page can't tell who made someone else's, so it says nothing then).
// The emails go out from 7 AM to 9 PM on the board's clock; from 8:50 PM it may go tonight or at 7 AM: nothing said.
function schedNoticeWords(rec, task, done){
  const who=schedCanon(rec.driver||''), reach=schedKnownPeople();
  if(done || !reach || !who || who==='Team' || !reach.has(who) || who===schedMyName()) return '';
  if(task && (schedCanon(task.driver||'')===who || !task.createdBy || task.createdBy!==(state.session?.user?.id||null))) return '';
  let day=schedIso(new Date()), mins=12*60;
  try{ const p={};
    new Intl.DateTimeFormat('en-US',{ timeZone:(rec.state==='NY'||rec.state==='FL')?'America/New_York':'America/Los_Angeles',
      year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false })
      .formatToParts(new Date()).forEach(x=>{ p[x.type]=x.value; });
    const hh=Number(p.hour)%24, mm=Number(p.minute);
    if(p.year && p.month && p.day && Number.isFinite(hh) && Number.isFinite(mm)){ day=`${p.year}-${p.month}-${p.day}`; mins=hh*60+mm; }

  if(mins>=7*60 && mins<20*60+50) return `${who} gets an email about it in a few minutes.`;
  if(mins<7*60 || (mins>=21*60 && rec.task_date>day)) return `${who} gets an email about it at 7 AM.`;
  return '';

  const drivers=[...new Set(

      // the task's OWN driver must always be an option: this list is rebuilt from the

  // the picker's search also finds a person by the other names the schedule knows them by (Leti is Ledy)

    <div id="stDrvHint" class="small" style="color:var(--orange);margin-top:4px" hidden></div>

    <input id="stDoneNote" style="margin-top:6px${task&&task.doneAt?'':';display:none'}" placeholder="Done note (optional): who was trained, what's next…" value="${esc((task&&task.doneNote)||'')}">

  const formSh=$('#sheet');

    if(best) return best.region;

  const refresh=async(dateIso,drv)=>{

  // a visit at a name that isn't one store can never be confirmed by the BA's records: say so under Account

  ['input','change'].forEach(ev=>$('#stAcct').addEventListener(ev, acctHint));

  // who it reaches: nobody, Team and a name that reaches no one (no active login on the board, or a first name

  const drvHint=()=>{ const h=$('#stDrvHint'); if(!h) return;
    const v=$('#stDriver').value;
    const msg=$('#stKind').value==='delivery' ? ''
      : !v ? 'Nobody is picked, so nobody will be told about this.'

      : schedGone(v, schedKnownPeople()) ? `${v} can't be reached on this board (no active login, or two people share that first name), so this won't be on anyone's list or in anyone's email.`

    h.textContent=msg; h.hidden=!msg; };
  $('#stDriver').addEventListener('change', drvHint); $('#stKind').addEventListener('change', drvHint); drvHint();
  // a booking only means something for a visit, Demo / PAD, EDU or training
  const bookShow=()=>{ const w=$('#stBookWrap'); if(w) w.style.display=['followup','delivery'].includes($('#stKind').value)?'none':''; };
  $('#stKind').addEventListener('change', bookShow); bookShow();
  // the Done note shows while Done is ticked, so nothing typed there is thrown away
  $('#stDone').addEventListener('change',()=>{ $('#stDoneNote').style.display=$('#stDone').checked?'':'none'; });
  $('#stSave').onclick=async()=>{
    const kind=SCHED_KINDS.some(o=>o.k===$('#stKind').value)?$('#stKind').value:'visit';
    const driver=$('#stDriver').value||null;
    const rec={ task_date:$('#stDate').value, account:$('#stAcct').value.trim(),
      inv_total:$('#stInv').value?Number($('#stInv').value):null,
      region:$('#stRegion').value.trim()||null, driver,
      kind, title:$('#stTitle').value.trim()||null, task_time:$('#stTime').value||null,
      booking:['followup','delivery'].includes(kind)?null:($('#stBooking').value==='needs'?'needs':'confirmed'),
      so_num:$('#stSo').value.trim()||null, notes:$('#stNotes').value.trim()||null,
      state:state.schedState||'CA' };   // a task belongs to the board it was created on
    // Done: ticking it marks the task done by you now; unticking reopens it (and the automatic check then
    // leaves it alone); a done task's note can change on its own
    const wantDone=$('#stDone').checked, wasDone=!!(task&&task.doneAt), doneNote=$('#stDoneNote').value.trim()||null;
    // Done on a visit still to come: refused when ticked now, and when a done visit is moved to a later day (a done
    // mark from the BA's records is cleared on a move below, so that one can go)
    const aheadNow=SCHED_VISIT_KINDS.has(kind) && rec.task_date>schedIso(new Date());
    if(wantDone && aheadNow && (!wasDone || !SCHED_VISIT_KINDS.has(schedKindOf(task))
        || (rec.task_date!==task.iso && !SCHED_AUTO_HOW.has(task.doneHow)))){
      toast('A visit can be marked done on its day or after. Untick Done, or if it already happened, use the day it happened.');
      return; }
    if(wantDone&&!wasDone) Object.assign(rec,{done_at:new Date().toISOString(), done_by:state.session?.user?.id||null, done_how:'marked', done_note:doneNote, done_on:null});
    // unticked: 'reopened' keeps the automatic check off it for good; a visit still to come is left to that check
    else if(!wantDone&&wasDone) Object.assign(rec,{done_at:null, done_by:null, done_how:aheadNow?null:'reopened', done_note:null, done_on:null});
    else if(wantDone) rec.done_note=doneNote;
    // a task moved to another day, store or person is checked again: a done mark from the BA's records (or a
    // "not done") belonged to the old one; the database marks it again if the new one has a record
    const moved=!!(task&&task.dbId) && (rec.task_date!==task.iso
      || rec.account.toLowerCase()!==String(task.account||'').trim().toLowerCase()
      || schedCanon(rec.driver||'')!==schedCanon(task.driver||''));
    if(moved&&wantDone===wasDone){
      if(wasDone&&SCHED_AUTO_HOW.has(task.doneHow)) Object.assign(rec,{done_at:null, done_by:null, done_how:null, done_on:null});
      else if(!wasDone&&task.doneHow==='reopened') rec.done_how=null;
    }
