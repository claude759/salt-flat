# Supabase CLI settings for the BA app's functions (deploy from ba/: supabase functions deploy <name> --project-ref ...).
# ba-notify is called by pg_cron and database triggers with only the x-notify-secret header and no Authorization
# header, so the gateway's sign-in (JWT) check must stay off for it: the Vault secret is its gate. Without this a
# plain deploy turns the check on and every BA email (the 9 AM reminders and tasks, new-task emails) stops quietly.
project_id = "ba"

[functions.ba-notify]
verify_jwt = false
