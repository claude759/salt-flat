/* ---- Strains view ---- */
const SV_KINDS = [['trim', 'Trim'], ['testing', 'Test'], ['jars', 'Jars'], ['prerolls', 'PR'], ['drop', 'Drop']];
function renderStrains() {
  const starts = S.weeks.map(w => w.start);
  if (!starts.length) { $('sv').innerHTML = ''; return; }
  const thisWeek = weekOf(todayISO());
  if (!S.svStart) S.svStart = PIPE.addDays(thisWeek, -14);
  const cols = []; for (let i = 0; i < 9; i++) cols.push(PIPE.addDays(S.svStart, i * 7));
  $('sv-title').textContent = `${md(cols[0])} – ${md(PIPE.addDays(cols[cols.length - 1], 6))}`;
  $('legend').innerHTML = SV_KINDS.map(([k, l]) => `<span><span class="sc" style="--c:var(--sv-${k})">${l}</span>${{ trim: 'in a room being trimmed', testing: 'sent to the lab', jars: 'packaged to jars', prerolls: 'pre-rolls made', drop: 'Nabis drop pickup' }[k]}</span>`).join('');
  const rows = [...S.sidx.entries()].filter(([s, m]) => cols.some(c => m.has(c)) && (!S.q || qMatch(s)))
    .sort((a, b) => sLabel(a[0]).localeCompare(sLabel(b[0])));
  let h = `<thead><tr><th class="sn">Strain</th>${cols.map(c => `<th class="${c === thisWeek ? 'cur' : ''}">${md(c)}${c === thisWeek ? ' · now' : ''}</th>`).join('')}</tr></thead><tbody>`;
  if (!rows.length) h += `<tr><td colspan="${cols.length + 1}" style="cursor:default"><div class="empty">No strains${S.q ? ` matching "${esc(S.q)}"` : ''} in these weeks.</div></td></tr>`;
  for (const [s, m] of rows) {
    h += `<tr><th class="sn">${esc(sLabel(s))}</th>` + cols.map(c => {
      const cell = m.get(c);
      const chips = cell ? SV_KINDS.filter(([k]) => cell[k]).map(([k, l]) => {
        const e = cell[k];
        const tip = `${l}: ${e.texts.join('; ')} (${e.dates.slice().sort().map(d => dowOf(d) + ' ' + md(d)).join(', ')})`;
        return `<span class="sc" style="--c:var(--sv-${k})" title="${esc(tip)}">${l}</span>`;
      }).join('') : '';
      return `<td class="${c === thisWeek ? 'cur' : ''}" data-go="${c}" data-strain="${esc(sLabel(s))}">${chips}</td>`;
    }).join('') + '</tr>';
  }
  $('sv').innerHTML = h + '</tbody>';
}

/* ---- Supplies view: the DISTRO SUPPLY and ACCESSORY SUPPLY tabs, read-only ---- */
const SUP_TABS = [{ id: 'distro', gid: '648610463', name: 'DISTRO SUPPLY', label: 'Distro supply' },
  { id: 'accessory', gid: '1854510668', name: 'ACCESSORY SUPPLY', label: 'Accessory supply' }];
const SUP_ST = {
  'RUNNING LOW': { label: 'Running low', c: 'var(--t-trim)', rank: 1 },
  OOS: { label: 'OOS', c: 'var(--red)', rank: 0 },
  'ON ORDER': { label: 'On order', c: 'var(--t-orders)', rank: 2 },
  BELOW: { label: 'Below par', c: 'var(--red)' },
  'IN STOCK': { label: 'In stock', c: 'var(--t-harvest)', rank: 4 },
  'NOT REORDERING': { label: 'Not reordering', c: 'var(--faint)', rank: 6 },
  NONE: { label: 'No status', c: 'var(--muted)', rank: 5 },
};
const CAT_LABEL = { JAR: 'Jars', LID: 'Lids', POUCH: 'Pouches', LABEL: 'Labels', PREROLL: 'Pre-roll', 'PRE-ROLL LABEL': 'Pre-roll labels',
  MYLAR: 'Mylars', 'PRE-LABELED JAR': 'Pre-labeled jars', 'LB BAG': 'Lb bags', BOX: 'Boxes', MISC: 'Misc', SEEDS: 'Seeds',
  'CASE PACK': 'Case packs', TUBE: 'Tubes', INSERT: 'Inserts', RIBBON: 'Ribbon', BUNDLE: 'Bundles', MESH: 'Mesh', SLEEVE: 'Sleeves',
  ACCESSORY: 'Accessories', DISPLAY: 'Displays', STICKER: 'Stickers', '': 'No category' };
const catLabel = k => CAT_LABEL[k] || k.split(/\s+/).map((w, i) => i ? w.toLowerCase() : cap(w)).join(' ');
const stKey = it => it.status ? (SUP_ST[it.status] ? it.status : 'OTHER:' + it.status) : 'NONE';
const stInfo = k => SUP_ST[k] || { label: cap(k.replace(/^OTHER:/, '')), c: 'var(--muted)', rank: 5 };
const fmtQ = n => (n == null ? '' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }));
const vendorLabel = s => /[a-z]/.test(s) ? s : s.split(/\s+/).map(w => KEEP[w] || cap(w)).join(' ');
function supMatch(it) {
  if (!S.q) return true;
  const hay = [it.name, it.cat, catLabel(it.cat), it.vendor, it.notes, stInfo(stKey(it)).label].join(' ').toUpperCase();
  return S.q.toUpperCase().split(/\s+/).every(w => hay.includes(w));
}
const supShow = it => !S.sf.size || S.sf.has(stKey(it)) || (S.sf.has('BELOW') && it.below);
const supRank = it => it.below && it.status === 'IN STOCK' ? 3 : stInfo(stKey(it)).rank;

function renderSupplies() {
  const list = $('sup-list');
  if (!S.sup) {
    $('sup-kpis').innerHTML = $('sup-chips').innerHTML = $('sup-alerts').innerHTML = '';
    list.innerHTML = S.supErr ? `<div class="alert">${esc(S.supErr)}</div>` : '<div class="empty">Loading supplies...</div>';
    return;
  }
  const all = S.sup.tabs.flatMap(t => t.items);
  const n = k => all.filter(it => k === 'BELOW' ? it.below : stKey(it) === k).length;
  const only = k => S.sf.size === 1 && S.sf.has(k);
  const kpi = (k, num, label, c) => `<button type="button" class="sup-kpi${(k === 'ALL' ? !S.sf.size : only(k)) ? ' on' : ''}" data-kpi="${k}" style="--c:${c}"><b>${fmtN(num)}</b><span>${label}</span></button>`;
  $('sup-kpis').innerHTML = kpi('BELOW', n('BELOW'), 'Below par', 'var(--red)') + kpi('OOS', n('OOS'), 'Out of stock', 'var(--red)') +
    kpi('RUNNING LOW', n('RUNNING LOW'), 'Running low', 'var(--t-trim)') + kpi('ON ORDER', n('ON ORDER'), 'On order', 'var(--t-orders)') +
    kpi('ALL', all.length, 'Items tracked', 'var(--t-supply)');

  const hits = all.filter(supMatch);
  const keys = Object.keys(SUP_ST).filter(k => k !== 'NONE' || hits.some(it => !it.status));
  hits.forEach(it => { const k = stKey(it); if (!keys.includes(k)) keys.push(k); });
  $('sup-chips').innerHTML = `<button type="button" class="chip${S.sf.size ? '' : ' on'}" data-sf="ALL" style="--c:var(--t-supply)">All <b>${hits.length}</b></button>` +
    keys.map(k => {
      const c = k === 'BELOW' ? hits.filter(it => it.below).length : hits.filter(it => stKey(it) === k).length;
      return `<button type="button" class="chip${S.sf.has(k) ? ' on' : ''}" data-sf="${esc(k)}" style="--c:${stInfo(k).c}"><i></i>${esc(stInfo(k).label)} <b>${c}</b></button>`;
    }).join('');

  const al = [];
  if (S.supErr) al.push(`<div class="alert">Couldn't refresh: ${esc(S.supErr)} Showing the last copy read.</div>`);
  if (S.sup.partial) al.push('<div class="alert info">Showing only the supply rows that are not hidden in the sheet (the full export could not be read).</div>');
  S.sup.missing.forEach(t => al.push(`<div class="alert info">The ${esc(t)} tab couldn't be read, so its items are missing.</div>`));
  $('sup-alerts').innerHTML = al.join('');

  let shown = 0;
  const out = S.sup.tabs.map(t => {
    const items = t.items.filter(it => supMatch(it) && supShow(it));
    shown += items.length;
    if (!items.length) return '';
    // columns that carry nothing in this tab stay off, so the accessory tab has no empty Par/Vendor columns
    const hasPar = t.items.some(it => it.par > 0), hasVen = t.items.some(it => it.vendor);
    const sites = t.sites.filter(s => t.items.some(it => it.at[s] != null || it.raw[s]));
    const tpl = ['minmax(180px,2.4fr)', '168px', '78px', hasPar ? '70px' : '', ...sites.map(() => '70px'), hasVen ? 'minmax(70px,1fr)' : '']
      .filter(Boolean).join(' ');
    const cats = [];
    items.forEach(it => { if (!cats.includes(it.cat)) cats.push(it.cat); });
    const head = `<div class="sup-row hd"><span>Item</span><span>Status</span><span class="n">Total</span>${hasPar ? '<span class="n">Par</span>' : ''}` +
      sites.map(s => `<span class="n">${esc(siteName(s))}</span>`).join('') + (hasVen ? '<span>Vendor</span>' : '') + '</div>';
    const body = cats.map(cat => {
      const rows = items.filter(it => it.cat === cat).sort((a, b) => supRank(a) - supRank(b) || a.name.localeCompare(b.name));
      const inCat = t.items.filter(it => it.cat === cat), low = inCat.filter(it => it.below).length;
      return `<div class="sup-grp">${esc(catLabel(cat))}<em>${rows.length < inCat.length ? `${rows.length} of ${inCat.length}` : inCat.length}</em>` +
        (low ? `<em class="warn">${low} below par</em>` : '') + '</div>' + rows.map(it => supRowHTML(it, hasPar, sites, hasVen)).join('');
    }).join('');
    return `<div class="sup-tab"><h2>${esc(t.label)}<em>${items.length < t.items.length ? `${items.length} of ${t.items.length} items` : `${t.items.length} items`}</em></h2>` +
      `<div class="sup-grid" style="--tpl:${tpl}">${head}${body}</div></div>`;
  }).join('');
  const hidden = hits.length - shown;
  list.innerHTML = (out || `<div class="empty">No supplies${S.q ? ` matching "${esc(S.q)}"` : ''} with the chosen status.</div>`) +
    (hidden && S.sf.size ? `<div class="sup-foot">${hidden} more item${hidden > 1 ? 's' : ''}${S.q ? ' matching' : ''} hidden by the status filter. <button type="button" class="sup-link" data-sf="ALL">Show all</button></div>` : '');
}
function supRowHTML(it, hasPar, sites, hasVen) {
  const k = stKey(it), st = stInfo(k);
  const pill = it.status ? `<span class="sup-pill" style="--c:${st.c}">${esc(st.label)}</span>` : '';
  const flag = it.below ? `<span class="sup-flag" title="${esc(`Total ${fmtQ(it.total)} is under the par of ${fmtQ(it.par)}: ${fmtQ(it.par - it.total)} short`)}">Below par</span>` : '';
  // a note that only repeats the status adds nothing
  const note = it.notes && !(it.status === 'NOT REORDERING' && /^NOT?\s*RE\s*-?\s*ORDER(?:ING)?$/i.test(it.notes)) ? it.notes : '';
  const low = it.below || (it.total === 0 && it.status !== 'NOT REORDERING');
  const off = it.sum !== it.total && !Object.keys(it.raw).length && Object.keys(it.at).length;
  const tot = `<span class="n tot${low ? ' low' : ''}"${off ? ` title="The sites add up to ${fmtQ(it.sum)}"` : ''}><i>Total</i>${fmtQ(it.total)}${off ? '*' : ''}</span>`;
  const par = hasPar ? `<span class="n${it.par > 0 ? '' : ' e'}"><i>Par</i>${it.par > 0 ? fmtQ(it.par) : ''}</span>` : '';
  const cells = sites.map(s => {
    const raw = it.raw[s], v = it.at[s];
    return `<span class="n${raw || v != null ? '' : ' e'}${raw ? ' raw' : ''}"${raw ? ` title="${esc(raw)}"` : ''}><i>${esc(siteName(s))}</i>${raw ? esc(raw) : fmtQ(v)}</span>`;
  }).join('');
  const ven = hasVen ? `<span class="ven${it.vendor ? '' : ' n e'}" title="${esc(vendorLabel(it.vendor))}"><i>Vendor</i>${esc(vendorLabel(it.vendor))}</span>` : '';
  return `<div class="sup-row"><span class="nm" title="${esc(`${it.tab} row ${it.row}`)}">${esc(it.name)}${note ? `<span class="nt">${esc(pretty(note))}</span>` : ''}</span>` +
    `<span class="c-st">${pill}${flag}</span><span class="sup-nums">${tot}${par}${cells}${ven}</span></div>`;
}

function render() {
  S.renderOk = false;
  $('view-week').hidden = S.view !== 'week';
  $('view-strains').hidden = S.view !== 'strains';
  $('view-supplies').hidden = S.view !== 'supplies';
  document.querySelectorAll('.views [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  document.body.dataset.view = S.view;
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = S.view === 'week' ? '#FFFFFF' : '#0f1115';
  if (S.view !== 'week') closePanelEl();
  if ($('q').value !== S.q) $('q').value = S.q;
  if ($('q2').value !== S.q) $('q2').value = S.q;
  if ($('q3').value !== S.q) $('q3').value = S.q;
  if (S.view === 'week') { renderWeekView(); stickTop(); } else if (S.view === 'strains') renderStrains(); else renderSupplies();
  renderGoHome();
  if (S.view === 'supplies' && !S.supAt && !S.supErr) loadSupplies(false);
  renderStatus();
  S.renderOk = true;
  const h = `#view=${S.view}${S.week ? '&week=' + S.week : ''}${S.q ? '&q=' + encodeURIComponent(S.q) : ''}`;
  if (location.hash !== h) history.replaceState(null, '', h);

// the board's day headers stick under the top bar on laptops; inside the scroll box they stick at its top
function stickTop() {
  const h = window.innerWidth >= 1100 ? $('top').offsetHeight : 0;
  document.body.style.setProperty('--wk-stick', h + 'px');
}
// "This week" floats in view whenever the Week or Strains view is showing another week
function renderGoHome() {
  const btn = $('go-home'); if (!btn) return;
  const tw = weekOf(todayISO());
  let away = 0;   // -1: looking at the past, 1: the future
  if (S.view === 'week' && S.week && S.weeks.length) {
    const home = nearestWeek(tw);
    if (S.week !== home) away = S.week < home ? -1 : 1;
  } else if (S.view === 'strains' && S.svStart) {
    const end = PIPE.addDays(S.svStart, 8 * 7);
    if (tw < S.svStart) away = 1; else if (tw > end) away = -1;
  }
  if (S.view === 'week' && isPhone() && S.phoneMode === 'day') away = 0;   // the day view's "Back to today" bar does this on phones
  btn.hidden = !away;
  if (away) btn.innerHTML = away < 0 ? 'This week <span aria-hidden="true">›</span>' : '<span aria-hidden="true">‹</span> This week';
  btn.setAttribute('aria-label', 'Back to this week');
}
function renderStatus() {
  const dot = $('st-dot'), t = $('st-text'), sup = S.view === 'supplies';
  const err = sup ? S.supErr : S.err, at = sup ? S.supAt : S.loadedAt;
  if (S.wb) $('sheet-link').href = `https://docs.google.com/spreadsheets/d/${S.wb}/edit#gid=${sup ? SUP_TABS[0].gid : GID}`;
  if (sup) $('alerts').innerHTML = '';
  if (S.view === 'week') renderBanner();
  if (err) { dot.className = 'dot bad'; t.textContent = err; return; }
  if (!at) { dot.className = 'dot stale'; t.textContent = 'Loading...'; return; }
  const mins = Math.round((Date.now() - at) / 60000);
  dot.className = 'dot' + (mins > 15 ? ' stale' : '');
  t.innerHTML = `From the ${sup ? 'supply' : 'pipeline'} sheet <span class="when">· ${mins < 1 ? 'just now' : mins + ' min ago'}</span>`;
  if (sup) return;
  const al = [];
  if (S.partial) al.push('<div class="alert info">Showing only the weeks that are not hidden in the sheet (the full export could not be read).</div>');
  $('alerts').innerHTML = al.join('');
}

/* ---- data ---- */
const GID = '442501874', TAB = 'DISTRO PIPELINE', CACHE = 'pipeline.v1';
function ingest(text, at, partial) {
  const weeks = PIPE.parse(text).sort((a, b) => a.start.localeCompare(b.start));
  if (!weeks.length) throw new Error('The sheet has no week headers.');
  S.weeks = weeks; S.byStart = new Map(weeks.map(w => [w.start, w]));
  learnStrains(weeks);
  S.drops = buildDrops(weeks);
  S.sidx = buildStrainIndex(weeks, S.drops);
  MODEL = WEEK.buildModel(weeks);
  S.lastText = text;
  S.loadedAt = at; S.partial = !!partial; S.err = '';
  if (!S.week || !S.byStart.has(S.week)) S.week = nearestWeek(weekOf(todayISO()));
}
function nearestWeek(ws) {
  if (S.byStart.has(ws)) return ws;
  const starts = S.weeks.map(w => w.start);
  return starts.find(s => s >= ws) || starts[starts.length - 1];
}
// the full export first; the gviz feed (visible rows only) if the export is refused
async function fetchCSV(gid, tab, ok, gvizArgs = '') {
  const base = `https://docs.google.com/spreadsheets/d/${S.wb}`;
  const tries = [[`${base}/export?format=csv&gid=${gid}`, false],
    [`${base}/gviz/tq?tqx=out:csv${gvizArgs}&sheet=${encodeURIComponent(tab)}`, true]];
  for (const [u, partial] of tries) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const text = await r.text();
      if (ok(text) && !/^\s*</.test(text)) return { text, partial };
    } catch (_) { /* next */ }
  }
  return null;
}
async function fetchSheet() {
  const got = await fetchCSV(GID, TAB, t => /MONDAY/i.test(t));
  if (got) return got;
  throw new Error("Couldn't read the pipeline sheet. Check that it is still shared by link.");
}
let loading = false;
async function load(quiet) {
  if (loading || !S.wb) return; loading = true;
  if (!quiet) { S.err = ''; renderStatus(); }
  try {
    const { text, partial } = await fetchSheet();
    if (text === S.lastText && !partial && !S.partial && S.renderOk) { S.loadedAt = Date.now(); S.err = ''; renderStatus(); return; }
    ingest(text, Date.now(), partial);
    try { if (!partial) localStorage.setItem(CACHE, JSON.stringify({ at: S.loadedAt, wb: S.wb, text })); } catch (_) {}
    render();
  } catch (e) {
    S.err = e.message || String(e); renderStatus();
  } finally { loading = false; }
}
const SUP_CACHE = 'pipeline.supplies.v1';
function ingestSupplies(texts, at, partial) {
  const tabs = [], missing = [];
  SUP_TABS.forEach((t, i) => {
    const p = texts[i] && SUP.parse(texts[i], t.name);
    if (p && p.items.length) tabs.push(Object.assign({}, t, p)); else missing.push(t.name);
  });
  if (!tabs.length || tabs[0].id !== 'distro') throw new Error("Couldn't read the DISTRO SUPPLY tab. Check that the sheet is still shared by link.");
  S.sup = { tabs, missing, partial: !!partial }; S.supAt = at; S.supErr = '';
}
let supLoading = false;
async function loadSupplies(quiet) {
  if (supLoading || !S.wb) return; supLoading = true;
  if (!quiet) { S.supErr = ''; renderStatus(); }
  try {
    const got = await Promise.all(SUP_TABS.map(t => fetchCSV(t.gid, t.name, x => /TOTAL\s*QTY/i.test(x), '&headers=1')));
    ingestSupplies(got.map(g => g && g.text), Date.now(), got.some(g => g && g.partial));
    try { if (!S.sup.partial) localStorage.setItem(SUP_CACHE, JSON.stringify({ at: S.supAt, wb: S.wb, texts: got.map(g => g && g.text) })); } catch (_) {}
  } catch (e) {
    S.supErr = e.message || String(e);
  } finally { supLoading = false; }
  if (S.view === 'supplies') render();
}
function startApp() {
  $('gate').hidden = true; $('top').hidden = false; $('app').hidden = false;
  const sl = $('sheet-link'); sl.href = `https://docs.google.com/spreadsheets/d/${S.wb}/edit#gid=${GID}`; sl.hidden = false;
  readHash();
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (c && c.wb === S.wb && c.text) { ingest(c.text, c.at, false); render(); }
  } catch (e) { console.error('cached render failed', e); }
  try {
    const c = JSON.parse(localStorage.getItem(SUP_CACHE) || 'null');
    if (c && c.wb === S.wb && c.texts) ingestSupplies(c.texts, c.at, false);
  } catch (_) {}
  if (S.view === 'supplies') { render(); loadSupplies(true); }
  load(false);
  setInterval(() => {
    if (document.visibilityState !== 'visible') { renderStatus(); return; }
    load(true); if (S.view === 'supplies') loadSupplies(true);
  }, 5 * 60 * 1000);
  setInterval(() => {
    renderStatus();
    // past midnight: a phone left on today moves to the new today
    const t = todayISO();
    if (t !== S.lastToday) {
      if (S.sel === S.lastToday) S.sel = t;
      if (S.week === weekOf(S.lastToday) && S.byStart.size) S.week = nearestWeek(weekOf(t));
      S.lastToday = t; if (S.view === 'week') render();
    }
  }, 60 * 1000);
  window.addEventListener('resize', () => { clearTimeout(S.rz); S.rz = setTimeout(() => { if (S.view === 'week') render(); }, 150); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') { S.hiddenAt = Date.now(); return; }
    if (S.hiddenAt && Date.now() - S.hiddenAt >= 10 * 60 * 1000 && S.byStart.size && isPhone() && S.phoneMode === 'day') {
      S.sel = todayISO(); S.week = nearestWeek(weekOf(S.sel)); if (S.view === 'week') render();
    }
    if (Date.now() - S.loadedAt > 2 * 60 * 1000) load(true);
    if (S.view === 'supplies' && Date.now() - S.supAt > 2 * 60 * 1000) loadSupplies(true);
  });
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('view') === 'strains' || p.get('view') === 'supplies') S.view = p.get('view');
  if (/^\d{4}-\d\d-\d\d$/.test(p.get('week') || '')) S.week = p.get('week');
  if (p.get('q')) S.q = p.get('q').trim();
}

/* ---- events ---- */
document.addEventListener('click', e => {
  // a click outside the day panel closes it (opening another day keeps it open)
  if (S.panel && !e.target.closest('#wk-panel') && !e.target.closest('[data-day]')) closePanel();
  const b = e.target.closest('[data-act],.views [data-view],[data-go],[data-sf],[data-kpi],[data-day],[data-sel],[data-me],[data-dens],[data-mode],[data-panel]');
  if (!b) return;
  if (b.dataset.day) { openDay(b.dataset.day, b.dataset.lane, b.dataset.key, b.dataset.drop); return; }
  if (b.dataset.panel) { if (MODEL && MODEL.days.has(b.dataset.panel)) { S.panel = b.dataset.panel; S.panelLane = ''; S.panelKey = ''; renderWeekView(); } return; }
  if (b.dataset.sel) {
    const d = b.dataset.sel;
    if (MODEL && MODEL.days.has(d)) {
      S.sel = d; if (S.byStart.has(weekOf(d))) S.week = weekOf(d);
      S.focus = b.dataset.lane ? { lane: b.dataset.lane, key: b.dataset.key } : null;   // a TOMORROW row opens on its card
      render(); if (!S.focus && !b.dataset.lane) window.scrollTo(0, 0);
    }
    return;
  }
  if (b.dataset.me != null && b.closest('#wk-who')) { S.me = S.me === b.dataset.me ? '' : b.dataset.me; savePref('pipeline.me', S.me); render(); return; }
  if (b.dataset.dens) { S.density = b.dataset.dens; savePref('pipeline.density', S.density); render(); return; }
  if (b.dataset.mode) { S.phoneMode = b.dataset.mode; savePref('pipeline.phoneMode', S.phoneMode); render(); return; }
  if (b.dataset.view) {
    S.view = b.dataset.view; render();
    if (S.view === 'supplies' && S.supAt && Date.now() - S.supAt > 2 * 60 * 1000) loadSupplies(true);
    return;
  }
  if (b.dataset.sf) {
    const k = b.dataset.sf;
    if (k === 'ALL') S.sf.clear(); else S.sf.has(k) ? S.sf.delete(k) : S.sf.add(k);
    render(); return;
  }
  if (b.dataset.kpi) {
    const k = b.dataset.kpi;
    S.sf = k === 'ALL' ? new Set() : S.sf.size === 1 && S.sf.has(k) ? new Set(SF_DEFAULT) : new Set([k]);
    render(); return;
  }
  if (b.dataset.go) { S.view = 'week'; S.week = nearestWeek(b.dataset.go); S.q = b.dataset.strain || ''; render(); window.scrollTo(0, 0); return; }
  const i = S.weeks.findIndex(w => w.start === S.week);
  switch (b.dataset.act) {
    case 'prev': if (i > 0) { S.week = S.weeks[i - 1].start; render(); } break;
    case 'next': if (i >= 0 && i < S.weeks.length - 1) { S.week = S.weeks[i + 1].start; render(); } break;
    case 'today': S.week = nearestWeek(weekOf(todayISO())); S.sel = null; render(); break;
    case 'home':
      if (S.view === 'strains') S.svStart = PIPE.addDays(weekOf(todayISO()), -14);
      else { S.week = nearestWeek(weekOf(todayISO())); S.sel = null; }
      if (S.panel) { S.panel = null; S.panelDrop = ''; }
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'close-panel': closePanel(); break;
    case 'sv-prev': S.svStart = PIPE.addDays(S.svStart, -28); render(); break;
    case 'sv-next': S.svStart = PIPE.addDays(S.svStart, 28); render(); break;
    case 'sv-today': S.svStart = PIPE.addDays(weekOf(todayISO()), -14); render(); break;
    case 'refresh': if (S.view === 'supplies') loadSupplies(false); else load(false); break;
    case 'signout': signOut(); break;
  }
});
let qT = null;
['q', 'q2', 'q3'].forEach(id => $(id).addEventListener('input', e => {
  clearTimeout(qT); const v = e.target.value.trim();
  qT = setTimeout(() => { S.q = v; render(); }, 120);
}));
document.addEventListener('keydown', e => {
  if (S.view !== 'week') return;
  if (e.key === 'Escape' && S.panel) { closePanel(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') document.querySelector('[data-act="prev"]').click();
  if (e.key === 'ArrowRight') document.querySelector('[data-act="next"]').click();
  if (e.key === 't') document.querySelector('[data-act="today"]').click();
});
// phone day view: swipe sideways to move a day
(() => {
  let x0 = null, y0 = null;
  document.addEventListener('pointerdown', e => { if (e.target.closest('#wk-day')) { x0 = e.clientX; y0 = e.clientY; } else x0 = null; });
  document.addEventListener('pointercancel', () => { x0 = null; });
  document.addEventListener('pointerup', e => {
    if (x0 == null || !MODEL || !S.sel) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    const d = PIPE.addDays(S.sel, dx < 0 ? 1 : -1);
    if (MODEL.days.has(d)) { S.sel = d; if (S.byStart.has(weekOf(d))) S.week = weekOf(d); render(); }
  });
})();

/* ---------------- sign-in: Google -> Supabase session (same flow as the timesheets app) ----------------
   The workbook id never ships in this public page: pipeline_source() hands it only to signed-in
   accounts on the pipeline list (universal admins, plus pipeline_viewers). */
const SB_URL = 'https://dhiqhgtmelxwelyoowle.supabase.co';
const SB_KEY = 'sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14';   // publishable anon key (RLS does the guarding)
const GOOGLE_CLIENT_ID = '168134930971-2au6foq8njul8tjja6a2v306mt10r45i.apps.googleusercontent.com';
let sb = null, rawNonce = null;
const gateErr = m => { $('gate-err').textContent = m || ''; };
async function sha256hex(s) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function openApp() {
  const { data, error } = await sb.rpc('pipeline_source');
  if (error) { gateErr(/function|does not exist|schema cache/i.test(error.message) ? "The pipeline isn't set up on the server yet. Ask Gianni." : "Couldn't reach the database. Check your connection and refresh."); return; }
  if (!data) {
    const { data: { user } } = await sb.auth.getUser();
    $('gate-signin').hidden = true; $('gate-noaccess').hidden = false;
    $('gate-email').textContent = user && user.email ? 'Signed in as ' + user.email : '';
    return;
  }
  S.wb = data; startApp();
}
async function onCredential(resp) {
  gateErr('');
  const { error } = await sb.auth.signInWithIdToken({ provider: 'google', token: resp && resp.credential, nonce: rawNonce });
  if (error) { gateErr('Sign-in failed: ' + error.message); return; }
  openApp();
}
async function showGoogleButton() {
  rawNonce = crypto.randomUUID() + crypto.randomUUID();
  const hashed = await sha256hex(rawNonce);
  let tries = 0;
  (function ready() {
    if (window.google && google.accounts && google.accounts.id) {
      $('gate-loading').hidden = true;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, hd: 'wizardtrees.com',
        nonce: hashed, auto_select: true, cancel_on_tap_outside: false });
      google.accounts.id.renderButton($('gsi'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
      google.accounts.id.prompt();
    } else if (tries++ < 60) setTimeout(ready, 150);
    else gateErr('Could not load Google sign-in. Check your connection and refresh.');
  })();
}
function signOut() {
  if (!sb) { location.reload(); return; }
  // scope 'local': this device only; 'global' would end every session on the shared project
  sb.auth.signOut({ scope: 'local' }).finally(() => {
    try { localStorage.removeItem(CACHE); localStorage.removeItem(SUP_CACHE); } catch (_) {}
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    location.reload();
  });
}
async function initGate() {
  // local preview only: ?wb=<workbook id> skips sign-in (the id is the secret, and only localhost honours it)
  const devWb = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get('wb');
  if (devWb) { S.wb = devWb; $('signout-btn').hidden = true; startApp(); return; }
  if (!window.supabase || !window.supabase.createClient) { gateErr('Could not load the page. Check your connection and refresh.'); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.wb) location.reload(); });
  const { data: { session } } = await sb.auth.getSession();
  if (session) { openApp(); return; }
  showGoogleButton();
}
initGate();
