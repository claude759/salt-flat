<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>Production Pipeline</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f9e5f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M7 11h18M7 16h12M7 21h7'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7eaf0; --muted:#9aa3b2; --faint:#6b7382;
    --accent:#7c5cff; --accent2:#9d86ff; --red:#ef4d56;
    --t-harvest:#4ade80; --t-trim:#facc15; --t-jars:#f472b6; --t-prerolls:#fb923c;
    --t-testing:#2dd4bf; --t-orders:#818cf8; --t-supply:#94a3b8; --t-labels:#c084fc;
    --t-other:#9aa3b2; --t-crew:#38bdf8;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);min-height:100vh;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--accent2)}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;line-height:1.2}
  .btn:hover{border-color:#3a4150}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text);border-color:var(--line)}

  /* top bar */
  #top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:30px;height:30px;border-radius:8px;background:#2f9e5f;display:grid;place-items:center;flex:none}
  .brand b{font-size:15px;display:block;white-space:nowrap}
  .brand span{font-size:11.5px;color:var(--muted);display:block}
  .views{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
  .views button{background:none;border:0;border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--muted)}
  .views button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
  .spacer{flex:1}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--t-harvest);display:inline-block}
  .status .dot.stale{background:var(--t-trim)}
  .status .dot.bad{background:var(--red)}

  main{max-width:1600px;margin:0 auto;padding:14px 16px 60px}
  .alert{background:rgba(239,77,86,.1);border:1px solid rgba(239,77,86,.4);color:#ffb4ae;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .alert.info{background:rgba(124,92,255,.08);border-color:rgba(124,92,255,.35);color:#cfc4ff}

  .wknav{display:flex;align-items:center;gap:6px}
  .wknav .arrow{width:34px;height:34px;padding:0;font-size:18px;display:grid;place-items:center}
  .wktitle{min-width:170px;text-align:center}
  .wktitle b{font-size:18px;display:block;letter-spacing:-.01em}
  .wktitle span{font-size:12px;color:var(--muted)}
  .search{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--text);
    font:inherit;width:220px;max-width:100%}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}

  .empty{color:var(--faint);font-size:12px;padding:10px 2px}

  /* strains view */
  .sv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 190px)}
  table.sv{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  .sv th,.sv td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .sv thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:600;white-space:nowrap;font-size:12px}
  .sv thead th.cur{color:#fff;background:#2a2346}
  .sv th.sn{position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap;font-weight:600}
  .sv thead th.sn{z-index:3;background:var(--panel2)}
  .sv td{min-width:92px;cursor:pointer}
  .sv td:hover{background:var(--panel2)}
  .sv td.cur{background:rgba(124,92,255,.07)}
  #view-strains{--sv-trim:#86EFAC;--sv-testing:#FDE047;--sv-jars:var(--t-jars);--sv-prerolls:var(--t-prerolls);--sv-drop:var(--t-orders)}
  .sc{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px;margin:1px 2px 1px 0;
    color:#0f1115;background:var(--c)}

  /* week view: a light, sheet-like board (scoped so Strains and Supplies stay as they are) */
  body[data-view="week"]{
    --wk-ink:#111111; --wk-ink2:#4A5160; --wk-grid:#E3E6EB; --wk-rule:#B8BEC8; --wk-label:#F6F7F9; --wk-line:#C9CED6;
    --wk-head:#DCE8F7; --wk-head-past:#EEF1F5; --wk-head-today:#1F3A93; --wk-today-col:#F5F8FF;
    --wk-off:#9EEFF5; --wk-trim:#C9EFBE; --wk-harvest:#F5C2D7; --wk-pack:#FFCF99; --wk-test:#FFF1A1;
    --wk-orders:#C9CAF5; --wk-supply:#E2E5EA; --wk-urgent:#C00000;
    --wk-lw:220px; --wk-stick:0px;
    background:#FFFFFF; color:var(--wk-ink);
  }
  body[data-view="week"] #top{background:#FFFFFF;border-bottom-color:var(--wk-line);backdrop-filter:none}
  body[data-view="week"] .brand b{color:#111}
  body[data-view="week"] .brand span,body[data-view="week"] .status{color:var(--wk-ink2)}
  body[data-view="week"] .views{background:#F1F3F6;border-color:var(--wk-line)}
  body[data-view="week"] .views button{color:var(--wk-ink2);font-weight:600}
  body[data-view="week"] .views button.on{background:#FFFFFF;color:#111;box-shadow:0 0 0 1px var(--wk-line)}
  body[data-view="week"] .btn{background:#FFFFFF;border-color:var(--wk-line);color:#111;font-weight:700}
  body[data-view="week"] .btn.ghost{background:none;border-color:transparent;color:var(--wk-ink2)}
  body[data-view="week"] .btn.ghost:hover{color:#111;border-color:var(--wk-line)}
  body[data-view="week"] .alert.info{background:#EEF4FF;border-color:#9DB4E0;color:#1F3A93}
  body[data-view="week"] a{color:#1F3A93}
  body[data-view="week"] a.btn{text-decoration:none}
  .f-off{--fill:var(--wk-off)} .f-trim{--fill:var(--wk-trim)} .f-harvest{--fill:var(--wk-harvest)} .f-pack{--fill:var(--wk-pack)}
  .f-test{--fill:var(--wk-test)} .f-orders{--fill:var(--wk-orders)} .f-supply{--fill:var(--wk-supply)} .f-urgent{--fill:var(--wk-urgent)}
  .o-lead{--fill:#E6EAF0} .o-call{--fill:#DDF1F4} .o-plain{--fill:#EEF0F3} .f-note{--fill:transparent}

  #view-week{font-size:14px;font-variant-numeric:tabular-nums}
  .wk-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:6px}
  .wk-nav{display:flex;align-items:center;gap:6px}
  .wk-nav .btn{height:34px}
  .wk-nav .arrow{width:34px;height:34px;padding:0;font-size:20px;display:grid;place-items:center}
  .wk-title{font-size:20px;font-weight:700;min-width:200px;text-align:center;letter-spacing:-.01em}
  .wk-seg2{display:flex;border:1px solid var(--wk-line);border-radius:8px;overflow:hidden}
  .wk-seg2 button{background:#FFFFFF;border:0;height:32px;padding:0 12px;font-size:14px;font-weight:700;color:var(--wk-ink2);cursor:pointer}
  .wk-seg2 button+button{border-left:1px solid var(--wk-line)}
  .wk-seg2 button.on{background:#E9ECF1;color:#111}
  .wk-who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .wk-lbl{font-size:13px;font-weight:700;color:var(--wk-ink2);margin-right:2px}
  .wk-chip{background:#FFFFFF;border:1px solid var(--wk-line);border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:700;color:#111;cursor:pointer;white-space:nowrap}
  .wk-chip.on{background:#111;border-color:#111;color:#FFFFFF}
  .wk-chip.on[data-me=""]{background:#E9ECF1;border-color:var(--wk-line);color:#111}
  #view-week .search{background:#FFFFFF;border-color:var(--wk-line);color:#111;font-size:14px;height:34px;padding:0 11px}
  #view-week .search:focus{border-color:#1F3A93}
  .wk-sentence{font-size:14px;font-weight:500;color:var(--wk-ink2);margin:2px 0 10px}
  .wk-banner{border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:14px;font-weight:700;background:#FFF4CE;color:#5C4300;border:1px solid #E0B000}
  .wk-banner.err{background:#FDE7E7;color:#8A0000;border-color:#E3A3A3}
  .wk-andon{display:block;width:100%;text-align:left;background:var(--wk-urgent);color:#FFFFFF;border:0;border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:15px;font-weight:800;cursor:pointer}

  /* the board grid */
  .wk-scroll{position:relative}
  .wk-board{display:grid;column-gap:0;grid-auto-rows:minmax(30px,auto);position:relative;background:#FFFFFF;border:1px solid var(--wk-line);border-radius:8px}
  .wk-col{background:#FFFFFF;border-right:1px solid var(--wk-grid);z-index:0}
  .wk-col.today{background:var(--wk-today-col)}
  .wk-corner{position:sticky;top:var(--wk-stick);left:0;z-index:4;background:#FFFFFF;border-bottom:1px solid var(--wk-line);border-right:1px solid var(--wk-line);border-top-left-radius:8px}
  .wk-dh{position:sticky;top:var(--wk-stick);z-index:3;display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:4px 8px;text-align:left;
    background:#FFFFFF;color:#111;border:0;border-bottom:1px solid var(--wk-line);border-right:1px solid var(--wk-grid);padding:7px 11px;cursor:pointer;min-width:0}
  .wk-dh:hover{background:#F7F8FA}
  .wk-dh.sel,.wk-dh.sel:hover{background:#EEF0F3;box-shadow:inset 0 -2px 0 #111}
  .wk-dh.today.sel{box-shadow:inset 0 3px 0 var(--wk-head-today),inset 0 -2px 0 #111}
  .wk-dh b{font-size:15px;font-weight:700}
  .wk-dh span{font-size:13px;font-weight:600;color:var(--wk-ink2)}
  .wk-dh.past b{color:#8A919E}
  .wk-dh.today{color:var(--wk-head-today);box-shadow:inset 0 3px 0 var(--wk-head-today)}
  .wk-dh.today span{color:var(--wk-head-today);font-weight:800}
  .wk-flag{font-style:normal;font-size:13px;font-weight:800;background:var(--wk-off);color:#111;border-radius:4px;padding:1px 6px}
  .wk-flag.u{background:var(--wk-urgent);color:#FFFFFF}
  .wk-band{grid-column:1 / -1;display:flex;align-items:center;gap:12px;padding:5px 12px;z-index:2;
    background:#F1F3F6;border-top:1px solid var(--wk-line);border-bottom:1px solid var(--wk-grid)}
  .wk-band>div{position:sticky;left:12px;display:flex;align-items:center;gap:12px}
  .wk-band b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.06em}
  .wk-sep{grid-column:1 / -1;align-self:end;height:0;border-bottom:1px solid #EEF0F3;z-index:0;pointer-events:none}
  .wk-lab{grid-column:1;position:sticky;left:0;z-index:2;background:#FFFFFF;border-right:1px solid var(--wk-line);border-bottom:1px solid #EEF0F3;
    padding:9px 12px 6px;display:flex;flex-direction:column;justify-content:flex-start;gap:1px;min-width:0;overflow-wrap:anywhere}
  .wk-lab b{font-size:14px;font-weight:700;line-height:1.25}
  .wk-sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .s-crew{background:var(--wk-off)} .s-harvest{background:var(--wk-harvest)} .s-trim{background:var(--wk-trim)} .s-jars,.s-prerolls{background:var(--wk-pack)}
  .s-testing{background:var(--wk-test)} .s-orders{background:var(--wk-orders)} .s-supplies{background:var(--wk-supply)}
  .wk-tot,.wk-q{font-size:13px;font-weight:500;color:var(--wk-ink2)}
  .wk-lab{gap:2px}
  .wk-site{display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--wk-ink2)}
  .wk-lt{font-size:13px;font-weight:700;color:var(--wk-ink2)}
  .wk-sq{display:inline-block;width:10px;height:10px;border:1px solid rgba(0,0,0,.35);margin-right:5px;flex:none}
  .wk-lab.me{background:#EEF4FF;box-shadow:inset 3px 0 0 #111}
  .wk-lab.hit b{background:#111;color:#FFFFFF;border-radius:2px;padding:0 3px;align-self:flex-start}

  /* a bar: fill over its days, a tick between days, headline inside the fill, detail that may run on to the right */
  .wk-bar{display:grid;grid-template-columns:subgrid;grid-template-rows:auto auto auto;margin:3px;z-index:1;position:relative;min-width:0}
  .wk-fill{grid-row:1 / -1;background:var(--fill);border-radius:6px}
  .cl .wk-fill{border-top-left-radius:0;border-bottom-left-radius:0}
  .cr .wk-fill{border-top-right-radius:0;border-bottom-right-radius:0}
  .o-lead .wk-fill{box-shadow:inset 3px 0 0 #111}
  .o-call .wk-fill{box-shadow:inset 3px 0 0 #0E7490}
  .f-supply .wk-fill{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .wk-bar.tbd .wk-fill{border:1.5px dashed rgba(17,17,17,.45)}
  .wk-bar.wk-me .wk-fill,.wk-bar.wk-hitbar .wk-fill{outline:3px solid #111;outline-offset:1px}
  .wk-seg{grid-row:1 / -1;background:transparent;border:0;padding:0;margin:0;cursor:pointer;z-index:1;border-radius:6px}
  .wk-seg.tick{border-radius:0}
  .wk-bar:hover .wk-seg.tick{border-left:1px dashed rgba(0,0,0,.14)}
  .wk-bar:hover .wk-fill{outline:2px solid rgba(31,58,147,.35);outline-offset:0}
  .wk-seg.picked{outline:2px solid #1F3A93;outline-offset:1px;border-radius:6px;z-index:3}
  .wk-nolist{margin:3px;border:1px dashed #B8BEC8;border-radius:6px;background:#F6F7F9;color:var(--wk-ink2);font:600 13px/1.3 inherit;
    padding:6px 8px;text-align:left;cursor:pointer;z-index:1;display:flex;align-items:flex-start}
  .wk-nolist:hover{border-color:#1F3A93;color:#111}
  .wk-seg:focus-visible{outline:3px solid #1F3A93;outline-offset:-3px}
  .wk-h,.wk-d,.wk-dn,.wk-conf{position:relative;z-index:2;pointer-events:none;min-width:0;overflow-wrap:anywhere}
  .wk-h{grid-row:1;font-size:14px;font-weight:700;line-height:1.25;padding:4px 8px;color:#111}
  .wk-h.caps{text-transform:uppercase;font-size:13px;letter-spacing:.02em}
  .wk-hn{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
  .wk-h.wk-qty{text-transform:none;font-size:13px;font-weight:700}
  .wk-d{grid-row:2;grid-column:1 / -1;font-size:13px;font-weight:500;line-height:1.35;padding:0 8px 6px;color:#111}
  .wk-dc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
  .wk-d b{font-weight:700}
  .wk-h .wk-cont{color:var(--wk-ink2);font-weight:600;font-size:13px;margin-left:6px;white-space:nowrap}
  .f-urgent .wk-h .wk-cont{color:#FFFFFF}
  .wk-dn{grid-row:3;font-size:13px;font-weight:700;padding:0 8px 5px}
  .wk-conf{grid-row:3;font-size:13px;font-weight:800;color:var(--wk-urgent);padding:0 8px 5px}
  .f-urgent .wk-h,.f-urgent .wk-d{color:#FFFFFF}
  .f-note .wk-h{font-weight:600}
  .wk-bar.wk-drop .wk-fill{outline:2px solid #111;outline-offset:1px}
  #wk-day{touch-action:pan-y pinch-zoom}
  .wk-tbd{display:inline-block;border:1px solid currentColor;padding:0 4px;margin-right:6px;font-size:13px;font-weight:800;line-height:1.2}
  .wk-bang{margin-right:5px}
  .wk-time{margin-right:6px}
  .wk-pill .wk-fill{background:#FFE8D1}
  .wk-bub{margin:3px;border:0;border-radius:8px;background:var(--fill);color:#111;padding:4px 8px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;justify-content:flex-start;gap:1px;min-width:0;font:inherit;z-index:1;overflow-wrap:anywhere}
  .wk-bub b{font-size:14px;font-weight:700;line-height:1.25}
  .wk-bub>span{font-size:13px;color:var(--wk-ink2);line-height:1.3}
  .wk-bub:hover{outline:2px solid rgba(31,58,147,.35)}
  .wk-bub.picked{outline:2px solid #1F3A93;outline-offset:1px}
  .wk-bub.wk-me{outline:3px solid #111;outline-offset:1px}
  .wk-bub.tbd{box-shadow:inset 0 0 0 1.5px rgba(17,17,17,.45)}
  .wk-bub.f-urgent,.wk-bub.f-urgent>span{color:#FFFFFF}
  .wk-bub.wk-crew{background:#F1F3F6}
  .wk-bub.wk-crew.f-off{background:var(--wk-off)}
  .wk-bub.wk-crew>span{color:#111;font-size:13px;font-weight:600}
  .wk-bub.wk-crew em{font-style:normal;font-weight:500;color:var(--wk-ink2);margin-right:3px}
  .wk-bub.wk-crew.conf{box-shadow:inset 3px 0 0 var(--wk-urgent)}
  .wk-pill .wk-h{font-size:13px;font-weight:600;padding:3px 8px}
  .wk-pill .wk-h b{font-weight:700}
  .wk-pq{color:#6B4A22;font-weight:500;white-space:nowrap}
  mark.wk-hit{background:#111;color:#FFFFFF;border-radius:2px;padding:0 2px}
  .wk-foot{margin-top:12px;font-size:13px;color:var(--wk-ink2);display:flex;flex-direction:column;gap:6px}
  .wk-key{display:flex;flex-wrap:wrap;gap:6px 14px}
  .wk-key span{display:inline-flex;align-items:center;gap:6px}
  .wk-key i{width:14px;height:14px;border-radius:3px;background:var(--fill);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .wk-key i.o-lead{box-shadow:inset 3px 0 0 #111} .wk-key i.o-call{box-shadow:inset 3px 0 0 #0E7490}
  .wk-key i.line{height:6px;border-radius:3px;box-shadow:none;background:#F2A65A}
  .wk-key i.nl{height:6px;border-radius:3px;box-shadow:none;background:repeating-linear-gradient(90deg,#F2A65A 0 4px,transparent 4px 7px)}
  .wk-key i.pill{background:#FFE8D1;box-shadow:none}
  .wk-key i.nol{background:#F6F7F9;box-shadow:none;border:1px dashed #B8BEC8}
  .wk-key i.tbd{background:#FFFFFF;box-shadow:none;border:1.5px dashed rgba(17,17,17,.45)}

  /* one day: the phone body and the laptop's side panel */
  #wk-panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#FFFFFF;color:#111;z-index:30;overflow:auto;
    box-shadow:0 0 0 1px var(--wk-line),-8px 0 24px rgba(0,0,0,.12)}
  .wk-ph{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;padding:10px 12px;background:#FFFFFF;border-bottom:1px solid var(--wk-line)}
  .wk-ph span{flex:1}
  .wk-ph .btn{min-width:38px;font-size:18px}
  .wk-pb{padding:12px 16px 40px}
  .wk-dt{font-size:20px;font-weight:700;margin:4px 0 8px;line-height:1.2}
  .wk-you{font-size:15px;font-weight:700;margin:0 0 8px}
  .wk-sec{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--wk-ink2);margin:16px 0 6px}

<script>
/* ===== PIPELINE PARSER START =====
   Reads the DISTRO PIPELINE tab of the Wizard Trees workbook (CSV export) into
   weeks -> days -> typed items. The tab is a band per week: a header row names the seven days
   ("OCTOBER, MONDAY 12TH"), and each day owns two columns, a task column and a detail column.
   A task cell starts an item; a detail cell on the same row, or below it with the task cell empty,
   belongs to that item. The sheet is free text, so types come from wording, not cell colors
   (the CSV export carries no formatting). */
const PIPE = (() => {
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const clean = s => String(s == null ? '' : s).replace(/\u00a0/g, ' ').replace(/\r/g, '')
    .replace(/[ \t]+$/gm, '').replace(/^\s*\n|\n\s*$/g, '').trim();

  // "OCTOBER, MONDAY 12TH (LORENZO OOO)" -> {month: 9, day: 12, note: 'LORENZO OOO'}
  function parseDayHeader(s) {
    const t = clean(s).toUpperCase();
    const m = t.match(/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\b[\s,]*(?:MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)?\s*(\d{1,2})(?:ST|ND|RD|TH)?\b/);
    if (!m) return null;
    const notes = [...t.matchAll(/\(([^)]*)\)/g)].map(x => x[1].trim()).filter(Boolean);
    return { month: MONTHS.indexOf(m[1]), day: +m[2], note: notes.join(' · ') };
  }
  const isWeekHeader = row => /MONDAY/i.test(row[0] || '') && !!parseDayHeader(row[0]) &&
    row.filter(c => /(TUES|WEDNES|THURS|FRI|SATUR|SUN)DAY/i.test(c || '')).length >= 3;

  const pad = n => String(n).padStart(2, '0');
  function addDays(isoDate, n) {
    const [y, m, d] = isoDate.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }

  // spellings seen in the sheet, so one strain groups under one name
  const TYPO = { RIPETIDE: 'RIPTIDE', ZANGANGER: 'ZANGBANGER', ZANBNAGER: 'ZANGBANGER', ZANGBNAGER: 'ZANGBANGER',
    SMOTHIE: 'SMOOTHIE', SMOOTHE: 'SMOOTHIE', SMOOTHIS: 'SMOOTHIE', SMOOTIE: 'SMOOTHIE', ZANGRIS: 'ZANGRIA',
    BLAC: 'BLACK', DRK: 'DARK', FLAAHBANG: 'FLASHBANG', GRAVITE: 'GRAVITIDE', TIDEBAGER: 'TIDEBANGER',
    BRITTISH: 'BRITISH', OOG: 'OG', GIMMLET: 'GIMLET' };
  const WHOLE = { NY: 'NEW YORKER', 'WIZ OG': 'WIZARD OG', 'ZANG BANGER': 'ZANGBANGER', 'BLUE BANGER': 'BLUEBANGER',
    'TIDE BANGER': 'TIDEBANGER', 'JUNGLE JUICE': 'ANTIDOTE' };

  const JOINED = { BLACKMAGIC: 'BLACK MAGIC', BLUEMAGIC: 'BLUE MAGIC', ORANGEMAGIC: 'ORANGE MAGIC', POOLPARTY: 'POOL PARTY',
    BLACKLIGHT: 'BLACK LIGHT', DARKMATTER: 'DARK MATTER', TEAPARTY: 'TEA PARTY', NEWYORKER: 'NEW YORKER',
    WIZARDOG: 'WIZARD OG', GASGIMLET: 'GAS GIMLET', BRITISHDELIGHT: 'BRITISH DELIGHT', LIMELIGHT: 'LIMELIGHT' };
  function strainKey(name) {
    let k = clean(name).toUpperCase().replace(/\([^)]*\)/g, ' ').replace(/[:;!*]+/g, ' ').replace(/\s*#\s*/g, ' #')
      .replace(/\s+/g, ' ').replace(/^[\s.\-]+|[\s.\-]+$/g, '');
    k = k.replace(/\s+-?\s*(?:PRE-?ROLLS?|\d*\.?\d+\s*G|5\s*PK|NEW LABEL|RESAMPLING)$/, '').trim();
    k = k.split(' ').map(w => TYPO[w] || w).join(' ');
    if (WHOLE[k]) return WHOLE[k];
    const [base, ...rest] = k.split(' #');
    const j = JOINED[base.replace(/\s+/g, '')];

  }

  const isStrain = k => !!k && k.length >= 2 && !/,|\bUNITS?\b|\bTOTAL\b|^PHENOS?$|^BREEDING|^(?:TESTING|MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)$/.test(k);

  // "RIPTIDE 5.5" / "BLACK LIGHT 27 9 LIGHTS" / "ANTIDOTE\t8" / "BLACK LIGHT #6  1/2" -> {name, n}
  function parseStrainLines(text) {
    const out = [];

      const line = raw.replace(/\t+/g, ' ').replace(/\s+/g, ' ').trim();

  };

  const NAMES = 'JUSTIN|NOURI|LORENZO|LOREZNO|CESAR|CC|DREA|VIC|NORMA';
  /* item types, checked in order (first match wins) */
  const TYPES = [
    { id: 'supply', re: /ARRIVES|SUPPLY|SUPPLIES|\bCOUNTS?\b|PALLETS?\b|INVENTORY|SHIPMENT/i },
    { id: 'crew', re: new RegExp(String.raw`^(?:NO DISTRO WORK|DISTRO OFF)|^[A-Z\s\/&,.\-]*(?<!DROP\s)\bOFF\b(?!\s+(?:JARS|LABEL))|\bOOO\b|\bON CALL\b|DISTRO LEAD|@ DISTRO\b|^(?:(?:${NAMES})\s*[\/&,]?\s*)+-?\s*DISTRO$|NORMA'?S? (?:TEAM|CREW)|^CC\b|\bWFH\b|OVERSEE TRIM|\bPPL$|^(?:PORTAL|25TH|23RD)\s*-\s*(?:CESAR|CC)\s*-\s*\d|^[A-Z\/ ]+-\s*\d{1,2}(?::?\d\d)?\s*(?:AM|PM)$|^\d{1,2}\s*(?:AM|PM)\s*-\s*\d{1,2}\s*(?:AM|PM) AT `, 'i') },
    { id: 'testing', re: /TESTING|\bCOAS?\b|\bLAB\b/i },
    { id: 'orders', re: /\bVOID\b|NABIS|SELF DISTRO|PICK ?UP\b(?! FOR PRE)|\bSTAGE\b|\bSO-\d+|DELIVER|DROP OFF|\bORDERS?\b|STIIIZY DROP/i },
    { id: 'harvest', re: /^HARVEST|\bHARVEST @/i },
    { id: 'trim', re: /^TRIM\b/i },
    { id: 'prerolls', re: /PRE-?ROLLS?\b.*(?:GRIND|PRODUCE|KNOCKBOX)|(?:GRIND|KNOCKBOX|PACKAGE|MAKE|START|PRODUCE)\b.*(?:PRE-?ROLLS?|PREOLLS?)\b|^FINISH .*PRE-?ROLL|PRE-?ROLL PRODUCTION/i },
    { id: 'jars', re: /SORT\s*\/\s*PACKAGE|PACKAGE (?:TO|INTO) JARS|\bJARS?\b.*\b(?:WEIGH|LABEL|PACKAG)|PACKAGE\b.*\bJARS\b|MYLARS?\b|^PACK .*JARS|^WEIGH\s*\/\s*PACKAGE/i },
    { id: 'labels', re: /\bLABEL|PRINT|RELABEL|STICKER/i },
  ];
  function typeOf(title) {
    for (const t of TYPES) if (t.re.test(title)) return t.id;
    return 'other';
  }

  // preroll quantity lines: "5PK .7G -- 700", "1G PREROLL- 450", "5PK- 128 UNITS", "1G- 1362 UNITS"
  function prerollQtys(text) {
    const out = [];
    for (const line of String(text).split(/\n|\|/)) {
      const s = clean(line).toUpperCase(); if (!s) continue;
      const note = ((s.match(/\(([^)]*)\)/) || [])[1] || '').trim();
      const b = s.replace(/\([^)]*\)/g, ' ').trim();
      let m = b.match(/^5\s*PKS?(?:\s*\.?7\s*G)?(?:\s*PRE-?ROLLS?)?\s*[-–:]*\s*(\d[\d,]*)/);
      if (m) { out.push({ size: '5pk', n: +m[1].replace(/,/g, ''), note }); continue; }
      m = b.match(/^(1\.5|1|\.7)\s*G(?:\s*PRE-?ROLLS?)?\s*[-–:]*\s*(\d[\d,]*)/);
      if (m) out.push({ size: (m[1] === '.7' ? '0.7' : m[1]) + 'g', n: +m[2].replace(/,/g, ''), note });
    }
    return out;
  }
  // jar quantity lines: "10 LBS- 3.5G (4-5 NUG MAX)" / "10 CASES OF 1.5G BAGS (1-2 NUG MAX)"
  function jarQty(t) {
    const s = clean(t).toUpperCase();
    const note = ((s.match(/\(([^)]*)\)/) || [])[1] || '').trim();
    let m = s.match(/^(\d+(?:\.\d+)?)\s*LBS?\b.*?(\d+(?:\.\d+)?)\s*G\b/);
    if (m) return { kind: 'lbs', n: +m[1], size: m[2] + 'g', note };
    m = s.match(/^(\d+)\s*CASES?\s+OF\s*(\d+(?:\.\d+)?)\s*G/);

    return null;
  }
  // a task cell that is just a strain name ("TIDEBANGER", "ANTIDOTE:"), listed under a task above it
  const NOT_STRAIN = /\b(AM|PM|LUNCH|TBD|COMPLETE|FINISH|BEGIN|EVENT|TRAINING|PORTAL|DISTRO|PACKAGE|LABEL|NEED|TAKE|MAKE|BRING|SMALLS|FLOWER|CULTIVATION|ROAD|HEALTH|INSPECTION|DESTRUCTION|PARTY FOR|TEAM|CREW|OFF|PICK|COUNT|WRAP)\b/i;
  function bareStrain(title) {
    const t = clean(title).replace(/[:\-\s]+$/, '');
    if (!t || t.length > 30 || /\n/.test(t) || !/^[A-Za-z][A-Za-z0-9 #'.&\/]*$/.test(t)) return '';
    if (t.split(/\s+/).length > 4 || typeOf(t) !== 'other' || NOT_STRAIN.test(t)) return '';
    return strainKey(t);
  }

  // "NOV DROP 1", "NOV PREROLL DROP", "OCT FLOWER DROP 1"
  function dropName(text) {
    const m = String(text).toUpperCase().match(/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEPT?|OCT|NOV|DEC)[A-Z]*\.?\s+((?:FLOWER\s+|PRE-?ROLL\s+)?DROP)\s*(\d*)/);
    if (!m) return '';

  // the strains a testing line names: "TESTING SCHEDULED FOR NOV DROP 1 - BLUEBANGER, TIDEBANGER"
  function listedStrains(text) {

    let seg = t.includes(':') ? t.slice(t.lastIndexOf(':') + 1) : t.split(/\s-\s/).slice(1).join(' - ');
    seg = seg.split('|')[0].replace(/\([^)]*\)/g, ' ').replace(/\b\.?\d+(?:\.\d+)?\s*G\b/gi, ' ');
    return seg.split(/[,\/]|\s&\s|\+/).map(s => s.replace(/&/g, ' ').replace(/\s+/g, ' ').trim())
      .filter(s => /^[A-Za-z][A-Za-z0-9 #']{1,28}$/.test(s) && s.split(' ').length <= 4 && !NOT_STRAIN.test(s) &&

  function mk(type, title, details) {

      drop: dropName(title) };

  /* one day's column pair -> raw items [{title, details[]}] */
  function dayItems(grid, r0, r1, col) {
    const items = []; let cur = null;
    for (let r = r0; r <= r1; r++) {

    for (const it of raw) {

        const named = title.includes(':') ? title.slice(title.lastIndexOf(':') + 1).replace(/\([^)]*\)/g, '').trim() : '';
        const ownStrain = named && named.length <= 30 && /^[A-Za-z0-9 #'.x\-]+$/.test(named) ? strainKey(named) : '';

        for (const d of details) {

          if (qs.length) { qs.forEach(q => run.lines.push({ strain: ownStrain, size: q.size, n: q.n, note: q.note })); continue; }

              note: clean(u[3].replace(/\(\s*\d[\d,]*\s*5\s*PKS?\s*\)/i, '')).replace(/^\*+|\*+$/g, '') });
          } else run.notes.push(d);

        if (ownStrain && run.lines.some(l => l.strain === ownStrain)) run.text = clean(run.text.slice(0, run.text.lastIndexOf(':')));
        continue;
      }

        rest = rest.replace(/1A[0-9A-Z]{20,}/g, '').replace(/\([^)]*\)/g, '').replace(/^[\s\-]+|[\s\-]+$/g, '');
        const strain = rest && rest.length <= 30 && /^[A-Za-z0-9 #'.x\-]+$/.test(rest) ? strainKey(rest) : '';

            else if (q && q.kind === 'cases' && line.cases == null) { line.cases = q.n; line.caseSize = q.size; line.casesNote = q.note; }

        }

          if (p) {
            Object.assign(x, p);
            const left = clean(d.replace(/ROOM\s*[A-Z0-9]+\s*@\s*\S+/i, '')).replace(/^[\s\-]+|[\s\-]+$/g, '');
            if (left) x.notes.push(left);

          }
          if (looksLikeStrainList(d)) {
            parseStrainLines(d).forEach(l => { if (/[A-Za-z]/.test(l.name)) x.strains.push({ strain: strainKey(l.name), n: l.n }); });
          } else x.notes.push(d);
        }
      } else if (type === 'testing') {

  }

  /* CSV text (or a grid) -> [{start: 'YYYY-MM-DD', days: [{date, dow, note, items}]}] */
  function parse(text, opts = {}) {
    const grid = typeof text === 'string' ? parseCSV(text) : text;
    const heads = [];
    grid.forEach((row, i) => { if (isWeekHeader(row)) heads.push(i); });
    const weeks = [];

      const days = [0, 1, 2, 3, 4, 5, 6].map(k => {

})();
/* ===== PIPELINE PARSER END ===== */

/* ===== SUPPLY PARSER START =====
   Reads the DISTRO SUPPLY and ACCESSORY SUPPLY tabs (CSV export): one row per item, the name in column A.
   Columns are found by header name so a moved column still lands. The site columns are whatever sits
   between PAR and Vendor (23RD, 25TH, PORTAL, then VOID or MYLARS). Rows with no name are the sheet's
   empty formula rows. TOTAL QTY is the sheet's own sum, so it is taken as written. */
const SUP = (() => {
  const clean = s => String(s == null ? '' : s).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const num = s => { const t = clean(s).replace(/[,$\s]/g, ''); return /^-?\d+(?:\.\d+)?$/.test(t) ? +t : null; };
  const lead = s => { const m = clean(s).replace(/,/g, '').match(/^(-?\d+(?:\.\d+)?)/); return m ? +m[1] : null; };
  // the same category spelled two ways
  const CAT = { LIDS: 'LID', '1LB BAG': 'LB BAG', 'PRE-ROLL': 'PREROLL', PREROLLS: 'PREROLL', JARS: 'JAR', LABELS: 'LABEL' };
  function status(s) {
    const t = clean(s).toUpperCase().replace(/-/g, ' ').replace(/\s+/g, ' ');
    if (!t) return '';
    if (/^(OOS|OUT OF STOCK|OUT)$/.test(t)) return 'OOS';
    if (/NOT RE ?ORDER/.test(t)) return 'NOT REORDERING';
    if (/LOW/.test(t)) return 'RUNNING LOW';
    if (/ON ORDER|ORDERED/.test(t)) return 'ON ORDER';
    if (/IN STOCK/.test(t)) return 'IN STOCK';
    return t;
  }
  function parse(text, tab) {
    const grid = typeof text === 'string' ? PIPE.parseCSV(text) : text;
    const h = grid.findIndex(r => r.some(c => /^TOTAL\s*QTY$/i.test(clean(c))) && r.some(c => /^STATUS$/i.test(clean(c))));
    if (h < 0) return null;
    const H = grid[h].map(c => clean(c).toUpperCase());
    const col = re => H.findIndex(c => re.test(c));
    const cCat = col(/^ITEM$/), cTot = col(/^TOTAL\s*QTY$/), cSt = col(/^STATUS$/), cPar = col(/^PAR$/),
      cVen = col(/^VENDORS?$/), cNotes = col(/^NOTES?$/);
    const first = Math.max(cTot, cSt, cPar) + 1, stop = cVen >= 0 ? cVen : cNotes >= 0 ? cNotes : H.length;
    const sites = []; for (let c = first; c < stop; c++) if (H[c]) sites.push({ c, key: H[c] });
    const items = [];
    for (let r = h + 1; r < grid.length; r++) {
      const row = grid[r], name = clean(row[0]);
      if (!name) continue;
      const at = {}, raw = {}; let sum = 0;
      for (const s of sites) {
        const v = clean(row[s.c]); if (!v) continue;
        const n = num(v);
        if (n != null) { at[s.key] = n; sum += n; } else { at[s.key] = lead(v); raw[s.key] = v; }
      }
      const tv = num(row[cTot]), total = tv != null ? tv : sum;
      const par = cPar >= 0 ? num(row[cPar]) : null, st = status(row[cSt]);
      const c0 = cCat >= 0 ? clean(row[cCat]).toUpperCase() : '';
      items.push({ tab, row: r + 1, name, cat: CAT[c0] || c0, total, sum, par, status: st, at, raw,
        vendor: cVen >= 0 ? clean(row[cVen]) : '', notes: cNotes >= 0 ? clean(row[cNotes]) : '',
        // under the reorder point; items no longer reordered are expected to run down
        below: par > 0 && total < par && st !== 'NOT REORDERING' });
    }
    return { sites: sites.map(s => s.key), items };
  }
  return { parse, status };
})();
/* ===== SUPPLY PARSER END ===== */

/* ===== WEEK MODEL START =====
   Turns parsed weeks into the swimlane Week board. Every sheet item becomes cells (lane, row, track, date, sig);
   cells with the same key on consecutive dates merge into one bar, so a job the sheet repeats on every day it
   runs is drawn once. Runs are found on the whole timeline and then clipped to the visible week, so a run
   that crosses a week band still knows its day n of m. No DOM in here: plain data with the sheet's uppercase
   keys; the page prettifies when it renders. */
const WEEK = ((PIPE) => {
  const addDays = PIPE.addDays;
  const DOWS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
  const DAYNAMES = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];
  const dowIdx = iso => (new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7;
  const mondayOf = iso => addDays(iso, -dowIdx(iso));
  const shortDay = iso => `${DOWS[dowIdx(iso)]} ${+iso.slice(8, 10)}`;
  const LANES = ['crew', 'harvest', 'trim', 'jars', 'prerolls', 'testing', 'orders', 'supplies'];
  const laneOf = t => (t === 'supply' || t === 'labels' || t === 'other') ? 'supplies' : t;
  const GENERIC = { prerolls: 'Pre-rolls', jars: 'Package to jars' };
  const LANE_WORD = { prerolls: 'PRE-ROLLS', jars: 'PACKAGE TO JARS' };
  const SIZE_ORDER = ['5pk', '0.7g', '1g', '1.5g', 'units'];
  const norm = s => String(s == null ? '' : s).toUpperCase().replace(/\bLOREZNO\b/g, 'LORENZO')
    .replace(/\bNABISPICKUP\b/g, 'NABIS PICKUP').replace(/\bPICK UP\b/g, 'PICKUP').replace(/!+/g, ' ')
    .replace(/\s+/g, ' ').replace(/[\s.,;:\-]+$/, '').trim();

  /* ---------- crew: "JUSTIN OFF / LORENZO OFF // DREA DISTRO LEAD" -> one status per person ---------- */
  // edit these when the crew changes; ROSTER is the row order on the board
  const KNOWN = ['JUSTIN', 'LORENZO', 'LOREZNO', 'NOURI', 'DREA', 'VIC', 'VICTORIA', 'CESAR', 'CC', 'NORMA', 'CARLOS',
    'SCOTT', 'JESSE', 'JORGE', 'THANH', 'MISTY'];
  const ALIAS = { LOREZNO: 'LORENZO', VICTORIA: 'VIC' };
  const ROSTER = ['JUSTIN', 'LORENZO', 'NOURI', 'DREA'];
  const CORE = ['JUSTIN', 'LORENZO', 'NOURI'];
  const RANK = { OOO: 7, OFF: 6, WFH: 5, 'ON CALL': 4, LEAD: 3, TRIM: 2, DISTRO: 1 };
  const RESERVED = /^(DISTRO|NO|ALL|TEAM|CREW|PORTAL|TRIM|OFF|OOO|OUT|ON|WFH|LEAD|NY|THE|AND|WITH)$/;
  const STATUS = [
    [/^NO DISTRO WORK\b/, 'OFF', 'NO DISTRO WORK'],
    [/^DISTRO OFF\b/, 'OFF', 'DISTRO OFF'],
    [/^ALL OFF\b/, 'OFF', 'DISTRO OFF'],
    [/^(?:@\s*)?DISTRO LEAD\b/, 'LEAD'],
    [/^ON CALL\b/, 'ON CALL'],
    [/^(?:OOO|OUT)\b/, 'OOO'],
    [/^OFF\b/, 'OFF'],
    [/^WFH\b/, 'WFH'],
    [/^(?:@\s*)?TRIM\b/, 'TRIM'],
    [/^(?:@\s*)?DISTRO\b/, 'DISTRO'],
  ];
  function parseCrew(text) {
    const t = String(text).toUpperCase().replace(/\bW\/\s*/g, ' WITH ').replace(/\s+/g, ' ').trim();
    const out = { people: {}, flag: '', unparsed: false, parts: [] };
    const segs = t.split(/\s*(?:\/\/|\/|&|,|\+|\bAND\b)\s*/).filter(Boolean);
    let pending = [], lastWith = null;
    const set = (n, st, note) => { const cur = out.people[n]; if (!cur || RANK[st] > RANK[cur.st]) out.people[n] = { st, note }; };
    for (const seg0 of segs) {
      let seg = seg0.replace(/^-\s*/, '');
      const names = [];
      let m;
      while ((m = seg.match(/^([A-Z]+)\??\s*-?\s*/))) {
        const w = m[1], after = seg.slice(m[0].length);
        const known = KNOWN.includes(w);
        // a name the list doesn't know counts only as the first word and right before a status ("CARLOS OOO")
        const generic = !known && !RESERVED.test(w) && w.length >= 3 && names.length === 0 &&
          !/^(?:NO DISTRO WORK|DISTRO OFF|ALL OFF)\b/.test(after) && STATUS.some(([re]) => re.test(after));
        if (!known && !generic) break;
        names.push(ALIAS[w] || w); seg = after;
      }
      let st = '', flag = '', note = '';
      for (const [re, s, f] of STATUS) { const mm = seg.match(re); if (mm) { st = s; flag = f || ''; note = seg.slice(mm[0].length); break; } }
      let teamNote = false;
      if (!st && !names.length) {   // "THANKSGIVING - DISTRO OFF": the day is still off; show the words as written
        const tm = seg.match(/\b(NO DISTRO WORK|DISTRO OFF|ALL OFF)\b/);
        if (tm) { st = 'OFF'; flag = tm[1] === 'NO DISTRO WORK' ? 'NO DISTRO WORK' : 'DISTRO OFF'; teamNote = true; }
      }
      const withNames = [];
      note = note.replace(/\bWITH\s+([A-Z ?]+)$/, (x, ns) => {
        ns.split(/[\s?]+/).filter(n => KNOWN.includes(n)).forEach(n => withNames.push(ALIAS[n] || n)); return '';
      });
      note = note.replace(/^\s*(?:-\s*)?(?:FOR\s+)?/, '').trim();
      if (flag === 'DISTRO OFF' && names.length) flag = '';
      if (flag && out.flag !== 'NO DISTRO WORK') out.flag = flag;
      if (!st) {
        if (names.length && !seg.trim()) {
          if (lastWith) names.forEach(n => set(n, lastWith, '')); else pending.push(...names);
          continue;
        }
        out.unparsed = true; out.parts.push(seg0); pending = []; lastWith = null; continue;
      }
      if (teamNote) { out.unparsed = true; out.parts.push(seg0); note = ''; }
      // "NOURI OFF - CC" / "NO DISTRO WORK - JUSTIN": a note that is only names is not a note
      const noteNames = note ? note.split(/[\s?]+/).filter(Boolean) : [];
      const nameOnly = noteNames.length > 0 && noteNames.every(w => KNOWN.includes(w));
      if (nameOnly) { if (!flag) { out.unparsed = true; out.parts.push(seg0); } note = ''; }
      const who = [...pending, ...names, ...withNames];
      if (!who.length && !flag) { out.unparsed = true; out.parts.push(seg0); }   // "DISTRO WORK IF NEED" names nobody
      for (const n of who) set(n, st, note);
      lastWith = withNames.length ? st : null;
      pending = flag && nameOnly ? noteNames.map(w => ALIAS[w] || w) : [];   // they take the next status
    }
    if (pending.length) { out.unparsed = true; out.parts.push(pending.join(' / ')); }
    return out;
  }
  const crewNames = text => {
    const out = [];
    for (const w of norm(text).split(/[^A-Z]+/)) if (KNOWN.includes(w)) { const n = ALIAS[w] || w; if (!out.includes(n)) out.push(n); }
    return out;
  };
  const crewDisplay = text => { const n = crewNames(text); return n.length ? n.join(' + ') : norm(text); };
  function crewDay(day) {
    const texts = [];
    if (day && day.note) day.note.split(' · ').forEach(t => texts.push({ src: 'header', text: t }));
    if (day) day.items.filter(i => i.type === 'crew').forEach(i => texts.push({ src: 'sheet', text: i.title }));
    const people = {}; let flag = ''; const notes = [];
    for (const t of texts) {
      const r = parseCrew(t.text);
      for (const [n, v] of Object.entries(r.people)) if (!people[n] || RANK[v.st] > RANK[people[n].st]) people[n] = v;
      if (r.flag && flag !== 'NO DISTRO WORK') flag = r.flag;
      if (r.unparsed) notes.push(t.text);
    }
    if (!flag && CORE.every(n => people[n] && (people[n].st === 'OFF' || people[n].st === 'OOO'))) flag = 'DISTRO OFF';
    return { people, flag, notes, raw: texts };
  }

  /* ---------- headline: the short bold line a bar or card leads with; the rest becomes detail ---------- */
  const DROP_RE = /\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEPT?|OCT|NOV|DEC)[A-Z]*\.?\s+((?:FLOWER\s+|PRE-?ROLL\s+)?DROP)\s*(\d*(?:\.\d+)?)/;
  const words = s => s.trim().split(/\s+/).filter(Boolean).length;
  const tidy = x => x.replace(/(?:\s*[,|:;]+|\s+(?:FOR|TO|WITH|AND|AT|@|&|-|–|\/))+$/, '').replace(/^[-–\s]+|[-–\s,|:;]+$/g, '');
  const displayWords = s => s.replace(/\bNABISPICKUP\b/g, 'NABIS PICKUP').replace(/\bPRE-?ROLLS\b/g, 'PRE-ROLLS')
    .replace(/\bPRE-?ROLL\b/g, 'PRE-ROLL').replace(/\b5\s*PKS?\b/g, '5-PACK').replace(/\bLOREZNO\b/g, 'LORENZO');
  function headline(it) {
    const orig = String(it.text || it.title || '');
    let s = orig.replace(/\n/g, ' ').toUpperCase().replace(/\s+/g, ' ').trim();
    const detail = [];
    const urgent = /!!!|\bURGENT\b|\bASAP\b/.test(s);
    s = s.replace(/!+/g, '').trim();
    const tbd = /\bTBD\b/.test(s);
    s = s.replace(/^TBD\s*[-:]*\s*/, '').replace(/\s*-\s*TBD$/, '');
    s = s.replace(/^(?:PRE-?ROLLS?|TRIM|HARVEST)\s*[-–:]\s*/, '');
    const paren = [];
    s = s.replace(/\s*\(([^)]*)\)\s*/g, (m, x) => { if (x.trim()) paren.push(x.trim()); return ' '; }).replace(/\s+/g, ' ').trim();
    let drop = '';
    const dm = s.match(DROP_RE);
    if (it.drop && dm) { drop = it.drop; s = (s.slice(0, dm.index) + ' ' + s.slice(dm.index + dm[0].length)).replace(/\s+/g, ' ').trim(); }
    const sm = s.match(/\s[-–]\s|\s*:+\s*/);
    if (sm && sm.index > 0) {
      const left = s.slice(0, sm.index).trim(), rest = s.slice(sm.index + sm[0].length).trim();
      if (rest && words(left) >= 2 && left.length >= 10) { detail.push(rest); s = left; }
    }
    s = tidy(s);
    if (s.length > 32) {
      const c = s.lastIndexOf(', ', 32);
      if (c >= 12) { detail.unshift(s.slice(c + 2)); s = s.slice(0, c); }
      else if (s.length > 48) {
        const p = s.indexOf('. ');
        if (p >= 12 && p <= 48) { detail.unshift(s.slice(p + 2)); s = s.slice(0, p); }
        else {
          const w = s.lastIndexOf(' ', 48), rest = s.slice(w + 1);
          if (w > 0 && !(words(rest) <= 2 && s.length <= 60)) {
            const sep = /\s[|\-–]\s|[-–]\s/g; let b = -1, bl = 0, m;
            while ((m = sep.exec(s)) && m.index <= 48) if (m.index >= 24) { b = m.index; bl = m[0].length; }
            if (b >= 24) { detail.unshift(s.slice(b + bl).trim()); s = tidy(s.slice(0, b)); }
            else { detail.unshift(rest); s = tidy(s.slice(0, w)); }
          }
        }
      }
    }
    s = displayWords(s);
    if (!s) s = displayWords(orig.toUpperCase().replace(/\s+/g, ' ').trim().slice(0, 48));
    if (drop) s = s ? `${s} · ${drop}` : drop;
    detail.push(...paren);
    return { head: s, detail: detail.map(displayWords).filter(Boolean), tbd, urgent, time: it.time || '', site: it.site || '' };
  }

  /* ---------- week roll-up (the sheet repeats a multi-day target on each day, so take the max) ---------- */
  function summarize(w) {
    const jars = new Map(), pre = new Map(), trims = new Map(), lists = { harvest: [], testing: [], orders: [], supply: [] };
    const addList = (kind, key, date, row) => {
      const arr = lists[kind]; let e = arr.find(x => x.key === key);
      if (!e) { e = Object.assign({ key, dates: [] }, row); arr.push(e); }
      if (!e.dates.includes(date)) e.dates.push(date);
    };
    for (const d of w.days) for (const it of d.items) {
      if (it.type === 'jars' && it.lines) it.lines.forEach(l => {
        if (!l.strain) return;
        const e = jars.get(l.strain) || { strain: l.strain, lbs: 0, size: '', cases: 0, caseSize: '', dates: [] };
        if (l.lbs != null) { e.lbs = Math.max(e.lbs, l.lbs); e.size = l.size; }
        if (l.cases != null) { e.cases = Math.max(e.cases, l.cases); e.caseSize = l.caseSize; }
        if (!e.dates.includes(d.date)) e.dates.push(d.date);
        jars.set(l.strain, e);
      });
      else if (it.type === 'prerolls') (it.lines || []).forEach(l => {
        if (!l.strain) return;
        const e = pre.get(l.strain) || { strain: l.strain, sizes: {}, dates: [] };
        e.sizes[l.size] = Math.max(e.sizes[l.size] || 0, l.n);
        if (!e.dates.includes(d.date)) e.dates.push(d.date);
        pre.set(l.strain, e);
      });
      else if (it.type === 'trim') {
        const key = (it.site || '?') + '|' + (it.room || '?');
        const e = trims.get(key) || { site: it.site, room: it.room, crews: [], dates: [], strains: new Map(), text: it.text };
        if (it.crew && !e.crews.includes(it.crew)) e.crews.push(it.crew);
        if (!e.dates.includes(d.date)) e.dates.push(d.date);
        it.strains.forEach(s => e.strains.set(s.strain, Math.max(e.strains.get(s.strain) || 0, s.n || 0)));
        trims.set(key, e);
      }
      else if (it.type === 'harvest') addList('harvest', it.site + '|' + it.room + '|' + it.title, d.date, { it });
      else if (it.type === 'testing') addList('testing', it.title, d.date, { it });
      else if (it.type === 'orders') addList('orders', it.title, d.date, { it });
      else if (it.type === 'supply') addList('supply', it.title, d.date, { it });
    }
    return { jars: [...jars.values()], pre: [...pre.values()], trims: [...trims.values()], ...lists };
  }

  /* ---------- cells and runs on the whole timeline ---------- */
  const preSig = ls => ls.slice().sort((a, b) => SIZE_ORDER.indexOf(a.size) - SIZE_ORDER.indexOf(b.size) || a.n - b.n)
    .map(l => `${l.n} ${l.size}`).join('|');
  const jarSig = ls => ls.map(l => `${l.lbs == null ? '-' : l.lbs} lb ${l.size}|${l.cases == null ? '-' : l.cases} cs ${l.caseSize}`).join('||');
  const roomRow = it => {
    const names = crewNames(it.crew || '');
    return it.room ? `${it.site || '?'}|${it.room}` : names.length ? 'crew:' + names.join('+') : 'text:' + norm(it.text);
  };

  function buildModel(weeks) {
    const days = new Map();
    for (const w of weeks) for (const d of w.days) days.set(d.date, d);
    const dates = [...days.keys()].sort();
    const cells = []; let seq = 0;
    const add = c => { c.seq = seq++; cells.push(c); };
    // packaging lane-runs: stretches of consecutive dates on which the lane has any item
    const laneRun = { jars: new Map(), prerolls: new Map() };
    for (const lane of ['jars', 'prerolls']) {
      let cur = null;
      for (const dt of dates) {
        if (!days.get(dt).items.some(i => i.type === lane)) continue;
        if (cur && dt === addDays(cur.end, 1)) { cur.end = dt; cur.dates.push(dt); }
        else cur = { start: dt, end: dt, dates: [dt] };
        laneRun[lane].set(dt, cur);
      }
    }
    const lastInstr = { jars: null, prerolls: null };
    const dayInfo = new Map();   // date -> {crew, listed: {jars, prerolls}, perStrain: {jars: Map, prerolls: Map}}
    for (const date of dates) {
      const d = days.get(date);
      const cd = crewDay(d);
      const info = { crew: cd, listed: {}, per: {}, loose: {}, heads: {} };
      dayInfo.set(date, info);
      for (const [n, v] of Object.entries(cd.people))
        add({ lane: 'crew', row: n, track: 'status', date, sig: v.st + '|' + v.note, data: { st: v.st, note: v.note } });
      for (const t of cd.notes) add({ lane: 'crew', row: '_head', track: 'head', date, sig: norm(t), data: { text: t } });
      for (const it of d.items) {
        const lane = laneOf(it.type);
        if (lane === 'trim' || lane === 'harvest') {
          const names = crewNames(it.crew || '');
          const disp = it.crew ? crewDisplay(it.crew) : '';
          add({ lane, row: roomRow(it), track: 'main', date, sig: trimSig(it), data: { item: it, crew: disp, names } });
          names.forEach(n => add({ lane: 'crew', row: n, track: 'assign', date,
            sig: (lane === 'trim' ? 'TRIM' : 'HARVEST') + '|' + (it.site || '') + '|' + (it.room || ''), data: { type: lane, site: it.site, room: it.room } }));
        } else if (lane === 'testing' || lane === 'orders' || lane === 'supplies') {
          add({ lane, row: '_track', track: 'main', date, data: { item: it },
            sig: it.type + '|' + norm(it.text) + '|' + norm((it.notes || []).join(' ')) + '|' + (it.sub || []).map(x => x.strain + ' ' + norm(x.text)).join(',') });
        }
      }
      for (const lane of ['jars', 'prerolls']) {
        const its = d.items.filter(i => i.type === lane);
        const run = laneRun[lane].get(date);
        if (run && run.start === date) lastInstr[lane] = null;
        if (!its.length) continue;
        const per = new Map(), loose = [];
        its.forEach(it => (it.lines || []).forEach(l => {
          if (!l.strain) { loose.push(l); return; }
          if (!per.has(l.strain)) per.set(l.strain, []);
          per.get(l.strain).push(l);
        }));
        info.listed[lane] = per.size > 0; info.per[lane] = per; info.loose[lane] = loose;
        for (const [st, ls] of per) add({ lane, row: st, track: 'main', date, sig: lane === 'prerolls' ? preSig(ls) : jarSig(ls), data: { lines: ls } });
        // header bars: the day's instruction. The parser makes a generic title for bare strain rows; on pre-rolls
        // that list belongs to today's lone instruction line, else to the instruction of an earlier day in the run.
        // Jar strain rows always carry their own wording, so they never borrow another jar job's title.
        const own = its.filter(it => it.title !== GENERIC[lane]);
        const bareHeads = own.filter(it => !(it.lines || []).length);
        const groups = new Map();
        for (const it of its) {
          let instr, from = '';
          if (it.title !== GENERIC[lane]) instr = norm(headline(it).head);
          else if (lane === 'prerolls' && bareHeads.length === 1) instr = norm(headline(bareHeads[0]).head);
          else if (lane === 'prerolls' && lastInstr[lane]) { instr = lastInstr[lane].instr; from = lastInstr[lane].date; }
          else instr = LANE_WORD[lane];
          if (!groups.has(instr)) groups.set(instr, { instr, from, items: [], per: new Map(), loose: [] });
          const g = groups.get(instr);
          g.items.push(it);
          (it.lines || []).forEach(l => {
            if (!l.strain) { g.loose.push(l); return; }
            if (!g.per.has(l.strain)) g.per.set(l.strain, []);
            g.per.get(l.strain).push(l);
          });
        }
        own.forEach(it => { lastInstr[lane] = { instr: norm(headline(it).head), date }; });
        info.heads[lane] = [...groups.values()];
        [...groups.values()].forEach((g, gi) => add({ lane, row: '_head', track: 'head', date, sig: g.instr,
          data: { group: g, listed: per.size > 0, noList: per.size === 0 && gi === 0, loose: g.loose } }));
      }
    }
    // merge: same key on consecutive dates -> one run; same key + date -> one cell
    const byKey = new Map();
    for (const c of cells) {
      const k = [c.lane, c.row, c.track, c.sig].join('§');
      if (!byKey.has(k)) byKey.set(k, new Map());
      const g = byKey.get(k);
      if (g.has(c.date)) g.get(c.date).datas.push(c.data); else g.set(c.date, { date: c.date, seq: c.seq, datas: [c.data] });
    }
    const runs = [];
    for (const [k, g] of byKey) {
      const [lane, row, track, sig] = k.split('§');
      let cur = null;
      for (const dt of [...g.keys()].sort()) {
        const cell = g.get(dt);
        if (cur && dt === addDays(cur.end, 1)) { cur.end = dt; cur.cells.push(cell); }
        else { cur = { key: k, lane, row, track, sig, start: dt, end: dt, cells: [cell], seq: cell.seq }; runs.push(cur); }
      }
    }
    const runAt = new Map();   // key§date -> run
    runs.forEach(r => r.cells.forEach(c => runAt.set(r.key + '§' + c.date, r)));
    return { days, dates, runs, runAt, laneRun, dayInfo };
  }

  /* ---------- the visible week ---------- */
  const firstFit = bars => {
    const tracks = [];
    bars.slice().sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a) || x.seq - y.seq).forEach(b => {
      let t = tracks.findIndex(tr => tr.every(o => b.a > o.b || b.b < o.a));
      if (t < 0) { tracks.push([]); t = tracks.length - 1; }
      tracks[t].push(b); b.track = t;
    });
    return tracks.map(tr => tr.sort((x, y) => x.a - y.a));
  };
  const strainOrder = (x, y) => x.first - y.first || x.seq - y.seq;
  // the strains another day lists under the same instruction(s) as this day
  const sharedPer = (src, today, lane) => {
    const want = new Set((today.heads[lane] || []).map(g => g.instr)), out = new Map();
    (src.heads[lane] || []).filter(g => want.has(g.instr)).forEach(g => g.per.forEach((v, k) => out.set(k, v)));
    return out;
  };

  function barBase(run, wk) {
    const mon = wk, sun = addDays(wk, 6);
    const ai = run.start < mon ? 0 : dowIdx(run.start), bi = run.end > sun ? 6 : dowIdx(run.end);
    return { lane: run.lane, row: run.row, kind: run.track, sig: run.sig, a: ai, b: bi, spillEnd: bi,
      start: run.start, end: run.end, m: run.cells.length, contL: run.start < mon, contR: run.end > sun,
      cells: run.cells.filter(c => c.date >= mon && c.date <= sun), allCells: run.cells, seq: run.seq,
      head: '', detail: [], dayNotes: {}, tbd: false, urgent: false, who: [], drop: '', conflictDays: [], src: [] };
  }
  // the sheet's own rows behind a cell, for "Sheet wording"
  const rawRows = it => it.raw && it.raw.length ? it.raw.flatMap(r => [r.title, ...r.details].filter(Boolean))
    : [it.title, ...(it.notes || [])];
  const srcOf = cells => cells.map(c => ({ date: c.date, texts: [...new Set(c.datas.flatMap(d => {
    if (d.item) return rawRows(d.item);
    if (d.group) return d.group.items.flatMap(rawRows);
    if (d.text) return [d.text];
    if (d.lines) return d.lines.map(l => l.lbs != null || l.cases != null ? `${l.strain} ${l.lbs ?? '-'} LB ${l.size} / ${l.cases ?? '-'} CS ${l.caseSize}` : `${l.strain} ${l.n} ${l.size}`);
    if (d.st) return [d.st + (d.note ? ' ' + d.note : '')];
    return [];
  }))] }));

  // testing: show the parsed strain list, and drop a sheet line only when it is nothing but those strains
  const testStrains = it => (it.strains || []).map(s => s.strain).filter(PIPE.isStrain);
  const listedLike = (text, keys) => {
    const parts = norm(text).split(/\s*(?:,|\/|;|\+|\s&\s|\s-+\s)\s*/).map(x => x.trim()).filter(Boolean);
    return keys.length > 0 && parts.length > 0 && parts.every(p => keys.includes(PIPE.strainKey(p)));
  };
  const flat = s => norm(s).replace(/[^A-Z0-9#]/g, '');
  function testingDetail(it, h) {
    const keys = testStrains(it);
    const kept = h.detail.filter(x => !listedLike(x, keys));
    // a kept sheet line that already names every strain: don't print the list twice

  const hit = S.q && b.row !== '_track' && b.row !== '_head' && b.lane !== 'crew' && (b.lane === 'jars' || b.lane === 'prerolls') && qMatch(b.row) ? ' wk-hitbar' : '';
  const child = quietStrain ? ' wk-pill' : '';
  return `<div class="wk-bar ${barClass(b)}${child}${b.tbd ? ' tbd' : ''}${b.touch ? ' touch' : ''}${b.contL ? ' cl' : ''}${b.contR ? ' cr' : ''}${who}${hit}" style="grid-row:${gridRow};grid-column:${1 + b.a} / ${2 + spill};--n:${n}">` +
    `<div class="wk-fill" style="grid-column:1 / span ${n}"></div>${segs}${headHTML}` +
    (det ? `<div class="wk-d"><div class="wk-dc">${det}</div></div>` : '') + notes + conflicts + `</div>`;
}
// the short form printed inside a strain's pill: "500 5pk · 450 1g", "10 lb · 10 cases"
function qtyShort(lane, lines, wide) {
  if (!lines || !lines.length) return '';
  if (lane === 'prerolls') return lines.slice().sort((a, b) => ['5pk', '0.7g', '1g', '1.5g', 'units'].indexOf(a.size) - ['5pk', '0.7g', '1g', '1.5g', 'units'].indexOf(b.size))
    .map(l => `${fmtN(l.n)} ${l.size}`).join(' · ');
  const l = lines[0];
  return [l.lbs != null ? `${fmtN(l.lbs)} lb${wide && l.size ? ' ' + l.size : ''}` : '', l.cases != null ? `${fmtN(l.cases)} cases${wide && l.caseSize ? ' ' + l.caseSize + ' bags' : ''}` : ''].filter(Boolean).join(' · ') || 'listed';
}
function qtyText(lane, lines) {
  if (!lines || !lines.length) return '';
  if (lane === 'prerolls') return lines.slice().sort((a, b) => ['5pk', '0.7g', '1g', '1.5g', 'units'].indexOf(a.size) - ['5pk', '0.7g', '1g', '1.5g', 'units'].indexOf(b.size))
    .map(l => `${fmtN(l.n)} ${sizeWord(l.size)}`).join(' · ');
  const l = lines[0];
  return [l.lbs != null ? `${fmtN(l.lbs)} lb ${l.size}` : '– lb', l.cases != null ? `${fmtN(l.cases)} cases ${l.caseSize}` : ''].filter(Boolean).join(' · ');
}

/* ---- board ---- */
function renderBoard(w, B) {
  const compact = S.density === 'compact' || (isPhone() && S.phoneMode === 'week');
  const prevDensity = S.density; if (compact) S.density = 'compact';
  const html = []; let r = 2;
  // laptops fit the week; tablets and phones scroll sideways inside the box with readable columns
  const vw = window.innerWidth;
  const cols = B.days.map((d, i) => {
    const empty = i >= 5 && !w.days[i].items.some(x => x.type !== 'crew');
    return vw >= 1100 ? 'minmax(0,1fr)' : vw >= 760 ? 'minmax(132px,1fr)' : empty ? '96px' : '150px';
  });
  // first-fit: put each group of bars in the first row where none of its days are taken
  const pack = groups => {
    const rows = [];
    groups.forEach(g => {
      const days = new Set(g.flatMap(b => { const d = []; for (let k = b.a; k <= b.b; k++) d.push(k); return d; }));
      let t = rows.findIndex(row => ![...days].some(k => row.days.has(k)));
      if (t < 0) { rows.push({ days: new Set(), bars: [] }); t = rows.length - 1; }
      days.forEach(k => rows[t].days.add(k)); rows[t].bars.push(...g);
    });
    return rows.map(x => x.bars);
  };
  // day headers
  B.days.forEach((d, i) => {
    html.push(`<button type="button" class="wk-dh${d.isToday ? ' today' : d.isPast ? ' past' : ''}${d.date === S.panel ? ' sel' : ''}" style="grid-row:1;grid-column:${i + 1}" data-day="${d.date}" aria-label="${esc(dowLong(d.date))}">` +
      `<b>${DOW[i]} ${+d.date.slice(8, 10)}</b>${d.isToday ? '<span>Today</span>' : ''}${d.inSheet ? '' : '<span>Not in the sheet</span>'}` +
      (d.flag ? `<em class="wk-flag">${esc(d.flag)}</em>` : '') + (d.urgent ? '<em class="wk-flag u">! URGENT</em>' : '') + `</button>`);
  });
  for (const L of B.lanes) {
    // a full-width band names the lane, like a section header in the sheet
    const total = L.total ? `<span class="wk-tot">${esc(L.total)}</span>` : '';
    html.push(`<div class="wk-band" style="grid-row:${r}"><div><b><i class="wk-sw ${'s-' + L.id}"></i>${LANE_LABEL[L.id]}</b>${total}</div></div>`);
    r++;
    const sep = (row0, n) => html.push(`<div class="wk-sep" style="grid-row:${row0 + n - 1}"></div>`);
    if (L.id === 'crew') {
      B.days.forEach((d, i) => { const h = crewBubbleHTML(d.date, r); if (h) html.push(h); });
      sep(r, 1); r += 1;
      continue;
    }
    if (L.id === 'trim' || L.id === 'harvest') {
      // one bubble per day: the lead and the room; strains and lights are in the day panel
      const tracks = pack(L.rows.flatMap(row => row.tracks.flat()).sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a)).map(b => [b]));
      const n = Math.max(1, tracks.length);
      tracks.forEach((tr, t) => tr.forEach(b => b.cells.forEach(c => html.push(bubbleHTML(b, c.date, r + t)))));
      sep(r, n); r += n;
      continue;
    }
    if (L.headTracks.length) {
      const n = L.headTracks.length;
      L.headTracks.forEach((tr, t) => tr.forEach(b => html.push(barHTML(b, r + t, B))));
      sep(r, n); r += n;
    }
    if (compact || !L.rows.length) continue;
    // strains: each pill carries its name, so strains that don't share a day can share a row
    const strainTop = r;
    const rows = pack(L.rows.filter(row => row.bars && row.bars.length).map(row => row.bars));
    rows.forEach((bars, t) => bars.forEach(b => html.push(barHTML(b, r + t, B))));
    if (rows.length) { sep(r, rows.length); r += rows.length; }
    // a packaging day with no strain list in the sheet: one block over the strain rows, which opens the nearest list
    if (r > strainTop) noListDays(L).forEach(i => html.push(`<button type="button" class="wk-nolist" data-day="${B.days[i].date}" data-lane="${L.id}" ` +
      `style="grid-row:${strainTop} / ${r};grid-column:${i + 1}">No strain list in the sheet that day</button>`));
  }
  // column backgrounds under everything
  const bg = B.days.map((d, i) => `<div class="wk-col${d.isToday ? ' today' : ''}" data-col="${d.date}" style="grid-row:1 / ${r};grid-column:${i + 1}"></div>`).join('');
  S.density = prevDensity;
  const board = $('wk-board');
  board.style.gridTemplateColumns = cols.join(' ');
  // in the scroll box the board must be as wide as its columns, or the sticky header stops partway
  if (vw < 1100) {
    const min = cols.reduce((a, c) => a + (c === '96px' ? 96 : vw >= 760 ? 132 : 150), 0);
    board.style.width = Math.max(min, $('wk-scroll').clientWidth - 2) + 'px';
  } else board.style.width = '';
  board.innerHTML = bg + html.join('');
}
// a day's crew in one bubble: who leads, who's on distro or on call, who's off
function crewBubbleHTML(date, gridRow) {
  if (!MODEL || !MODEL.days.has(date)) return '';
  const D = WEEK.dayBoard(MODEL, date, { drops: S.drops });
  const by = st => D.crew.filter(p => p.st === st);
  const names = list => list.map(p => cap(p.name) + (p.conflict ? ' (on trim!)' : '')).join(', ');
  const lines = [];
  if (D.flag) lines.push(`<b>${esc(D.flag === 'NO DISTRO WORK' ? 'No distro work' : 'Distro off')}</b>`);
  [['LEAD', 'Lead'], ['DISTRO', 'Distro'], ['ON CALL', 'On call'], ['OFF', 'Off'], ['OOO', 'Out'], ['WFH', 'WFH']].forEach(([st, word]) => {
    const ps = by(st);
    if (!ps.length) return;
    lines.push(`<span><em>${word}</em> ${esc(names(ps))}</span>`);
  });
  if (!lines.length && D.notes.length) lines.push(`<span>${TP(D.notes[0])}</span>`);
  if (!lines.length) return '';
  const i = WEEK.dowIdx(date);
  const me = S.me && D.crew.some(p => p.name === S.me);
  const off = D.flag || (D.crew.length && D.crew.every(p => p.st === 'OFF' || p.st === 'OOO'));
  const conflict = D.crew.some(p => p.conflict);
  return `<button type="button" class="wk-bub wk-crew${off ? ' f-off' : ''}${conflict ? ' conf' : ''}${S.panel === date && S.panelLane === 'crew' ? ' picked' : ''}${me ? ' wk-me' : ''}" ` +
    `style="grid-row:${gridRow};grid-column:${i + 1}" data-day="${date}" data-lane="crew" aria-label="${esc(`Who's on ${dowLong(date)}`)}">${lines.join('')}</button>`;
}
// a trim or harvest day: who leads it and where
function bubbleHTML(b, date, gridRow) {
  const it = b.item, i = WEEK.dowIdx(date);
  const lead = b.who && b.who.length ? b.who.map(cap).join(' + ') : pretty(b.head);
  const where = [it.room ? 'Room ' + it.room : '', it.site ? siteName(it.site) : ''].filter(Boolean).join(' · ');
  const key = [b.lane, b.row, b.kind, b.sig].join('§');

    `data-day="${date}" data-lane="${b.lane}" data-key="${esc(key)}" aria-label="${esc(`${b.lane === 'harvest' ? 'Harvest' : 'Trim'}: ${lead}${where ? ', ' + where : ''}, ${dowLong(date)}`)}">` +
    `<b>${b.urgent ? '! ' : ''}${b.tbd ? '<span class="wk-tbd">TBD</span>' : ''}${markHTML(esc(lead || (b.lane === 'harvest' ? 'Harvest' : 'Trim')))}</b>` +
    (where ? `<span>${esc(where)}</span>` : '') + `</button>`;
}
const noListDays = L => [...new Set((L.rows || []).flatMap(r => r.notListed || []))];
function rowLabelHTML(L, row) {
  if (row.kind === 'person') return `<b>${esc(cap(row.label))}</b>`;
  if (row.kind === 'room') {
    const sub = [row.site ? siteName(row.site) : '', row.lights ? `${fmtN(row.lights)} lights` : ''].filter(Boolean).join(' · ');
    return `<b>${row.room ? 'Room ' + esc(row.room) : esc(pretty(row.label))}</b>${sub ? `<span class="wk-q">${esc(sub)}</span>` : ''}`;

}

/* ---- the week view ---- */
function renderWeekView() {
  const w = S.byStart.get(S.week);
  const phone = isPhone();
  $('view-week').classList.toggle('phone', phone);
  $('wk-title').textContent = w ? `${rangeLabel(w.start)}${phone ? '' : ', ' + w.start.slice(0, 4)}` : '';
  // who to highlight: the regular crew plus anyone the sheet names this week
  const names = new Set(WEEK.ROSTER);
  if (w && MODEL) w.days.forEach(d => { const info = MODEL.dayInfo.get(d.date); if (info) Object.keys(info.crew.people).forEach(n => names.add(n)); });
  $('wk-who').innerHTML = `<span class="wk-lbl">Highlight</span>` + [['', 'Everyone'], ...[...names].map(n => [n, n])]
    .map(([k, l]) => `<button type="button" class="wk-chip${S.me === k ? ' on' : ''}" data-me="${esc(k)}">${esc(k ? cap(l) : l)}</button>`).join('');
  $('wk-dens').innerHTML = phone ? ['day', 'week'].map(m => `<button type="button" class="${S.phoneMode === m ? 'on' : ''}" data-mode="${m}">${m === 'day' ? 'Day' : 'Week'}</button>`).join('')
    : ['details', 'compact'].map(m => `<button type="button" class="${S.density === m ? 'on' : ''}" data-dens="${m}">${m === 'details' ? 'Details' : 'Compact'}</button>`).join('');
  if (!w || !MODEL) { $('wk-board').innerHTML = ''; $('wk-day').innerHTML = `<div class="wk-empty">No weeks found in the sheet.</div>`; return; }
  const B = WEEK.buildBoard(MODEL, w.start, weekCtx(w));
  S.board = B;
  // the week in one sentence, or what the search found
  let sent = B.sentence.join(' · ');
  if (S.q) {
    const hits = w.days.filter(d => d.items.some(itemMatch)).map(d => dowOf(d.date));
    sent = hits.length ? `${S.q}: on ${hits.length} day${hits.length > 1 ? 's' : ''} this week (${hits.join(', ')})` : `No match for "${S.q}" this week`;
  }

  $('wk-andon').innerHTML = B.urgent.map(u => `<button type="button" class="wk-andon" data-day="${u.date}">! ${esc(shortDate(u.date).toUpperCase())} · ${esc(u.head)}</button>`).join('');
  renderBanner();
  const dayMode = phone && S.phoneMode === 'day';
  $('view-week').classList.toggle('daymode', dayMode);
  document.body.style.setProperty('--wk-topbar', $('top').offsetHeight + 'px');
  $('wk-scroll').hidden = dayMode; $('wk-strip').hidden = !dayMode; $('wk-day').hidden = !dayMode;
  if (dayMode) {
    if (!S.sel || weekOf(S.sel) !== w.start) S.sel = w.days.some(d => d.date === todayISO()) ? todayISO() : w.start;
    renderStrip(B); renderDay($('wk-day'), S.sel, { phone: true });
  } else {
    renderBoard(w, B);
    if (phone || window.innerWidth < 1100) requestAnimationFrame(scrollToToday);
  }
  $('wk-foot').innerHTML = `<div class="wk-key"><span><i class="f-off"></i>Distro off</span>` +
    (dayMode ? '' : `<span><i class="pill"></i>Strain on that day's list, with the sheet's amounts</span><span><i class="nol"></i>No strain list that day</span>`) +
    `<span><i class="tbd"></i>TBD</span><span><i class="f-urgent"></i>Urgent</span></div>` +
    `<div id="wk-read"></div>`;
  renderBanner();
  if (S.panel && !phone) renderPanel(); else closePanelEl();
  if (S.focus) { const f = S.focus; S.focus = null; requestAnimationFrame(() => focusCard($('wk-day'), f.lane, f.key, true)); }
}
function scrollToToday() {
  const wrap = $('wk-scroll'), col = $('wk-board').querySelector('.wk-dh.today');

function renderBanner() {
  const el = $('wk-banner'); if (!el) return;

  else if (S.loadedAt && mins > 30) el.innerHTML = `<div class="wk-banner">Last read from the sheet ${mins} min ago. Tap Refresh.</div>`;

function packTableHTML(lane, tbl, label, hit) {

    tbl.rows.map(r => `<tr${hit && r.strain === hit ? ' class="hit"' : ''}><td>${T(sLabel(r.strain))}</td>${tbl.cols.map(c => `<td>${cell(r, c)}</td>`).join('')}</tr>`).join('') +
    `<tr class="tot"><td>${esc(label)}</td>${tbl.cols.map(c => `<td>${fmtN(tbl.total[c])}</td>`).join('')}</tr></tbody></table>`;

function cardHTML(c, date, hit) {

    (src ? `<details class="wk-src"><summary>Sheet wording</summary>${src}</details>` : '') + `</div>`;

function tomorrowRow(c, date) {
  const where = c.lane === 'trim' || c.lane === 'harvest'
    ? [c.item.room || c.item.site ? `${c.item.room ? 'Room ' + c.item.room + ' @ ' : ''}${siteName(c.item.site || '')}` : pretty(c.head), c.crew ? pretty(c.crew) : ''].filter(Boolean).join(' · ')

  const word = c.typeWord === 'NABIS' ? 'Nabis' : c.typeWord.charAt(0) + c.typeWord.slice(1).toLowerCase();
  const showWord = !where.toLowerCase().startsWith(word.toLowerCase());

    `${c.urgent ? '' : `<i class="wk-sw s-${c.lane}"></i>`}${showWord ? `<b>${esc(word)}</b> · ` : ''}${c.tbd ? '<span class="wk-tbd">TBD</span>' : ''}${markHTML(esc(where))}` +
    `${run ? ` <span class="wk-run">${esc(run)}</span>` : ''}</button>`;
}
function renderDay(el, date, opt) {
  if (!MODEL) { el.innerHTML = ''; return; }
  const D = WEEK.dayBoard(MODEL, date, { drops: S.drops });
  const today = todayISO(), tomorrow = PIPE.addDays(today, 1);
  const longDate = `${dowLong(date)}, ${md(date)}`;
  const title = date === today ? `Today · ${longDate}` : date === tomorrow ? `Tomorrow · ${longDate}` : longDate;
  let h = '';
  if (opt.phone && date !== today && MODEL.days.has(today)) h += `<button type="button" class="wk-back" data-sel="${today}">Showing ${esc(shortDate(date))} · Back to today ›</button>`;
  if (opt.phone) h += `<h2 class="wk-dt">${esc(title)}</h2>`;   // the panel's header already names the day
  if (S.me) {
    const p = D.crew.find(x => x.name === S.me);
    let line = '';
    const asg = a => `${a.type === 'trim' ? 'Trim' : 'Harvest'} · ${a.room ? 'Room ' + a.room + ' @ ' : ''}${siteName(a.site || '')}${a.range ? ` (${a.range.replace(/\b([A-Z])([A-Z]{2})\b/g, (m, x, y) => x + y.toLowerCase())})` : ''}`;
    if (p && (p.st || p.assign.length)) {
      const parts = [];
      // a bare TRIM status says nothing the assignment doesn't
      if (p.st && !(p.st === 'TRIM' && !p.note && p.assign.some(a => a.type === 'trim'))) parts.push((p.st === 'LEAD' ? 'DISTRO LEAD' : p.st) + (p.note ? ' · ' + pretty(p.note) : ''));
      p.assign.forEach(a => parts.push(asg(a)));
      line = `${cap(S.me)}: ${parts.join(' / ')}${p.conflict ? ` · ! ${p.st} but also named on trim` : ''}`;
    } else line = `Nothing names ${cap(S.me)} today. Distro tasks below are for whoever is on distro.`;
    h += `<p class="wk-you">${esc(line)}</p>`;
  }
  if (!D.inSheet) { el.innerHTML = h + `<p class="wk-empty">This day isn't in the sheet.</p>`; return; }
  // opened from a bar: what was clicked comes first, then the rest of that day
  let picked = null, hit = '';
  if (opt.focus && opt.focus.lane) {
    const all = [...D.urgent, ...D.cards];
    let [kl, kr] = String(opt.focus.key || '').split('§');
    if (!kl) kl = opt.focus.lane;   // the "no strain list" block names only its lane
    picked = (opt.focus.key && all.find(c => c.key === opt.focus.key)) || ((kl === 'jars' || kl === 'prerolls') && all.find(c => c.lane === kl)) || null;
    if (picked && (kl === 'jars' || kl === 'prerolls') && kr && kr !== '_head') hit = kr;
  }
  if (picked) {
    h += `<h3 class="wk-sec">SELECTED${hit ? ' · ' + esc(sLabel(hit).toUpperCase()) : ''}</h3>` + cardHTML(picked, date, hit).replace('class="wk-card ', 'class="wk-card focus ') +
      `<div class="wk-also">Also on ${esc(dowLong(date))}</div>`;
  }
  const others = c => c !== picked;
  if (D.urgent.filter(others).length) h += `<h3 class="wk-sec">URGENT</h3>` + D.urgent.filter(others).map(c => cardHTML(c, date)).join('');
  h += `<h3 class="wk-sec">WHO'S ON</h3>`;
  if (D.flag) h += `<div class="wk-offbar">${esc(D.flag)}</div>`;
  if (D.crew.length) h += D.crew.map(personLine).join('');
  D.notes.forEach(n => { h += `<div class="wk-pl note">${TP(n)}</div>`; });
  if (!D.crew.length && !D.notes.length && !D.flag) h += `<p class="cap">No crew notes in the sheet for ${dowLong(date)}.</p>`;
  if (D.cards.filter(others).length) h += D.cards.filter(others).map(c => cardHTML(c, date)).join('');
  else if (!D.urgent.length && !picked) h += `<p class="wk-empty">Nothing on the sheet for ${dowLong(date)}.</p>`;
  if (opt.phone && date === today && MODEL.days.has(tomorrow)) {
    const T2 = WEEK.dayBoard(MODEL, tomorrow, { drops: S.drops });
    const rows = [...T2.urgent, ...T2.cards];
    h += `<h3 class="wk-sec">TOMORROW · ${esc(dowLong(tomorrow).toUpperCase())}, ${esc(md(tomorrow).toUpperCase())}</h3>` +
      (rows.length ? rows.map(c => tomorrowRow(c, tomorrow)).join('') : `<p class="cap">Nothing on the sheet for ${dowLong(tomorrow)}.</p>`);
  }
  if (opt.phone) {
    const prev = PIPE.addDays(date, -1), next = PIPE.addDays(date, 1);
    h += `<div class="wk-daynav">${MODEL.days.has(prev) ? `<button type="button" class="btn" data-sel="${prev}">‹ ${esc(shortDate(prev))}</button>` : '<span></span>'}` +
      `${MODEL.days.has(next) ? `<button type="button" class="btn" data-sel="${next}">${esc(shortDate(next))} ›</button>` : ''}</div>`;
  }
  el.innerHTML = h;
}

// outline and scroll to the card a click came from: the same key as its bar, else the first card of its lane
