<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>Production Pipeline</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f9e5f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M7 11h18M7 16h12M7 21h7'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e7eaf0; --muted:#9aa3b2; --faint:#6b7382;
    --accent:#7c5cff; --accent2:#9d86ff; --red:#ef4d56;
    --t-harvest:#4ade80; --t-trim:#facc15; --t-jars:#f472b6; --t-prerolls:#fb923c;
    --t-testing:#2dd4bf; --t-orders:#818cf8; --t-supply:#94a3b8; --t-labels:#c084fc;
    --t-other:#9aa3b2; --t-crew:#38bdf8;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);min-height:100vh;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--accent2)}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;line-height:1.2}
  .btn:hover{border-color:#3a4150}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--text);border-color:var(--line)}

  /* top bar */
  #top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:30px;height:30px;border-radius:8px;background:#2f9e5f;display:grid;place-items:center;flex:none}
  .brand b{font-size:15px;display:block;white-space:nowrap}
  .brand span{font-size:11.5px;color:var(--muted);display:block}
  .views{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
  .views button{background:none;border:0;border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--muted)}
  .views button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
  .spacer{flex:1}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--t-harvest);display:inline-block}
  .status .dot.stale{background:var(--t-trim)}
  .status .dot.bad{background:var(--red)}

  main{max-width:1600px;margin:0 auto;padding:14px 16px 60px}
  .alert{background:rgba(239,77,86,.1);border:1px solid rgba(239,77,86,.4);color:#ffb4ae;border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .alert.info{background:rgba(124,92,255,.08);border-color:rgba(124,92,255,.35);color:#cfc4ff}

  /* week header */
  .weekhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .wknav{display:flex;align-items:center;gap:6px}
  .wknav .arrow{width:34px;height:34px;padding:0;font-size:18px;display:grid;place-items:center}
  .wktitle{min-width:170px;text-align:center}
  .wktitle b{font-size:18px;display:block;letter-spacing:-.01em}
  .wktitle span{font-size:12px;color:var(--muted)}
  .search{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--text);
    font:inherit;width:220px;max-width:100%}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}

  /* week summary */
  .sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:14px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--c)}
  .scard h3{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--c);display:flex;justify-content:space-between;gap:8px}
  .scard h3 em{font-style:normal;color:var(--text);text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600}
  .srow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-top:1px solid rgba(42,47,58,.6)}
  .srow:first-of-type{border-top:0}
  .srow .k{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .srow .v{color:var(--muted);white-space:nowrap;text-align:right}
  .srow .sub{display:block;color:var(--faint);font-size:11.5px}
  .more{font-size:12px;color:var(--muted);background:none;border:0;padding:4px 0 0;cursor:pointer}

  /* board */
  .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:140px;min-width:0;scroll-margin-top:120px}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .dh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
  .dh b{font-size:14px}
  .dh .dt{color:var(--muted);font-size:12.5px}
  .pill{font-size:10.5px;border-radius:999px;padding:1px 7px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .pill.today{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.note{color:#ffd59a;border-color:rgba(250,204,21,.35)}
  .crew{margin-top:6px;display:flex;flex-direction:column;gap:2px}
  .crew div{font-size:12px;color:#9fdcf7;display:flex;gap:6px;align-items:baseline}
  .crew div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t-crew);flex:none;transform:translateY(-1px)}
  .card{background:var(--panel2);border-radius:9px;padding:7px 9px 8px;margin-top:6px;border-left:3px solid var(--c);min-width:0}
  .day.past .card,.day.past .crew{opacity:.6}
  .tl{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:700}
  .tl .meta{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;font-size:11.5px}
  .ct{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
  .cn{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
  .who{font-size:12.5px;margin-top:2px}
  .lns{margin-top:4px;font-size:12.5px}
  .ln{display:flex;flex-wrap:wrap;column-gap:8px;padding:1px 0}
  .ln .s{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .ln .q{color:var(--muted);white-space:nowrap;margin-left:auto;text-align:right}
  .strs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .str{font-size:11.5px;background:#262b36;border-radius:6px;padding:1px 6px;white-space:nowrap}
  .str b{font-weight:600;color:var(--muted);margin-left:3px}
  .str.hit{background:color-mix(in srgb,var(--accent) 35%,#262b36)}
  .empty{color:var(--faint);font-size:12px;padding:10px 2px}

  /* strains view */
  .sv-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 190px)}
  table.sv{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
  .sv th,.sv td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .sv thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:600;white-space:nowrap;font-size:12px}
  .sv thead th.cur{color:#fff;background:#2a2346}
  .sv th.sn{position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap;font-weight:600}
  .sv thead th.sn{z-index:3;background:var(--panel2)}
  .sv td{min-width:92px;cursor:pointer}
  .sv td:hover{background:var(--panel2)}
  .sv td.cur{background:rgba(124,92,255,.07)}
  .sc{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 5px;margin:1px 2px 1px 0;
    color:#0f1115;background:var(--c)}

  /* sign-in gate */
  #gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
  .gbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:100%;max-width:380px;text-align:center}
  .gbox h1{font-size:19px;margin:12px 0 2px}
  .gbox .sub{color:var(--muted);font-size:12px;letter-spacing:.12em;margin-bottom:18px}
  .gbox .note{color:var(--muted);font-size:12.5px;margin-top:14px}
  .gbox .err{color:#ffb4ae;font-size:12.5px;margin-top:10px;min-height:1em}
  #gsi{display:flex;justify-content:center;min-height:44px}

  @media (max-width:1180px){
    .board{grid-template-columns:repeat(7,minmax(200px,1fr));overflow-x:auto;padding-bottom:6px}
  }
  @media (max-width:760px){
    .bar{padding:8px 16px;gap:10px}
    .brand span{display:none}
    .status .when{display:none}
    main{padding:12px 16px 50px}
    .board{grid-template-columns:1fr;overflow:visible}
    .day{min-height:0}
    .search{width:100%}
    .weekhead{gap:10px}
    .wknav{width:100%;justify-content:space-between}
    .sum{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="gbox">
    <div class="logo" style="width:44px;height:44px;margin:0 auto;border-radius:12px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h6"/></svg></div>
    <h1>Production Pipeline</h1>
    <div class="sub">WIZARD TREES</div>
    <div id="gate-signin">
      <div id="gsi"></div>
      <div class="note" id="gate-loading">Loading sign-in...</div>
      <div class="err" id="gate-err"></div>
      <div class="note">Sign in with your <b>@wizardtrees.com</b> Google account.</div>
    </div>
    <div id="gate-noaccess" hidden>
      <p>Your account isn't on the pipeline list yet. Ask Gianni to add you.</p>
      <p class="note" id="gate-email"></p>
      <button class="btn" type="button" data-act="signout">Sign out</button>
    </div>
  </div>
</div>

<header id="top" hidden>
  <div class="bar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h6"/></svg></div>
      <div><b>Production Pipeline</b><span>Harvest · trim · packaging</span></div>
    </div>
    <nav class="views" aria-label="View">
      <button type="button" data-view="week" class="on">Week</button>
      <button type="button" data-view="strains">Strains</button>
    </nav>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot" id="st-dot"></span>
      <span id="st-text">Loading...</span>
      <button class="btn ghost" type="button" data-act="refresh" title="Reload from the sheet">Refresh</button>
      <a class="btn ghost" id="sheet-link" href="#" target="_blank" rel="noopener" hidden>Open sheet</a>
      <button class="btn ghost" type="button" data-act="signout" id="signout-btn">Sign out</button>
    </div>
  </div>
</header>

<main id="app" hidden>
  <div id="alerts"></div>
  <section id="view-week">
    <div class="weekhead">
      <div class="wknav">
        <button class="btn arrow" type="button" data-act="prev" aria-label="Previous week">&#8249;</button>
        <div class="wktitle"><b id="wk-title"></b><span id="wk-sub"></span></div>
        <button class="btn arrow" type="button" data-act="next" aria-label="Next week">&#8250;</button>
        <button class="btn" type="button" data-act="today">This week</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Find a strain or task" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div class="sum" id="sum"></div>
    <div class="board" id="board"></div>
  </section>
  <section id="view-strains" hidden>
    <div class="sv-head">
      <div class="wknav">
        <button class="btn arrow" type="button" data-act="sv-prev" aria-label="Earlier weeks">&#8249;</button>
        <div class="wktitle"><b id="sv-title"></b><span>Where each strain is, week by week</span></div>
        <button class="btn arrow" type="button" data-act="sv-next" aria-label="Later weeks">&#8250;</button>
        <button class="btn" type="button" data-act="sv-today">This week</button>
      </div>
      <input class="search" id="q2" type="search" placeholder="Find a strain" autocomplete="off">
      <div class="legend" id="legend"></div>
    </div>
    <div class="tablewrap"><table class="sv" id="sv"></table></div>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===== PIPELINE PARSER START =====
   Reads the DISTRO PIPELINE tab of the Wizard Trees workbook (CSV export) into
   weeks -> days -> typed items. The tab is a band per week: a header row names the seven days
   ("OCTOBER, MONDAY 12TH"), and each day owns two columns, a task column and a detail column.
   A task cell starts an item; a detail cell on the same row, or below it with the task cell empty,
   belongs to that item. The sheet is free text, so types come from wording, not cell colors
   (the CSV export carries no formatting). */
const PIPE = (() => {
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const clean = s => String(s == null ? '' : s).replace(/\u00a0/g, ' ').replace(/\r/g, '')
    .replace(/[ \t]+$/gm, '').replace(/^\s*\n|\n\s*$/g, '').trim();

  // "OCTOBER, MONDAY 12TH (LORENZO OOO)" -> {month: 9, day: 12, note: 'LORENZO OOO'}
  function parseDayHeader(s) {
    const t = clean(s).toUpperCase();
    const m = t.match(/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\b[\s,]*(?:MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)?\s*(\d{1,2})(?:ST|ND|RD|TH)?\b/);
    if (!m) return null;
    const notes = [...t.matchAll(/\(([^)]*)\)/g)].map(x => x[1].trim()).filter(Boolean);
    return { month: MONTHS.indexOf(m[1]), day: +m[2], note: notes.join(' · ') };
  }
  const isWeekHeader = row => /MONDAY/i.test(row[0] || '') && !!parseDayHeader(row[0]) &&
    row.filter(c => /(TUES|WEDNES|THURS|FRI|SATUR|SUN)DAY/i.test(c || '')).length >= 3;

  const pad = n => String(n).padStart(2, '0');
  function addDays(isoDate, n) {
    const [y, m, d] = isoDate.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
  }

  // spellings seen in the sheet, so one strain groups under one name
  const TYPO = { RIPETIDE: 'RIPTIDE', ZANGANGER: 'ZANGBANGER', ZANBNAGER: 'ZANGBANGER', ZANGBNAGER: 'ZANGBANGER',
    SMOTHIE: 'SMOOTHIE', SMOOTHE: 'SMOOTHIE', SMOOTHIS: 'SMOOTHIE', SMOOTIE: 'SMOOTHIE', ZANGRIS: 'ZANGRIA',
    BLAC: 'BLACK', DRK: 'DARK', FLAAHBANG: 'FLASHBANG', GRAVITE: 'GRAVITIDE', TIDEBAGER: 'TIDEBANGER',
    BRITTISH: 'BRITISH', OOG: 'OG', GIMMLET: 'GIMLET' };
  const WHOLE = { NY: 'NEW YORKER', 'WIZ OG': 'WIZARD OG', 'ZANG BANGER': 'ZANGBANGER', 'BLUE BANGER': 'BLUEBANGER',
    'TIDE BANGER': 'TIDEBANGER', 'JUNGLE JUICE': 'ANTIDOTE' };
  // written with or without the space: compare with spaces removed
  const JOINED = { BLACKMAGIC: 'BLACK MAGIC', BLUEMAGIC: 'BLUE MAGIC', ORANGEMAGIC: 'ORANGE MAGIC', POOLPARTY: 'POOL PARTY',
    BLACKLIGHT: 'BLACK LIGHT', DARKMATTER: 'DARK MATTER', TEAPARTY: 'TEA PARTY', NEWYORKER: 'NEW YORKER',
    WIZARDOG: 'WIZARD OG', GASGIMLET: 'GAS GIMLET', BRITISHDELIGHT: 'BRITISH DELIGHT', LIMELIGHT: 'LIMELIGHT' };
  function strainKey(name) {
    let k = clean(name).toUpperCase().replace(/\([^)]*\)/g, ' ').replace(/[:;!*]+/g, ' ').replace(/\s*#\s*/g, ' #')
      .replace(/\s+/g, ' ').replace(/^[\s.\-]+|[\s.\-]+$/g, '');
    k = k.replace(/\s+-?\s*(?:PRE-?ROLLS?|\d*\.?\d+\s*G|5\s*PK|NEW LABEL|RESAMPLING)$/, '').trim();
    k = k.split(' ').map(w => TYPO[w] || w).join(' ');
    if (WHOLE[k]) return WHOLE[k];
    const [base, ...rest] = k.split(' #');
    const j = JOINED[base.replace(/\s+/g, '')];
    return j ? [j, ...rest].join(' #') : k;
  }
  // words that land in a strain position but are not strains
  const isStrain = k => !!k && k.length >= 2 && !/,|\bUNITS?\b|\bTOTAL\b|^PHENOS?$|^BREEDING|^(?:TESTING|MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)$/.test(k);

  // "RIPTIDE 5.5" / "BLACK LIGHT 27 9 LIGHTS" / "ANTIDOTE\t8" / "BLACK LIGHT #6  1/2" -> {name, n}
  function parseStrainLines(text) {
    const out = [];
    for (const raw of String(text).split(/\n|\|/)) {
      const line = raw.replace(/\t+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!line) continue;
      // a number right after "#" is a pheno number, part of the name ("BLACK LIGHT #6  1/2")
      const m = line.match(/^(.*?[A-Za-z#].*?)\s*-?\s*(?<!#)(\d+(?:\.\d+)?(?:\s+1\/2)?|1\/2)\s*(?:lights?)?\s*$/i);
      if (m) {
        const n = m[2] === '1/2' ? 0.5 : / 1\/2$/.test(m[2]) ? parseFloat(m[2]) + 0.5 : +m[2];
        out.push({ name: m[1].trim(), n });
      } else out.push({ name: line, n: null });
    }
    return out;
  }
  const looksLikeStrainList = t => {
    const ls = parseStrainLines(t);
    return ls.length >= 2 && ls.filter(l => l.n != null).length >= Math.ceil(ls.length * 0.6);
  };

  const NAMES = 'JUSTIN|NOURI|LORENZO|LOREZNO|CESAR|CC|DREA|VIC|NORMA';
  /* item types, checked in order (first match wins) */
  const TYPES = [
    { id: 'supply', re: /ARRIVES|SUPPLY|SUPPLIES|\bCOUNTS?\b|PALLETS?\b|INVENTORY|SHIPMENT/i },
    { id: 'crew', re: new RegExp(String.raw`^(?:NO DISTRO WORK|DISTRO OFF)|^[A-Z\s\/&,.\-]*(?<!DROP\s)\bOFF\b(?!\s+(?:JARS|LABEL))|\bOOO\b|\bON CALL\b|DISTRO LEAD|@ DISTRO\b|^(?:(?:${NAMES})\s*[\/&,]?\s*)+-?\s*DISTRO$|NORMA'?S? (?:TEAM|CREW)|^CC\b|\bWFH\b|OVERSEE TRIM|\bPPL$|^(?:PORTAL|25TH|23RD)\s*-\s*(?:CESAR|CC)\s*-\s*\d|^[A-Z\/ ]+-\s*\d{1,2}(?::?\d\d)?\s*(?:AM|PM)$|^\d{1,2}\s*(?:AM|PM)\s*-\s*\d{1,2}\s*(?:AM|PM) AT `, 'i') },
    { id: 'testing', re: /TESTING|\bCOAS?\b|\bLAB\b/i },

/* ===== app ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TYPE = {
  harvest: { label: 'Harvest' }, trim: { label: 'Trim' }, jars: { label: 'Jars' }, prerolls: { label: 'Pre-rolls' },
  testing: { label: 'Testing' }, orders: { label: 'Orders' }, labels: { label: 'Labels' }, supply: { label: 'Supplies' },
  other: { label: 'Other' }, crew: { label: 'Crew' },

const ORDER = ['harvest', 'trim', 'jars', 'prerolls', 'testing', 'orders', 'labels', 'supply', 'other'];
const SITES = { '23RD': ['23rd', 'Slane'], '25TH': ['25th', 'Filifera'], '15TH': ['15th', 'Imperial'],
  OLYMPIC: ['Olympic', 'Rio Verde'], PORTAL: ['Portal', ''], IMPERIAL: ['Imperial', ''], HQ: ['HQ', ''] };
const siteName = s => (SITES[s] || [s ? s.charAt(0) + s.slice(1).toLowerCase() : ''])[0];

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const md = iso => MON[+iso.slice(5, 7) - 1] + ' ' + (+iso.slice(8, 10));
const dowOf = iso => DOW[(new Date(iso + 'T12:00:00Z').getUTCDay() + 6) % 7];

/* ---- readable text: the sheet is all caps; show it in sentence case with names restored ---- */
const KEEP = { NABIS: 'Nabis', STIIIZY: 'STIIIZY', UID: 'UID', UIDS: 'UIDs', COA: 'COA', COAS: 'COAs', THC: 'THC',
  SKU: 'SKU', SKUS: 'SKUs', QR: 'QR', DCR: 'DCR', CGA: 'CGA', SOP: 'SOP', HQ: 'HQ', USC: 'USC', NY: 'NY', CA: 'CA',
  OOO: 'OOO', WFH: 'WFH', TBD: 'TBD', CC: 'CC', DISTRU: 'Distru', METRC: 'Metrc', REC: 'rec', VOID: 'Void', PPL: 'ppl', LBS: 'lbs',
  '5PK': '5pk', '5PKS': '5pks', NABISPICKUP: 'Nabis pickup' };
const PROPER = new Set(('JUSTIN NOURI LORENZO LOREZNO CESAR VIC VICTORIA DREA NORMA NORMAS CARLOS SCOTT SCOTTS RYAN JOANNA ' +
  'BRITTANY ANTONIO JESSE GARRETT ETAI KEELIN AMANDA PORTAL OLYMPIC IMPERIAL SLANE FILIFERA ' +
  'JANUARY FEBRUARY MARCH APRIL JUNE JULY AUGUST SEPTEMBER OCTOBER NOVEMBER DECEMBER JAN FEB MAR APR JUN JUL AUG SEP SEPT OCT NOV DEC ' +
  'MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY').split(' '));

  .replace(/\b(Og|Bb|Rs\d*|Gg)\b/g, w => w.toUpperCase()).replace(/\b(\d+)X\b/g, '$1x').replace(/\bX\b/g, 'x');

function learnStrains(weeks) {
  const names = new Map(), spellings = new Set();
  const add = raw => {
    const k = PIPE.strainKey(raw); if (k.length < 3 || !PIPE.isStrain(k)) return;
    names.set(k, strainLabel(k)); spellings.add(k); spellings.add(String(raw).toUpperCase().replace(/\s+/g, ' ').trim());
  };
  for (const w of weeks) for (const d of w.days) for (const it of d.items) {
    (it.lines || []).forEach(l => l.strain && add(l.strain));
    (it.strains || []).forEach(s => add(s.strain));

function pretty(s) {
  s = String(s || '').replace(/\t+/g, ' ').replace(/ {2,}/g, ' ').trim();

  let t = s.toLowerCase();
  t = t.replace(/[a-z0-9'#]+/gi, w => {

  if (STRAIN_RE) t = t.replace(STRAIN_RE, m => sLabel(PIPE.strainKey(m)));
  t = t.replace(/\b1a4[0-9a-z]{15,}\b/gi, m => m.toUpperCase()).replace(/\bso-\d+/gi, m => m.toUpperCase())
    .replace(/(\d)(st|nd|rd|th)\b/gi, (m, a, b) => a + b.toLowerCase()).replace(/\s*\/\/\s*/g, ' · ');
  t = t.replace(/(^|[.!?]\s+|\n|\|\s*)([a-z])/g, (m, a, b) => a + b.toUpperCase());

/* ---- week roll-up: the sheet repeats a multi-day task on each day it runs, so targets dedupe ---- */
function summarize(w) {
  const jars = new Map(), pre = new Map(), trims = new Map(), lists = { harvest: [], testing: [], orders: [], supply: [] };
  const addList = (kind, key, date, row) => {
    const arr = lists[kind]; let e = arr.find(x => x.key === key);
    if (!e) { e = Object.assign({ key, dates: [] }, row); arr.push(e); }
    if (!e.dates.includes(date)) e.dates.push(date);
  };
  for (const d of w.days) for (const it of d.items) {
    if (it.type === 'jars' && it.lines) it.lines.forEach(l => {
      const e = jars.get(l.strain) || { strain: l.strain, lbs: 0, size: '', cases: 0, caseSize: '', dates: [] };
      if (l.lbs != null) { e.lbs = Math.max(e.lbs, l.lbs); e.size = l.size; }
      if (l.cases != null) { e.cases = Math.max(e.cases, l.cases); e.caseSize = l.caseSize; }
      if (!e.dates.includes(d.date)) e.dates.push(d.date);
      jars.set(l.strain, e);
    });
    else if (it.type === 'prerolls') (it.lines || []).forEach(l => {
      if (!l.strain) return;
      const e = pre.get(l.strain) || { strain: l.strain, sizes: {}, dates: [] };
      e.sizes[l.size] = Math.max(e.sizes[l.size] || 0, l.n);
      if (!e.dates.includes(d.date)) e.dates.push(d.date);
      pre.set(l.strain, e);
    });
    else if (it.type === 'trim') {
      const key = (it.site || '?') + '|' + (it.room || '?');
      const e = trims.get(key) || { site: it.site, room: it.room, crews: [], dates: [], strains: new Map(), text: it.text };
      if (it.crew && !e.crews.includes(it.crew)) e.crews.push(it.crew);
      if (!e.dates.includes(d.date)) e.dates.push(d.date);
      it.strains.forEach(s => e.strains.set(s.strain, Math.max(e.strains.get(s.strain) || 0, s.n || 0)));
      trims.set(key, e);
    }
    else if (it.type === 'harvest') addList('harvest', it.site + '|' + it.room + '|' + it.title, d.date, { it });
    else if (it.type === 'testing') addList('testing', it.title, d.date, { it });
    else if (it.type === 'orders') addList('orders', it.title, d.date, { it });

/* ---- drops (Nabis releases): testing names the strains, orders name the stage and pickup days ---- */
function buildDrops(weeks) {
  const drops = new Map();
  for (const w of weeks) for (const d of w.days) for (const it of d.items) {
    if (!it.drop) continue;
    const e = drops.get(it.drop) || { name: it.drop, strains: new Set(), events: [] };
    if (it.type === 'testing') (it.strains || []).forEach(s => e.strains.add(s.strain));
    const kind = it.type === 'testing' ? 'test' : /PICK ?UP/i.test(it.title) ? 'pickup' : /STAGE/i.test(it.title) ? 'stage' : 'work';
    e.events.push({ date: d.date, kind, it });
    drops.set(it.drop, e);
  }
  return drops;
}
const dropLabel = n => n.split(' ').map((w, i) => i === 0 ? cap(w) : /^\d+$/.test(w) ? w : w === 'PREROLL' ? 'pre-roll' : w.toLowerCase()).join(' ');

/* ---- strain index for the Strains view: strain -> week -> {trim, testing, jars, prerolls, drop} ---- */
function buildStrainIndex(weeks, drops) {
  const idx = new Map();
  const add = (strain, date, kind, text) => {
    if (!PIPE.isStrain(strain)) return;
    const ws = weekOf(date);
    let s = idx.get(strain); if (!s) idx.set(strain, s = new Map());
    let c = s.get(ws); if (!c) s.set(ws, c = {});
    const e = c[kind] || (c[kind] = { dates: [], texts: [] });
    if (!e.dates.includes(date)) e.dates.push(date);
    if (text && !e.texts.includes(text)) e.texts.push(text);
  };
  for (const w of weeks) for (const d of w.days) for (const it of d.items) {
    if (it.type === 'trim') it.strains.forEach(s => add(s.strain, d.date, 'trim',
      `Room ${it.room || '?'} @ ${siteName(it.site)}${s.n != null ? ` · ${fmtN(s.n)} lights` : ''}`));
    else if (it.type === 'jars' && it.lines) it.lines.forEach(l => add(l.strain, d.date, 'jars', jarText(l)));
    else if (it.type === 'prerolls') (it.lines || []).forEach(l => add(l.strain, d.date, 'prerolls', `${fmtN(l.n)} ${sizeLabel(l.size)}`));
    else if (it.type === 'testing') (it.strains || []).forEach(s => add(s.strain, d.date, 'testing', it.drop ? dropLabel(it.drop) : 'Testing'));
  }
  for (const dr of drops.values()) {
    const pick = dr.events.filter(e => e.kind === 'pickup');
    pick.forEach(e => dr.strains.forEach(s => add(s, e.date, 'drop', `${dropLabel(dr.name)} pickup`)));
  }
  return idx;
}
const sizeLabel = s => s === '5pk' ? '5-pk' : s === 'units' ? 'units' : s;
const jarText = l => [l.lbs != null ? `${fmtN(l.lbs)} lb ${l.size}` : '', l.cases != null ? `${fmtN(l.cases)} cs ${l.caseSize}` : ''].filter(Boolean).join(' · ');

/* ---------------- state + rendering ---------------- */
const S = { weeks: [], byStart: new Map(), drops: new Map(), sidx: new Map(), week: null, view: 'week', q: '',
  types: new Set(), svStart: null, wb: null, loadedAt: 0, partial: false, err: '', more: {} };

function qMatch(text) {
  if (!S.q) return true;
  const q = S.q.toUpperCase(), k = PIPE.strainKey(S.q);
  const t = String(text).toUpperCase().replace(/\s+/g, ' ');
  return t.includes(q) || (k.length > 1 && t.includes(k));
}
// a drop's pickup or staging day matches the strains going out in that drop
const itemMatch = it => qMatch(itemText(it)) || (!!it.drop && [...((S.drops.get(it.drop) || {}).strains || [])].some(qMatch));
function itemText(it) {
  return [it.title, ...(it.notes || []), ...(it.lines || []).map(l => l.strain), ...(it.strains || []).map(s => s.strain),
    ...(it.sub || []).map(s => s.strain + ' ' + s.text), it.crew || ''].join(' ');
}

function typeChips() {
  const ids = ['harvest', 'trim', 'jars', 'prerolls', 'testing', 'orders', 'labels', 'supply', 'crew'];
  $('chips').innerHTML = ids.map(id => `<button type="button" class="chip${S.types.has(id) ? ' on' : ''}" data-type="${id}" style="--c:var(--t-${id})"><i></i>${TYPE[id].label}</button>`).join('');
}
const showType = id => !S.types.size || S.types.has(id);

function renderWeek() {
  const w = S.byStart.get(S.week);
  const today = todayISO(), thisWeek = weekOf(today);
  $('wk-title').textContent = w ? rangeLabel(w.start) : '';
  $('wk-sub').textContent = !w ? '' : w.start === thisWeek ? `${w.start.slice(0, 4)} · this week` :
    w.start < thisWeek ? `${w.start.slice(0, 4)} · past` : `${w.start.slice(0, 4)} · coming up`;
  if (!w) { $('sum').innerHTML = ''; $('board').innerHTML = '<div class="empty">No weeks found in the sheet.</div>'; return; }
  const sm = summarize(w);
  $('sum').innerHTML = summaryHTML(sm, w);
  $('board').innerHTML = w.days.map(d => dayHTML(d, today)).join('');
}

function srow(k, v, sub) {
  return `<div class="srow"><span class="k">${k}${sub ? `<span class="sub">${sub}</span>` : ''}</span><span class="v">${v}</span></div>`;
}
const daysText = dates => dates.slice().sort().map(dowOf).join(', ');
function scard(type, title, total, rows) {
  if (!rows.length) return '';
  const lim = 6, open = S.more[type];
  const shown = open ? rows : rows.slice(0, lim);
  return `<div class="scard" style="--c:var(--t-${type})"><h3>${title}${total ? `<em>${total}</em>` : ''}</h3>${shown.join('')}` +
    (rows.length > lim ? `<button class="more" type="button" data-more="${type}">${open ? 'Show less' : `+${rows.length - lim} more`}</button>` : '') + `</div>`;
}
function summaryHTML(sm, w) {
  const out = [];
  if (showType('trim')) {
    const rows = sm.trims.filter(t => !S.q || [...t.strains.keys()].some(qMatch) || qMatch(t.crews.join(' ') + ' ' + t.site)).map(t => {
      const strains = [...t.strains.entries()];
      const lights = strains.reduce((a, [, n]) => a + (n || 0), 0);
      const sub = strains.filter(([s]) => !S.q || qMatch(s)).map(([s, n]) => `${sLabel(s)}${n ? ' ' + fmtN(n) : ''}`).join(', ');
      return srow(`Room ${esc(t.room || '?')} @ ${esc(siteName(t.site) || '?')}`, esc(daysText(t.dates)),
        esc([t.crews.map(pretty).join(', '), lights ? `${fmtN(lights)} lights` : '', sub].filter(Boolean).join(' · ')));
    });
    out.push(scard('trim', 'Trim', sm.trims.length ? `${sm.trims.length} room${sm.trims.length > 1 ? 's' : ''}` : '', rows));
  }
  if (showType('harvest')) {
    const rows = sm.harvest.filter(h => qMatch(itemText(h.it))).map(h =>
      srow(h.it.room ? `Room ${esc(h.it.room)} @ ${esc(siteName(h.it.site))}` : esc(pretty(h.it.text)), esc(daysText(h.dates))));
    out.push(scard('harvest', 'Harvest', '', rows));
  }
  if (showType('jars')) {
    const list = sm.jars.filter(j => qMatch(j.strain));
    const lbs = list.reduce((a, j) => a + (j.lbs || 0), 0);
    const rows = list.map(j => srow(esc(sLabel(j.strain)), esc(jarText(j) || '—'), esc(daysText(j.dates))));
    out.push(scard('jars', 'Package to jars', lbs ? `${fmtN(lbs)} lb` : '', rows));
  }
  if (showType('prerolls')) {
    const list = sm.pre.filter(p => qMatch(p.strain));
    const tot = {}; list.forEach(p => Object.entries(p.sizes).forEach(([k, n]) => tot[k] = (tot[k] || 0) + n));
    const rows = list.map(p => srow(esc(sLabel(p.strain)),
      esc(Object.entries(p.sizes).map(([k, n]) => `${fmtN(n)} ${sizeLabel(k)}`).join(' · ')), esc(daysText(p.dates))));
    out.push(scard('prerolls', 'Pre-rolls', Object.entries(tot).map(([k, n]) => `${fmtN(n)} ${sizeLabel(k)}`).join(' · '), rows));
  }
  if (showType('testing')) {
    const rows = sm.testing.filter(t => qMatch(itemText(t.it))).map(t => {
      const st = (t.it.strains || []).map(s => sLabel(s.strain)).join(', ');
      return srow(esc(t.it.drop ? dropLabel(t.it.drop) : pretty(t.it.text)), esc(daysText(t.dates)), esc(t.it.drop ? st || pretty(t.it.text) : st));
    });
    out.push(scard('testing', 'Testing', '', rows));
  }
  if (showType('orders')) {
    const rows = sm.orders.filter(o => !S.q || itemMatch(o.it))
      .map(o => {
        const dr = o.it.drop && S.drops.get(o.it.drop);
        const st = dr ? [...dr.strains].map(sLabel).join(', ') : '';
        return srow(esc(pretty(o.it.text)), esc(daysText(o.dates)), esc(st));
      });
    out.push(scard('orders', 'Orders & drops', '', rows));
  }
  if (showType('supply')) {
    const rows = sm.supply.filter(o => qMatch(itemText(o.it))).map(o => srow(esc(pretty(o.it.text)), esc(daysText(o.dates))));
    out.push(scard('supply', 'Supplies', '', rows));
  }
  const html = out.join('');
  return html || (S.q ? `<div class="empty">Nothing this week matches "${esc(S.q)}".</div>` : '');
}

function dayHTML(d, today) {
  const isToday = d.date === today, past = d.date < today;
  const crew = d.items.filter(i => i.type === 'crew');
  const items = d.items.filter(i => i.type !== 'crew' && showType(i.type) && (!S.q || itemMatch(i)))
    .sort((a, b) => ORDER.indexOf(a.type) - ORDER.indexOf(b.type));
  const showCrew = !S.q && showType('crew') && crew.length;
  let h = `<div class="day${isToday ? ' today' : ''}${past ? ' past' : ''}" ${isToday ? 'id="today-col"' : ''}>` +
    `<div class="dh"><b>${DOW[d.dow]}</b><span class="dt">${md(d.date)}</span>` +
    (isToday ? '<span class="pill today">Today</span>' : '') +
    (d.note ? `<span class="pill note">${esc(pretty(d.note))}</span>` : '') + `</div>`;
  if (showCrew) h += `<div class="crew">${crew.map(c => `<div>${esc(pretty(c.title))}</div>`).join('')}</div>`;
  h += items.map(cardHTML).join('');
  if (!items.length && !showCrew) h += `<div class="empty">${S.q || S.types.size ? 'Nothing matching' : 'Nothing planned'}</div>`;
  return h + '</div>';
}

function cardHTML(it) {
  const c = `--c:var(--t-${it.type})`;
  const metaBits = [it.time, it.site ? siteName(it.site) : ''].filter(Boolean).join(' · ');
  let head = `<div class="tl">${TYPE[it.type].label}${metaBits ? `<span class="meta">${esc(metaBits)}</span>` : ''}</div>`;
  let body = '';
  const notes = (it.notes || []).filter(Boolean).map(n => `<div class="cn">${esc(pretty(n))}</div>`).join('');
  const sub = (it.sub || []).filter(s => !S.q || qMatch(s.strain) || qMatch(it.title))
    .map(s => `<div class="ln"><span class="s">${esc(sLabel(s.strain))}</span><span class="q">${esc(pretty(s.text))}</span></div>`).join('');
  const subHTML = sub ? `<div class="lns">${sub}</div>` : '';
  if (it.type === 'trim' || it.type === 'harvest') {
    const place = it.room || it.site ? `Room ${esc(it.room || '?')} @ <span title="${esc(siteTitle(it.site))}">${esc(siteName(it.site) || '?')}</span>` : '';
    head = `<div class="tl">${TYPE[it.type].label}${place ? `<span class="meta">${place}</span>` : ''}</div>`;
    if (it.crew) body += `<div class="who">${esc(pretty(it.crew))}</div>`;
    if (it.type === 'harvest' && !it.room) body += `<div class="ct">${esc(pretty(it.text))}</div>`;
    if (it.type === 'trim' && it.text && !/^TRIM\b/i.test(it.text)) body += `<div class="ct">${esc(pretty(it.text))}</div>`;
    if (it.strains && it.strains.length) {
      const lights = it.strains.reduce((a, s) => a + (s.n || 0), 0);
      body += `<div class="strs">${it.strains.map(s => `<span class="str${S.q && qMatch(s.strain) ? ' hit' : ''}">${esc(sLabel(s.strain))}${s.n != null ? `<b>${fmtN(s.n)}</b>` : ''}</span>`).join('')}</div>` +
        (lights ? `<div class="cn">${fmtN(lights)} lights</div>` : '');
    }
    return `<div class="card" style="${c}">${head}${body}${notes}${subHTML}</div>`;
  }
  if (it.type === 'jars' && it.lines) {
    const lines = it.lines.filter(l => !S.q || qMatch(l.strain) || !it.lines.some(x => qMatch(x.strain)));
    body = (it.note ? `<div class="cn">${esc(pretty(it.note))}</div>` : '') + `<div class="lns">${lines.map(l => `<div class="ln"><span class="s" title="${esc(l.tag)}">${esc(sLabel(l.strain))}</span><span class="q">${esc(jarText(l) || '—')}</span></div>`).join('')}</div>`;
    const ln = lines.flatMap(l => l.notes).map(n => `<div class="cn">${esc(pretty(n))}</div>`).join('');
    return `<div class="card" style="${c}">${head}${body}${ln}</div>`;
  }
  if (it.type === 'prerolls') {
    const lines = (it.lines || []).filter(l => !S.q || !l.strain || qMatch(l.strain) || !it.lines.some(x => qMatch(x.strain)));
    const by = new Map();
    lines.forEach(l => { const k = l.strain || ''; if (!by.has(k)) by.set(k, []); by.get(k).push(l); });
    const desc = it.title === 'Pre-rolls' ? '' : pretty(it.text.replace(/^PRE-?ROLLS?\s*-\s*/i, ''));
    body = (desc ? `<div class="ct">${esc(desc)}</div>` : '') +
      (by.size ? `<div class="lns">${[...by.entries()].map(([s, ls]) => `<div class="ln"><span class="s">${esc(s ? sLabel(s) : '')}</span><span class="q">${esc(ls.map(l => `${fmtN(l.n)} ${sizeLabel(l.size)}`).join(' · '))}</span></div>`).join('')}</div>` : '');
    return `<div class="card" style="${c}">${head}${body}${notes}${subHTML}</div>`;
  }
  body = `<div class="ct">${esc(pretty(it.text))}</div>`;
  if (it.type === 'testing' && it.strains && it.strains.length && it.drop) {
    body = `<div class="ct">${esc(dropLabel(it.drop))} testing</div><div class="strs">${it.strains.map(s => `<span class="str${S.q && qMatch(s.strain) ? ' hit' : ''}">${esc(sLabel(s.strain))}</span>`).join('')}</div>`;
  }
  return `<div class="card" style="${c}">${head}${body}${notes}${subHTML}</div>`;
}

/* ---- Strains view ---- */
const SV_KINDS = [['trim', 'Trim'], ['testing', 'Test'], ['jars', 'Jars'], ['prerolls', 'PR'], ['drop', 'Drop']];
function renderStrains() {
  const starts = S.weeks.map(w => w.start);
  if (!starts.length) { $('sv').innerHTML = ''; return; }
  const thisWeek = weekOf(todayISO());
  if (!S.svStart) S.svStart = PIPE.addDays(thisWeek, -14);
  const cols = []; for (let i = 0; i < 9; i++) cols.push(PIPE.addDays(S.svStart, i * 7));
  $('sv-title').textContent = `${md(cols[0])} – ${md(PIPE.addDays(cols[cols.length - 1], 6))}`;
  $('legend').innerHTML = SV_KINDS.map(([k, l]) => `<span><span class="sc" style="--c:var(--t-${k === 'drop' ? 'orders' : k})">${l}</span>${{ trim: 'in a room being trimmed', testing: 'sent to the lab', jars: 'packaged to jars', prerolls: 'pre-rolls made', drop: 'Nabis drop pickup' }[k]}</span>`).join('');
  const rows = [...S.sidx.entries()].filter(([s, m]) => cols.some(c => m.has(c)) && (!S.q || qMatch(s)))
    .sort((a, b) => sLabel(a[0]).localeCompare(sLabel(b[0])));
  let h = `<thead><tr><th class="sn">Strain</th>${cols.map(c => `<th class="${c === thisWeek ? 'cur' : ''}">${md(c)}${c === thisWeek ? ' · now' : ''}</th>`).join('')}</tr></thead><tbody>`;
  if (!rows.length) h += `<tr><td colspan="${cols.length + 1}" style="cursor:default"><div class="empty">No strains${S.q ? ` matching "${esc(S.q)}"` : ''} in these weeks.</div></td></tr>`;
  for (const [s, m] of rows) {
    h += `<tr><th class="sn">${esc(sLabel(s))}</th>` + cols.map(c => {
      const cell = m.get(c);
      const chips = cell ? SV_KINDS.filter(([k]) => cell[k]).map(([k, l]) => {
        const e = cell[k];
        const tip = `${l}: ${e.texts.join('; ')} (${e.dates.slice().sort().map(d => dowOf(d) + ' ' + md(d)).join(', ')})`;
        return `<span class="sc" style="--c:var(--t-${k === 'drop' ? 'orders' : k})" title="${esc(tip)}">${l}</span>`;
      }).join('') : '';
      return `<td class="${c === thisWeek ? 'cur' : ''}" data-go="${c}" data-strain="${esc(sLabel(s))}">${chips}</td>`;
    }).join('') + '</tr>';
  }
  $('sv').innerHTML = h + '</tbody>';
}

function render() {
  $('view-week').hidden = S.view !== 'week';
  $('view-strains').hidden = S.view !== 'strains';
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  typeChips();
  if ($('q').value !== S.q) $('q').value = S.q;
  if ($('q2').value !== S.q) $('q2').value = S.q;
  if (S.view === 'week') renderWeek(); else renderStrains();
  renderStatus();
  const h = `#view=${S.view}${S.week ? '&week=' + S.week : ''}${S.q ? '&q=' + encodeURIComponent(S.q) : ''}`;
  if (location.hash !== h) history.replaceState(null, '', h);
}
function renderStatus() {
  const dot = $('st-dot'), t = $('st-text');
  if (S.err) { dot.className = 'dot bad'; t.textContent = S.err; return; }
  if (!S.loadedAt) { dot.className = 'dot stale'; t.textContent = 'Loading...'; return; }
  const mins = Math.round((Date.now() - S.loadedAt) / 60000);
  dot.className = 'dot' + (mins > 15 ? ' stale' : '');
  t.innerHTML = `From the pipeline sheet <span class="when">· ${mins < 1 ? 'just now' : mins + ' min ago'}</span>`;
  const al = [];
  if (S.partial) al.push('<div class="alert info">Showing only the weeks that are not hidden in the sheet (the full export could not be read).</div>');
  $('alerts').innerHTML = al.join('');
}

/* ---- data ---- */
const GID = '442501874', TAB = 'DISTRO PIPELINE', CACHE = 'pipeline.v1';
function ingest(text, at, partial) {
  const weeks = PIPE.parse(text).sort((a, b) => a.start.localeCompare(b.start));
  if (!weeks.length) throw new Error('The sheet has no week headers.');
  S.weeks = weeks; S.byStart = new Map(weeks.map(w => [w.start, w]));
  learnStrains(weeks);
  S.drops = buildDrops(weeks);
  S.sidx = buildStrainIndex(weeks, S.drops);
  S.loadedAt = at; S.partial = !!partial; S.err = '';
  if (!S.week || !S.byStart.has(S.week)) S.week = nearestWeek(weekOf(todayISO()));
}
function nearestWeek(ws) {
  if (S.byStart.has(ws)) return ws;
  const starts = S.weeks.map(w => w.start);
  return starts.find(s => s >= ws) || starts[starts.length - 1];
}
async function fetchSheet() {
  const base = `https://docs.google.com/spreadsheets/d/${S.wb}`;
  const tries = [[`${base}/export?format=csv&gid=${GID}`, false],
    [`${base}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB)}`, true]];
  for (const [u, partial] of tries) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) continue;
      const text = await r.text();
      if (/MONDAY/i.test(text) && !/^\s*</.test(text)) return { text, partial };
    } catch (_) { /* next */ }
  }
  throw new Error("Couldn't read the pipeline sheet. Check that it is still shared by link.");
}
let loading = false;
async function load(quiet) {
  if (loading || !S.wb) return; loading = true;
  if (!quiet) { S.err = ''; renderStatus(); }
  try {
    const { text, partial } = await fetchSheet();
    ingest(text, Date.now(), partial);
    try { if (!partial) localStorage.setItem(CACHE, JSON.stringify({ at: S.loadedAt, wb: S.wb, text })); } catch (_) {}
    render();
  } catch (e) {
    S.err = e.message || String(e); renderStatus();
  } finally { loading = false; }
}
function startApp() {
  $('gate').hidden = true; $('top').hidden = false; $('app').hidden = false;
  const sl = $('sheet-link'); sl.href = `https://docs.google.com/spreadsheets/d/${S.wb}/edit#gid=${GID}`; sl.hidden = false;
  readHash();
  try {
    const c = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (c && c.wb === S.wb && c.text) { ingest(c.text, c.at, false); render(); }
  } catch (_) {}
  load(false).then(() => {
    if (S.view === 'week' && window.innerWidth <= 760) { const t = $('today-col'); if (t) t.scrollIntoView({ block: 'start' }); }
  });
  setInterval(() => { if (document.visibilityState === 'visible') load(true); else renderStatus(); }, 5 * 60 * 1000);
  setInterval(renderStatus, 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - S.loadedAt > 2 * 60 * 1000) load(true);
  });
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('view') === 'strains') S.view = 'strains';
  if (/^\d{4}-\d\d-\d\d$/.test(p.get('week') || '')) S.week = p.get('week');
  if (p.get('q')) S.q = p.get('q');
}

/* ---- events ---- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-view],[data-type],[data-more],[data-go]');
  if (!b) return;
  if (b.dataset.view) { S.view = b.dataset.view; render(); return; }
  if (b.dataset.type) { const t = b.dataset.type; S.types.has(t) ? S.types.delete(t) : S.types.add(t); render(); return; }
  if (b.dataset.more) { S.more[b.dataset.more] = !S.more[b.dataset.more]; render(); return; }
  if (b.dataset.go) { S.view = 'week'; S.week = nearestWeek(b.dataset.go); S.q = b.dataset.strain || ''; render(); window.scrollTo(0, 0); return; }
  const i = S.weeks.findIndex(w => w.start === S.week);
  switch (b.dataset.act) {
    case 'prev': if (i > 0) { S.week = S.weeks[i - 1].start; render(); } break;
    case 'next': if (i >= 0 && i < S.weeks.length - 1) { S.week = S.weeks[i + 1].start; render(); } break;
    case 'today': S.week = nearestWeek(weekOf(todayISO())); render(); break;
    case 'sv-prev': S.svStart = PIPE.addDays(S.svStart, -28); render(); break;
    case 'sv-next': S.svStart = PIPE.addDays(S.svStart, 28); render(); break;
    case 'sv-today': S.svStart = PIPE.addDays(weekOf(todayISO()), -14); render(); break;
    case 'refresh': load(false); break;
    case 'signout': signOut(); break;
  }
});
let qT = null;
['q', 'q2'].forEach(id => $(id).addEventListener('input', e => {
  clearTimeout(qT); const v = e.target.value.trim();
  qT = setTimeout(() => { S.q = v; render(); }, 120);
}));
document.addEventListener('keydown', e => {
  if (S.view !== 'week' || /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  if (e.key === 'ArrowLeft') document.querySelector('[data-act="prev"]').click();
  if (e.key === 'ArrowRight') document.querySelector('[data-act="next"]').click();
});

/* ---------------- sign-in: Google -> Supabase session (same flow as the timesheets app) ----------------
   The workbook id never ships in this public page: pipeline_source() hands it only to signed-in
   accounts on the pipeline list (universal admins, plus pipeline_viewers). */
const SB_URL = 'https://dhiqhgtmelxwelyoowle.supabase.co';
const SB_KEY = 'sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14';   // publishable anon key (RLS does the guarding)
const GOOGLE_CLIENT_ID = '168134930971-2au6foq8njul8tjja6a2v306mt10r45i.apps.googleusercontent.com';
let sb = null, rawNonce = null;
const gateErr = m => { $('gate-err').textContent = m || ''; };
async function sha256hex(s) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function openApp() {
  const { data, error } = await sb.rpc('pipeline_source');
  if (error) { gateErr(/function|does not exist|schema cache/i.test(error.message) ? "The pipeline isn't set up on the server yet. Ask Gianni." : "Couldn't reach the database. Check your connection and refresh."); return; }
  if (!data) {
    const { data: { user } } = await sb.auth.getUser();
    $('gate-signin').hidden = true; $('gate-noaccess').hidden = false;
    $('gate-email').textContent = user && user.email ? 'Signed in as ' + user.email : '';
    return;
  }
  S.wb = data; startApp();
}
async function onCredential(resp) {
  gateErr('');
  const { error } = await sb.auth.signInWithIdToken({ provider: 'google', token: resp && resp.credential, nonce: rawNonce });
  if (error) { gateErr('Sign-in failed: ' + error.message); return; }
  openApp();
}
async function showGoogleButton() {
  rawNonce = crypto.randomUUID() + crypto.randomUUID();
  const hashed = await sha256hex(rawNonce);
  let tries = 0;
  (function ready() {
    if (window.google && google.accounts && google.accounts.id) {
      $('gate-loading').hidden = true;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, hd: 'wizardtrees.com',
        nonce: hashed, auto_select: true, cancel_on_tap_outside: false });
      google.accounts.id.renderButton($('gsi'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', width: 260 });
      google.accounts.id.prompt();
    } else if (tries++ < 60) setTimeout(ready, 150);
    else gateErr('Could not load Google sign-in. Check your connection and refresh.');
  })();
}
function signOut() {
  if (!sb) { location.reload(); return; }
  // scope 'local': this device only; 'global' would end every session on the shared project
  sb.auth.signOut({ scope: 'local' }).finally(() => {
    try { localStorage.removeItem(CACHE); } catch (_) {}
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    location.reload();
  });
}
async function initGate() {
  // local preview only: ?wb=<workbook id> skips sign-in (the id is the secret, and only localhost honours it)
  const devWb = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get('wb');
  if (devWb) { S.wb = devWb; $('signout-btn').hidden = true; startApp(); return; }
  if (!window.supabase || !window.supabase.createClient) { gateErr('Could not load the page. Check your connection and refresh.'); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.wb) location.reload(); });
  const { data: { session } } = await sb.auth.getSession();
  if (session) { openApp(); return; }
  showGoogleButton();
}
initGate();
