<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
<title>Receipts</title>
<link rel="icon" href="data:," />
<!-- Employee receipt requests. Each person's private link (#k=...) calls the rr_* functions as anon; the database finds the person
     from the key's sha256 and shows only their lines. With no key, this is Gianni's overview, behind the Bank Board's Google sign-in.
     This page holds no data. The anon key below is public; row level security and the rr_* functions are the only gate. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --line:#e3e2dd; --line2:#c9c8c1; --text:#1c1d1f; --muted:#62645f;
    --accent:#2f6f4f; --on-accent:#fff; --ok-bg:#e4f1e8; --ok:#22603f; --warn-bg:#fbf0d9; --warn:#7a5208; --no-bg:#ececE8; --no:#4d4f4a; --bad:#a32d2d;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181d; --card:#1f2228; --line:#30343c; --line2:#454a54; --text:#eceef1; --muted:#a2a7b1;
      --accent:#5fbf8f; --on-accent:#0f2419; --ok-bg:#1d3a2b; --ok:#8fd6ae; --warn-bg:#3d3015; --warn:#eec877; --no-bg:#2c2f36; --no:#c3c6cc; --bad:#f09595; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
  main.wide{max-width:980px}
  h1{font-size:24px;font-weight:600;margin:0 0 4px}
  h2{font-size:14px;font-weight:600;color:var(--muted);margin:24px 0 8px}
  p{margin:0}
  .sub{color:var(--muted);margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:17px}
  .top span:last-child{white-space:nowrap}
  .meta{color:var(--muted);font-size:14px;margin-top:2px}
  .ask{font-size:14px;margin-top:8px}
  .flag{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
  .row{display:flex;gap:8px;margin-top:12px}
  button{font:inherit;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--text);min-height:44px;padding:0 14px;cursor:pointer}
  button.grow{flex:1}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.link{border:0;min-height:36px;padding:0 4px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  button:disabled{opacity:.55;cursor:default}
  .links{display:flex;justify-content:flex-end;gap:14px;margin-top:6px}
  .chip{display:inline-flex;align-items:center;font-size:14px;font-weight:600;padding:5px 10px;border-radius:8px;margin-top:10px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.no{background:var(--no-bg);color:var(--no)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .files{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .note{font-size:14px;margin-top:8px;color:var(--muted);overflow-wrap:anywhere}
  label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
  textarea,select,input[type=text]{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px}
  textarea{min-height:64px;resize:vertical}
  select{min-height:44px}
  .busy{font-size:14px;color:var(--muted);margin-top:12px}
  .done{text-align:center;padding:32px 16px;color:var(--muted)}
  .done b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:15px;display:none;z-index:5}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.n,th.n{text-align:right}
  tr.pick{cursor:pointer}
  tr.on td{background:var(--ok-bg)}
  .scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  td select{min-height:34px;padding:4px 6px;font-size:14px;margin:0;width:auto;max-width:130px}
  a{color:var(--accent)}
  .foot{color:var(--muted);font-size:13px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main id="app"><p class="sub">Loading...</p></main>
<div id="toast" role="status"></div>
<input id="picker" type="file" accept="image/*,application/pdf" multiple hidden />
<script>
const SUPA={url:'https://bvazrztbrisleezfbucq.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2YXpyenRicmlzbGVlemZidWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzY4NjcsImV4cCI6MjEwMTI1Mjg2N30.Ys-SXNH2C_oIG7B18j7fhoyKcbe7VB-u7nhxh8YfHuY'};
const BUCKET='receipt-requests', MAX=10*1024*1024, GOOGLE_CLIENT_ID='168134930971-2au6foq8njul8tjja6a2v306mt10r45i.apps.googleusercontent.com';
const TYPES={'application/pdf':'pdf','image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp'};
const EXTS={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp'};
const app=document.getElementById('app'), toastEl=document.getElementById('toast'), picker=document.getElementById('picker');
const key=new URLSearchParams(location.hash.slice(1)).get('k');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$'+(Number(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
let toastT; function toast(m){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.style.display='none';},5000);}
const plain=e=>{const m=String(e?.message||e||'');return /fetch|network|load failed/i.test(m)?'No connection. Try again.':m||'Something went wrong. Try again.';};

// ── a person's list ─────────────────────────────────────────────────────────
let sb, data, hash, panel=null, busy=null, pickFor=null;
async function sha256hex(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
async function rpc(fn,args){const {data:d,error}=await sb.rpc(fn,{p_key:key,...args});if(error)throw error;return d;}
async function startPerson(){
  sb=supabase.createClient(SUPA.url,SUPA.anon,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  hash=await sha256hex(key);
  try{data=await rpc('rr_my_list');render();}
  catch(e){const m=plain(e);app.innerHTML=`<h1>Receipts</h1><p class="sub">${esc(/not active/.test(m)?"This link isn't active. Ask Gianni for a new one.":m)}</p>`;}
}
const isTodo=l=>l.status==='open';
function lineHtml(l){
  const whose=l.cardholder&&l.cardholder.split(' ')[0]!==data.name?` · ${esc(l.cardholder.split(' ')[0])}'s card`:'';
  let body='';
  if(busy?.id===l.id) body=`<p class="busy">${esc(busy.text)}</p>`;
  else if(panel?.id===l.id&&panel.kind==='cant') body=`<label>Anything that would help? (optional)<textarea id="pnote" maxlength="500">${esc(l.note)}</textarea></label>
    <div class="row"><button class="grow primary" data-do="cant-yes" data-id="${l.id}">Mark can't locate</button><button data-do="close">Cancel</button></div>`;
  else if(panel?.id===l.id&&panel.kind==='mine') body=`<label>Who has this one?<select id="pto">${data.people.map(p=>`<option value="${esc(p.email)}"${p.name===(l.cardholder||'').split(' ')[0]?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label>Note for them (optional)<textarea id="pnote" maxlength="500"></textarea></label>
    <div class="row"><button class="grow primary" data-do="mine-yes" data-id="${l.id}">Move it</button><button data-do="close">Cancel</button></div>`;
  else if(panel?.id===l.id&&panel.kind==='note') body=`<label>Your note<textarea id="pnote" maxlength="500">${esc(l.note)}</textarea></label>
    <div class="row"><button class="grow primary" data-do="note-yes" data-id="${l.id}">Save note</button><button data-do="close">Cancel</button></div>`;
  else if(l.status==='open') body=`<div class="row"><button class="grow primary" data-do="add" data-id="${l.id}">Add receipt</button><button class="grow" data-do="cant" data-id="${l.id}">Can't locate</button></div>
    <div class="links"><button class="link" data-do="note" data-id="${l.id}">Add a note</button><button class="link" data-do="mine" data-id="${l.id}">Not mine</button></div>`;
  else if(l.status==='cant_locate') body=`<span class="chip no">Can't locate</span><div class="links"><button class="link" data-do="undo" data-id="${l.id}">Undo</button><button class="link" data-do="add" data-id="${l.id}">Found it, add receipt</button></div>`;
  else body=`<span class="chip ok">Receipt added</span>${l.files.length?`<p class="files">${l.files.map(f=>esc(f.name||'File')).join(', ')}</p>`:''}
    <div class="links">${l.status==='uploaded'?`<button class="link" data-do="undo" data-id="${l.id}">Undo</button>`:''}<button class="link" data-do="add" data-id="${l.id}">Add another page</button><button class="link" data-do="note" data-id="${l.id}">${l.note?'Edit note':'Add a note'}</button></div>`;
  const showNote=l.note&&panel?.id!==l.id;
  return `<section class="card"><div class="top"><span>${esc(l.merchant)}</span><span>${money(l.amount_cents)}</span></div>
    <p class="meta">${day(l.date)} · ${esc(l.account||'')}${whose}</p>
    ${l.prompt&&l.status==='open'?`<p class="ask">${esc(l.prompt)}</p>`:''}
    ${l.flag?`<p class="flag">Needs another try: ${esc(l.flag)}</p>`:''}
    ${showNote?`<p class="note">Note: ${esc(l.note)}</p>`:''}${body}</section>`;
}
function render(){
  const todo=data.lines.filter(isTodo), done=data.lines.filter(l=>!isTodo(l)), n=todo.length;
  const head=n?`${n} ${n===1?'charge needs':'charges need'} a receipt. A photo, PDF or screenshot is fine.`:done.length?'Nothing left to do.':'Nothing on your list.';
  app.innerHTML=`<h1>Hi ${esc(data.name)}</h1><p class="sub">${head}</p>
    ${n?todo.map(lineHtml).join(''):`<div class="done"><b>All set</b>Thanks, ${esc(data.name)}.</div>`}
    ${done.length?`<h2>Done (${done.length})</h2>${done.map(lineHtml).join('')}`:''}
    <p class="foot">Questions? Reply to Gianni's email.</p>`;
}
function setLine(l){data.lines=data.lines.map(x=>x.id===l.id?l:x);panel=null;busy=null;render();}
async function act(id,text,fn){busy={id,text};panel=null;render();try{setLine(await fn());}catch(e){busy=null;render();toast(plain(e));}}
const lineOf=id=>data.lines.find(l=>l.id===id);

function typeOf(f){const t=String(f.type||'').toLowerCase();if(TYPES[t])return EXTS[TYPES[t]];const e=(f.name.split('.').pop()||'').toLowerCase();return EXTS[e]||'';}
// Phone photos over 2 MB shrink here, as the board does. PDFs pass through untouched.
async function shrink(file,type){
  if(!/^image\//.test(type)||file.size<=2*1024*1024)return {file,type};
  try{
    const img=await createImageBitmap(file), scale=Math.min(1,2200/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    return blob&&blob.size<file.size?{file:blob,type:'image/jpeg'}:{file,type};
  }catch(e){return {file,type};}
}
async function addFiles(id,files){
  for(const f of files){
    const t0=typeOf(f);
    if(!t0){toast(`${f.name} can't be used. Send a photo, screenshot or PDF.`);continue;}
    busy={id,text:`Uploading ${f.name}...`};panel=null;render();
    try{
      const {file,type}=await shrink(f,t0);
      if(file.size>MAX)throw new Error(`${f.name} is over 10 MB. Try a smaller photo or a screenshot.`);
      const path=`${hash}/${id}/${uuid()}.${TYPES[type]}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:type,upsert:false});
      if(error)throw new Error(/size|too large/i.test(error.message)?`${f.name} is over 10 MB. Try a smaller photo or a screenshot.`:'That upload did not go through. Try again.');
      const l=await rpc('rr_add_file',{p_request:id,p_path:path,p_name:f.name});
      data.lines=data.lines.map(x=>x.id===id?l:x);
    }catch(e){toast(plain(e));}
  }
  busy=null;render();
}
picker.addEventListener('change',()=>{const files=[...picker.files],id=pickFor;picker.value='';if(files.length&&id)addFiles(id,files);});
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-do]');if(!b||!key)return;
  const id=b.dataset.id, what=b.dataset.do, val=()=>document.getElementById('pnote')?.value||'';
  if(what==='add'){pickFor=id;picker.click();}
  else if(what==='close'){panel=null;render();}
  else if(what==='cant'||what==='mine'||what==='note'){panel={id,kind:what};render();document.getElementById('pnote')?.focus();}
  else if(what==='cant-yes'){const v=val();act(id,'Saving...',()=>rpc('rr_cant_locate',{p_request:id,p_note:v}));}
  else if(what==='note-yes'){const v=val();act(id,'Saving...',()=>rpc('rr_set_note',{p_request:id,p_note:v}));}
  else if(what==='undo')act(id,'Undoing...',()=>rpc('rr_undo',{p_request:id}));
  else if(what==='mine-yes'){
    const to=document.getElementById('pto').value, v=val();busy={id,text:'Moving...'};panel=null;render();
    rpc('rr_hand_off',{p_request:id,p_to:to,p_note:v}).then(r=>{data.lines=data.lines.filter(l=>l.id!==id);busy=null;render();toast(`Moved to ${r.moved_to}.`);}).catch(err=>{busy=null;render();toast(plain(err));});
  }
});

// ── Gianni's overview ───────────────────────────────────────────────────────
let all={people:[],lines:[],files:[]}, who=null, gisNonce=null;
async function startOverview(){
  // This origin hosts other apps, so the admin session stays in memory: nothing another page could read from storage.
  sb=supabase.createClient(SUPA.url,SUPA.anon,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
  app.innerHTML=`<h1>Receipts</h1><p class="sub">Open this from the private link in your email from Gianni.</p><div style="margin-top:28px" id="gsi"></div><p class="foot" id="gmsg"></p>`;
  gisNonce=crypto.randomUUID()+crypto.randomUUID();
  const hashed=await sha256hex(gisNonce), s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=()=>{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogle,hd:'wizardtrees.com',nonce:hashed});
    google.accounts.id.renderButton(document.getElementById('gsi'),{theme:'outline',size:'large',text:'signin_with',shape:'pill',width:260});};
  document.head.appendChild(s);
}
async function isAdmin(){const {data:d}=await sb.rpc('is_admin');return d===true;}
async function onGoogle(resp){
  const {error}=await sb.auth.signInWithIdToken({provider:'google',token:resp&&resp.credential,nonce:gisNonce});
  if(error){document.getElementById('gmsg').textContent='Sign-in failed. Try again.';return;}
  if(await isAdmin())loadOverview(); else document.getElementById('gmsg').textContent='The overview is for Gianni. Your list opens from the link in your email.';
}
async function readAll(table,cols,order){const out=[];for(let i=0;;i+=1000){const {data:d,error}=await sb.from(table).select(cols).order(order).range(i,i+999);if(error)throw error;out.push(...d);if(d.length<1000)return out;}}
async function loadOverview(){
  app.className='wide';app.innerHTML='<h1>Receipts</h1><p class="sub">Loading...</p>';
  try{
    const [people,lines,files]=await Promise.all([readAll('receipt_request_people','email,first_name,link_on,active,last_seen_at','first_name'),readAll('receipt_requests','*','txn_date'),readAll('receipt_request_files','*','uploaded_at')]);
    all={people,lines,files};
    const review=files.filter(f=>f.state==='review');
    all.urls={};
    await Promise.all(review.map(async f=>{const {data:u}=await sb.storage.from(BUCKET).createSignedUrl(f.storage_path,1800);if(u)all.urls[f.id]=u.signedUrl;}));
    renderOverview();
  }catch(e){app.innerHTML=`<h1>Receipts</h1><p class="sub">${esc(plain(e))}</p>`;}
}
const LABEL={open:'Waiting',uploaded:'Being checked',cant_locate:"Can't locate",attached:'On the bank row',closed:'Closed'};
function renderOverview(){
  const {people,lines,files,urls}=all, byId=new Map(lines.map(l=>[l.id,l])), look=files.filter(f=>f.state==='review');
  const names=new Map(people.map(p=>[p.email,p.first_name]));
  const count=(e,s)=>lines.filter(l=>l.assignee_email===e&&l.status===s).length;
  const shown=people.filter(p=>lines.some(l=>l.assignee_email===p.email));
  const rows=shown.map(p=>`<tr class="pick${who===p.email?' on':''}" data-who="${esc(p.email)}"><td>${esc(p.first_name)}</td><td class="n">${count(p.email,'open')}</td><td class="n">${count(p.email,'uploaded')}</td><td class="n">${count(p.email,'cant_locate')}</td><td class="n">${count(p.email,'attached')}</td><td>${p.last_seen_at?new Date(p.last_seen_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):(p.link_on?'Not yet':'No link')}</td></tr>`).join('');
  const list=lines.filter(l=>(who?l.assignee_email===who:true)&&l.status!=='closed').sort((a,b)=>a.assignee_email.localeCompare(b.assignee_email)||a.txn_date.localeCompare(b.txn_date));
  const options=e=>people.filter(p=>p.active).map(p=>`<option value="${esc(p.email)}"${p.email===e?' selected':''}>${esc(p.first_name)}</option>`).join('');
  app.innerHTML=`<h1>Receipts</h1><p class="sub">${lines.filter(l=>l.status==='open').length} waiting · ${lines.filter(l=>l.status==='cant_locate').length} can't locate · ${lines.filter(l=>l.status==='attached').length} on the bank row</p>
  ${look.length?`<h2>Waiting for a look (${look.length})</h2>${look.map(f=>{const l=byId.get(f.request_id);return `<section class="card"><div class="top"><span>${esc(l.merchant)}</span><span>${money(l.amount_cents)}</span></div>
    <p class="meta">${day(l.txn_date)} · ${esc(names.get(l.assignee_email)||'')} · ${urls[f.id]?`<a href="${esc(urls[f.id])}" target="_blank" rel="noopener">Open the file</a>`:'File'}</p><p class="ask">${esc(f.reason||'')}</p>${l.note?`<p class="note">Their note: ${esc(l.note)}</p>`:''}
    <div class="row"><button class="grow primary" data-ok="${f.id}">It's right, attach it</button><button class="grow" data-no="${f.id}">Send it back</button></div></section>`;}).join('')}`:''}
  <h2>People</h2><div class="scroll"><table><thead><tr><th>Person</th><th class="n">Waiting</th><th class="n">Checking</th><th class="n">Can't locate</th><th class="n">Done</th><th>Opened</th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>${who?esc(names.get(who))+"'s lines":'All lines'} (${list.length})</h2>
  <div class="scroll"><table><thead><tr><th>Date</th><th>Merchant</th><th class="n">Amount</th><th>Card</th><th>Asked</th><th>Status</th><th>Note</th></tr></thead><tbody>${list.map(l=>`<tr><td>${day(l.txn_date)}</td><td>${esc(l.merchant)}</td><td class="n">${money(l.amount_cents)}</td><td>${esc((l.cardholder||'').split(' ')[0])}</td><td>${['open','cant_locate'].includes(l.status)?`<select data-move="${l.id}" aria-label="Asked">${options(l.assignee_email)}</select>`:esc(names.get(l.assignee_email)||'')}</td><td>${LABEL[l.status]||esc(l.status)}</td><td>${esc(l.note||'')}</td></tr>`).join('')}</tbody></table></div>`;
}
app.addEventListener('click',async e=>{
  if(key)return;
  const row=e.target.closest('tr[data-who]');if(row){who=who===row.dataset.who?null:row.dataset.who;renderOverview();return;}
  const ok=e.target.closest('[data-ok]'), no=e.target.closest('[data-no]');
  if(!ok&&!no)return;
  const reason=no?prompt('What should they send instead? They will see this.'):null;
  if(no&&!reason)return;
  const {error}=await sb.rpc('rr_admin_review',{p_file:(ok||no).dataset[ok?'ok':'no'],p_ok:!!ok,p_reason:reason});
  if(error)toast(plain(error));else loadOverview();
});
app.addEventListener('change',async e=>{
  const s=e.target.closest('select[data-move]');if(!s||key)return;
  const {error}=await sb.rpc('rr_admin_assign',{p_request:s.dataset.move,p_to:s.value});
  if(error){toast(plain(error));}else{const l=all.lines.find(x=>x.id===s.dataset.move);if(l)l.assignee_email=s.value;toast('Moved.');renderOverview();}
});
(key?startPerson():startOverview()).catch(e=>{app.innerHTML=`<h1>Receipts</h1><p class="sub">${esc(plain(e))}</p>`;});
</script>
</body>
</html>
