<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
<title>Receipts</title>
<link rel="icon" href="data:," />
<!-- Employee receipt requests. Each person's private link (#k=...) calls the rr_* functions as anon; the database finds the person
     from the key's sha256 and shows only their lines. With no key, this is Gianni's overview, behind the Bank Board's Google sign-in.
     This page holds no data. The anon key below is public; row level security and the rr_* functions are the only gate. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --line:#e3e2dd; --line2:#c9c8c1; --text:#1c1d1f; --muted:#62645f;
    --accent:#2f6f4f; --on-accent:#fff; --ok-bg:#e4f1e8; --ok:#22603f; --warn-bg:#fbf0d9; --warn:#7a5208; --no-bg:#ececE8; --no:#4d4f4a; --bad:#a32d2d;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181d; --card:#1f2228; --line:#30343c; --line2:#454a54; --text:#eceef1; --muted:#a2a7b1;
      --accent:#5fbf8f; --on-accent:#0f2419; --ok-bg:#1d3a2b; --ok:#8fd6ae; --warn-bg:#3d3015; --warn:#eec877; --no-bg:#2c2f36; --no:#c3c6cc; --bad:#f09595; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
  main.wide{max-width:980px}
  h1{font-size:24px;font-weight:600;margin:0 0 4px}
  h2{font-size:14px;font-weight:600;color:var(--muted);margin:24px 0 8px}
  p{margin:0}
  .sub{color:var(--muted);margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:17px}
  .top span:last-child{white-space:nowrap}
  .meta{color:var(--muted);font-size:14px;margin-top:2px}
  .ask{font-size:14px;margin-top:8px}
  .flag{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
  .row{display:flex;gap:8px;margin-top:12px}
  .row.wrap{flex-wrap:wrap}
  button{font:inherit;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--text);min-height:44px;padding:0 14px;cursor:pointer}
  button.grow{flex:1}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  button.link{border:0;min-height:36px;padding:0 4px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  button:disabled{opacity:.55;cursor:default}
  .links{display:flex;justify-content:flex-end;gap:14px;margin-top:6px}
  .chip{display:inline-flex;align-items:center;font-size:14px;font-weight:600;padding:5px 10px;border-radius:8px;margin-top:10px}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.no{background:var(--no-bg);color:var(--no)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .files{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
  .note{font-size:14px;margin-top:8px;color:var(--muted);overflow-wrap:anywhere}
  label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
  label[hidden]{display:none}
  textarea,select,input[type=text]{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px}
  textarea{min-height:64px;resize:vertical}
  select{min-height:44px}
  .busy{font-size:14px;color:var(--muted);margin-top:12px}
  .done{text-align:center;padding:32px 16px;color:var(--muted)}
  .done b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
  #toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:15px;display:none;z-index:5}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.n,th.n{text-align:right}
  tr.pick{cursor:pointer}
  tr.on td{background:var(--ok-bg)}
  .scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  td select{min-height:34px;padding:4px 6px;font-size:14px;margin:0;width:auto;max-width:130px}
  td button.link{display:block;min-height:0;padding:2px 0;font-size:13px;white-space:nowrap}
  a{color:var(--accent)}
  .foot{color:var(--muted);font-size:13px;margin-top:20px;text-align:center}
  .qcard{border-color:var(--accent)}
  .qtag{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .qask{font-size:15px;font-weight:600;margin-top:10px}
  .said{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);overflow-wrap:anywhere}
  td input[type=text]{min-height:34px;padding:4px 6px;font-size:14px;margin:0;width:120px}
  /* a file opened from the status page shows over it; Back or Close returns to the same spot */
  .viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
  .vbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--card);border-bottom:1px solid var(--line)}
  .vname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--muted)}
  .vbar a{font-size:14px;white-space:nowrap}
  .vbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .vbody img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:6px;background:#fff}
  .vbody iframe{display:block;width:100%;height:100%;min-height:70vh;border:0;border-radius:6px;background:#fff}
  body.viewing{overflow:hidden}
  .claude{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--accent);overflow-wrap:anywhere}
  /* the overview's status page (Gianni only) */
  .sum{font-size:15px;color:var(--muted);margin:2px 0 14px}
  .sum b{color:var(--text);font-weight:600}
  .views{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
  .vbtn{min-height:38px;padding:0 13px;font-size:14px;font-weight:500;border-radius:999px}
  .vbtn.on{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:2px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12px;line-height:20px;text-align:center}
  button.tap{display:block;width:100%;min-height:0;padding:0;border:0;border-radius:6px;background:none;text-align:left;font-size:inherit;font-weight:inherit;color:inherit}
  button.tap .meta{display:block}
  button.tap:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  button.tap.in{display:inline;width:auto;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:14px}
  .ln{border-top:1px solid var(--line);padding:12px 14px}
  .row.mid{align-items:center;margin-top:8px}
  .row.mid .chip,.rhead .chip{margin-top:0}
  .rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .meta button.link{display:inline;min-height:0;padding:0;font-size:14px}
  .hist{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);font-size:14px}
  .hist .said{background:var(--card)}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{position:relative;margin-left:5px;padding:0 0 10px 16px;border-left:2px solid var(--line2);overflow-wrap:anywhere}
  .tl li:last-child{padding-bottom:0;border-left-color:transparent}
  .tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--line2)}
  .when{display:block;font-size:12px;color:var(--muted)}
  .hsub{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 2px}
  .hfile{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:4px;overflow-wrap:anywhere}
  .hfile .chip{margin-top:0;padding:2px 8px;font-size:12px}
  .hfile button.link{min-height:30px}
  tr.hrow td{background:var(--card);padding:0 8px 8px}
  tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--line2)}
  input.search{margin:10px 0 0}
  #al-body td:first-child{white-space:nowrap}
  details.fold{margin-top:18px}
  details.fold summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:8px 0;min-height:36px}
  .sum2{font-size:14px;color:var(--muted);margin:-10px 0 14px}
  /* Still need: one row per person, folded; a tap opens their charges */
  .card.grp{padding:0;margin-bottom:8px}
  button.phead{padding:12px 14px;border-radius:12px}
  button.phead .pname::before{content:"\25B8";display:inline-block;width:12px;margin-right:4px;text-align:center;color:var(--muted);transition:transform .15s}
  button.phead[aria-expanded="true"] .pname::before{transform:rotate(90deg)}
  button.phead .meta{padding-left:16px}
  .subrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
  .subrow .sub{margin-bottom:0}
  .subrow button.link{min-height:36px}
  td button.link{min-height:32px}
  @media (max-width:640px){
    th,td{padding:6px 5px}
    th{white-space:normal;vertical-align:bottom}
    .hide-sm{display:none}
    /* All lines: each charge stacks into a small block instead of a wide row */
    #al-tbl thead{display:none}
    #al-tbl,#al-tbl tbody{display:block}
    #al-body tr[data-item]{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:10px 12px;border-bottom:1px solid var(--line)}
    #al-body tr[data-item] td{display:block;border:0;padding:0}
    #al-body tr[data-item] td:nth-child(2){order:1;flex:1 1 55%;font-weight:600;min-width:0}
    #al-body tr[data-item] td:nth-child(3){order:2;margin-left:auto;font-weight:600}
    #al-body tr[data-item]::after{content:"";order:3;flex-basis:100%;height:0}
    #al-body tr[data-item] td:nth-child(1){order:4;font-size:13px;color:var(--muted)}
    #al-body tr[data-item] td:nth-child(4){order:5;font-size:13px;color:var(--muted)}
    #al-body tr[data-item] td:nth-child(4):not(:empty)::before{content:"\00B7  card: ";white-space:pre;margin-left:-3px}
    #al-body tr[data-item] td:nth-child(6){order:6;flex-basis:100%;font-size:13px}
    #al-body tr[data-item] td:nth-child(6) button.link{display:inline-block;margin-left:10px;vertical-align:middle}
    #al-body tr[data-item] td:nth-child(5){order:7;flex-basis:100%;font-size:13px;color:var(--muted)}
    #al-body tr[data-item] td:nth-child(5)::before{content:"Asked: "}
    #al-body tr[data-item] td:nth-child(5) input{display:inline-block;vertical-align:middle;margin-left:2px}
    #al-body tr[data-item] td:nth-child(7){order:8;flex-basis:100%;font-size:13px;color:var(--muted)}
    #al-body tr[data-item] td:nth-child(7):empty{display:none}
    #al-body tr.hrow{display:block}
    #al-body tr.hrow td{display:block;padding:0 12px 10px}
    #al-body tr td[colspan]{display:block}
    #al-body button.tap.in{font-size:15px;text-align:left}
  }
</style>
</head>
<body>
<main id="app"><p class="sub">Loading...</p></main>
<div id="toast" role="status"></div>
<input id="picker" type="file" accept="image/*,application/pdf" multiple hidden />
<script>
const SUPA={url:'https://bvazrztbrisleezfbucq.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2YXpyenRicmlzbGVlemZidWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NzY4NjcsImV4cCI6MjEwMTI1Mjg2N30.Ys-SXNH2C_oIG7B18j7fhoyKcbe7VB-u7nhxh8YfHuY'};
const SOMEONE='__someone', IDK='__idk', noteLabel=to=>to===SOMEONE||to===IDK?'Note (optional). Gianni and whoever takes this will see it.':'Note for them (optional)';
const BUCKET='receipt-requests', MAX=10*1024*1024, GOOGLE_CLIENT_ID='168134930971-2au6foq8njul8tjja6a2v306mt10r45i.apps.googleusercontent.com';
const TYPES={'application/pdf':'pdf','image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/heic':'heic','image/heif':'heif','image/webp':'webp'};
const EXTS={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp'};
const app=document.getElementById('app'), toastEl=document.getElementById('toast'), picker=document.getElementById('picker');
const key=new URLSearchParams(location.hash.slice(1)).get('k');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=c=>'$'+(Number(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const day=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
let toastT; function toast(m){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.style.display='none';},5000);}
const plain=e=>{const m=String(e?.message||e||'');return /fetch|network|load failed/i.test(m)?'No connection. Try again.':m||'Something went wrong. Try again.';};
// Pick lists are typable boxes, never plain selects (Gianni's rule for everything built for him): the exact entry in any case,
// else the one entry that contains what was typed; anything else is refused and the last good choice stays. A suggestion picked
// from the list is used at once; typed text waits for Enter or leaving the box.
function pickFrom(list,text,labelsOf){const t=String(text||'').trim().toLowerCase();if(!t)return null;const ls=x=>labelsOf(x).filter(Boolean).map(v=>String(v).toLowerCase());
  const exact=list.filter(x=>ls(x).includes(t));if(exact.length===1)return exact[0];const part=list.filter(x=>ls(x).some(v=>v.includes(t)));return part.length===1?part[0]:null;}
const picked=e=>e.inputType===undefined||e.inputType==='insertReplacementText';

// ── a person's list ─────────────────────────────────────────────────────────
let sb, data, hash, panel=null, busy=null, pickFor=null, asks=[];
const drafts={}, editing={};   // questions from Gianni: what is typed in each answer box, and which answered ones are open to change
async function sha256hex(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
async function rpc(fn,args){const {data:d,error}=await sb.rpc(fn,{p_key:key,...args});if(error)throw error;return d;}
async function startPerson(){
  sb=supabase.createClient(SUPA.url,SUPA.anon,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  hash=await sha256hex(key);
  try{data=await rpc('rr_my_list');try{asks=await rpc('rr_my_asks')||[];}catch(e){asks=[];}render();}
  catch(e){const m=plain(e);app.innerHTML=`<h1>Receipts</h1><p class="sub">${esc(/not active/.test(m)?"This link isn't active. Ask Gianni for a new one.":m)}</p>`;}
}
const isTodo=l=>l.status==='open';
function lineHtml(l){
  const whose=l.cardholder&&l.cardholder.split(' ')[0]!==data.name?` · ${esc(l.cardholder.split(' ')[0])}'s card`:'';
  let body='';
  if(busy?.id===l.id) body=`<p class="busy">${esc(busy.text)}</p>`;
  else if(panel?.id===l.id&&panel.kind==='cant') body=`<label>Anything that would help? (optional)<textarea id="pnote" maxlength="500">${esc(panel.note??l.note)}</textarea></label>
    <div class="row"><button class="grow primary" data-do="cant-yes" data-id="${l.id}">Mark can't locate</button><button data-do="close">Cancel</button></div>`;
  else if(panel?.id===l.id&&panel.kind==='mine'){const holder=data.people.find(p=>p.name===(l.cardholder||'').split(' ')[0]);if(panel.to===undefined)panel.to=holder?.email??'';const to=panel.to;
    body=`<label>Who has this one?<input type="text" id="pto" list="pto-list" autocomplete="off" placeholder="Type a name" value="${esc(panel.toText??mineLabel(to))}" /></label>
    <datalist id="pto-list">${mineChoices().map(c=>`<option value="${esc(c.label)}"></option>`).join('')}</datalist>
    <label id="pwhobox"${to===SOMEONE?'':' hidden'}>Who is it?<input type="text" id="pwho" maxlength="80" autocomplete="off" value="${esc(panel.who)}" /></label>
    <label><span id="pnotelabel">${noteLabel(to)}</span><textarea id="pnote" maxlength="500">${esc(panel.note)}</textarea></label>
    <div class="row"><button class="grow primary" data-do="mine-yes" data-id="${l.id}">Move it</button><button data-do="close">Cancel</button></div>`;}
  else if(panel?.id===l.id&&panel.kind==='note') body=`<label>Your note<textarea id="pnote" maxlength="500">${esc(panel.note??l.note)}</textarea></label>
    <div class="row"><button class="grow primary" data-do="note-yes" data-id="${l.id}">Save note</button><button data-do="close">Cancel</button></div>`;
  else if(l.status==='open') body=`<div class="row"><button class="grow primary" data-do="add" data-id="${l.id}">Add receipt</button><button class="grow" data-do="cant" data-id="${l.id}">Can't locate</button></div>
    <div class="links"><button class="link" data-do="note" data-id="${l.id}">Add a note</button><button class="link" data-do="mine" data-id="${l.id}">Not mine</button></div>`;
  else if(l.status==='cant_locate') body=`<span class="chip no">Can't locate</span><div class="links"><button class="link" data-do="undo" data-id="${l.id}">Undo</button><button class="link" data-do="add" data-id="${l.id}">Found it, add receipt</button></div>`;
  else if(l.status==='no_receipt') body=`<span class="chip ok">No receipt needed</span>`;   // Gianni booked it without one: nothing left to do
  else body=`<span class="chip ok">Receipt added</span>${l.files.length?`<p class="files">${l.files.map(f=>esc(f.name||'File')).join(', ')}</p>`:''}
    <div class="links">${l.status==='uploaded'?`<button class="link" data-do="undo" data-id="${l.id}">Undo</button>`:''}<button class="link" data-do="add" data-id="${l.id}">Add another page</button><button class="link" data-do="note" data-id="${l.id}">${l.note?'Edit note':'Add a note'}</button></div>`;
  const showNote=l.note&&(panel?.id!==l.id||panel.kind==='mine');
  return `<section class="card"><div class="top"><span>${esc(l.merchant)}</span><span>${money(l.amount_cents)}</span></div>
    <p class="meta">${day(l.date)} · ${esc(l.account||'')}${whose}</p>
    ${l.prompt&&l.status==='open'?`<p class="ask">${esc(l.prompt)}</p>`:''}
    ${l.flag?`<p class="flag">Needs another try: ${esc(l.flag)}</p>`:''}
    ${showNote?`<p class="note">Note: ${esc(l.note)}</p>`:''}${asks.some(a=>a.line_id===l.id&&askTodo(a))?'<p class="note">Gianni also asked what this was for (see his question above).</p>':''}${body}</section>`;
}
// ── questions from Gianni (what a charge was for) ──
const askTodo=a=>a.status==='open'||editing[a.id];
const askLive=a=>['open','answered','unsure','relaying'].includes(a.status);
function askHtml(a){
  const whose=a.cardholder&&a.cardholder!==data.name?` · ${esc(a.cardholder)}'s card`:'';
  const title=`${esc(a.merchant)}${a.more_rows>0?` and ${a.more_rows} more`:''}`;
  const meta=[a.date?day(a.date):'',esc(a.account||'')].filter(Boolean).join(' · ')+whose;
  let body='';
  if(busy?.id===a.id) body=`<p class="busy">${esc(busy.text)}</p>`;
  else if(panel?.id===a.id&&panel.kind==='aidk') body=`<label>Who might know? (optional)<input type="text" id="awho" list="awho-list" autocomplete="off" placeholder="Type a name" value="${esc(panel.whoText??panel.who??'')}" /></label>
    <datalist id="awho-list">${data.people.map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist>
    <label>Anything that would help? (optional)<textarea id="anote" maxlength="500">${esc(panel.note??'')}</textarea></label>

// Phone photos over 2 MB shrink here, as the board does. PDFs pass through untouched.
async function shrink(file,type){
  if(!/^image\//.test(type)||file.size<=2*1024*1024)return {file,type};
  try{
    const img=await createImageBitmap(file), scale=Math.min(1,2200/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    return blob&&blob.size<file.size?{file:blob,type:'image/jpeg'}:{file,type};
  }catch(e){return {file,type};}
}

const LABEL={open:'Waiting',uploaded:'Being checked',cant_locate:"Can't locate",attached:'On the bank row',no_receipt:'Booking without a receipt',closed:'Closed'};
const GIANNI='gianni@wizardtrees.com', passedOn=l=>l.status==='open'&&l.assignee_email===GIANNI&&l.cardholder!=='Gianni Lane';
const T=s=>{const t=Date.parse(s||'');return Number.isFinite(t)?t:0;};
const push=(m,k,v)=>{const a=m.get(k);if(a)a.push(v);else m.set(k,[v]);};
const when=s=>{const d=new Date(s);return s&&!isNaN(d)?d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';};
const dayOf=s=>{const d=new Date(s);return s&&!isNaN(d)?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';};
const daysAgo=t=>Math.max(0,Math.floor((Date.now()-t)/864e5));

function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}   // Monday
function index({people,lines,files,events,asks}){
  const first=new Map(people.map(p=>[p.email,p.first_name])), person=new Map(people.map(p=>[p.email,p])), line=new Map(lines.map(l=>[l.id,l]));
  const ev=new Map(), fl=new Map(), ak=new Map(), weekly=[], byRow=new Map(lines.map(l=>[l.account_id+'|'+l.txn_id,l]));
  for(const e of [...events].sort((a,b)=>T(a.at)-T(b.at)||a.id-b.id)){if(e.request_id)push(ev,e.request_id,e);else if(e.action==='weekly_email')weekly.push(e);}
  // an 'emailed' event dated after its line was closed, booked or attached is not a send that listed it: left out
  for(const [id,es] of ev){if(!line.has(id))continue;const end=es.find(e=>DONE.includes(e.action));
    if(end&&es.some(e=>e.action==='emailed'&&T(e.at)>T(end.at)))ev.set(id,es.filter(e=>e.action!=='emailed'||T(e.at)<=T(end.at)));}
  for(const f of files)push(fl,f.request_id,f);
  const lineOf=a=>a&&a.account_id?byRow.get(a.account_id+'|'+a.txn_id)||null:null;
  for(const a of asks){const l=lineOf(a);if(l)push(ak,l.id,a);}

function replay(l){
  const evs=ix.ev.get(l.id)||[], moves=evs.filter(e=>e.action==='handed_off'||e.action==='assigned');
  let to=moves.length?(moves[0].action==='handed_off'?moves[0].actor:null):l.assignee_email, status='open';
  const out=[{t:T(l.created_at),status,to}];
  for(const e of evs){const d=e.detail||{};
    if(e.action==='handed_off'||e.action==='assigned')to=d.to||to;
    else if(e.action==='uploaded'){if(status!=='attached')status='uploaded';}
    else if(e.action==='undo'||(e.action==='rejected'&&status==='uploaded'))status='open';
    else if(['cant_locate','attached','closed','no_receipt'].includes(e.action))status=e.action;

    out.push({t:T(e.at),status,to});}

}

function mailInfo(l){
  if(ix.mail.has(l.id))return ix.mail.get(l.id);
  const sent=(ix.ev.get(l.id)||[]).filter(e=>e.action==='emailed'), reminders=[];
  if(sent.length){const tl=replay(l);
    for(const w of ix.weekly){const to=w.detail&&w.detail.to, t=T(w.at);if(!to)continue;
      const firstTo=sent.find(e=>e.detail&&e.detail.to===to);if(!firstTo||t<=T(firstTo.at)+60e3)continue;
      if(sent.some(e=>e.detail&&e.detail.to===to&&Math.abs(T(e.at)-t)<=60e3))continue;   // the send that listed it as new
      const s=stateAt(tl,t);if(s.status==='open'&&s.to===to)reminders.push(w);}}
  const m={sent,reminders,first:sent[0]||null};ix.mail.set(l.id,m);return m;
}

  const body=document.getElementById('al-body');if(!body)return;
  const words=search.toLowerCase().split(/\s+/).filter(Boolean);
  const hay=l=>[l.merchant,ix.first.get(l.assignee_email),l.assignee_email===GIANNI?'you':'',l.cardholder,l.account_label,money(l.amount_cents),(Number(l.amount_cents)/100).toFixed(2),LABEL[l.status]||l.status,l.note,day(l.txn_date),l.txn_date].join(' ').toLowerCase();
  const list=all.lines.filter(l=>(who?l.assignee_email===who:true)&&l.status!=='closed'&&(!words.length||words.every(w=>hay(l).includes(w))))
    .sort((a,b)=>a.assignee_email.localeCompare(b.assignee_email)||a.txn_date.localeCompare(b.txn_date));
  document.getElementById('al-count').textContent=`${who?`${ix.first.get(who)||firstOf(who)}'s lines`:'All lines'} (${list.length})`;
  body.innerHTML=list.map(l=>{const k='l:'+l.id;
    return `<tr data-item="${esc(k)}"><td>${day(l.txn_date)}</td><td><button type="button" class="tap in" data-hist="${esc(l.id)}" data-k="${esc(k)}" aria-expanded="${openHist.has(k)}">${esc(l.merchant)}</button></td><td class="n">${money(l.amount_cents)}</td><td>${esc(holderOf(l))}</td><td>${['open','cant_locate'].includes(l.status)?`<input type="text" data-move="${l.id}" list="dl-people" autocomplete="off" aria-label="Asked" value="${esc(ix.first.get(l.assignee_email)||'')}" />`:esc(ix.first.get(l.assignee_email)||'')}</td><td>${esc(LABEL[l.status]||l.status)}${['open','cant_locate'].includes(l.status)?`<button class="link" data-nr="${esc(l.id)}">Book without receipt</button>`:''}</td><td>${esc(l.note||'')}</td></tr>${openHist.has(k)?`<tr class="hrow"><td colspan="7">${histHtml(l)}</td></tr>`:''}`;}).join('')
    ||'<tr><td colspan="7" class="meta">Nothing matches.</td></tr>';
}
function renderOverview(){
  // The first line counts charges and adds up to every charge asked about; the second counts files and answers.
  const {lines,files,asks}=all, n=f=>lines.filter(f).length;
  const need=lines.filter(l=>l.status==='open'), cents=need.reduce((s,l)=>s+Number(l.amount_cents),0), wk=files.filter(f=>T(f.uploaded_at)>=weekStart()).length;
  const answers=asks.filter(a=>a.answered_at&&['answered','unsure','relaying','relayed'].includes(a.status)).length;
  const lookN=files.filter(f=>f.state==='review'&&ix.line.get(f.request_id)).length+n(l=>l.status==='cant_locate'||passedOn(l));
  const b=x=>`<b>${x}</b>`;
  const sum=`${lines.length} ${lines.length===1?'charge':'charges'} asked about: still need ${b(need.length)} (${money(cents)}) · being checked ${b(n(l=>l.status==='uploaded'))} · can't locate ${b(n(l=>l.status==='cant_locate'))} · done ${b(n(l=>DONE.includes(l.status)))}`;
  const sum2=[`${files.length} ${files.length===1?'file':'files'} uploaded, ${wk} this week`,all.asks.length?`${answers} ${answers===1?'answer':'answers'} to your questions`:''].filter(Boolean).join(' · ');
  const nav=VIEWS.map(([v,label])=>`<button type="button" class="vbtn${view===v?' on':''}" data-view="${v}" aria-pressed="${view===v}">${label}${v==='look'&&lookN?` <span class="badge">${lookN}</span>`:''}</button>`).join('');
  const body={need:needView,uploaded:uploadedView,responses:responsesView,look:lookView,people:peopleView,lines:linesView}[view]();
  app.innerHTML=`<h1>Receipts</h1><p class="sum">${sum}</p><p class="sum2">${sum2}</p><nav class="views" aria-label="Views">${nav}</nav><div id="vbody">${body}</div>`;
  if(view==='lines')fillLines();
}
function setView(v){view=v;try{history.replaceState(null,'',`${location.pathname}${location.search}#v=${v}`);}catch(e){}renderOverview();window.scrollTo(0,0);}
// A tap on a charge opens or closes its history right under it (in a table, as the next row).
function toggleHist(btn){
  const k=btn.dataset.k, host=btn.closest('[data-item]');if(!host||!k)return;
  const inRow=host.tagName==='TR', shown=inRow?(host.nextElementSibling&&host.nextElementSibling.classList.contains('hrow')?host.nextElementSibling:null):host.querySelector(':scope > .hist');
  if(shown){shown.remove();openHist.delete(k);btn.setAttribute('aria-expanded','false');return;}
  const id=btn.dataset.hist, a=id.startsWith('ask:')?all.asks.find(x=>x.id===id.slice(4)):null, l=a?null:ix.line.get(id);
  if(!l&&!a)return;
  const html=histHtml(l,a);
  if(inRow)host.insertAdjacentHTML('afterend',`<tr class="hrow"><td colspan="${host.children.length}">${html}</td></tr>`);else host.insertAdjacentHTML('beforeend',html);
  openHist.add(k);btn.setAttribute('aria-expanded','true');
}
// A file is signed only when tapped, for 2 minutes, and shown over the page (Gianni 11/17: opening it took him off the page and
// Back didn't bring him back, signed in, to where he was). Back or Close closes it (Esc too, unless a PDF has the keyboard); the
// page underneath never moves and can't be reached while it is open (inert). "New tab" signs the file again when tapped, for a
// PDF a phone shows only the first page of, or a photo this browser can't show.
let viewer=null;
async function signFile(f){try{const {data:u,error}=await sb.storage.from(BUCKET).createSignedUrl(f.storage_path,SIGN_SECONDS);return !error&&u?u.signedUrl:null;}catch(e){return null;}}
async function openFile(b){
  const f=all.files.find(x=>x.id===b.dataset.open);if(!f||b.disabled)return;
  b.disabled=true;const url=await signFile(f);b.disabled=false;
  if(!url){toast("That file couldn't be opened. Try again.");return;}
  showFile(f,url,b);
}
function showFile(f,url,from){
  const name=f.file_name||'File', type=String(f.mime||'').toLowerCase();
  const isImg=/^image\//.test(type)||(!type&&/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(name));
  const el=document.createElement('div');el.className='viewer';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',name);
  el.innerHTML=`<div class="vbar"><button type="button" data-vclose>Close</button><span class="vname">${esc(name)}</span><button type="button" class="link" data-vnew>New tab</button></div><div class="vbody">${isImg?`<img alt="${esc(name)}" src="${esc(url)}">`:`<iframe title="${esc(name)}" src="${esc(url)}"></iframe>`}</div>`;
  el.addEventListener('click',e=>{if(e.target.closest('[data-vclose]'))closeFile();else if(e.target.closest('[data-vnew]'))newTab(f,e.target.closest('[data-vnew]'));});
  const img=el.querySelector('img');if(img)img.addEventListener('error',()=>{const p=document.createElement('p');p.className='note';p.textContent="This browser can't show this photo. Tap New tab to download it.";img.replaceWith(p);});
  if(viewer)viewer.el.remove();   // one at a time: the Back step already there stays
  else if(!(history.state&&history.state.rrFile)){try{history.pushState({rrFile:1},'',location.href);}catch(e){}}
  viewer={el,from:viewer?viewer.from:from};document.body.appendChild(el);document.body.classList.add('viewing');app.inert=true;
  el.querySelector('[data-vclose]').focus({preventScroll:true});
}
// The tab opens inside the tap (a phone's popup blocker allows that), then goes to a freshly signed address.
async function newTab(f,b){
  let w=null;try{w=window.open('','_blank');}catch(e){}
  b.disabled=true;const url=await signFile(f);b.disabled=false;
  if(!url){if(w)w.close();toast("That file couldn't be opened. Try again.");return;}
  if(w){try{w.opener=null;}catch(e){}w.location.replace(url);return;}
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Tap to open';b.replaceWith(a);
}
// fromBack: the Back button already left the step showFile added; otherwise step back off it so Back isn't needed twice.
function closeFile(fromBack){
  if(!viewer)return;
  const v=viewer;viewer=null;v.el.remove();document.body.classList.remove('viewing');app.inert=false;
  if(!fromBack&&history.state&&history.state.rrFile){try{history.back();}catch(e){}}
  if(v.from&&document.contains(v.from))v.from.focus({preventScroll:true});
}
window.addEventListener('popstate',()=>{if(viewer)closeFile(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer){e.preventDefault();closeFile();}});
// Gianni decides no receipt is coming. The line leaves the person's list now; the Mac marks the bank row "no receipt needed".
async function bookNoReceipt(b){
  const l=all.lines.find(x=>x.id===b.dataset.nr);if(!l)return;
  const first=l.assignee_email===GIANNI?'':all.people.find(p=>p.email===l.assignee_email)?.first_name||'';
  if(!confirm(`Book ${l.merchant} ${money(l.amount_cents)} without a receipt? ${first?`It stops asking ${first} and marks`:'It comes off the list and marks'} the bank row "no receipt needed" within 15 minutes.`))return;
  const note=prompt('Short note for the record (optional)','');if(note===null)return;
  b.disabled=true;
  const {error}=await sb.rpc('rr_admin_no_receipt',{p_request:l.id,p_note:note.trim()||null});
  if(error){b.disabled=false;toast(/schema cache|does not exist/i.test(error.message||'')?"Book without receipt isn't switched on yet. It needs the 13d database update.":plain(error));}
  else{toast('Booked without a receipt.');loadOverview();}
}
app.addEventListener('click',async e=>{
  if(key)return;
  const vb=e.target.closest('button[data-view]');if(vb){setView(vb.dataset.view);return;}
  const of=e.target.closest('button[data-open]');if(of){openFile(of);return;}
  const hb=e.target.closest('button[data-hist]');if(hb){toggleHist(hb);return;}
  const pb=e.target.closest('button[data-person]');if(pb){const k=pb.dataset.person;if(openPeople.has(k))openPeople.delete(k);else openPeople.add(k);renderOverview();
    [...document.querySelectorAll('button[data-person]')].find(x=>x.dataset.person===k)?.focus({preventScroll:true});return;}
  const pa=e.target.closest('button[data-people-all]');if(pa){openPeople.clear();if(pa.dataset.peopleAll==='open')for(const l of all.lines)if(l.status==='open')openPeople.add('p:'+l.assignee_email);renderOverview();return;}
  if(e.target.closest('[data-who-clear]')){who=null;renderOverview();return;}
  const row=e.target.closest('tr[data-who]');if(row){who=row.dataset.who;setView('lines');return;}
  const nr=e.target.closest('button[data-nr]');if(nr){bookNoReceipt(nr);return;}
  const ok=e.target.closest('[data-ok]'), no=e.target.closest('[data-no]');
  if(!ok&&!no)return;
  const reason=no?(prompt('What should they send instead? They will see this on their page and get it by email.')||'').trim():null;
  if(no&&!reason)return;
  const {error}=await sb.rpc('rr_admin_review',{p_file:(ok||no).dataset[ok?'ok':'no'],p_ok:!!ok,p_reason:reason});
  if(error)toast(plain(error));else loadOverview();
});
// The Asked column: a typable name box. A pick from the suggestions moves the line at once; typed text on Enter or leaving the box.
async function moveLine(box){
  const l=all.lines.find(x=>x.id===box.dataset.move);if(!l||box.dataset.busy)return;
  const now=all.people.find(p=>p.email===l.assignee_email), typed=box.value.trim();
  if(now&&typed===now.first_name)return;
  const p=pickFrom(all.people.filter(x=>x.active),typed,x=>[x.first_name,x.email]);
  if(!p){if(typed)toast('Pick someone from the list.');box.value=now?.first_name||'';return;}
  if(p.email===l.assignee_email){box.value=p.first_name;return;}
  box.dataset.busy='1';box.value=p.first_name;
  const {error}=await sb.rpc('rr_admin_assign',{p_request:l.id,p_to:p.email});
  delete box.dataset.busy;
  if(error){toast(plain(error));box.value=now?.first_name||'';}else{l.assignee_email=p.email;ix.mail.clear();toast(`Moved to ${p.first_name}.`);renderOverview();}
}
app.addEventListener('change',e=>{const b=e.target.closest('input[data-move]');if(b&&!key)moveLine(b);});
app.addEventListener('toggle',e=>{const d=e.target;if(key||!d.dataset||!d.dataset.fold)return;if(d.open)openFolds.add(d.dataset.fold);else openFolds.delete(d.dataset.fold);},true);   // toggle does not bubble
app.addEventListener('input',e=>{
  if(key)return;
  if(e.target.id==='al-q'){search=e.target.value;fillLines();return;}   // the search box redraws only the table, so typing keeps going
  const b=e.target.closest('input[data-move]');if(b&&picked(e))moveLine(b);
});
app.addEventListener('keydown',e=>{const b=e.target.closest('input[data-move]');if(b&&!key&&e.key==='Enter'){e.preventDefault();moveLine(b);}});
(key?startPerson():startOverview()).catch(e=>{app.innerHTML=`<h1>Receipts</h1><p class="sub">${esc(plain(e))}</p>`;});
</script>
