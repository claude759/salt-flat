<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wizard Trees Financials</title>
<!--
  Wizard Trees financials board: monthly P&L, EBITDA, balance sheets, intercompany eliminations and an
  EBITDA-multiple valuation for the 7 companies. Static page: the data comes from Supabase through the
  key-scoped fin_read RPC (supabase/financials.sql). A Mac-side producer (~/ar-automation/lib/
  financials-feed.mjs) rewrites the snapshot from QuickBooks. The key in #key=... is the only way in;
  the server checks it. Nothing secret lives here: the Supabase anon key is public and gated by RLS + RPC.
-->
<style>
:root{color-scheme:light;
  --surface:#fcfcfb;--panel:#ffffff;--line:#e5e4e0;--text:#0b0b0b;--text2:#52514e;--muted:#8a8880;
  --pos:#1baf7a;--neg:#eb6834;--warn:#d29c26;--accent:#2a78d6;--grid:#eeede9;--soft:#f4f3ef;
  --s1:#2a78d6;--s2:#eb6834;--blue:#e2edfd;--blueline:#4a90e8}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){color-scheme:dark;
  --surface:#1a1a19;--panel:#222221;--line:#3a3936;--text:#fff;--text2:#c3c2b7;--muted:#8a8880;
  --pos:#2cbd80;--neg:#ee7a4a;--warn:#f0b53a;--accent:#4d9bf5;--grid:#2c2b29;--soft:#2a2a28;
  --s1:#3987e5;--s2:#d95926;--blue:#152a47;--blueline:#4189e0}}
:root[data-theme=dark]{color-scheme:dark;
  --surface:#1a1a19;--panel:#222221;--line:#3a3936;--text:#fff;--text2:#c3c2b7;--muted:#8a8880;
  --pos:#2cbd80;--neg:#ee7a4a;--warn:#f0b53a;--accent:#4d9bf5;--grid:#2c2b29;--soft:#2a2a28;
  --s1:#3987e5;--s2:#d95926;--blue:#152a47;--blueline:#4189e0}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;padding:22px 24px 70px}
@media (max-width:640px){body{padding:14px 16px 60px}}
.wrap{max-width:1500px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:15px;margin:30px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .n{font-size:12px;color:var(--muted);font-weight:400}
.sub{color:var(--text2);margin:0 0 14px;font-size:13px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
button{cursor:pointer}button:hover{border-color:var(--muted)}
button.small{font-size:12px;padding:3px 9px}
button.link{border:0;background:none;color:var(--accent);padding:0;font-size:12px}
input.mult{width:62px;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;border-radius:0;padding:4px 11px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--text);color:var(--surface)}
.chip{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--text2);white-space:nowrap;vertical-align:middle}
.chip.live{color:var(--pos);border-color:var(--pos)}.chip.off{color:var(--neg);border-color:var(--neg)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.tag{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:0 7px;background:var(--soft);border:1px solid var(--line);color:var(--text2);white-space:nowrap;vertical-align:middle;margin-left:6px}
.tag.ab{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.ctrl{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;font-size:13px;color:var(--text2)}
.ctrl label{display:inline-flex;gap:6px;align-items:center}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0 6px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.hero.big{border:2px solid var(--blueline);background:var(--blue)}
.hero .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .val{font-size:23px;font-weight:650;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero .val.neg{color:var(--neg)}
.hero .note{font-size:12px;color:var(--text2);margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
td.l,th.l{text-align:left}
thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:650}
tr.key td{font-weight:650;background:var(--soft)}
tr.key td:first-child{background:var(--soft)}
tr.dim td{color:var(--text2)}
tr.acct td{font-size:12px;color:var(--text2)}
tr.acct td:first-child{padding-left:22px;white-space:normal;min-width:240px}
tr.sec td{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:600}
tr.sec td:first-child{background:var(--soft)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td .neg,span.neg{color:var(--neg)}
.m{color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text2);margin:2px 0 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px color-mix(in srgb,#000 18%,transparent);white-space:nowrap;display:none;z-index:5}
.tip b{font-variant-numeric:tabular-nums}
.notes{font-size:13px;color:var(--text2);line-height:1.6}
.notes li{margin:3px 0}
.foot{margin-top:30px;font-size:12px;color:var(--muted);line-height:1.7}
.gate{max-width:520px;margin:60px auto;text-align:center}.gate p{color:var(--text2)}
.hidden{display:none !important}
@media print{body{background:#fff;color:#000;padding:0}.chip,button,.noprint,.seg,.ctrl{display:none !important}.tbl{overflow:visible}table{font-size:10px}th,td{padding:3px 5px}}
</style></head><body><div class="wrap" id="app"><div class="gate"><h1>Wizard Trees Financials</h1><p>Loading</p></div></div>
<script>
'use strict';
const SB_URL='https://dhiqhgtmelxwelyoowle.supabase.co';
const SB_KEY='sb_publishable_FtScmtn1C0tE1bwUsavJFg_koiVEu14';
const SB_H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const POLL_MS=15*60*1000, STALE_H=30;

/* ── key gate: the key stays in the address bar so the same link keeps working; also kept in localStorage ── */
let viewKey='';
(function(){
  const m=location.hash.match(/key=([\w-]+)/);
  if(m){ viewKey=m[1]; try{ localStorage.setItem('finKey',m[1]); }catch(e){} return; }
  try{ viewKey=localStorage.getItem('finKey')||''; }catch(e){}
})();

/* ── state ── */
let raw=null, data=null, rev=-1, online=false, scope='', cacheKey='';
const ls=(k,d)=>{ try{ const v=localStorage.getItem('fin_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const save=(k,v)=>{ try{ localStorage.setItem('fin_'+k,JSON.stringify(v)); }catch(e){} };
const S={ basis:['ttm','h','custom'].includes(ls('basis','ttm'))?ls('basis','ttm'):'ttm', from:ls('from',null), to:ls('to',null), mult:ls('mult',null), shareholder:ls('shareholder',true), cards:ls('cards',false),
  plCo:ls('plCo','__cons'), plAccts:false, bsCo:ls('bsCo','__cons'), bsAccts:false, openPairs:new Set(), excluded:ls('excluded',[]) };

/* ── helpers ── */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=()=>data.meta.month_keys.length;
const z=()=>Array(N()).fill(0);
const addA=(a,b)=>a.map((v,i)=>v+(b[i]||0));
const subA=(a,b)=>a.map((v,i)=>v-(b[i]||0));
const sumI=(a,idx)=>idx.reduce((s,i)=>s+(a[i]||0),0);
const whole=n=>{ const v=Math.round(Number(n)||0); return v<0?`<span class="neg">−${Math.abs(v).toLocaleString('en-US')}</span>`:v.toLocaleString('en-US'); };
const plain=n=>Math.round(Number(n)||0);
const big=n=>{ const v=Number(n)||0, a=Math.abs(v), s=v<0?'−':''; return a>=1e6?`${s}$${(a/1e6).toFixed(2)}M`:a>=1e3?`${s}$${Math.round(a/1e3).toLocaleString('en-US')}K`:`${s}$${Math.round(a)}`; };
const pct=(a,b)=>b?`${(a/b*100).toFixed(1)}%`:'';
const fmtTs=iso=>iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const shortM=i=>{ const k=data.meta.month_keys[i]; const [y,m]=k.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+" '"+y.slice(2)+(i===data.meta.mtd?'*':''); };
const sha8=async s=>{ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].slice(0,4).map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return 'x'; } };
const ttmIdx=()=>{ const n=N(); return Array.from({length:n-1},(_,i)=>i); };
const lastIdx=k=>{ const n=N(); return Array.from({length:k},(_,i)=>n-1-k+i); };   // last k complete months
// Period for the headline figures and the company table: the last 12 or 6 complete months, or months the viewer picks.
// The valuation always uses a yearly rate: the period's EBITDA x 12 / the number of months in it (the current month counts pro rata).
const PERIODS={ttm:'Last 12 months',h:'Last 6 months',custom:'Pick months'};
const coByName=n=>data.companies.find(c=>c.name===n);

/* ── data ── */
async function rpc(name){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:SB_H,body:JSON.stringify({p_key:viewKey})});
  if(!r.ok){ const t=await r.text(); if(/bad key/i.test(t)){ const e=new Error('bad key'); e.badKey=true; throw e; } throw new Error('http '+r.status); }
  return r.json();
}
function adopt(j){ raw=j.data||null; rev=j.rev; scope=j.scope; derive();
  if(!S.mult&&data&&data.valuation) S.mult={...data.valuation.multiples}; }

/* ── leaving companies out ──
   The snapshot is consolidated over all 7 companies. When a viewer leaves one out (the WizardT switch),
   build() re-consolidates the rest the same way the producer does: add up the remaining companies, then
   remove only the sales between companies that are both still in. Balances with a company that is left
   out stop being intercompany: what the others owe it becomes an outside loan, what it owes them a loan
   to an outside party. */
const ASSET_TAGS=new Set(['cash','ic_receivable','loan_to_outside_party']);
const signOf=a=>a.portion_of||!a.side?1:((a.side==='asset')===ASSET_TAGS.has(a.tag)?1:-1);
function build(src,ex){
  const n=src.meta.month_keys.length, Z=()=>Array(n).fill(0), add=(a,b)=>a.map((v,i)=>v+(b[i]||0)), sub=(a,b)=>a.map((v,i)=>v-(b[i]||0)), inc=x=>!ex.has(x);
  const companies=src.companies.filter(c=>inc(c.name)).map(c=>{
    const buckets={...c.bs.buckets};
    for(const a of c.bs.accounts) if(/^ic_/.test(a.tag||'')&&a.counterparty&&ex.has(a.counterparty)){
      const v=a.vals.map(x=>x*signOf(a)), to=a.tag==='ic_payable'?'debt_third_party':'loan_to_outside_party';
      buckets[a.tag]=sub(buckets[a.tag],v); buckets[to]=add(buckets[to],v); }
    return {...c,bs:{...c.bs,buckets}}; });
  const keys=Object.keys(src.companies[0].lines);
  const sum=Object.fromEntries(keys.map(k=>[k,companies.reduce((t,c)=>add(t,c.lines[k]),Z())]));
  const pairs=src.eliminations.pairs.filter(p=>inc(p.seller)&&inc(p.buyer));
  const icRev=pairs.reduce((t,p)=>add(t,p.revenue),Z()), icRevE=pairs.filter(p=>p.revenue_in_ebitda).reduce((t,p)=>add(t,p.revenue),Z()), icExpE=pairs.reduce((t,p)=>add(t,p.expense_in_ebitda),Z());
  const icExp=sec=>companies.reduce((t,c)=>add(t,c.ic.filter(g=>g.side==='expense'&&g.tag===sec&&inc(g.counterparty)).reduce((u,g)=>add(u,g.monthly),Z())),Z());
  const consolidated={...sum, revenue:sub(sum.revenue,icRev), cogs:sub(sum.cogs,icExp('cogs')), opex:sub(sum.opex,icExp('opex')), other_expense:sub(sum.other_expense,icExp('other_expense')),
    ebitda:add(sub(sum.ebitda,icRevE),icExpE), net_income:add(sub(sum.net_income,icRev),add(add(icExp('cogs'),icExp('opex')),icExp('other_expense')))};
  consolidated.gross_profit=sub(consolidated.revenue,consolidated.cogs);
  const R=src.royalty||{}, ic={}, ext={...(R.external||{})};
  for(const [k,v] of Object.entries(R.intercompany||{})) (inc(k)?ic:ext)[k]=v;
  return {...src, companies, sum_of_companies:sum, consolidated, eliminations:{...src.eliminations,pairs}, royalty:{intercompany:ic,external:ext},
    adjustments:(src.adjustments||[]).filter(a=>inc(a.company)), excluded:[...ex]};
}
function derive(){ if(!raw){ data=null; return; } const ex=new Set(S.excluded.filter(x=>raw.companies.some(c=>c.name===x))); data=ex.size?build(raw,ex):raw; }
const WT='WizardT LLC';
const countLabel=()=>{ const n=data.companies.length, all=raw.companies.length; return n===all?`All ${all} companies`:`${n} of ${all} companies (${(data.excluded||[]).map(x=>esc((raw.companies.find(c=>c.name===x)||{}).short||x)).join(', ')} left out)`; };
async function load(){
  if(!viewKey){ gate('Open this page with the link you were sent.'); return; }
  cacheKey='fin_cache_'+await sha8(viewKey);
  try{ const j=await rpc('fin_read'); online=true; adopt(j); try{ localStorage.setItem(cacheKey,JSON.stringify(j)); }catch(e){} }
  catch(e){
    if(e.badKey){ try{ localStorage.removeItem('finKey'); localStorage.removeItem(cacheKey); }catch(x){} viewKey=''; gate('That link is no longer valid.'); return; }
    online=false; let c=null; try{ c=JSON.parse(localStorage.getItem(cacheKey)||'null'); }catch(x){}
    if(c) adopt(c); else { gate('Could not reach the data service. Try again in a minute.'); return; }
  }
  if(!data||!data.companies){ gate('The first QuickBooks pull has not been saved yet.'); return; }
  render();
}
async function poll(){ if(!viewKey||document.hidden) return; try{ const v=await rpc('fin_rev'); online=true; if(v.rev!==rev) await load(); }catch(e){ online=false; } }
function gate(msg){ $('#app').innerHTML=`<div class="gate"><h1>Wizard Trees Financials</h1><p>${esc(msg)}</p></div>`; }

/* ── model ── */
// Adjusted EBITDA applies the high and medium confidence one-time items; low-confidence items are listed only.
const adjOn=()=>true;
const applies=x=>x.confidence!=='low';
function adjMonthly(co,kind){ const a=z(); for(const x of (data.adjustments||[])){ if(co&&x.company!==co) continue; if(kind&&x.kind!==kind) continue; if(!applies(x)) continue; const i=data.meta.month_keys.indexOf(x.month); if(i>=0) a[i]+=Number(x.amount)||0; } return a; }
function consEbitda(){ const e=data.consolidated.ebitda.slice(); return adjOn()?addA(e,adjMonthly()):e; }
const ebLabel=()=>'Adjusted EBITDA';
// Net debt is read from each company's QuickBooks balance sheet at the latest date.
function netDebtRows(){
  const L=N()-1;
  return data.companies.map(c=>{ const b=c.bs.buckets;
    const cash=b.cash[L]||0, cards=b.credit_card[L]||0, debt=b.debt_third_party[L]||0, sh=b.debt_shareholder[L]||0;
    return {c,cash,cards,debt,sh,nd:debt+(S.shareholder?sh:0)+(S.cards?cards:0)-cash}; });
}
function netDebt(){ const r=netDebtRows(), t=k=>r.reduce((s,x)=>s+x[k],0); return {cash:t('cash'),debt:t('debt'),sh:t('sh'),cards:t('cards'),nd:t('nd'),rows:r}; }
function selIdx(){
  if(S.basis==='h') return lastIdx(6);
  if(S.basis==='custom'){ const K=data.meta.month_keys; let f=K.indexOf(S.from), t=K.indexOf(S.to); if(f<0) f=0; if(t<0) t=K.length-2; if(f>t) [f,t]=[t,f]; return Array.from({length:t-f+1},(_,i)=>f+i); }
  return ttmIdx();
}
const mtdFrac=()=>{ const [y,m,d]=data.meta.as_of.split('-').map(Number); return d/new Date(Date.UTC(y,m,0)).getUTCDate(); };
const monthsIn=idx=>idx.reduce((t,i)=>t+(i===data.meta.mtd?mtdFrac():1),0);
const selLabel=()=>{ const idx=selIdx(), a=data.meta.months[idx[0]].replace(' to date',''), b=data.meta.months[idx[idx.length-1]]; return idx.length===1?b:`${a} to ${b}`; };

/* ── render ── */
function render(){
  const m=data.meta, gen=data.meta.generated_at, ageH=gen?(Date.now()-new Date(gen))/36e5:999;
  const fresh=!online?'<span class="chip off">offline copy</span>':ageH>STALE_H?`<span class="chip warn">last pull ${fmtTs(gen)}</span>`:'<span class="chip live">live</span>';
  $('#app').innerHTML=`
  <div class="topbar"><div><h1>Wizard Trees Financials</h1>
    <p class="sub">${countLabel()} from QuickBooks, ${esc(m.basis.toLowerCase())} basis, ${esc(m.months[0])} to ${esc(m.as_of)}. Updated ${esc(fmtTs(gen))}.</p></div>
    <div class="actions noprint">${fresh}<button class="small" id="refresh">Refresh</button><button class="small" onclick="print()">Print</button></div></div>
  <div id="val"></div>
  <h2>Monthly revenue and EBITDA <span class="n">consolidated, after removing sales between the companies</span></h2>
  <div class="panel"><div class="legend"><span><i style="background:var(--s1)"></i>Revenue</span><span><i style="background:var(--s2)"></i>${ebLabel()}</span><span class="m">* month to date</span></div><div class="chart" id="chart"></div></div>
  <h2>EBITDA by company <span class="n" id="perLbl"></span></h2><div id="cos"></div>
  <h2>Monthly profit and loss</h2><div id="pl"></div>
  <h2>Balance sheets <span class="n">month-end balances</span></h2><div id="bs"></div>
  <h2>Between the companies <span class="n">removed from the consolidated figures</span></h2><div id="ic"></div>
  <h2>Royalties received by Waf &amp; Gus</h2><div id="roy"></div>
  <h2>One-time items <span class="n">what an acquirer would normalize: owner costs, one-offs, and costs missing from the books</span></h2><div id="adj"></div>
  <h2>Ownership</h2><div id="own"></div>
  <h2>Notes</h2><div id="notes"></div>
  <div class="foot">Source: QuickBooks Online, the 7 company files, pulled by the Wizard Trees reporting job. EBITDA = net income + interest + income taxes + depreciation + amortization; payroll, sales and cannabis taxes stay in. Value = one year of adjusted EBITDA × the multiple entered at the top; it is a quick rule-of-thumb estimate, not an appraisal.</div>`;
  $('#refresh').onclick=()=>load();
  renderVal(); renderChart(); renderCos(); renderPL(); renderBS(); renderIC(); renderRoy(); renderAdj(); renderOwn(); renderNotes();
}

function renderVal(){
  const idx=selIdx(), months=monthsIn(idx), f=12/months, e=consEbitda(), rev=data.consolidated.revenue, M=S.mult, D=netDebt();
  const revAdj=sumI(adjMonthly(undefined,'revenue'),idx);
  const ebitda=sumI(e,idx), booked=sumI(data.consolidated.ebitda,idx), revenue=sumI(rev,idx)+revAdj, yearly=ebitda*f, full=Math.abs(f-1)<1e-9;
  const ev=k=>yearly>0?yearly*M[k]:null, eq=k=>yearly>0?yearly*M[k]-D.nd:null;
  const range=fn=>fn('low')==null?'n/m':`${big(fn('low'))} to ${big(fn('high'))}`;
  const K=data.meta.month_keys, opt=(sel,last)=>K.map((k,i)=>`<option value="${k}" ${k===sel?'selected':''}>${esc(data.meta.months[i])}</option>`).join('');
  $('#val').innerHTML=`
  <div class="ctrl noprint">
    <span class="seg" id="basis">${Object.entries(PERIODS).map(([k,l])=>`<button data-k="${k}" class="${S.basis===k?'on':''}">${l}</button>`).join('')}</span>
    ${S.basis==='custom'?`<span>From <select id="fromS">${opt(K[idx[0]])}</select> to <select id="toS">${opt(K[idx[idx.length-1]])}</select></span>`:''}
  </div>
  <div class="ctrl noprint">
    <span>Valuation multiple (times one year of EBITDA): low <input class="mult" data-k="low" value="${M.low}">× mid <input class="mult" data-k="mid" value="${M.mid}">× high <input class="mult" data-k="high" value="${M.high}">×</span>
  </div>
  <div class="ctrl noprint">
    <label><input type="checkbox" id="shT" ${S.shareholder?'checked':''}> Count shareholder loans as debt</label>

function renderChart(){
  const el=$('#chart'), n=N(), rev=data.consolidated.revenue, eb=consEbitda();
  const W=Math.max(320,el.clientWidth||900), H=260, padL=56, padR=8, padT=10, padB=26;
  const hi=Math.max(...rev,...eb,1), lo=Math.min(0,...eb,...rev);
  const step=niceStep((hi-lo)/4), top=Math.ceil(hi/step)*step, bot=Math.floor(lo/step)*step;
  const y=v=>padT+(top-v)/(top-bot)*(H-padT-padB), bw=(W-padL-padR)/n, bar=Math.min(24,(bw-10)/2);
  let g='';
  for(let t=bot;t<=top+1e-6;t+=step) g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${big(t).replace('$','$')}</text>`;
  g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;
  const col=(x,v,c,mtd)=>{ if(!v) return ''; const y0=y(0), y1=y(v), h=Math.abs(y1-y0), r=Math.min(4,h); const up=v>0, yt=up?y1:y0;
    const d=up?`M${x},${y0}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bar-r}Q${x+bar},${yt} ${x+bar},${yt+r}V${y0}Z`:`M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+bar-r}Q${x+bar},${y1} ${x+bar},${y1-r}V${y0}Z`;
    return `<path d="${d}" fill="${c}" ${mtd?'fill-opacity=".45"':''}/>`; };
  for(let i=0;i<n;i++){ const cx=padL+bw*i+bw/2; g+=col(cx-bar-1,rev[i],'var(--s1)',i===data.meta.mtd)+col(cx+1,eb[i],'var(--s2)',i===data.meta.mtd);
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortM(i)}</text><rect class="hit" data-i="${i}" x="${padL+bw*i}" y="${padT}" width="${bw}" height="${H-padT-padB}" fill="transparent"/>`; }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Monthly consolidated revenue and EBITDA">${g}</svg><div class="tip" id="tip"></div>`;
  const tip=$('#tip');
  for(const r of el.querySelectorAll('rect.hit')){
    r.onmousemove=ev=>{ const i=+r.dataset.i; tip.innerHTML=`<div>${esc(data.meta.months[i])}</div><div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s1);margin-right:5px"></i>Revenue <b>$${plain(rev[i]).toLocaleString()}</b></div><div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s2);margin-right:5px"></i>Adjusted EBITDA <b>${eb[i]<0?'−':''}$${Math.abs(plain(eb[i])).toLocaleString()}</b> <span class="m">${pct(eb[i],rev[i])}</span></div>`;
      tip.style.display='block'; const bx=el.getBoundingClientRect(); let x=ev.clientX-bx.left+12; if(x+tip.offsetWidth>bx.width) x=ev.clientX-bx.left-tip.offsetWidth-12; tip.style.left=x+'px'; tip.style.top=(ev.clientY-bx.top-10)+'px'; };
    r.onmouseleave=()=>{ tip.style.display='none'; };
  }
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1)))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

const KIND={owner:'Owner cost, added back',onetime:'One-time cost, added back',revenue:'Not ongoing sales, removed',missing:'Cost missing from the books, deducted',correction:'Booking correction'};
function renderAdj(){
  const idx=ttmIdx(), m=data.meta.mtd, g={};
  for(const x of (data.adjustments||[])){ const k=x.company+'|'+x.label; const r=(g[k]||={company:x.company,label:x.label,kind:x.kind,conf:new Set(),ttm:0,mtd:0,months:new Set(),on:false,low:false});
    const i=data.meta.month_keys.indexOf(x.month); if(i<0) continue; r.conf.add(x.confidence); r.months.add(i); if(i===m) r.mtd+=+x.amount; else r.ttm+=+x.amount; if(applies(x)) r.on=true; }
  const rows=Object.values(g).sort((a,b)=>Math.abs(b.ttm+b.mtd)-Math.abs(a.ttm+a.mtd));
  const tot=k=>rows.reduce((s,r)=>s+r[k],0), on=(data.adjustments||[]).filter(x=>applies(x)&&data.meta.month_keys.indexOf(x.month)>=0&&data.meta.month_keys.indexOf(x.month)<m).reduce((s,x)=>s+(+x.amount),0);
  const cl=s=>['high','medium','low'].filter(c=>s.has(c)).join(' / ');
  $('#adj').innerHTML=rows.length?`<div class="tbl"><table><thead><tr><th>Item</th><th class="l">Company</th><th class="l">Effect on EBITDA</th><th>Months</th><th>Last 12 months</th><th>${esc(data.meta.months[m])}</th><th class="l">Confidence</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.on?'':'dim'}"><td class="l" style="white-space:normal;min-width:260px">${esc(r.label)}${r.on?'':' <span class="tag">low confidence, not applied</span>'}</td><td class="l">${esc((coByName(r.company)||{}).short||r.company)}</td><td class="l">${esc(KIND[r.kind]||r.kind)}</td><td>${r.months.size}</td><td>${whole(r.ttm)}</td><td>${r.mtd?whole(r.mtd):''}</td><td class="l">${cl(r.conf)}</td></tr>`).join('')}
  <tr class="tot"><td>All items</td><td></td><td></td><td></td><td>${whole(tot('ttm'))}</td><td>${whole(tot('mtd'))}</td><td></td></tr>
  <tr class="key"><td>Applied to adjusted EBITDA</td><td></td><td></td><td></td><td>${whole(adjOn()?on:0)}</td><td></td><td></td></tr></tbody></table></div>
  <p class="sub" style="margin-top:6px">Positive numbers add to EBITDA, negative numbers reduce it. Low-confidence items are listed but not applied.</p>`:'<p class="sub">None identified.</p>';
}
function renderOwn(){
  const o=data.ownership||[];
  $('#own').innerHTML=o.length?`<div class="tbl"><table><thead><tr><th>Company</th><th class="l">Owners</th><th class="l">Tax form</th><th class="l">Notes</th></tr></thead><tbody>${o.map(x=>`<tr><td>${esc(x.company)}</td><td class="l">${esc(x.owners)}</td><td class="l">${esc(x.form||'')}</td><td class="l" style="white-space:normal">${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">Not entered yet.</p>';
}
function renderNotes(){
  const an=(data.anomalies||[]);
  $('#notes').innerHTML=`<div class="panel notes"><ul>${(data.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
  ${data.companies.filter(c=>c.caveats&&c.caveats.length).map(c=>`<div style="margin-top:8px"><b>${esc(c.name)}</b><ul>${c.caveats.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}
  ${an.length?`<div style="margin-top:8px"><b>Data checks</b><ul>${an.map(a=>`<li>${a.level==='error'?'<span class="tag warn">check</span> ':''}${esc(a.company)}: ${esc(a.text)}</li>`).join('')}</ul></div>`:''}</div>`;
}

function csvFromTable(t,file){
  const q=s=>{ s=String(s).replace(/\s+/g,' ').trim().replace(/^−/,'-'); return /[",]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const lines=[...t.querySelectorAll('tr')].map(r=>[...r.children].map(c=>{ const x=c.cloneNode(true); x.querySelectorAll('.tag').forEach(n=>n.remove()); return q(x.textContent.replace(/,(?=\d{3})/g,'')); }).join(','));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})); a.download=file.replace(/[^\w.-]+/g,'-'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

load();
setInterval(poll,POLL_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
</script></body></html>
